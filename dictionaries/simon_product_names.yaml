version: 1
updated_at: "2026-10-20"
description: >
  Nazwy produktow Kontakt Simon dla Baselinkera/Woo budowane z symbolu
  producenta: rdzen nazwy per symbol bazowy (symbol bez koncowki koloru) +
  kolor + seria + kod producenta na koncu. Uzywa
  src/build_simon_baselinker_from_api.py. Typ/Podtyp i kontrole wartosci robi
  potem src/fix_simon_attributes_to_shop_model.py.
  Wzorzec: "<rdzen> <kolor> <seria> <kod>", np.
  "Ramka 1-krotna biała Simon 24 NR1/11",
  "Gniazdo wtyczkowe pojedyncze z uziemieniem i przesłonami 16 A Push In grafitowy mat Simon 24 NGZ1CZ.01/38".
  "Push In" tylko tam, gdzie API podaje montaz "mocowanie Push In" (skrypt to sprawdza).

manufacturer_name: Kontakt-Simon
producer_data: "KONTAKT-SIMON, Bestwińska 21 43-500 Czechowice-Dziedzice, info@kontakt-simon.com.pl"
producent: Kontakt Simon
default_series: Simon 24
default_category: "Gniazdka i Łączniki > Gniazdka Kontakt Simon > Simon 24"

# Kod koloru z konca symbolu (NR1/11, NGZ1BCZ.01/38A). Kolor w nazwie odmienia
# sie przez rodzaj rzeczownika (m/f/n); kolory "... mat" sa nieodmienne, jak w
# istniejacych tytulach sklepu. kolor/kolor_producenta = terminy Woo, tak jak
# u rodzenstwa Simon 55 (149 -> Czarny/Czarny, 116 -> Grafitowy/Grafitowy,
# 144 -> Złoty/Szampański). api = fragment, ktory musi byc w parametrze Kolor API.
colors:
  "11": {name: {m: biały, f: biała, n: białe}, kolor: Biały, kolor_producenta: Biały, api: biał}
  "49": {name: czarny mat, kolor: Czarny, kolor_producenta: Czarny, api: czarny}
  "38": {name: grafitowy mat, kolor: Grafitowy, kolor_producenta: Grafitowy, api: grafit}
  "34": {name: szampański mat, kolor: Złoty, kolor_producenta: Szampański, api: szampa}
  "42": {name: {m: kaszmirowy, f: kaszmirowa, n: kaszmirowe}, kolor: Kaszmir, kolor_producenta: Kaszmir, api: kaszmir}

# Klucz = symbol bazowy; "/..A" = wersja z klapka transparentna (NGZ1BCZ.01/38A).
# Pola: stem, gender (m/f/n, potrzebny przy kolorze), montaz (domyslnie
# Podtynkowy; null = bez atrybutu), lacznosc, typ/podtyp (tylko gdy reguly
# nazwy z kontakt_simon_shop_structure.yaml nie wystarcza), seria (null = bez
# atrybutu Seria), name_series (seria w nazwie, gdy inna niz atrybut),
# category, status + uwaga (dla pozycji do decyzji uzytkownika).
