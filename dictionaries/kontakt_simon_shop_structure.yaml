version: 1
updated_at: "2026-09-17"
description: >
  Struktura atrybutow Kontakt Simon w sklepie Woo (odczytana z lokalnej kopii
  AlkanLocal, kategoria "Gniazdka Kontakt Simon", 2171 produktow). To jest
  NADRZEDNE zrodlo dla pol Typ produktu / Podtyp produktu i atrybutow
  filtrowych przy kazdej nowej partii Simon. Nazwy dostawcy ("Nazwa
  produktu/Rodzaj", "Typ produktu" z ETIM) NIE trafiaja do tych pol.
source:
  shop_copy: "C:/laragon/www/AlkanLocal (alkanlocal.test:8443)"
  filter_plugin: ext-product-filter (szablony 38/39 dla marek osprzetu)
  variant_plugin: wpc-linked-variation-premium (grupy po tagu produktu)

# Jak dziala filtr sklepu dla osprzetu (Simon, Ospel, Hager/Berker, Karlik):
# - "Typ produktu" (pa_typ-produktu) to drzewo glowne filtra.
# - "Podtyp produktu" (pa_podtyp-produktu) jest przypiety do typu
#   (term-meta ext_pf_cross_parent_term_id) i pokazuje sie pod nim.
# - "Krotnosc" i "Material" pokazuja sie TYLKO gdy Typ = Ramki.
# - Pozostale filtry: Kolor, Stopien ochrony [IP], Sposob montazu,
#   Typ lacznosci, Seria (na kategoriach glownych marek).
filter_model:
  typ_produktu_attribute: "Typ produktu"
  podtyp_produktu_attribute: "Podtyp produktu"
  types:
    Gniazda:
      podtypy: [Wtyczkowe, Antenowe, Komputerowe, Telefoniczne, USB, HDMI, Głośnikowe, Ekwipotencjalne, Światłowodowe]
      dodatkowe_atrybuty: [Rodzaj gniazda, Liczba gniazd, Uziemienie, Przesłony torów prądowych, Kategoria kabli sieciowych, Podświetlenie]
      uwagi:
        - Kilka funkcji w jednym module = kilka podtypow rozdzielonych ", " (np. "Antenowe, Komputerowe", "Wtyczkowe, USB").
        - Ladowarki USB (TEC2CAQ, DEC2CAQ, DC2USB) to Gniazda / USB, a nie osobny typ.
    Łączniki:
      podtypy: [Pojedyncze, Podwójne, Potrójne, Schodowe, Krzyżowe, Żaluzjowe, Pozostałe łączniki]
      dodatkowe_atrybuty: [Rodzaj łącznika, Liczba biegunów, Podświetlenie, Piktogram]
      uwagi:
        - Podtyp mowi o FUNKCJI (schodowy, krzyzowy), nie o liczbie klawiszy; "Lacznik schodowy podwojny" to nadal Schodowe.
        - Lacznik swiecznikowy / jednobiegunowy podwojny = Podwójne. Lacznik roletowy/zaluzjowy = Żaluzjowe.
    Przyciski:
      podtypy: [Zwierne, Dzwonek, Światło, Przycisk żaluzjowy]
      dodatkowe_atrybuty: [Rodzaj łącznika, Podświetlenie, Piktogram]
      uwagi:
        - Przycisk pojedynczy/podwojny/potrojny/poczworny zwierny = Zwierne. Przycisk roletowy = Przycisk żaluzjowy.
    Ramki:
      podtypy: []
      dodatkowe_atrybuty: [Krotność, Materiał, Rodzaj ramki, Wykończenie ramki]
      uwagi:
        - RAMKI NIE MAJA PODTYPU. Krotnosc idzie w atrybucie "Krotność" z wartoscia "1x".."5x".
        - Material w sklepie: Tworzywo sztuczne / Szkło / Metal / Drewno.
        - Ramki nie maja "Sposób montażu".
        - Wartosci "Ramka 1- krotna" itp. to STARY model (Berker/Karlik) - nie uzywac.
    Sterowniki i automatyka:
      podtypy: [Ściemniacze, Sterowniki oświetleniowe, Sterowniki żaluzjowe, Regulatory temperatury i termostaty, Kontrolery, Nadajniki bateryjne]
      dodatkowe_atrybuty: [Typ łączności]
      uwagi:
        - Produkty Simon GO / Simon 55 GO dostaja "Typ łączności: Wi-Fi".
        - Sciemniacz to Sterowniki i automatyka / Ściemniacze, nie osobny typ "Ściemniacze".
    Inne:
      podtypy: [Pozostałe, Pokrywy do gniazd, Puszki natynkowe, Sygnalizatory i oprawy LED]
      dodatkowe_atrybuty: []
      uwagi:
        - Zaslepki, wkladki, przylacza kabla, gniazdo DATA z kluczem, czujnik ruchu z przekaznikiem = Inne / Pozostałe.
        - Oprawy oswietleniowe LED do ramek i sygnalizatory = Inne / Sygnalizatory i oprawy LED.
        - Pokrywy do gniazd (DKP*, TKP*, TGZ1ZP) = Inne / Pokrywy do gniazd.
        - Puszki natynkowe (DSC, DPN*, DPNR*, DSH, CSC) = Inne / Puszki natynkowe.
    Puszki podłogowe:
      podtypy: [Puszki podłogowe, Kasety do wylewki, Wyposażenie]
      dodatkowe_atrybuty: []
  klawisze:
    uwaga: >
      Klawisze (DKW*, DKZ*, TKW*, TKE*) w sklepie NIE MAJA Typu ani Podtypu
      (ani w Simon 54, ani w Simon 55). "Klawisze" nie jest terminem podtypu.
      Skrypt usuwa Typ/Podtyp dla klawiszy, zeby nie tworzyc nowych terminow.
      Do potwierdzenia przez uzytkownika, czy klawisze maja dostac Inne / Pozostałe.
  value_formats:
    "Stopień ochrony [IP]": ["IP 20", "IP 44", "IP20/IP44", "IP 40"]
    "Sposób montażu": [Podtynkowy, Natynkowy]
    "Krotność": ["1x", "2x", "3x", "4x", "5x"]
    "Podświetlenie": [Tak, Nie]
    "Typ łączności": [Wi-Fi]

# Normalizacja wartosci z plikow dostawcy do formatu sklepu.
value_normalization:
  "Stopień ochrony [IP]":
    "IP20": "IP 20"
    "IP44": "IP 44"
    "IP40": "IP 40"
    "IP 20/IP 44": "IP20/IP44"
    "IP20 / IP44": "IP20/IP44"
  "Sposób montażu":
    "montaż podtynkowy": Podtynkowy
    "podtynkowy": Podtynkowy
    "montaż natynkowy": Natynkowy
    "natynkowy": Natynkowy
    "inne": null

# Tagi wariantowe (WPC Linked Variation laczy produkty po tagu produktu).
# Nowy kolor istniejacego produktu dostaje tag swojego rodzenstwa (ten sam
# symbol bazowy). Skrypt: src/fill_variant_tags_from_siblings.py.
variant_tags:
  # Tagi, ktore nie sa wariantowe i nie sa kopiowane na nowe produkty.
  ignored_tags:
    - ElektroTargi Alkan 2026
  # Rozstrzygniecia, gdy rodzenstwo w sklepie jest rozbite na rowne grupy.
  # T62E: 111/114/116 maja "...RJ45 ekranowane 55 simon", 143/144/149 maja
  # "...RJ45 kategoria 6 ekranowane 55 simon"; wzorzec nazwy z T62/T61E to
  # wersja z "kategoria 6".
  overrides:
    "T62E.01": "Gniazdo komputerowe podwójne RJ45 kategoria 6 ekranowane 55 simon"
  # Zrzut grup wariantow z AlkanLocal (2026-09-17): nazwa, status, zrodlo,
  # slugi tagow, licznik, osie.
  variant_groups_snapshot: dictionaries/alkanlocal_wpclv_groups.tsv

