# Atrybuty zatwierdzone przez uzytkownika, ktorych nie ma jeszcze w lokalnej
# kopii Woo (np. zalozone na produkcji pozniej). Dopisuj recznie.
approved_extra_attributes: []

# Atrybuty, ktore skrypt naprawczy wolno mu ruszac. Wszystko inne
# (wymiary, GPSR, ETIM, opakowania) zostaje jak w pliku wejsciowym.
managed_attributes:
  - Typ produktu
  - Podtyp produktu
  - Krotność
  - Materiał
  - Rodzaj gniazda
  - Rodzaj łącznika
  - Liczba biegunów
  - Podświetlenie
  - Piktogram
  - Uziemienie
  - Przesłony torów prądowych
  - Liczba gniazd
  - Kategoria kabli sieciowych
  - Stopień ochrony [IP]
  - Sposób montażu
  - Typ łączności

# Atrybuty zarzadzane TYLKO gdy Typ = Ramki. Dla innych produktow zostaje
# wartosc z pliku (np. material ETIM "tworzywo sztuczne, PC, bezhalogenowe"
# to informacja produktowa, a nie wartosc filtra Material dla ramek).
managed_only_for_frames:
  - Materiał

# Symbol bazowy = symbol bez koncowki koloru (TR1/142 -> TR1, DW7.01/X/11 -> DW7.01/X).
# Kolory Simon: 11 bialy, 49 czarny, 42/142 kaszmir, 111 bialy mat, 114 jasnoszary mat,
# 144 szampanski mat, 149 czarny mat.
symbol_base:
  strip_supplier_suffix: "/KON"
  color_suffix_regex: "/\\d{2,3}$"

# Reguly po nazwie - uzywane, gdy symbol bazowy nie ma rodzenstwa w sklepie
# albo rodzenstwo nie ma Typu. Kolejnosc ma znaczenie: pierwsza pasujaca
# wygrywa. "typ: null" = usun Typ/Podtyp.
name_rules:
  - match: "^klawisz"
    typ: null
    podtyp: null
  - match: "^ramka"
    typ: Ramki
    podtyp: null
  - match: "^pokrywa"
    typ: Inne
    podtyp: Pokrywy do gniazd
  - match: "^puszka natynkowa|do składanej puszki natynkowej|^element rozszerzający"
    typ: Inne
    podtyp: Puszki natynkowe
  - match: "^(zaślepka|wkładka|przyłącze|adapter|pierścień|wieszak|czujnik ruchu|gniazdo data)"
    typ: Inne
    podtyp: Pozostałe
  - match: "^(oprawa oświetleniowa|sygnalizator)"
    typ: Inne
    podtyp: Sygnalizatory i oprawy LED
  - match: "^gniazdo wtyczkowe z zintegrowaną ładowarką"
    typ: Gniazda
    podtyp: "Wtyczkowe, USB"
  - match: "^(ładowarka|gniazdo usb)"
    typ: Gniazda
    podtyp: USB
  - match: "^gniazdo antenowe.*rj45"
    typ: Gniazda
    podtyp: "Antenowe, Komputerowe"
  - match: "^gniazdo (wtyczkowe|schuko|z uziemieniem)"
    typ: Gniazda
    podtyp: Wtyczkowe
  - match: "^gniazdo antenowe|^gniazdo (tv|r-tv|sat)"
    typ: Gniazda
    podtyp: Antenowe
  - match: "^gniazdo komputerowe.*telefoniczne"
    typ: Gniazda
    podtyp: "Komputerowe, Telefoniczne"
  - match: "^gniazdo komputerowe|^gniazdo rj45"
    typ: Gniazda
    podtyp: Komputerowe
  - match: "^gniazdo telefoniczne"
    typ: Gniazda
    podtyp: Telefoniczne
  - match: "^gniazdo hdmi"
    typ: Gniazda
    podtyp: HDMI
  - match: "^gniazdo głośnikowe"
    typ: Gniazda
    podtyp: Głośnikowe
  - match: "^gniazdo ekwipotencjalne"
    typ: Gniazda
    podtyp: Ekwipotencjalne
  - match: "^gniazdo światłowodowe"
    typ: Gniazda
    podtyp: Światłowodowe
  - match: "^przycisk.*(roletow|żaluzjow)"
    typ: Przyciski
    podtyp: Przycisk żaluzjowy
  - match: "^przycisk.*dzwonek"
    typ: Przyciski
    podtyp: Dzwonek
  - match: "^przycisk.*światło"
    typ: Przyciski
    podtyp: Światło
  - match: "^przycisk"
    typ: Przyciski
    podtyp: Zwierne
  - match: "^łącznik.*(roletow|żaluzjow)"
    typ: Łączniki
    podtyp: Żaluzjowe
  - match: "^łącznik schodowy"
    typ: Łączniki
    podtyp: Schodowe
  - match: "^łącznik krzyżowy"
    typ: Łączniki
    podtyp: Krzyżowe
  - match: "^łącznik potrójny"
    typ: Łączniki
    podtyp: Potrójne
  - match: "^łącznik (świecznikowy|jednobiegunowy podwójny|dwubiegunowy podwójny|podwójny)"
    typ: Łączniki
    podtyp: Podwójne
  - match: "^łącznik (jednobiegunowy|dwubiegunowy|pojedynczy)"
    typ: Łączniki
    podtyp: Pojedyncze
  - match: "^łącznik"
    typ: Łączniki
    podtyp: Pozostałe łączniki
  - match: "^ściemniacz"
    typ: Sterowniki i automatyka
    podtyp: Ściemniacze
  - match: "^sterownik.*(rolet|żaluzj)"
    typ: Sterowniki i automatyka
    podtyp: Sterowniki żaluzjowe
  - match: "^sterownik"
    typ: Sterowniki i automatyka
    podtyp: Sterowniki oświetleniowe
  - match: "^(termostat|regulator temperatury)"
    typ: Sterowniki i automatyka
    podtyp: Regulatory temperatury i termostaty
  - match: "^kontroler"
    typ: Sterowniki i automatyka
    podtyp: Kontrolery
  - match: "^nadajnik"
    typ: Sterowniki i automatyka
    podtyp: Nadajniki bateryjne

# Mapa: symbol bazowy -> atrybuty filtrowe, jakie maja produkty tego symbolu
# (inne kolory) w sklepie. Wygenerowana z AlkanLocal 2026-09-17, tylko serie
# Simon 5x. Wartosc {niejednoznaczne: [...]} = rodzenstwo nie jest zgodne;
# skrypt wtedy zostawia wartosc z pliku, jesli jest na liscie, inaczej bierze pierwsza.
symbol_map:
