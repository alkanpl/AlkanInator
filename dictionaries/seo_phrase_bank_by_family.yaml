by_family:
  czujnik:
    ogolne:
    - 'Czujnik ruchu przejmuje rolę osoby naciskającej klawisz: sam zamyka i otwiera obwód.'
    - Czujnik ruchu z przekaźnikiem wykrywa obecność w swoim polu pracy i steruje obwodem automatycznie,
      dzięki czemu nie wymaga każdorazowego naciskania klawisza.
    montaz_uzytkowanie:
    - Przewody podłącza się do zacisków śrubowych, a moduł mocuje pazurkami albo wkrętami w puszce podtynkowej.
    - Zaciski śrubowe i montaż na pazurki lub wkręty odpowiadają standardowej instalacji podtynkowej.
    - Przed zakupem kluczowe jest sprawdzenie obecności przewodu neutralnego w puszce.
  gniazdo_zasilajace:
    montaz_uzytkowanie:
    - Mechanizm montuje się podtynkowo, używając pazurków albo wkrętów, a szybkozłącza umożliwiają zamocowanie
      przewodów bez dokręcania zacisków śrubowych.
    - Przewody wpina się w szybkozłącza, a moduł unieruchamia pazurkami rozporowymi lub wkrętami.
    - Mechanizm wykorzystuje szybkozłącza, więc przewody można osadzić bez dokręcania śrub zaciskowych.
    - Przy montażu trzeba zachować kompletność elementów wymaganych do utrzymania deklarowanego stopnia
      ochrony.
    - Moduł jest przeznaczony do montażu podtynkowego i mocowany na pazurki lub wkręty.
    - Oznaczenie frontu, przesłony oraz szybkozłącza tworzą wyraźnie wyspecjalizowane stanowisko.
    - Szybkozłącza skracają etap mocowania przewodów w porównaniu z zaciskami wymagającymi dokręcania.
    - Mocowanie odbywa się wkrętem, natomiast żyły przewodów są zaciskane śrubowo.
    - Przewody zasilające podłącza się do zacisków śrubowych.
    - Płytki mechanizm i szybkozłącza są jego najważniejszymi zaletami montażowymi.
    ogolne:
    - Gniazdo wtyczkowe tej wersji ma ruchome przesłony, które odsuwają się dopiero przy równoczesnym
      nacisku obu bolców wtyczki.
    - Pojedynczy przedmiot wsunięty do jednego otworu nie otwiera toru prądowego.
    - Klapka osłania front, gdy gniazdo nie jest używane, a przesłony stanowią dodatkową barierę w otworach
      prądowych.
    - Gniazdo wtyczkowe z przesłonami ma ruchome zabezpieczenia torów prądowych, które odsuwają się dopiero
      przy równoczesnym nacisku obu bolców wtyczki.
    - Ramkę dobiera się osobno do liczby stanowisk.
    - Do gotowego stanowiska trzeba jeszcze dobrać odpowiednią ramkę.
    - Przesłony torów prądowych stanowią dodatkowy element konstrukcji.
    - Brak klapki uchylnej pozostawia klasyczny otwarty front.
    - Front stanowi plakietka centralna bez nadruku.
    - Podwójna konstrukcja ogranicza liczbę osobnych punktów na ścianie, a przesłony osłaniają oba tory
      prądowe.
    - Oznacza to, że do kompletnej konfiguracji wymagającej wyższego poziomu ochrony trzeba uwzględnić
      brakujący element uszczelniający.
    - Klapka jest wykonana w tym samym kolorze co pokrywa, dzięki czemu front pozostaje jednolity wizualnie.
    - Uziemienie realizowane jest przez bolec, a otwory prądowe mają przesłony.
    - Gniazdo wtyczkowe w tej wersji łączy dwie jednostki z klapką uchylną i dołączoną uszczelką.
    - Oba tory mają również przesłony otworów prądowych.
    - Gniazdo wtyczkowe jest przeznaczone do miejsc, w których potrzebne są dwa standardowe punkty z uziemieniem,
      ale bez osłony klapkowej.
    - Dwie jednostki zajmują jeden wspólny moduł, a przesłony torów prądowych stanowią dodatkowy element
      frontu.
    funkcje_korzysci:
    - Gniazdo wtyczkowe pozwala zasilać tradycyjny odbiornik i jednocześnie korzystać z ładowarki USB
      wbudowanej w ten sam front.
  klawisz:
    montaz_uzytkowanie:
    - Element jest wahadłowy i mocuje się zaciskowo, przez wciśnięcie na prowadnice.
    - Przed zakupem warto więc odczytać oznaczenie znajdujące się na module zamontowanym w ścianie.
    - Element mocuje się zaciskowo, przez wciśnięcie na prowadnice.
    - Przed zakupem najważniejsze jest sprawdzenie oznaczenia zamontowanego mechanizmu.
    - Symbol zgodnego modułu jest najważniejszą informacją montażową podaną w nazwie produktu.
    - Symbol pozostaje widoczny na froncie po montażu.
    - Kompaktowy format i montaż zaciskowy sprawiają, że jest to typowy element frontowy, a nie osobny
      mechanizm elektryczny.
    design_estetyka:
    - Powierzchnia jest gładka, bez nadruku i bez okienka na kontrolkę świetlną, więc pasuje do mechanizmów
      bez podświetlenia.
    - Zgodność należy potwierdzić po symbolu mechanizmu, a nie wyłącznie po wyglądzie istniejącego klawisza.
    - Brak piktogramu oznacza neutralny wygląd obu widocznych części.
    - Powierzchnia nie ma nadruku, a konstrukcja nie zawiera okienka kontrolki świetlnej.
    - Powierzchnia jest matowa i naturalnie zabezpieczona.
    funkcje_korzysci:
    - Wymiana dotyczy wyłącznie części widocznej i obsługowej, więc mechanizm elektryczny pozostaje na
      swoim miejscu.
    - Brak nadruku jest przydatny tam, gdzie funkcja jest oczywista z położenia stanowiska albo nie wymaga
      oznaczenia.
    - Brak piktogramu pozostawia neutralny front, dlatego element można zastosować tam, gdzie opis funkcji
      na klawiszu nie jest potrzebny.
    - W tym modelu funkcję rozpoznaje się po nadruku, a zgodność po symbolu mechanizmu.
    - Brak symbolu sprawia, że front nie narzuca określonej funkcji.
    - Dwa pola obsługowe odpowiadają konstrukcji przewidzianej dla tych mechanizmów.
    ogolne:
    - Przed zakupem najważniejsze jest potwierdzenie symbolu mechanizmu, z którym klawisz ma być połączony.
    - Przed zamówieniem warto sprawdzić symbol mechanizmu, ponieważ to on decyduje o dopasowaniu.
    - Przed zakupem wystarczy potwierdzić symbol modułu, aby uniknąć doboru podobnego wizualnie, ale innego
      elementu.
    - Symbol żaluzji ogranicza ryzyko pomylenia stanowiska z innym łącznikiem umieszczonym w tej samej
      przestrzeni.
    - Piktogram żaluzji pozostaje widoczny na froncie, dlatego stanowisko jest łatwe do rozpoznania nawet
      bez dodatkowych opisów.
    - Oznacza to zgodność odpowiednio z przyciskiem podwójnym zwiernym oraz łącznikami świecznikowymi
      wskazanymi przez producenta.
    - Dwa pola frontowe odpowiadają dwóm oddzielnym dźwigniom.
    - Pierwszy z tych mechanizmów jest łącznikiem schodowym podwójnym, drugi krzyżowym podwójnym.
    - Klawisz nie ma nadruku ani okienka kontrolki świetlnej, dlatego wizualnie pozostaje neutralny.
    jakosc_trwalosc:
    - Wykonano go z bezhalogenowego tworzywa PC o matowej powierzchni.
    - Wykonano go z bezhalogenowego PC o naturalnie zabezpieczonej, matowej powierzchni.
  lacznik_instalacyjny:
    ogolne:
    - Łącznik schodowy pracuje w układzie bistabilnym, więc każde naciśnięcie klawisza zmienia stan obwodu
      niezależnie od położenia drugiego mechanizmu.
    - Łącznik jednobiegunowy pracuje bistabilnie, więc po zmianie położenia klawisz pozostaje w nowym
      stanie do kolejnego przełączenia.
    - Łącznik jednobiegunowy pozostaje w wybranej pozycji po przełączeniu, a dodatkowe podświetlenie pomaga
      odnaleźć punkt w słabszym świetle.
    - Każdy tor pracuje bistabilnie, więc nie wymaga przytrzymywania klawisza.
    - Podświetlenie jest opcjonalne i nie znajduje się w zestawie.
    - Piktogram schodów nie rozstrzyga tego pytania, a przy dwóch polach potrafi dodatkowo mylić.
    - Gładki front bywa więc czytelniejszy niż powtórzony dwukrotnie ten sam symbol.
    - Każdy tor wymaga własnego mechanizmu po drugiej stronie obwodu, dokładnie jak w wersji pojedynczej.
    - Łącznik krzyżowy jest przeznaczony do rozbudowanego układu, w którym ten sam obwód ma być przełączany
      z więcej niż dwóch miejsc.
    - Mechanizm pracuje bistabilnie i zmienia stan po każdym użyciu klawisza.
    - 'Łącznik krzyżowy nigdy nie pracuje sam: jego miejsce jest zawsze pomiędzy dwoma mechanizmami schodowymi.'
    - Dołożenie tego mechanizmu rozszerza istniejący układ o następny punkt przełączania.
    - Praca jest bistabilna, więc każde naciśnięcie zmienia stan obwodu niezależnie od pozostałych mechanizmów.
    - Przy trzech punktach potrzebne są dwa mechanizmy schodowe na końcach i jeden krzyżowy w środku;
      każdy następny punkt to kolejna sztuka tego modelu.
    - Dwie dźwignie rozdzielają oba tory, a każdy z nich pracuje bistabilnie.
    - Zamiast dwóch osobnych puszek i dwóch ramek wystarczy jedno stanowisko.
    - Każdy z dwóch torów musi być wpięty między własną parę mechanizmów schodowych.
    - 'Przed zamówieniem policz cały układ: każdy tor potrzebuje własnej pary mechanizmów schodowych na
      końcach.'
    montaz_uzytkowanie:
    - Dwa takie moduły połączone przewodami sterowniczymi dają pełną obsługę jednego punktu świetlnego
      z dwóch stron pomieszczenia.
    - Przewody wprowadza się do szybkozłączy, bez dokręcania śrub zaciskowych.
    - Mechanizm można mocować pazurkami lub wkrętami.
    - Szybkozłącza pozwalają podłączyć przewody bez dokręcania śrub.
    - Bistabilny mechanizm, szybkozłącza i możliwość rozbudowy o podświetlenie tworzą klasyczną konfigurację
      do instalacji podtynkowej.
    - Trzy dźwignie, szybkozłącza i niewielka głębokość wbudowania tworzą zwarte stanowisko podtynkowe.
    - Dwie dźwignie, szybkozłącza i możliwość uzupełnienia o podświetlenie tworzą praktyczny moduł świecznikowy.
    - Przewody wprowadza się do szybkozłączy, a moduł unieruchamia pazurkami rozporowymi albo wkrętami.
    - Przewody podłącza się przez szybkozłącza, a mechanizm mocuje na pazurki lub wkręty.
    - Podwójna konstrukcja ogranicza liczbę osobnych mechanizmów na ścianie, a szybkozłącza upraszczają
      podłączenie przewodów.
    - Przewody wprowadza się do szybkozłączy, a moduł mocuje pazurkami albo wkrętami.
    - Dla osoby korzystającej z instalacji wszystkie punkty w takim obwodzie działają identycznie, więc
      wyróżnianie jednego z nich symbolem nie wnosi informacji.
    - Przewody podłącza się przez szybkozłącza, a mocowanie odbywa się na pazurki lub wkręty.
    - Podwójna konstrukcja ogranicza liczbę osobnych mechanizmów, a szybkozłącza ułatwiają podłączenie
      przewodów.
    - Dźwignie są kołyskowe i działają bistabilnie, a przewody mocuje się w szybkozłączach.
    funkcje_korzysci:
    - Klawisz działa kołyskowo, a podświetlenie jest opcjonalne i nie wchodzi w skład zestawu.
    - Front nie ma piktogramu, dlatego nie przypisuje mechanizmu wizualnie do jednej funkcji.
    - Trzy dźwignie rozdzielają obsługę poszczególnych obwodów i pozwalają sterować nimi niezależnie.
    - Pozwala więc niezależnie przełączać dwa tory z jednego stanowiska ściennego.
    - Łącznik świecznikowy pozwala łatwo rozpoznać oba pola sterujące dzięki oddzielnemu podświetleniu.
    - Układ bistabilny działa dokładnie tak samo jak w wersji opisanej symbolem.
    - Do zbudowania pełnego sterowania z dwóch miejsc nadal potrzebne są dwa mechanizmy schodowe.
    - Pamiętaj o zamówieniu drugiego mechanizmu schodowego, bez którego układ sterowania z dwóch miejsc
      nie zadziała.
    - Łącznik schodowy w wersji podwójnej pozwala sterować dwoma niezależnymi obwodami schodowymi bez
      montowania dwóch osobnych mechanizmów.
    - Dwie dźwignie rozdzielają funkcje obu torów, a każdy z nich pracuje w układzie przewidzianym do
      sterowania z więcej niż jednego miejsca.
    - Jednocześnie zachowuje typowe działanie bistabilne układu schodowego.
    - Symbol schodów pozwala rozpoznać funkcję bez dodatkowej etykiety.
    - Symbol na froncie ułatwia rozpoznanie funkcji.
    - Łącznik krzyżowy w wersji podwójnej pozwala dodać dodatkowy punkt sterowania dla dwóch oddzielnych
      torów bez stosowania dwóch osobnych mechanizmów.
    zastosowanie_wnetrza:
    - Do korytarza, klatki schodowej albo sypialni potrzebne są dwa takie mechanizmy — dopiero para tworzy
      działający obwód.
    - Sprawdza się też w pomieszczeniach reprezentacyjnych, gdzie osprzęt ma być jak najmniej zauważalny.
    design_estetyka:
    - Brak piktogramów pozostawia neutralny wygląd obu powierzchni.
    - Łącznik schodowy w tym wykonaniu przydaje się tam, gdzie kilka mechanizmów stoi obok siebie i wspólny,
      jednolity front wygląda spokojniej niż zestaw różnych piktogramów.
    swiatlo_barwa:
    - Dwa wymienialne LED-y i dwa bistabilne tory wyróżniają ten model na tle standardowej wersji bez
      światła.
    - Łącznik schodowy obsługujący dwa obwody trafia zwykle w miejsca, gdzie i tak trzeba pamiętać, który
      klawisz odpowiada za które światło.
    - Łącznik schodowy jest łatwiejszy do odnalezienia przy słabszym oświetleniu dzięki wbudowanej diodzie
      LED.
    - Łącznik krzyżowy w wersji podwójnej ma sens wszędzie tam, gdzie dwa obwody prowadzone są równolegle
      tą samą trasą, na przykład oświetlenie główne i kinkiety w długim korytarzu.
  przycisk_zaluzjowy:
    montaz_uzytkowanie:
    - Szybkozłącza skracają przygotowanie przewodów w porównaniu z zaciskami wymagającymi dokręcania śrub.
    - Przed montażem wystarczy zweryfikować schemat napędu i dostępne miejsce w puszce.
    - Mocowanie odbywa się na pazurki lub wkręty, a przewody trafiają do szybkozłączy.
    - Dwie dźwignie, szybkozłącza i czytelny symbol żaluzji tworzą kompaktowe stanowisko podtynkowe.
    ogolne:
    - 'Najważniejszą różnicą względem łącznika bistabilnego jest sposób pracy: po puszczeniu klawisza
      mechanizm wraca do pozycji spoczynkowej.'
    funkcje_korzysci:
    - Symbol żaluzji pozwala od razu rozpoznać przeznaczenie stanowiska.
    - Model jest przeznaczony do sterowania roletami.
  ramka:
    montaz_uzytkowanie:
    - Producent przewidział oba kierunki montażu, więc ten sam element pasuje do stanowiska ułożonego
      poziomo i pionowo.
    - Tworzywo PC jest bezhalogenowe, co ma znaczenie w budynkach, gdzie stawia się wymagania wobec materiałów
      instalacyjnych.
    - Zatrzaskowy sposób mocowania upraszcza osadzenie elementu na kompatybilnym osprzęcie.
    - Możliwość montażu w obu kierunkach i zatrzaskowe mocowanie dają swobodę przy wykańczaniu jednego
      stanowiska.
    - Ramka jest mocowana na zatrzask i wykonana z bezhalogenowego PC.
    - Duża szerokość ramki obejmuje cały układ, a możliwość montażu pionowego i poziomego pozwala dopasować
      orientację do miejsca instalacji.
    - Kierunek montażu może być poziomy albo pionowy.
    ogolne:
    - 'Przy planowaniu zakupów warto policzyć stanowiska, a nie same mechanizmy: dwa moduły obok siebie
      potrzebują jednej takiej ramki, a nie dwóch pojedynczych.'
    - W jednym elemencie mieszczą się dwa sąsiadujące moduły.
    - przy malowaniu ściany lub zmianie konfiguracji osprzętu.
    - Jedna ramka obejmuje cały układ, zachowuje niewielką głębokość i może zostać ustawiona w pionie
      albo poziomie.
  sciemniacz:
    ogolne:
    - Świetlówki kompaktowe i liniowe, transformatory rdzeniowe oraz urządzenia z silnikiem elektrycznym
      są wykluczone.
    - Można go wpiąć w układ schodowy, a także połączyć z czujnikiem ruchu lub przyciskiem radiowym.
    - Moduł może pracować w układzie schodowym, a dodatkowo współpracować z czujnikiem ruchu lub przyciskiem
      radiowym.
    - Ściemniacz obrotowy wykorzystuje mechaniczne pokrętło jako element sterujący, więc poziom regulacji
      zmienia się przez jego obrót.
    swiatlo_barwa:
    - Moduł zapamiętuje ostatnio ustawiony poziom jasności, więc po ponownym załączeniu światło wraca
      do tej samej wartości.
    - Funkcja pamięci sprawia, że po ponownym włączeniu oświetlenie wraca do ostatniego ustawionego poziomu.
    - Funkcja pamięci przywraca zapisany poziom jasności, a sterowanie można prowadzić przyciskiem, aplikacją
      lub zgodnym przyciskiem radiowym.
    funkcje_korzysci:
    - Połączenie z aplikacją działa przez zwykły router, bezpośrednio przez Wi-Fi albo zdalnie przez internet.
    - Nie jest przeznaczony do świetlówek, silników ani transformatorów wskazanych jako nieobsługiwane.
    montaz_uzytkowanie:
    - Przed montażem trzeba potwierdzić, że zastosowane źródła światła są rzeczywiście ściemnialne i zgodne
      z zakresem obciążenia.
    - Przewody zasilające podłącza się do zacisków śrubowych.
  gniazdo_antenowe:
    ogolne:
    - Połączenia wykonuje się za pomocą wtyków, zgodnie z konstrukcją tego modułu.
    - Konstrukcja końcowa ma sens tam, gdzie właśnie w tym miejscu ma znaleźć się docelowy punkt przyłączenia,
      bez potrzeby prowadzenia sygnału dalej przez ten sam mechanizm.
    - Gniazdo antenowe w tym wykonaniu ma dwa przyłącza zamiast jednego, dzięki czemu oba są dostępne
      w obrębie tego samego modułu.
    - Podwójna konstrukcja ogranicza liczbę stanowisk na ścianie i pozostawia front bez dodatkowych oznaczeń.
    - Gniazdo antenowe ma jedno wyjście typu F i wykonanie końcowe.
    - Gniazdo antenowe łączy trzy wyjścia i jest określone jako końcowe oraz zakończeniowe.
    - Wszystkie trzy oznaczenia znajdują się na froncie.
    montaz_uzytkowanie:
    - Przy instalacji warto więc uwzględnić nie tylko sam mechanizm, ale także miejsce na przewody zakończone
      odpowiednimi wtykami.
    - W tym modelu producent zastosował zaciski śrubowe, dlatego przewód jest unieruchamiany mechanicznie
      w złączu podczas montażu.
    - Jeśli potrzebujesz właśnie takiej funkcji bez dodatkowych portów i z podłączeniem na zaciski śrubowe,
      ten model odpowiada takiej konfiguracji.
    - Przy dwóch przewodach warto wcześniej zaplanować ich ułożenie w puszce, aby nie tworzyć zbędnych
      naprężeń za mechanizmem.
    - 'Oba tory korzystają z różnych sposobów zakończenia: część antenowa z wtyku, a część sieciowa z
      zacisku przebijającego izolację.'
    - Gniazdo antenowe w wersji przelotowej jest przeznaczone do pracy w punkcie pośrednim instalacji,
      a nie wyłącznie jako jej zakończenie.
    - 'Zastosowano dwa typy połączeń: wtyk oraz zaciski śrubowe.'
    - Przy montażu przelotowym szczególnie ważne jest zostawienie miejsca na przewody wchodzące i wychodzące
      z puszki.
    - Producent wskazuje zastosowanie tylko w instalacjach indywidualnych, co jest kluczową informacją
      przy wyborze miejsca tego modelu w systemie.
    - Pokrywa jest częścią konstrukcji, a mechanizm można mocować na pazurki lub wkręty.
    funkcje_korzysci:
