          - {match: 'DRZWI NIEPRZEZROCZ', label: drzwi pełne, group: door}
          - {match: 'DRZWI PRZEZROCZ', label: drzwi transparentne, group: door}
          - {match: 'METALOWA', label: metalowa, group: mat}
          - {match: 'PLASTIKOWA', label: plastikowa, group: mat}
