# Nazwy do Ekonoma - krotkie nazwy dla sprzedawcow (nie tytuly SEO).
# Narzedzie: src/build_ekonom_names.py. Zasady ogolne: CLAUDE.md -> "Nazwy do Ekonoma".
#
# Nazwa = noun + marka + atrybuty w kolejnosci z `attrs`. Atrybut bez wartosci jest
# pomijany; jezeli jest w `required`, wiersz dostaje status DO_SPRAWDZENIA.
# Typy sa dopasowywane po kolei (pierwszy pasujacy wygrywa) regexem na pelnej
# nazwie z Ekonoma bez polskich znakow, wielkimi literami.
#
# Atrybuty (render w src/build_ekonom_names.py):
#   gwint         E27, GU10, G24d-3 ...
#   line          linia zarowki: Value / Performance / Superior / Star / Superstar / Vintage 1906 ...
#   shape         ksztalt zarowki: A60 / swieczka / kulka / globe G95 / sztyft / PAR16 ...
#   beam          kat swiecenia zarowek reflektorowych (PAR16, R50, MR16...): 36°
#   glass         klosz: przezroczysta / matowa
#   dim           "sciemnialna"
#   optics        kat swiecenia (30°, asym. 45x140°) albo kod optyki (opt. VW)
#   color         kolor obudowy wg `housing_colors` i `gender` typu
#   ugr           UGR19
#   version_suffix: true -> gdy nazwa dalej sie powtarza, dopisz wyroznik wersji z nazwy katalogowej
#   tube_type     T8 / T5 / T9 / T5C
#   tube_length   dlugosc swietlowki/tuby w cm (z mm w nazwie albo `fluorescent_lengths`)
#   length        dlugosc oprawy liniowej w cm (600/1200/1500 albo NNNmm/NNcm)
#   panel_size    60x60, 62,5x62,5, 120x30 ...
#   diameter      srednica oprawy okraglej: fi190
#   power         moc: 7,5W / 4x3,4W
#   lumen         strumien: z PDF po EAN, potem z nazwy (920LM)
#   cct           barwa: 4000K, 3000/4000K, TW, CCT, RGBW
#   ip            IP65
#   control       DALI / Zigbee / WiFi / BT
#   sensor        "z czujnikiem"
#   emergency     "awaryjna"
#   tube_supply   EM / HF / 230V / EM/230V (z czym wspolpracuje tuba LED)
#   strip         tasma: 5m 1000lm/m ...
#   driver        zasilacz: 35W 700mA / 20W 24V
#   ballast       statecznik: 1x18-40W
#   voltage       12V (tylko niskonapieciowe)
#   model         reszta nazwy oryginalnej po `strip_prefix` (typy bez schematu parametrycznego)

suppliers:
  ledvance:
    brand: Ledvance
    # Producent w nazwie (2026-10-19: najpierw "niepotrzebne", potem "jednak chcemy"). `brand_in_name: false`
    # zdejmuje marke (zostaje tylko u blizniakow roznych marek); przy true `brand_words` pilnuje jednej marki
    # ("Ledvance Bellalux" -> "Bellalux"). Zarowki LED: marka przed linia na koncu, inne typy: po rzeczowniku.
    brand_in_name: true
    # linia (Value / Performance / Superior / Star...) w kazdym typie, gdy jest - zaraz po marce (2026-10-19);
    # takze ze skrotu literowego przed moca: "SPOT ADJ P 8W" = Performance, "SF DISC 300 V 21W" = Value
    line_all_types: true
    # marka i linia na koncu nazwy we wszystkich typach, jak w zarowkach (2026-10-19): najpierw parametry i cechy
    brand_last: true
    # to samo slowo dwa razy obok siebie zostaje raz ("globe Globe 95" -> "Globe 95", "SENSOR SENSOR")
    dedupe_adjacent: true
    # srednica jako "220 mm", nie "fi220" (2026-10-19)
    diameter_mm: true
    # wymiar bez jednostki "120X30" / "BL100x25" to cm (Planon), mm dopiero gdy oba wymiary >= 100 (2026-10-21)
    deco_size_bare_cm: true
    brand_words: [Ledvance, Osram, Bellalux, LEDV]
    # Naprawy zapisu w Ekonomie przed parsowaniem (przeglad 2026-10-21):
    # - Ekonom zamienil kiedys "PL" na "PANEL" w calych nazwach: PLANON PLUS -> "PANELANON PANELUS", PLUG -> "PANELUG",
    #   PL-CN111 (PrevaLED Coin) -> "PANEL-CN111"; "PANELa Fraless" = Planon Frameless
    # - opis po "|" ("| Dekoracyjne kolorowe paski LED ...") to nie nazwa
    # - literowki: "Zasolacz", "specjala", "filtry fo"
    name_cleanup:
      - {match: 'PANELANON', repl: PLANON}
      - {match: 'PANELUS\b', repl: PLUS}
      - {match: 'PANELUG\b', repl: PLUG}
      - {match: '\bPANEL-(?=CN|CUBE)', repl: PL-}
      - {match: '(?i)\bPANELa\s+Fraless\b', repl: Planon Frameless}
      - {match: '\s*\|.*$', repl: ''}
      - {match: '\bZasolacz\b', repl: Zasilacz}
      - {match: '\bspecjala\b', repl: specjalna}
      - {match: '\bfiltry fo\b', repl: filtry do}
      - {match: '^SMT WF', repl: SMART WF}  # "SMT WFA30D4,5W..." = SMART+ WiFi
      - {match: '^Oprawa\s+Oprawa\b', repl: Oprawa}
      # dekor / Smart+ (przeglad 2026-10-21): "SUNATHOME" = Sun@Home, "Obris" = Orbis, sklejone kody barwy i koloru
      # ("RGBTWBK", "TWWT", "MGCRGBTW", "SMARTWIFI", "CORNER2000"), skroty PEND / CLICKD / CLG SUSP / REM / CAM
      - {match: '\bSUNATHOME\b', repl: 'SUN@HOME'}
      - {match: '(?i)\bObris\b', repl: Orbis}
      - {match: '\bSMARTWIFI\b', repl: SMART WIFI}
      - {match: '\bMGCRGBTW\b', repl: RGBTW}
      - {match: '\bRGBTW(WT|BK)\b', repl: 'RGBTW \1'}
      - {match: '\bTW(WT|BK)\b', repl: 'TW \1'}
      - {match: '\bBWT(?=LEDV|\s|$)', repl: 'BK '}  # karta: "Orbis ZEST RGB 500mm Black"
      - {match: '\bCORNER ?(1400|2000)\b', repl: 'CORNER \1MM'}  # wysokosc lampy narożnej -> "140cm"
      - {match: '(?i)(?<=\dmm)TW\b', repl: ' TW'}  # "1200x300mmTW"
      - {match: '\bTRACKL\b', repl: TRACKLIGHT}
      - {match: '\bCLG SUSP\b', repl: SUSPENDED}
      - {match: '(?i)\b([2-9])\s?X\s?PEND(?:ANT)?\b', repl: 'PENDANT \1XPKT'}
      - {match: '(?i)\bPEND\b', repl: PENDANT}
      - {match: '\bCLICKD(?=\s|LEDV|$)', repl: CLICK DIM}
      - {match: '\bCLICK DIM(?=LEDV)', repl: 'CLICK DIM '}
      - {match: '(?<=\d)W(?=[89]\d{2}\b)', repl: 'W '}  # "18W830"
      - {match: '(?i)\bREM\b', repl: '+ RC'}  # "+ RC" = z pilotem; "REMOTE" robilo z panelu typ "Pilot"
      - {match: '(?i)\bCAM\b', repl: CAMERA}
      - {match: '(?i)\bENTRANCENUMBER\b', repl: ENTRANCE NUMBER}
      - {match: '(?i)\bADJ WALL ADJUSTABLE WALL\b', repl: ADJUSTABLE WALL}
      - {match: '(?i)\bGARDEN DOT (\d+) DOTS\b', repl: 'GARDEN DOT \1P'}
      - {match: '(?i)\bGARDEN DOT (\d+)P EXT\b', repl: 'GARDEN DOT \1P EXTENSION'}
      - {match: '(?i)(?<=\dXE27 )BW\b', repl: BROWN}  # Orbis Paris BW = Brown (karta)
      - {match: '\bTURBANE\b', repl: TUBE}
      - {match: '(?i)\bCEILING FAN RD\b', repl: CEILING FAN ROUND}
      - {match: '(?i)\bCEILING FAN CYL\b', repl: CEILING FAN CYLINDER}
      - {match: '(?i)\s6 kV S\b', repl: ''}  # tuba Ultra Output "6 kV S" (ochrona przepieciowa) - zostawalo "kV"
      - {match: '\bPLAN PLUS BL\s?', repl: 'PLANON PLUS BACKLIGHT '}  # Smart+ Planon Plus Backlight (2026-10-21)
      # akcesoria (przeglad 2026-10-21): sklejone "ERECESSEDMOUNTFRAME" / "ESURFACEMOUNTKITH70", "PL 1200300", "END x 10",
      # literowki "jednsotka" / "sterując", angielski duplikat polskiego opisu jednostek sterujacych
      - {match: '\bERECESSEDMOUNTFRAME\b', repl: E RECESSED MOUNT FRAME}
      - {match: '\bESURFACEMOUNTKITH(\d+)\b', repl: 'E SURFACE MOUNT KIT H\1'}
      - {match: '\bPL ?1200300\b', repl: PL 1200X300}
      - {match: '(?i)\bEND x (\d+)$', repl: 'END x\1'}
      - {match: '\bjednsotka\b', repl: jednostka}
      - {match: '\bsterując\b', repl: sterująca}
      - {match: '(?<=sterująca)(?=MANUAL\b)', repl: ' '}  # "Jednostka sterującaMANUAL CONTROL UNIT" (2026-10-26)
      - {match: '(?i)\s(?:MANUAL |PUSH BUTTON )?CONTROL UNITS?\b', repl: ''}
      - {match: '(?i)\b(TOUCH DALI-2 TW) \1\b', repl: '\1'}
      - {match: '(?i)\b(TOUCH DALI-2) \1\b', repl: '\1'}
      # zestawienie 2026-10-26 (stare kartoteki Osram i nowe Floodlight PS):
      # - lm skrocone "1K2LM" / "10KLM" (Floodlight 10 8W 1K2LM) -> 1200LM / 10000LM
      # - stare kody Osram z poczatku: "L15/76" = L 15W/76, "DS7/41-827" = DULUX S 7W/827, "ST8A-0.9M" = T8 900 mm
      # - sklejki i literowki Ekonoma: "16W830EUE", "8404100 lm", "OSRA M", "EUELEDV", "Classicassic", "E277 173",
      #   "ODWIFI" (= OUTD WIFI), "PBU SB" (= PB USB, ciecie na 40. znaku)
      - {match: '(?i)\b(\d{1,3})K(\d)LM\b', repl: '\g<1>\g<2>00LM'}
      - {match: '(?i)\b(\d{1,3})KLM\b', repl: '\g<1>000LM'}
      - {match: '^L(\d{1,2})/(\d{2,3})\b', repl: 'L \1W/\2'}
      - {match: '^D([SL])(\d{1,2})/(?:\d{2}-)?(\d{3})\b', repl: 'DULUX \1 \2W/\3'}
      - {match: '\bST8[A-Z]?-0[.,](\d)M\b', repl: 'T8 \g<1>00MM'}
      - {match: '\bST8[A-Z]?-1[.,](\d)M\b', repl: 'T8 1\g<1>00MM'}
      - {match: '(?<=\d)W([89]\d{2})EUE\b', repl: 'W \1 EUE'}
      - {match: '(?i)\b([89]\d{2})(\d{4}) ?LM\b', repl: '\1 \2LM'}
      - {match: '(?i)\bOSRA M\b', repl: OSRAM}
      - {match: '\bEUELEDV\b', repl: EUE LEDV}
      - {match: '(?i)\bClassicassic\b', repl: Classic}
      - {match: '\bE277 173$', repl: E27}
      - {match: '\bODWIFI\b', repl: OUTD WIFI}
      - {match: '\bPBU SB\b', repl: PB USB}
      - {match: '(?i)\b3x 4x(\d+)\b', repl: '3x\1/4x\1'}  # statecznik "FIT8 3x 4x18" = 3x18 albo 4x18, nie "3x4W"
      - {match: '\b2GX11\b', repl: 2G11}  # "DL28/830 HE 2GX11" - karta GTIN: DULUX L 28W/830 (trzonek 2G11)
      # barwa slowem bez K: ENDURA Flood "Cool White" = 4000 K (karta GTIN), BASIC T5 "640" = L 6W/640 = 4000 K
      - {match: '(?i)^(.*\bENDURA\b.*?)\bCool White\b(?!.*\d{4} ?K)', repl: '\1 4000K'}
      - {match: '(?i)^(.*\bBASICL?\b.*\dW) 6([2-5])0\b', repl: '\1 \g<2>000K'}
      # moc z karty GTIN (34 W, 4352 / 4420 lm) - Ekonom podaje tylko klosz OPAL / PRISM
      - {match: '\bOFFICE LINEAR V 2CCT\b', repl: 'OFFICE LINEAR V 34W 2CCT'}
      # zestaw Google Nest Mini Chalk + zarowka (karta: "Google Mini Bundle chalk Classic A60 FR RGBW E27")
      - {match: '(?i)^Smart\+ WiFi Google Chalk \+ Led A60\b', repl: 'GOOGLE NEST MINI CHALK + CLA60'}
      - {match: '^Czujnik (DALI-2) SENSORS CEILING MOUNTING KIT$', repl: 'Adapter do montażu czujników na suficie \1'}
    # Rodzaj oprawy, gdy typ reguly daje zly rzeczownik (przeglad 2026-10-21): rodzina architektoniczna AR (FLO =
    # naswietlacz, ING = najazdowa, WWASH = wallwasher, SPOT = reflektor), podszafkowe Puck / Magnet, Orbis Flame =
    # kinkiet, IndiviLED Light Sources = modul, UVC Panel = panel z oczyszczaczem
    noun_overrides:
      # kamery z oswietleniem wg modelu (2026-10-21); Globe Camera Track & Trace wkreca sie w oprawe E27 - bez wlasnego swiatla
      - {match: '\bFLOOD\b', noun: Naświetlacz LED z kamerą, gender: m, types: [kamera_oprawa]}
      - {match: '\bMULTI ?SPOT\b', noun: Reflektor LED z kamerą, gender: m, types: [kamera_oprawa]}
      - {match: '\bGLOBE\b', noun: Kamera, gender: f, types: [kamera_oprawa]}
      - {match: '^OPRAWA AR FLO\b', noun: Naświetlacz LED, gender: m, typ: naswietlacz, types: [wpuszczana]}
      - {match: '^OPRAWA AR ING\b', noun: Oprawa najazdowa LED, gender: f, types: [wpuszczana]}
      - {match: '^OPRAWA AR WWASH\b', noun: Oprawa Wall Washer LED, gender: f, types: [wpuszczana]}
      - {match: '^OPRAWA AR SPOT\d?\b', noun: Reflektor LED, gender: m, types: [wpuszczana]}
      - {match: 'PUCK|UNDERCABINET|\bMAGNET\b', noun: Oprawa podszafkowa LED, gender: f, types: [wpuszczana, downlight]}
      - {match: 'ORBIS FLAME WALL', noun: Kinkiet LED, gender: m, types: [plafon]}
      - {match: 'LIGHT SOURCES', noun: Moduł LED, gender: m, typ: modul_led, types: [panel, plafon, liniowa]}
      - {match: 'UVC PANEL.*RECIRCULATOR', noun: Panel LED z oczyszczaczem UVC, gender: m, types: [panel]}
      - {match: 'OFFICE LINE DESK', noun: Lampa biurkowa LED, gender: f, types: [liniowa]}
      - {match: 'BOLLARD', noun: Słupek oświetleniowy LED, gender: m, types: [uliczna]}
      - {match: 'WALL VARIO', noun: Kinkiet zewnętrzny LED, gender: m, types: [uliczna]}
      # "LED SQUARE IP44 14W Click-CCT" - kwadratowy plafon sufitowo-scienny (karta: rodzina LED SQUARE IP44), 2026-10-26
      - {match: '\bLED SQUARE IP44\b', noun: Plafon LED, gender: m, typ: plafon, types: [oprawa_led]}
    # koncowe zamiany: rozmiar banki z wyroznika katalogu do ksztaltu ("globe ... Globe 95" -> "globe G95 ...", 2026-10-21)
    name_replace:
      - {match: '\bglobe\b((?: \S+){0,3}?) Globe (\d{2,3})\b', repl: 'globe G\2\1'}
    # wspolne listy cech (`features: [plug]` w typie): wtyczka CH / EU / UK zamiast golego "CH" / "EU" (2026-10-21)
    feature_sets:
      plug:
        - {match: '\bCH\b(?:\s?PLUG)?|SWISS PLUG', label: z wtyczką CH, group: plug}
        - {match: '\bEU\b(?:\s?PLUG)?', label: z wtyczką EU, group: plug}
        - {match: '\bUK\b(?:\s?PLUG)?', label: z wtyczką UK, group: plug}
    # karta GTIN uzupelnia brakujace parametry (moc, ksztalt, barwa TW, protokol Smart+, T8) w tych typach, gdy opisuje
    # ten sam produkt co Ekonom (2026-10-21)
    card_fill_types: [zarowka_led, tuba, zarowka_tradycyjna, klosz_hql, halogen, liniowa, kamera_oprawa]
    # brakujace lm z karty ledvance.com/en/gtin/<EAN> (cache scripts/fetch_ledvance_web.py), gdy moc i barwa
    # karty zgadzaja sie z Ekonomem (2026-10-20: "brakuje lumenow a na stronie ledvance jest")
    lumen_from_gtin_card: true
    # linia z rodziny produktu na karcie GTIN, gdy ktoras karta rodziny pisze ja slowem ("LED CLASSIC B V" + karta
    # "VALUE CLAS B 60" -> Value); litera w Ekonomie nadal nic nie decyduje (2026-10-20)
    line_from_card_family: true
    # swietlowki liniowe nazywamy tubami (decyzja uzytkownika 2026-10-19), takze "Oprawa hermetyczna pod tuby LED"
    tube_words: [tubę, tuby]
    # Marka z opakowania (decyzja uzytkownika 2026-10-15). Ledvance sprzedaje te same lampy pod
    # markami OSRAM, LEDVANCE i BELLALUX - kazda z osobnym EAN, a stara nazwa w Ekonomie jest
    # identyczna. Zrodla: kolumny EAN marek w polskim katalogu ("Nazwa produktu | OSRAM EAN10 |
    # LEDVANCE EAN10 | BELLALUX EAN10") i jawna koncowka kodu zamowieniowego w nazwie Ekonoma
    # ("...2X1OSRAM", "... FS1 OSRAM"). Przy rozbieznosci wygrywa katalog.
    package_from_pdf: true
    package_brand:
      catalog_columns: {OSRAM: Osram, LEDVANCE: Ledvance, BELLALUX: Bellalux}
      name_rules:
        - {match: 'OSRAM\s*$', brand: Osram}
        # stare kartoteki z koncowka EAN za marka: "HALOSTAR 35W 12V GY6,35 OSRAM 7426", "120ST OSRAM8081" (2026-10-26)
        - {match: '\bOSRAM ?\d{4}$', brand: Osram}
        # zarowki samochodowe to zawsze Osram (Ledvance ich nie sprzedaje), takze bez slowa OSRAM w Ekonomie
        - {match: '^(?!.*LATARKA)(?!.*FLASHLIGHT).*(?:SAMOCH|\bZAROWKA SAM\.)', brand: Osram}
    # Multipak (decyzja 2026-10-15): liczba sztuk w opakowaniu na koncu nazwy, gdy > 1. Zrodla:
    # nazwa w Ekonomie ("3pack", "FS3", kod "10X3OSRAM" = karton 10 x opak. 3 szt.) i wiersz katalogu
    # retail ("... dlugosc | srednica | sztuk w opak. | sztuk w kartonie"), ten drugi tylko gdy wiersz
    # ma moc z nazwy. Cen nie uzywamy.
    pack_size:
      suffix: 'op. {n} szt.'
      from_catalog: true
      name_patterns:
        - '\b(\d+)\s*-?\s*PACK\b'
        - '\bFS(\d+)\b'
        - '\b(\d+)\s?PCS?\b'   # "DOT-IT NURSERY 3PC" = zestaw 3 lampek (2026-10-21)
        - '\bSET ?(\d+)\b'     # "PANEL PRINT SKY ... SET9" = komplet 9 paneli jednego nadruku (2026-10-21)
        # kod sklejony z marka, takze z gwintem ("E274X3LEDV" = E27 + 4X3); "110X30 LEDV" to kat, "500X500" wymiar
        - '(?<![.X])\d+X(\d{1,2})(?:EUE)?(?:OSRAM|LEDV)'
        - '\bX(\d{1,2})$'        # "... ENERGY RAIL 1500 5P END x10"
        - '\bEND X (\d{1,2})$'   # "... 8P END x 10"
        - '\b(\d{1,2})X$'        # "CONNECTOR BOX 5POLE L/N/E/D+/D- 4x"
      word_packs: {DOUBLE: 2, TRIPLE: 3}  # "Terminal Block 10W 840 Triple Pack"
      fixed_words: {DUOBOX: 2}  # "64193NBU DUOBOX" = blister 2 szt. (2026-10-26)
    # Barwa w nazwie Ekonoma inna niz kod barwy w katalogu dla tego EAN (2026-10-15: Star PAR16 3,7W
    # 827/840 zamienione). Moc zgodna -> barwa z katalogu (WARNING), inna moc -> DO_SPRAWDZENIA.
    catalog_cct_check: true
    # Katalogi (fragment nazwy pliku), w ktorych wiersz tabeli jest wiarygodny: nazwa przy swoim EAN,
    # przedostatnia liczba = sztuk w opakowaniu (25/25 zgodne z kodem w nazwie). W innych katalogach ta
    # kolumna to karton albo moc, a tabele opraw przesuwaja nazwy wzgledem EAN.
    package_catalogs: ['retail_lamps_program']
    # Wyroznik dla nazw, ktore nadal sie powtarzaja (decyzje 2026-10-15: "dodaj wyrozniki", potem "tyle
    # informacji, zeby sie wyroznialo, ale nie wiecej; czego nie ma - wyszukaj w sieci"). Kazdy produkt
    # dostaje NAJMNIEJSZY zestaw slow, ktorego nie ma w calosci zaden inny z grupy (slowa przed liczbami).
    # Zrodla po kolei: katalog PDF (tylko katalogi lamp z nazwa przy EAN - w katalogach opraw nazwy sa
    # przesuniete), stara nazwa w Ekonomie, nazwa ze strony ledvance.com (cache
    # `scripts/fetch_ledvance_web.py`). Porownujemy tylko produkty opisane jednym stylem zapisu.
    # `words`: tlumaczenie slow (zarowka = rodzaj zenski; kolory z `housing_colors` odmieniane wg nazwy);
    # null = slowo pomijane. `stop`: szum ze starych nazw.
    distinguish:
      # fragment nazwy pliku katalogu -> styl zapisu nazw
      catalogs: {retail_lamps_program: retail, lamps_launch_trade: broszura, vintage_edition: broszura}
      web_cache: cache/ledvance_web
      # karta ledvance.com/en/gtin opisuje pod EAN inny produkt (moc/barwa/gwint) niz nazwa w Ekonomie ->
      # nazwa budowana z karty (EAN = nadruk na opakowaniu), WARNING ze stara nazwa w uwagach
      fix_from_gtin_page: true
      # ...ale nie, gdy karta ma inny trzonek, ksztalt banki albo dlugosc tuby - to inny produkt, nie literowka w Ekonomie:
      # zostaje nazwa z Ekonoma, status DO_SPRAWDZENIA (decyzja uzytkownika 2026-10-21)
      gtin_other_product: true
      stop: [LAMPA, LAMPY, OPRAWA, ZAROWKA, PASEK, LED, LEDV, LEDVANCE, OSRAM, BELLALUX, EUE, CLASS, CLASSIC, CL, NON, NON-DIM,
             LAMPS, LAMP, WITH, AND, THE, FOR, OF, IN,
             # pilot w nazwie juz jako "z pilotem" (2026-10-20)
             RC, REMOTE, CONTROL]
      # opakowanie rozstrzyga `pack_size` ("op. N szt."), kody kartonu nie sa wyroznikiem
      stop_patterns: ['FS\d+', '\d*-?PACK', 'SINGLE', 'TRIPLE', 'DOUBLE', '\d+X\d+', 'X\d+', '\d+X', '[VPSE]', '\d+XLAMP',
                      # kody zamowieniowe / nazwy rodzin z karty GTIN - nic nie mowia sprzedawcy ("PIN20" = zamiennik 20 W)
                      'LSSP\w*', 'LED(PIN|TSLIM|TUBE)\w*', 'T?SLIM', 'PIN\d*', 'PAR\d{4,}', 'SPOT', 'TUBE',
                      'CLAS?\d*', 'VALUECLA\d*',
                      # smieci wyroznikow z przegladu 2026-10-21 ("Valcla 100", "Ledsclb 40", "CLP 40", "FR 40", "GL 60",
                      # "Rgbw 60", "TW 60", "T8 36", "SST", "PAR 16V", "100D", "PARATHOM+", "Big", "Special", "Retrofit");
                      # slowo przed liczba z tej listy odbiera tez liczbe za nim (zamiennik mocy "40" nic nie mowi)
                      'VALCLA\d*', 'LEDVCLA\d*', 'LEDS?CL[ABP]\w*', 'CL[ABP]\d*', 'FR', 'GL', 'GLFR', 'RGBW?', 'TW',
                      # kod ksztaltu jest juz w nazwie, liczba za nim to zamiennik mocy ("PAR16 80", "R50 60")
                      'PAR\d{2}', 'MR\d{2}', 'R\d{2}', 'AR111', 'T26',
                      # RETROFIT nie jest tu szumem - odroznia blizniaki (decyzja uzytkownika 2026-10-21)
                      'T[58]', 'EM', 'STICK', 'SST', 'PAR', '\d{2,3}D', 'PARATHOM\+?', 'BIG', 'SPECIAL',
                      # plomyk BA / BW tez sklejony ("CLBW40", "BW40") - BW nie wraca jako wyroznik (decyzja 2026-10-21)
                      'WORKLIGHTS?', '\d{3}-\d', 'BA', 'BW', 'CL?B[AW]\d*', 'A(?:15|25|40|45|55|75|100|120|150|200)V?', 'SMART\+?',
                      # rozmiar globe jest w ksztalcie ("globe G80"), sklejone kody Vintage ("1906LGL80")
                      'GLOBE\d+', '1906\w*', 'LGL\d*', 'COLOU?RED',
                      # sklejony kod zamowieniowy "LED G125150" (globe 125 + zamiennik 150 W), 2026-10-21
                      'G\d{5,6}', 'LEDS?G\d+',
                      # "Zawiesie do paneli Zestaw", "Pilot WiFi Controller DIM" (2026-10-26)
                      'ZESTAW', 'CONTROLLER']
      # wyroznik sprzeczny z nazwa (inny klosz / ksztalt niz w Ekonomie) -> DO_SPRAWDZENIA, bez dopisku
      conflicts: [[matowa, przezroczysta], [świeczka, kulka, A60, globe]]
      words:
        # linia Pro z karty ("HQL LED PRO") - jak inne linie stoi za marka (2026-10-21: bylo "PRO" przed marka)
        PRO: Pro
        # swietlowki T5 short "BASICL 6W 640" / "LUMILUXL 8W 840" (2026-10-26: wyroznik "Basicl")
        BASICL: Basic
        LUMILUXL: Lumilux
        DARK: grafitowy  # "Outdoor Motion Sensor Dark Grey" (2026-10-21: bylo "Dark")
        GLOBE: globe
        EDISON: Edison
        BLUE: niebieska
        RED: czerwona
        ORANGE: pomarańczowa
        ROSE: różowa
        # kolor szkla klosza po angielsku, jak na opakowaniu (decyzja uzytkownika 2026-10-21)
        SMOKE: Smoke
        AMBER: Amber
        TEA: null
        SMALL: mała
        MEDIUM: średnia
        LARGE: duża
        ROUND: okrągła
        SQUARE: kwadratowa
        CRACKED: spękane szkło
        # klosz dekoracyjnych FLAT LAMP (karta: "... IN CRACKED GLASS FLATTENED BROWN"), 2026-10-21
        SMOEK: null  # literowka "SMOEK 80" w Ekonomie (globe G80 jest juz w ksztalcie)
        FLATTENED: spłaszczona
        LONG: podłużna
        ELECTRO: szkło elektrostatyczne
        GLASS: null
        DAYL+SENS: z czujnikiem zmierzchu
        DAYL+MOT+SENS: z czujnikiem ruchu i zmierzchu
        DAYLIGHT: z czujnikiem zmierzchu
        MOTION: z czujnikiem ruchu
        SENSOR: z czujnikiem
        GLOWDIM: GlowDim
        STEP: 3-stopniowa
        MAGNETIC: magnetyczna
        FILAMENT: filament
        FIL: filament
        GL: null
        DECOR: null
        RECYCLED: PCR
        PLASTIC: null
        DIM: null
        CLEAR: przezroczysta
        FROSTED: matowa
        FR: matowa
        B25: świeczka
        B35: świeczka
        B40: świeczka
        B60: świeczka
        B75: świeczka
        CLB: świeczka
        P25: kulka
        P40: kulka
        P45: kulka
        P60: kulka
        CLP: kulka
    # Pojedyncza litera V/P/S/E nie jest linia ani wyroznikiem (2026-10-19: "wylacz z samych liter, bo moga byc
    # bledne" - "URBAN LITE S 15W" to rozmiar S, nie Superior). Linia tylko ze slowa: VALUE, PERFORMANCE, SUPERIOR...
    # WITH / RC - resztki "WITH REMOTE CONTROL" / "+ RC" (pilot idzie jako "z pilotem"), nie wyroznik
    # OVEN / SUPER / 4Y / CO / WORKLIGHT - juz w cechach ("do piekarnika", "Super 4Y", "powlekana"), 2026-10-21
    # SKY1 - numer wzoru Print Sky jest przy nazwie wlasnej (`family_extra`), 2026-10-21
    version_skip: ['SKY\d', '\d*-?PACK', 'FS\d+', 'SINGLE', '[VPSE]', 'WITH', 'RC', 'PASEK', 'REMOTE', 'CONTROL', 'DETEKTOR', 'MOTION', 'CONTACT', 'OVEN', 'SUPER', '4Y', 'XT', 'CO',
                   'WORKLIGHTS?', 'MEAT', 'BREAD', 'FRUIT', 'SEAFOOD', 'VEG', 'PLUG', 'CH', 'EU',
                   'ZESTAW', 'CONTROLLER',  # "Zawiesie do paneli Zestaw", "Pilot WiFi Controller DIM" (2026-10-26)
                   'BA', 'BW', 'A(?:15|25|40|45|55|75|100|120|150|200)V?', 'OP']
    # wersja z nazwy po `name_cleanup` ("PL-CN111", bez opisu po "|"), 2026-10-21
    version_from_clean: true
    # wersja z klosza opal: "Downlight ... OPAL OP" -> "opal" (2026-10-21)
    version_letters: {OPAL: opal}
    # Rodzina opraw z nazwy katalogowej, za marka ("Oprawa uliczna LED 30W ... Ledvance Urban Lite S"); `label` albo
    # dopasowanie pisane Wielka Litera (litery rozmiaru S/M/L/XL zostaja wielkie). Pomijana, gdy juz jest w serii / modelu.
    families:
      - match: '\bURBAN(?: (?:LANTERN(?: SQUARE)?|LITE(?: (?:XL|S|M|L)\b)?|VILLA(?: (?:COMPACT|RETROFIT))?|WALL VARIO|WALLPACK|BOLLARD CONE|AREA|FERNANDINO|CLASSIC))?\b'
      # oprawy SL FLEX bez karty GTIN (2026-10-21: "Oprawa Oprawa SL FLEX SM NM" - bez nazwy wlasnej)
      - {match: '\bSL FLEX SM\b', label: Streetlight Flex Small}
      - {match: '\bSL FLEX MD\b', label: Streetlight Flex Medium}
      - {match: '\bSL FLEX LA\b', label: Streetlight Flex Large}
    # Nazwa wlasna oprawy z rodziny na karcie ledvance.com/en/gtin/<EAN> (2026-10-20: "brakuje nazw wlasnych"):
    # "DAMP PROOF MAX EMERGENCY SENSOR" -> "Damp Proof Max", "Orbis Livia", "TruSys Wide". Stoi na miejscu `family`
    # (za marka przed linia, `family_after_noun: false`); `families` z nazwy w Ekonomie (Urban) ma pierwszenstwo. Tylko typy
    # opraw z `types`.
    # Z rodziny wycinane sa slowa techniczne, ktore nazwa juz niesie w parametrach (DALI, czujnik, awaryjna, IP, UGR,
    # wymiary, moc, GEN 2), linia slowem (Value / Performance / Superior) i samotne litery klasy V / P / E.
    # Sama nazwa kategorii (Panel, Downlight, Floodlight, Damp Proof, High Bay...) nie jest nazwa wlasna - pomijana.
    # nazwa wlasna (Urban, rodzina z karty) na KONCU, za marka, przed linia (decyzja 2026-10-20, druga: "nazwa wlasna
    # jednak na koncu wszedzie" - "Naswietlacz LED 50W 5000lm 6500K 100° bialy Ledvance Floodlight Compact"); v9-v15
    # stala zaraz za rzeczownikiem (true)
    family_after_noun: false
    # seria / nazwa wlasna dekoru i Smart+ tez na koncu za marka (2026-10-20: "Lampa stolowa E27 brazowa Ledvance Decor
    # Cardboard Square", nie "Lampa stolowa Decor Cardboard Square E27 ..."), jak u Kobi / Kanlux / GTV / Bemko
    series_after_brand: true
    # dopisek do nazwy wlasnej w wybranych typach (2026-10-20): HE w oprawach hermetycznych to High Efficiency
    # ("Oprawa hermetyczna LED Damp Proof High Efficiency 120cm 29W ..."); w downlightach / tubach HE zostaje bez zmian
    family_extra:
      - types: [hermetyczna]
        match: '\bHE\b|HIGH EFFICIENCY'
        add: High Efficiency
      # linia ECO CLASS stoi u Ledvance przed nazwa ("ECO CLASS DAMP PROOF HLO GEN 2"); Ekonom pisze tylko "LED ECO"
      - types: [hermetyczna]
        match: '\bECO CLASS\b'
        add: Eco Class
        prepend: true
      - types: [hermetyczna]
        match: '\bHLO\b|HIGH LUMEN OUTPUT'
        add: High Lumen Output
      # "DAMP PROOF HE 5X THROUGHWIRING" / "DP HE 5TH" - okablowanie przelotowe 5-zylowe (wczesniej resztki "HE
      # THROUGHWIRING" / "5TH" jako wyroznik)
      - types: [hermetyczna]
        match: '\b5\s?X\s?THROUGH ?WIRING\b|\b5\s?TH\b'
        add: 5x Throughwiring
      # zwykle okablowanie przelotowe: "DAMP PROOF FLEX THROUGHWIRING", "DP COMP TH", "SUBMARINE THROUGHWIRING"
      # (pomijane, gdy jest juz "5x Throughwiring"); "3TH" w DAMP PROOF ECO zostaje bez zmian - znaczenie niepewne
      - types: [hermetyczna]
        match: '\bTHROUGH ?WIRING\b|\bTH\b'
        add: Throughwiring
      # numer wzoru nadruku paneli Print Sky przy nazwie wlasnej: "... Ledvance Print Sky 1" (decyzja uzytkownika 2026-10-21)
      - types: [panel]
        match: '\bSKY ?(\d)\b'
        family: '^Print Sky$'
        add: '{0}'
    # slowa nazwy wlasnej, ktore mowi juz kat swiecenia ("Damp Proof Eco Narrow ... 90x60°" -> "Damp Proof Eco")
    family_strip:
      - types: [hermetyczna]
        match: '\b(?:Very )?(?:Narrow|Wide)\b'
    # skroty cech w nazwach Ledvance (karty: "DP EL" = DAMP PROOF EMERGENCY, "BLKH RD EL SN" = ... EMERGENCY SENSOR)
    feature_abbrev:
      EL: [emergency, EMERGENCY]
      SN: [sensor, SENSOR]
    # "ON-OFF" tylko przy blizniaku w wersji DALI / 1DIM (ta sama nazwa bez slow sterowania), decyzja 2026-10-21
    onoff_twins: true
    # HQI D / DL: barwa w K z karty GTIN zamiast "barwa dzienna"; bez karty zostaje "barwa dzienna" (decyzja 2026-10-21)
    hid_cct_from_card: true
    # GU5.3 z napieciem: "GU5.3 12V" (230V tylko gdy nazwa z Ekonoma / karta GTIN tak mowi), 2026-10-20
    gu53_voltage: true
    family_from_card:
      types: [downlight, wpuszczana, plafon, panel, liniowa, uliczna, naswietlacz, hermetyczna, high_bay, low_bay,
              szynowa, lampa_robocza, oprawa_hermetyczna_tuby, oprawa_zadaszen, oprawa_led, oprawa_scienna,
              oprawa_awaryjna, lampa_stojaca, oprawa_model]
      # rodziny-zaslepki na karcie ("Phase out" = wycofywany, "Coming soon")
      placeholders: ['(?i)^(phase out|coming soon)$']
      # rodziny, w ktorych nazwa produktu na karcie jest dokladniejsza ("Orbis Click Sensor" -> karta "Orbis Square
      # Click Sensor 430x430mm" = Orbis Square Click; Square / Sparkledot / Plate to modele), 2026-10-20
      refine_from_name: ['(?i)^ORBIS CLICK SENSOR$']
      # zamiany przed wycinaniem slow technicznych: "LED Color + White" to nazwa (RGB + bialy), a nie kolor obudowy
      rename:
        - {match: '(?i)\bCOLOU?R\s*(?:AND|\+)\s*WHITE\b', repl: COLORPLUSWHITE}
        - {match: '(?i)^SL AREA\b', repl: Streetlight Area}  # karta "SL AREA SM" = Streetlight Area (2026-10-21)
        # 2026-10-26: "LEDVANCE FLOODLIGHT LED" dawalo "... czarny Floodlight Ledvance" (marka z rodziny szla na koniec);
        # "ECO CLASS AREALIGHTING Gen 2" dawalo "Arealighting" - w nazwach v20 ta rodzina to "Eco Area"
        - {match: '(?i)^LEDVANCE\s+', repl: ''}
        - {match: '(?i)^ECO CLASS AREALIGHTING\b', repl: ECO AREA}
        - {match: '\s-\s', repl: ' '}  # "Worklights - Tripod"
      remove:
        - '(?i)\bGEN\s?\d\b|\(\s*GEN\s?\d\s*\)'
        - '(?i)\b(DALI|ZIGBEE|WI-?FI|MATTER|BT|SENSOR|EMERGENCY|OPAL|PS|ON-OFF|1DIM|DIM(MABLE)?)\b'
        - '(?i)\bCCT(-DIM)?\b|\b\d?CCT\b|\bCRI\s?\d+\b|\bIP\d\d\b|\bIK\d\d\b|\bUGR\s?[<-]?\s?\d\d\b'
        - '(?i)\b(WARM|COOL|NEUTRAL|TUNABLE) WHITE\b|\bMULTICOLOU?R\b|\bRGB(\+?W)?\b'
        - '(?i)\bACCESSORIES\b|\bLUMINAIRE HEAD\b|\bWITH EU PLUG\b|\bCH PLUG\b'
        - '(?i)\b(RADIAL )?SYMMETRIC(\s\d+)?\b|\bA?SYM\b|\bASYMMETRIC(\s\d+\s?X\s?\d+)?\b|\bZHAGA( TOP)?\b|\bRV20ST\b'
        - '(?i)\b\d*X?\s?THROUGH ?WIRING\b|\b\d+TH\b|\b\d+X\b'
        - '(?i)\b\d+\s?X\s?\d+\s?MM\b|\b\d+\s?X\s?\d+\b|\bX\s\d+\b|\b\d+\s?W\b|\b\d+\s?mm\b|\b\d+°|\b\d{2,4}\b'
        - '(?i)\bSMART\+|\bLED\b|\bPCR\b|\bVALUE\b|\bPERFORMANCE\b|\bSUPERIOR\b|\bECO CLASS\b|\bHLO\b|\bHE\b|\bHIGH EFFICIENCY\b'
        - '(?i)\b(BLACK|WHITE|GR[AE]Y|SILVER|ANTHRACITE|DARK GR[AE]Y|GRAPHITE|BK|WT|GY)\b'
        - '(?i)\bR[VUNSW]\d{2}\w*\b|\bTOP ?&\s?BOTTOM\b|&\s?BOTTOM\b|\bON/OFF\b|\b\d+X\d+W\b'
        - '\b[VPE]\b'
        - '™|\(\s*\)'
        - '(?i)\bDAMP PROOF (?=SUBMARINE\b)'
      # Pojedyncze slowo, ktore samo nie jest nazwa wlasna (rodzina = tylko ono jest pomijana). Od 2026-10-20 puste:
      # "Bulkhead", "Batten", "Spot", "Floodlight" to nazwy produktow Ledvance ("tutaj nie powinien byc bulkhead jako
      # nazwa wlasna?"); "Panel" / "Downlight" i tak wypadaja jako powtorzenie rzeczownika.
      generic_words: []
      # pisownia producenta ("INDIVILED" -> "IndiviLED")
      spelling: {Indiviled: IndiviLED, Trusys: TruSys, Hcl: HCL, Gu10: GU10, Tubekit: TubeKIT, Usb: USB, Pir: PIR,
                 Tpa: TPA, Tpb: TPB, Cps: CPS, Uvc: UVC, Colorpluswhite: Color + White}
    # Szum z nazw katalogowych usuwany przed budowa `model`.
    noise_patterns:
      - '(?i)(EUE)?\s?LEDV(ANCE)?\b'
      - '(?i)\bOSRAM\b'
      - '(?i)\bEUE\b'
    lumen_patterns:
      # "61000lm", "61 000lm", "920LM"; nie skleja "830 880LM" (barwa + lm)
      - '(?<!\d)(\d{1,2}[ .]\d{3}|\d{2,6})\s?LM\b'
      - '^LAMPA HQL LED (\d{4,5}) '
    # Dlugosc swietlowek liniowych z mocy (nazwa podaje tylko T8/T5 + W).
    fluorescent_lengths:
      T8: {15: 45, 16: 72, 18: 60, 30: 90, 36: 120, 38: 105, 58: 150, 70: 180}
      T5: {14: 55, 21: 85, 28: 115, 35: 145, 24: 55, 39: 85, 54: 115, 49: 145, 80: 145, 6: 21, 8: 29, 13: 52}
    # Gwint kompaktow DULUX z typu i mocy (gdy brak w nazwie).
    dulux_sockets:
      'D': {10: G24d-1, 13: G24d-1, 18: G24d-2, 26: G24d-3}
      'D/E': {10: G24q-1, 13: G24q-1, 18: G24q-2, 26: G24q-3}
      'T': {13: GX24d-1, 18: GX24d-2, 26: GX24d-3}
      'T/E': {13: GX24q-1, 18: GX24q-2, 26: GX24q-3, 32: GX24q-3, 42: GX24q-4, 57: GX24q-5}
      'S': {5: G23, 7: G23, 9: G23, 11: G23}
      'S/E': {5: 2G7, 7: 2G7, 9: 2G7, 11: 2G7}
      'L': {18: 2G11, 24: 2G11, 36: 2G11, 40: 2G11, 55: 2G11, 80: 2G11}
      'F': {18: 2G10, 24: 2G10, 36: 2G10}
    # Kolor obudowy (rodzaj wg `gender` typu albo rzeczownika: m / f / n). Kolejnosc ma znaczenie.
    # kolory dwutonowe "Black and Blue" -> "czarno-niebieski", "White and Wood Decor" -> "biały/drewno" (2026-10-20)
    two_tone_colors: true
    color_ignore: ['COLOU?R ?(?:\+|AND) ?WHITE']
    housing_colors:
      czarny: {stem: czarno, m: czarny, f: czarna, n: czarne, match: ['\bBK\b', '\bBLACK\b', 'CZARN', '\bBK(?=LEDV|ON\b)', 'EMBK\b']}
      # "Warm White", "Cool White", "Tunable White" to barwa swiatla, nie kolor obudowy (2026-10-15)
      bialy: {stem: biało, m: biały, f: biała, n: białe, match: ['\bWT\b', '(?<!WARM )(?<!COOL )(?<!NEUTRAL )(?<!TUNABLE )(?<!DAYLIGHT )\bWHITE\b', '\bWH\b', 'BIAL', 'WT(?= LEDV)']}
      grafit: {stem: grafitowo, m: grafitowy, f: grafitowa, n: grafitowe, match: ['\bDG\b', 'DARK GR[AE]Y', 'GUN ?METAL']}
      szary: {stem: szaro, m: szary, f: szara, n: szare, match: ['\bGY\b', '\bGR\b', '\bGRAY\b', '\bGREY\b', 'SZAR']}
      srebrny: {stem: srebrno, m: srebrny, f: srebrna, n: srebrne, match: ['\bSI\b', '\bSILVER\b']}
      nikiel: {m: nikiel, f: nikiel, n: nikiel, match: ['\bBN\b', 'BRUSHED NICKEL', '\bNK\b', '\bNICKEL\b']}
      chrom: {m: chrom, f: chrom, n: chrom, match: ['\bCR\b', '\bCHROME\b']}
      stal: {m: stal nierdz., f: stal nierdz., n: stal nierdz., match: ['STAINLESS STEEL', '\bST\b']}
      alu: {m: aluminium, f: aluminium, n: aluminium, match: ['\bALW\b', '\bAL(?=DA|ON)', '\bALUMINIUM\b']}
      brazowy: {stem: brązowo, m: brązowy, f: brązowa, n: brązowe, match: ['\bBROWN\b']}
      bezowy: {stem: beżowo, m: beżowy, f: beżowa, n: beżowe, match: ['\bBEIGE\b', '\bBG\b']}
      niebieski: {stem: niebiesko, m: niebieski, f: niebieska, n: niebieskie, match: ['\bBLUE\b']}
      pomaranczowy: {stem: pomarańczowo, m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['\bORANGE\b']}
      zielony: {stem: zielono, m: zielony, f: zielona, n: zielone, match: ['\bGREEN\b']}
      zloty: {stem: złoto, m: złoty, f: złota, n: złote, match: ['\bGOLD\b']}
      miedziany: {stem: miedziano, m: miedziany, f: miedziana, n: miedziane, match: ['\bCOPPER\b']}
      drewno: {m: drewno, f: drewno, n: drewno, match: ['\bWOOD DECOR\b', '\bWD\b', '\bWOOD\b']}
    # Rodzaj oprawy domowej/dekoracyjnej z nazwy katalogowej (pierwsze trafienie wygrywa).
    mount_nouns:
      # Planon to panel (Smart+ Planon Plus / Frameless, SMART+ MATTER Planon), nie plafon (2026-10-21)
      - {match: 'PLANON', noun: Panel LED, gender: m}
      # kamery z oswietleniem (Smart+ Outdoor ... Cam), wentylator, czesci Endura Hybrid / Urban Bollard (2026-10-21:
      # byly "Kinkiet ... Entrancenumber Cam", "Plafon ... Fan", "Oprawa ... Solar Panel", "Slupek ... Concrete Anchors")
      - {match: 'CAMERA', noun: Kamera, gender: f}
      - {match: 'CEILING FAN', noun: Wentylator sufitowy, gender: m}
      - {match: 'COMPONENTS SOLAR PANEL', noun: Panel solarny, gender: m}
      - {match: 'COMPONENTS TRANSFORMATOR', noun: Transformator, gender: m}
      - {match: 'CONCRETE ANCHORS', noun: Kotwy betonowe do słupka, gender: f}
      - {match: 'FOUNDATION', noun: Tuleja fundamentowa do słupka, gender: f}
      - {match: '\bPENDANT\b|\bPENDENT\b|PENDULUM|\bSUSPENDED\b', noun: Lampa wisząca, gender: f}
      # "Cabinet LED Corner 350mm" to oprawa podszafkowa narozna, nie lampa podlogowa (2026-10-21)
      - {match: '\bFLOOR\b|STANDING|^(?!.*CABINET).*CORNER', noun: Lampa podłogowa, gender: f}
      - {match: '\bTABLE', noun: Lampa stołowa, gender: f}
      - {match: '\bDESK\b|TASK ?LIGHT|DESKTOP', noun: Lampa biurkowa, gender: f}
      - {match: '\bWALL\b|\bMIRROR\b|ENTRANCE|\bUPDOWN\b|\bW CROSS\b|NUMBER', noun: Kinkiet, gender: m}
      - {match: '\bPOST\b|BOLLARD|\bPATH\b|GARDEN POLE|\bPOLE\b', noun: Słupek ogrodowy, gender: m}
      - {match: '\bSPIKE\b|GARDEN|\bGROUND\b', noun: Oprawa ogrodowa, gender: f}
      - {match: 'CAMERA', noun: Kamera, gender: f}
      - {match: 'TRACKL', noun: Reflektor szynowy, gender: m}
      - {match: 'CABINET|\bSHELF\b|BACKLIGHT|\bMOBILE\b', noun: Oprawa podszafkowa, gender: f}
      - {match: 'STRIP|\bFLEX\b|NEON|STRING', noun: Taśma LED, gender: f}
      - {match: '\bSPOT\b|\bSP\b|\bBEAM\b', noun: Reflektor, gender: m}
      - {match: 'NIGHTLUX|LUNETTA|DOT-IT|NIGHTLIGHT|CLOCK', noun: Lampka LED, gender: f}
      - {match: '\bCEILING\b|ORBIS|OBRIS|PLANON|CIRCULAR|\bDISC\b|\bDL\b|\bPANAN\b|\bUL\b', noun: Plafon, gender: m}
    outdoor_pattern: 'ENDURA|\bOUTD|OUTDOOR|SOLAR|IP6[5-8]'
