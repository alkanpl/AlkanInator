      - {match: '^QUAZAR', noun: Kinkiet ogrodowy, gender: m}
    series_drop:
      - '(?i)\b\d+\s?x\s?(E27|E14|G9|GU10|GX53|G5[,.]3|R7s)\b'
      - '(?i)\b(E27|E14|G9|GU10|GX53|G4|G5[,.]3|R7s)\b'
      - '(?i)\b\d{2,4}\s?x\s?\d{1,4}([.,]\d+)?\s?(mm|cm)?\b'
      - '(?i)\b\d{1,4}\s?(mm|cm)\b'
      - '(?i)\b\d+([.,]\d+)?\s?m\b'
      - '(?i)\b\d+([.,]\d+)?(-\d+([.,]\d+)?)*\s?W\b'
      - '(?i)\b\d{4}\s?K\b'
      - '(?i)\b\d+\s?lm\b'
      - '(?i)\bIP\s?\d{2}\b'
      - '(?i)\b\d?CCT\b|\bRGB\b'
      - '(?i)\b(LED|solar|LX|ST|DIM)\b'
      - '(?i)\b(czarn\w*|biał\w*|szar\w*|chrom\w*|złot\w*|srebrn\w*|różow\w*|zielon\w*|niebiesk\w*|drewn\w*|mat\w*|stal\w*|miedzian\w*|przeźroczyst\w*|przezroczyst\w*)\b'
      - '(?i)\b(black|white|gold|silver)\b'
      - '(?i)\b\d+-pak\b'
      - '(?i)\bdo (nad?|w)budowania\b'
      - '(?i)\b(z\s+)?siatk[aą](\s+(metal|plastik))?\b'
      - '(?i)\b(ruchom|gipsow|kwadratow|okrągł)\w*\b'
      - '(?i)\b(round|square)\b'
      - '(?i)\bdąb\b'
      - '(?i)\b\d+x\d+\s?lm\b'
      - '(?i)\b(oprawa|pochodnia) wbijana\b'
      - '(?i)\boprawa kanałowa\b'
      - '(?i)^(lampka biurkowa|lampa wisząca|pierścień ozdobny|oprawa|plafon|kinkiet)\b'
      - '(?i)\b\d+x\d+([.,]\d+)?W\b'
      - '(?<![\w.,/-])\d{2,4}(?![\w.,/-])'
    # Przeglad nazw wlasnych 2026-11-16: seria w typach parametrycznych (za marka). Dodatkowe porzadki tylko dla tych
    # typow (`series_drop: [*kobi_param_series_drop]`), bo w `dekor` seria niesie tez DALI / opis: rodzaj z nazwy feedu
    # ("Naświetlacz LED DELYO", "Panel LED CAPRI"), resztki parametrow (kat "36ST" / "120x90ST" / "90°", UGR, CRI, DALI,
    # 24V, "3/5/7W"), opis czujnika, kody zrodel, skroty koloru (CZ / CZA), gwiazdka z Ekonoma ("VESPA *").
    kobi_param_series_drop: &kobi_param_series_drop
      - '^\s*[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(\s+[a-ząćęłńóśźż]\S*)*(?=\s|$)'
      - '(?i)\bhigh bay\b'
      - '(?i)\bx?\d+(?:[-/x]\d+)?\s?(?:ST\b|°)'
      - '°'
      - '(?i)\bUGR\s?<?\s?\d*'
      - '(?i)\bCRI\s?\d*\b'
      - '(?i)\b(DALI|WIFI|ZIGBEE)\b'
      - '(?i)\b\d+(?:[.,]\d+)?\s?V\b'
      - '(?i)\b\d+(?:/\d+)+\s?W\b'
      - '(?<!\S)\d+(?:/\d+)*/(?!\S)'
      - '(?i)\bz czujnikiem( ruchu| zmierzchu)?( i zmierzchu)?\b'
      - '(?i)\b\d*\s?x?\s?(MR16|MR11|T8|T5)\b'
      - '(?i)\b(zestaw|oczko)\b'
      - '(?i)\bCZA?\b\.?'
      - '\*'
    types:
      # --- zrodla swiatla ---
      - key: zarowka_led
        noun: Żarówka LED
        match: ['^ZAROWKA', '^LED (GS|MB|SW|FGS|FMB|FSW|FDE|FG125|FST64|G120|R50|R63|MR11|MR16|ES111|T|J78|J118|G9|G4|GU10|GX53)\b', '^SMART LED (GS|GU10|\d)']
        no_feed: [color]
        version_suffix: true   # LLS GU10 5W 3000K i "GU10 PREMIUM 5W 3000K" to dwa produkty
        # kolejnosc jak w zarowkach Ledvance (2026-10-19): gwint, W, lm, K, ksztalt i cechy, marka na koncu
        # seria przed marka (PLANTY, 2026-11-17), protokol smart (WiFi) tez; kody ksztaltu (GS, MB, FGS...) i trzonki to nie nazwy wlasne
        series_drop: [*kobi_param_series_drop, '(?i)\b(GS|MB|SW|FGS|FMB|FSW|FDE|FG ?125|FST ?64|G ?\d{2,3}|R ?\d{2}|ES ?111|J ?\d{2,3}|S14|GU10|GX53|G9|G4|smart|filament\w*|mleczna)\b', '^\s*\S{1,2}\s*$']
        attrs: [gwint, power, lumen, cct, shape, glass, dim, sensor, features, color, control, series, brand]
        required: [gwint, power, lumen, cct]
      - key: swietlowka_led
        noun: Tuba LED
        match: ['^SWIETLOWKA LED', '^LED T8', '^LED NEXTUBE']
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop, '(?i)\b(tuba|świetlówka|swietlowka)\b', '^\s*G\d\s*$']
        attrs: [series, tube_type, tube_length, power, lumen, cct]
        required: [power, lumen, cct]
      - key: tasma
        noun: Taśma LED
        match: ['^TASMA', '^LED TRAMO', '^LUMOS', '^SMART LED SET']
        version_suffix: true
        series_drop: [*kobi_param_series_drop, '(?i)\bCOB\b', '(?i)\b(SMD)?(2835|5050|3528)\b', '(?i)\b(RED|GREEN|BLUE|YELLOW)\b']
        attrs: [series, features, size, power, cct, voltage, ip, control]
      # --- urzadzenia i akcesoria ---
      - key: zasilacz
        noun: Zasilacz LED
        match: ['^ZASILACZ', '^MODUL ZASILACZA']
        version_suffix: true
        # zasilacze do paneli (nowe kartoteki 2026-11-05): "do paneli", DALI, CCT
        features:
          - {match: 'DO PANEL', label: do paneli}
          - {match: '\bDALI\b', label: DALI}
          - {match: '\b\d?CCT\b', label: CCT}
        # kod zasilacza Lifud z nazwy w Ekonomie ("Zasilacz do Panelu LED 36W LF-GIF040YS900H"), feed go nie podaje (2026-11-16)
        features_code_raw:
          - {match: '\b(LF-[A-Z0-9]+)\b', label: '{0}'}
        attrs: [psu_kind, features, voltage, power, ip, features_code_raw]
      # Schemat nazwy przedluzaczy V3 (archived_input_files/input_2026-11-10/schemat nazwy przedłużaczy V3.xlsx, 2026-11-05) - wspolny z Bemko
      # (bebnowe tylko u Bemko): rodzaj, gniazda (+ USB), dlugosc, przekroj, uziemienie / Schuko / bez uziemienia,
      # wylacznik, [kolor], nazwa wlasna, marka. Kody Kobi "3gn/1,5m/Zu+W/1,5mm" rozpisane slowami.
      - key: przedluzacz
        noun_from: first_word
        match: ['^PRZEDLUZACZ', '^ROZGALEZNIK']
        version_suffix: true
        features:
          - {match: '\b(\d)GN\b', label: '{0} gn.', group: gn}
          - {match: 'GN\+(\d?USB(?:/\d?USB-C)?)', label: '+ {0}', group: usb}
          - {match: '/(\d+(?:,\d+)?)M\b', label: '{0}m', group: len}
          - {match: '/(\d(?:,\d+)?(?:X\d(?:,\d+)?)?)MM\b', label: '{0}mm2', group: cross}
          - {match: '/BU\b', label: bez uziemienia, group: earth}
          - {match: '/ZU\b', label: z uziemieniem, group: earth}
          - {match: '/ZU\+W\b', label: z wyłącznikiem}
        # nazwa wlasna (seria Kobi) za kolorem, przed marka; najdluzsza pierwsza
        features_name:
          - {match: '\bLINEA PRO CUBE C\b', label: Linea Pro Cube C, group: name}
          - {match: '\bLINEA PRO CUBE\b', label: Linea Pro Cube, group: name}
          - {match: '\bLINEA PRO XC\b', label: Linea Pro XC, group: name}
          - {match: '\bLINEA PRO (FL\d?)\b', label: 'Linea Pro {0}', group: name}
          - {match: '\bLINEA PRO\b', label: Linea Pro, group: name}
          - {match: '\bLINEA G\b', label: Linea G, group: name}
          - {match: '\bLINEA\b', label: Linea, group: name}
          - {match: '\bCONNECTO\b', label: Connecto, group: name}
          - {match: '\bFLOWFLEXER ORANGE\b', label: Flowflexer Orange, group: name}
        attrs: [features, color, features_name]
      - key: czujnik
        noun_from: first_word
        match: ['^CZUJNIK', '^LX\d']
        default_noun: Czujnik ruchu
        code_regex: '\b(LX\d+|HD\d+\w*)\b'
        version_suffix: true
        attrs: [code, optics, ip, features, color]
      - key: akcesorium
        noun_from: first_word
        match: ['^LACZNIK', '^ADAPTER', '^BAZA', '^ZASILANIE', '^ZASLEPKA', '^SZYNA', '^SZYNOPRZEWOD', '^ZESTAW DO ZAWIESZENIA', '^ZESTAW DO ZWIESZANIA', '^ROZETA', '^UCHWYT', '^OSLONA', '^SOCZEWKA', '^KLOSZ', '^RAMKA', '^KOTWA', '^PILOT', '^PRZESLONA', '^PRZEWOD', '^PROFIL', '^SLUP\b', '^MODUL BASE', '^PRZEDLUZKA', '^LINKA', '^UNIWERSALNY UCHWYT']
        version_suffix: true
        # system z nazwy w Ekonomie, gdy nazwa z feedu go gubi ("SZYNA 3-FAZOWA 2M CZARNA DO NEXTRACK NT" -> feed
        # "Szynoprzewód 3-obwodowy 2m czarny"; "UCHWYTY DO KARTONGIPSU NELIO") - przed marka, jak seria opraw (2026-11-17)
        features_sys_raw:
          - {match: '\bNEX(?:TRACK)?(?: NT)?$|\bNEXTRACK NT\b', label: Nextrack NT, group: sys}
          - {match: '\bNELIO\b', label: Nelio, group: sys}
        attrs: [model, features_sys_raw, brand]
      - key: urzadzenie
        noun_from: first_word
        match: ['^MIERNIK', '^PROGRAMATOR', '^STEROWNIK', '^WZMACNIACZ', '^SCIEMNIACZ', '^AKUM', '^BATERIA', '^STARTER', '^OPRAWKA', '^KOSTKA', '^SMART SOCKET', '^LATAR', '^ZESTAW TRAMO', '^WKLAD']
        version_suffix: true
        attrs: [model]
      # Grzejniki, termowentylatory, wentylatory i klimatory Kobi Windstar (2026-11-17): rodzaj, moc, kolor, nazwa
      # wlasna przed marka - "Grzejnik konwektorowy 2000W biały Sondo Turbo Kobi Windstar" (bylo "SONDO 2000W TURBO")
      - key: windstar
        noun_from: first_word
        match: ['^WENTYLATOR', '^KLIMATOR', '^TERMOWENTYLATOR', '^GRZEJNIK']
        version_suffix: true
        # tylko rodzaj z poczatku - wzorce opraw ("2 ST" = kat) obcinaly "LISSE 2 ST"
        series_drop_skip: ['solar|LX|ST|DIM']
        series_drop: ['^\s*[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(\s+[a-ząćęłńóśźż]\S*)*(?=\s|$)']
        attrs: [series, power, color]
      # KOBI POWER BOX 600W / 1000W / 1800W to banki energii (uzytkownik 2026-11-05); SUNFLASH - nierozstrzygniety
      - key: bank_energii
        noun: Bank energii
        gender: m
        match: ['\bPOWER BOX\b']
        trusted: true
        attrs: [power, series]
      # --- oprawy parametryczne ---
      - key: naswietlacz
        noun: Naświetlacz LED
        gender: m
        # VESPA PRO to w feedzie "Oprawa drogowa" (2026-11-05); SOLAR LED MHCS / KAMI - nowe kartoteki
        match: ['^NASWIETLACZ', '^LED (MHN|MHNC|MHC|MH|NEXPRO|ULSAN|KOLOSUM|TIGRA|MOSS|KAMI)\b', '^LED VESPA(?! PRO)\b', '^SOLAR LED MHCS?\b']
        feed_optics: true
        version_suffix: true
        # KAMI: "z kamerą i głośnikiem" daje cecha
        series_drop: [*kobi_param_series_drop, '(?i)\b(KAMERA|GŁOŚNIK|GLOSNIK)\b']
        attrs: [series, features, power, lumen, cct, optics, ip, sensor, color]
        required: [power, lumen]
      - key: high_bay
        noun: Oprawa High Bay LED
        match: ['HIGH BAY', '\bHB\b']
        requires_power: true
        feed_optics: true
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, power, lumen, cct, optics, ip, control, color]
        required: [power, lumen]
      - key: uliczna_parkowa
        noun: Oprawa parkowa LED
        match: ['^OPRAWA PARKOWA', 'STREET PARK', 'NEXPARK']
        version_suffix: true
        series_drop: [*kobi_param_series_drop]
        attrs: [series, features, power, lumen, cct, optics, ip, control, sensor, color]
        required: [power, lumen]
      - key: uliczna
        noun: Oprawa uliczna LED
        match: ['^OPRAWA DROGOWA', 'STREET', '\bVESPA PRO\b']
        requires_power: true
        version_suffix: true
        series_drop: [*kobi_param_series_drop]
        attrs: [series, features, power, lumen, cct, optics, ip, control, sensor, color]
        required: [power, lumen]
      - key: panel
        noun: Panel LED
        gender: m
        match: ['^PANEL LED', '^LED (ORIO|CAPRI|NELIO|CAMARO|DALIO)\b']
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, panel_size, power, lumen, cct, ugr, control, color]
        required: [power, lumen]
      # "Zestaw szynoprzewód 1-obwodowy NEXTRACK GO 4xGU10 1m" - szyna z reflektorami na wymienne zrodla
      - key: zestaw_szynowy
        noun: Zestaw szynowy
        gender: m
        match: ['^ZESTAW SZYNOPRZEWOD']
        version_suffix: true
        series_drop: [*kobi_param_series_drop]
        # bez mocy / lm seria nie przechodzi sama na koniec - seria i marka jawnie na koncu
        attrs: [features, sockets, size, color, series, brand]
      - key: reflektor_szynowy
        noun: Reflektor szynowy
        gender: m
        match: ['^REFLEKTOR SZYNOWY', '^NEXTRACK (NT|S-LINE)', '^NEXPULLOUT']
        feed_optics: true
        version_suffix: true
        # NEXTRACK "... CRI90 B / C / BP / CZ. P" - koncowki koloru i wersji z kodu, "CR90" = CRI90
        series_drop: [*kobi_param_series_drop, '(?i)\bCR\s?\d{2}\b', '(?<=\s)(B|C|BP|CP|P)\.?(?=\s|$)']
        attrs: [series, features, sockets, power, lumen, cct, optics, cri, color]
        required: [lumen]
      - key: downlight
        noun: Downlight
        gender: m
        match: ['^DOWNLIGHT', '^LED (NEXEYE|SATURN)\b', '^OH-\d+ OCZKO', '^OCZKO']
        version_suffix: true
        # oczka OH-xx: ksztalt i model (nowe kartoteki 2026-11-05 - "OH-20 OCZKO KWADRAT STAŁE CZARNE")
        code_regex: '\b(OH-\d+[A-Z]?)\b'
        # (ksztalt "kwadratowy" daje lista `features` dostawcy)
        features_post:
          - {match: '\bSTALE\b', label: {m: stały, f: stała, n: stałe}}
        series_drop: [*kobi_param_series_drop, '(?i)\bKWADRAT\b', '(?i)\bSTAŁ[EAY]\b', '(?i)\bRUCH\w*']
        attrs: [series, diameter, sockets, power, lumen, cct, ip, control, sensor, features, features_post, color, code]
        required: [lumen]
      - key: plafon
        noun: Plafon LED
        gender: m
        # plafony na zarowki (ROMERO 2xE27, MINI PLAFON 1X60W) ida do `dekor` (2026-11-05)
        match: ['^PLAFON(?!.*(\dXE27|\dX\d+W\b))', '^LED (SIGARO|ZOE|SOLARIS|MIA|ARIEL)\b']
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, power, lumen, cct, ip, sensor, color]
        required: [power, lumen]
      - key: hermetyczna_tuby
        noun: Oprawa hermetyczna
        # HERMETIC / HERMIC / HERMES n x dlugosc - takze z nazwy feedu "Oprawa hermetyczna HERMETIC 1x60" (2026-11-05)
        match: ['^HERMIC \d', '^DELFIA', '^ZEBRA', 'HERMETYCZNA LED 2XT8', '^(?!ZESTAW).*\b(HERMETIC|HERMIC|HERMES)( G2)? \dX']
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, housing_tubes, cct, ip, color]
      # Zestaw oprawy z tubami (2026-11-17): "ZESTAW HERMETIC 2X120 + LED T8 18W 4000K" byl "Oprawa hermetyczna LED
      # 128cm 18W" (bez tub, z moca jednej tuby) -> "Oprawa hermetyczna z tubami LED 2x120cm 2x18W 3600lm 4000K ..."
      - key: zestaw_hermetyczny
        noun: Oprawa hermetyczna
        match: ['^ZESTAW HERMETIC', '^ZESTAW HERMETYCZNY']
        version_suffix: true
        power_per_tube: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop, '(?i)(?<!\S)\d+x(?:\d+)?(?!\S)', '\+']
        attrs: [series, set_tubes, power, lumen, cct, ip, color]
        required: [power]
      - key: hermetyczna
        noun: Oprawa hermetyczna LED
        match: ['HERMETYCZNA', '^LED CORTEZ', '^LED NEXFORCE']
        version_suffix: true
        series_drop_skip: ['round|square']
        # zestaw "HERMETIC G2 + 2x LED T8" - samo "2x" po wycieciu tub
        series_drop: [*kobi_param_series_drop, '(?i)(?<!\S)\d+x(?!\S)', '\+']
        attrs: [series, length, power, lumen, cct, ip, color]
        required: [power, lumen]
      - key: liniowa
        noun: Oprawa liniowa LED
        match: ['^OPRAWA LINIOWA', '^LED DELGADO', '^OPRAWA NEXLINE', '\bKOLINE\b']
        requires_power: true
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, length, power, lumen, cct, ugr, control, color]
        required: [power, lumen]
      - key: meblowa
        noun: Oprawa meblowa LED
        match: ['^OPRAWA MEBLOWA', '^LAMPA PODSZAFKOWA', '^OPRAWA PODSZAFKOWA', '^LED WL\b']
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, power, lumen, cct, color]
        required: [power, lumen]
      - key: lampa_roslin
        noun: Lampa do roślin LED
        match: ['^LAMPA DO ROSLIN']
        version_suffix: true
        series_drop_skip: ['round|square']
        series_drop: [*kobi_param_series_drop]
        attrs: [series, power, cct, color]
      # --- oprawy domowe/dekoracyjne (rzeczownik z nazwy dostawcy) ---
      - key: dekor
        noun_from: first_word
        default_noun: Oprawa
        match: ['^LAMP', '^KINKIET', '^SLUPEK', '^GIRLANDA', '^OPRAWA', '^PLAFON', '^SPOT', '^PIERSCIEN', '^SMART LED', '^QUAZAR', '^NUUK', '^AQUARIUS', '^LO41', '^SAMIRA', '^SILVER', '^DECORO', '^LED (RIKO|CORREA|CLICK|HALO|VIVO|ORIGAMI)', '^IMPA', '^SOLAR LED']
        # rzeczownik z nazwy dostawcy ('Lampa wisząca ', 'Kinkiet ogrodowy ') - stare nazwy WIELKIMI zostaja (seria QUAZAR)
        strip_prefix: '^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(\s+[a-ząćęłńóśźż]\S*)*\s+'
        version_suffix: true
        attrs: [series, size, sockets, power, lumen, cct, ip, sensor, features, color]
      # Nowe kartoteki spoza feedu "LED <MODEL> 18W 4000K" bez rodzaju (DEFENDER, INDUO, ENTERA P - 2026-11-05):
      # rodzaju nie zgadujemy - "Oprawa LED" + model, brak lm = DO_SPRAWDZENIA.
      - key: oprawa_led_ogolna
        noun_from: first_word
        default_noun: Oprawa LED
        match: ['^LED [A-Z]{3,}']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, sensor, features, color]
        required: [lumen]

  # =================================================================== KANLUX
  # Wejscie: CSV z Ekonoma + pliki Parametry*.xlsx z kanlux.pl (--params-dir, format dlugi:
  # Kod Kanlux; Nazwa; Nazwa atrybutu; Wartosc). Dopasowanie po kodzie z `Kod towaru`
  # (37246/KAN -> 37246). Parametry sa zrodlem prawdy (moc, lm, K, trzonek, IP, kolor, wymiary)
  # i nadpisuja wartosci z nazwy; bez parametrow dane ida tylko z nazwy.
  # Nazwa Kanlux = kod modelu + polski typ ("XLED GU10 4,9W-WW Źródło światła LED") - rzeczownik
  # bierze sie z typu (`noun_from: tail`), seria z kodu modelu bez parametrow.
  kanlux:
    brand: Kanlux
    # zasady z Ledvance (2026-10-19): marka na koncu (seria opraw z parametrami za nia, jak linia),
    # srednica w mm, bez powtorzonych slow obok siebie, "tubę/tuby" zamiast "świetlówkę/świetlówki"
    brand_last: true
    series_after_brand: true
    diameter_mm: true
    dedupe_adjacent: true
    tube_words: [tubę, tuby]
    # "Oprawa pyłoszczelna" (typ z kanlux.com) to w nazwach "Oprawa hermetyczna" - jak u Ledvance, Bemko i GTV
    # (decyzja uzytkownika 2026-11-09); tez w odmianie: "Akcesorium oprawy hermetycznej".
    name_replace:
      - {match: '\bpyłoszczeln', repl: 'hermetyczn'}
      - {match: '\bPyłoszczeln', repl: 'Hermetyczn'}
    # Nazwa z parametrow tylko zamiast przerobionych nazw zaczynajacych sie od typu
    # ("Oprawa uliczna LED PRO-SL M 105W NW 17850lm ..."); poza tym zostaje nazwa z Ekonoma.
    prefer_feed_name: polish_start
    # ...i zamiast nazw WIELKIMI LITERAMI ("ZONA JQ-37-B CZUJNIK RUCHU 360ST CZARNY KANLUX", 2026-11-04)
    prefer_feed_name_upper: true
    # Karty produktow z kanlux.com dla kodow spoza plikow Parametry (scripts/fetch_kanlux_web.py);
    # kod, ktorego wyszukiwarka kanlux.com nie zna, jest wycofany - zostaje z danymi z nazwy (jak Kobi spoza feedu).
    params_web_cache: cache/kanlux_web
    # Powtorzenia rozniace sie tylko rozmiarem z kodu (STOBI DLP 350-W / 450-W) - rozmiar przy serii.
    version_number_with_word: true
    split_tail: true
    keep_case: true
    name_cleanup:
      - '^.*\bGwar\.\s+'
      - '^Gwarancja\s+(lat\s+)?\d+(\s+lat)?(\s+kolor\s+\S+)?\s+'
      - '\s+KANLUX$'
      - '(?<=^T5)-'   # "T5-13W" - inaczej moc przelaczana "5-13W"
      - '(?<=^G9)-'   # "G9-60W STAR"
      - '(?<=\b[ACGP]\d\d)(?=E\d\d)'   # "G45E14" -> "G45 E14" (ksztalt sklejony z gwintem)
      # nowe kartoteki 2026-11-04: kod uciety w Ekonomie ("AL-MS-WW-MAT-W-NT (35", "AZPO LED 22W-NW-L-B (")
      - '\s\(\d*(?=\s|$)(?![^()]*\))'
      # "T8 LED GLASSv3 24W-NW LAMPA LED" - rodzenstwo to "Tuba LED"
      - {match: '^(T8 LED .*)\bLAMPA LED$', repl: '\1Tuba LED'}
      - {match: '(\d)W(?=CCT\b)', repl: '\1W '}   # "AZPO LED 11,8WCCT-O-W" - moc zostawala w serii
      - '\s\*OPRAWA\b'   # "PLAVE LED CCT *OPRAWA"
    # Gwint, ktorego nazwa nie podaje.
    socket_rules:
      - {match: '^J-\d', socket: R7s}
      # A60/A67/G95/G125 bez gwintu w nazwie to E27 (B22 i E14 Kanlux zawsze podaje)
      - {match: '^(?!.*\b(E14|E27|B22)\b).*\b(A60|A67|G95C?|G125)\b', socket: E27}
    # Kolor swiatla wezy i neonow (kod w modelu: GIVRO LED 15M-BL).
    light_colors: {BL: niebieski, RE: czerwony, GR: zielony, YE: żółty, PK: różowy, MC: wielokolorowy}
    params_lumen_keys:
      - 'Strumień świetlny oprawy [lm]'
      - 'Całkowity znamionowy strumień świetlny [lm]'
      - 'Znamionowy strumień świetlny [lm]'
      # FIZU, SIGO: jedyny strumien w parametrach (karta kanlux.com ma te sama nazwe)
      - 'Użyteczny strumień świetlny źródła światła Φuse [lm]'
    # Kody barwy w kodzie modelu (gdy brak parametrow). WW u zarowek bywa 2700K - uwaga w raporcie.
    cct_codes: {WW: 3000K, NW: 4000K, CW: 6500K, EW: 2700K, WN: 3500K}
    lumen_patterns:
      - '(?<!\d)(\d{2,6})\s?LM\b'
    noise_patterns: []
    tail_drop:
      - ',\s*[1-4]P$'
      - ',\s*In \d+A'
    tail_nouns:
      - {match: '^WYLACZNIK NADMIAROWO-PRADOWY', noun: Wyłącznik nadprądowy, gender: m}
      # KRO = RCBO ("Wyłącznik róznicowo-prądowy, z członem nadmiarowym") - jak "Wyłącznik RCBO" u Bemko (2026-11-04)
      - {match: '^WYLACZNIK ROZNICOWO-PRADOWY, Z CZLONEM NADMIAROWYM', noun: Wyłącznik RCBO, gender: m}
      - {match: '^WYLACZNIK ROZNICOWO-PRADOWY', noun: Wyłącznik różnicowoprądowy, gender: m}
      # przecinki z typu Kanlux ("Rozłącznik izolacyjny, modułowy", "Stycznik modułowy, sterowanie230V AC") - 2026-11-04
      - {match: '^ROZLACZNIK IZOLACYJNY', noun: Rozłącznik izolacyjny, gender: m}
      - {match: '^STYCZNIK MODULOWY', noun: Stycznik modułowy, gender: m}
      - {match: '^OGRANICZNIK PRZEPIEC', noun: Ogranicznik przepięć, gender: m}
      - {match: '^OPRAWA TYPU DOWNLIGHT', noun: Downlight LED, gender: m}
      - {match: '^OPRAWA LED HIGH BAY', noun: Oprawa High Bay LED, gender: f}
      - {match: '^LAMPA PODLGOWA', noun: Lampa podłogowa, gender: f}
      - {match: '^RAMKA CZEROKROTNA', noun: Ramka czterokrotna, gender: f}
    # Kolor: wartosc `Kolor` z parametrow albo kod w modelu (-W, -B; osprzet: bi, sr, kr, sz, pe...).
    housing_colors:
      bialy_mat: {m: biały mat, f: biała mat, n: białe mat, match: ['BIALY MAT']}
      # kod osprzetu `cm` = czarny mat (parametry Kanlux LOGI ...-042 cm: Kolor "czarny mat", 2026-10-15)
      czarny_mat: {m: czarny mat, f: czarna mat, n: czarne mat, match: ['CZARNY MAT', '\bCM\b']}
      czarny_metalik: {m: czarny metalik, f: czarna metalik, n: czarne metalik, match: ['CZARNY METALIK']}
      # kod koloru Kanlux to ostatni czlon kodu (przed ew. -NT/-PT/-P1/-SE): "AL-SL-NW-MAT-W-NT", "STATO 50W-B"
      bialy: {m: biały, f: biała, n: białe, match: ['BIAL', '-W(?=(-[A-Z]{1,3}\d?)*$|/)', '\bBI\b']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN', '-B(?=(-[A-Z]{1,3}\d?)*$|/)', '\bCZ\b']}
      grafit: {m: grafitowy, f: grafitowa, n: grafitowe, match: ['GRAFIT', '-(GR|GM)(?=(-[A-Z]{1,3}\d?)*$)', '\bGR\b']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['SREBRN', '-(S|SR)(?=(-[A-Z]{1,3}\d?)*$)', '\bSR\b']}
      szampanski: {m: szampański, f: szampańska, n: szampańskie, match: ['SZAMPAN', '\bSZ\b']}
      kremowy: {m: kremowy, f: kremowa, n: kremowe, match: ['KREM', '\bKR\b', '\bECRU\b']}
      perlowy: {m: perłowy, f: perłowa, n: perłowe, match: ['PERL', '\bPE\b']}
      szary: {m: szary, f: szara, n: szare, match: ['SZAR']}
      zloty: {m: złoty, f: złota, n: złote, match: ['ZLOT', '\bZL\b']}
      chrom: {m: chrom, f: chrom, n: chrom, match: ['CHROM']}
      miedziany: {m: miedziany, f: miedziana, n: miedziane, match: ['MIEDZ']}
      brazowy: {m: brązowy, f: brązowa, n: brązowe, match: ['BRAZ', '-BR(?=(-[A-Z]{1,3}\d?)*$|/)']}
      inox: {m: stal nierdz., f: stal nierdz., n: stal nierdz., match: ['NIERDZEWN', 'INOX']}
    shape_codes:
      - {match: '\bST ?64\b', label: Edison ST64}
      - {match: '\bG ?125\b', label: globe G125}
      - {match: '\bG ?95\b', label: globe G95}
      - {match: '\bG ?45\b|\bP ?45\b', label: kulka}
      - {match: '\bC ?35\b|\bC37\b|\bB35\b', label: świeczka}
      - {match: '\bPAR ?16\b|\bGU10\b', label: PAR16}
      - {match: '\bMR ?16\b', label: MR16}
      - {match: '\bT ?25\b|\bT ?26\b', label: T26}
    # Z serii (kodu modelu) usuwane sa parametry, ktore sa juz osobno w nazwie.
    series_drop:
      # dwuczlonowy kod koloru "W-SR" (bialy/srebrny) - przed wzorcem jednoczlonowego "-SR"
      - '(?<![\w-])(W|B|S)-(SR|GR|GM|ZL|BR|W|B|S)(?![\w-])'
      # "SPR.CTC-55/MR16" - po ukosniku to zgodnosc akcesorium, nie gwint (zostawal "SPR.CTC-55/", 2026-11-04)
      - '(?i)(?<!/)(E27|E14|E40|B22|GU10|GU5[.,]3|GX5[.,]3|G9|G4|GX53|R7S|G13|MR16)(?=\b|-|[A-Z])'
      - '(?i)\b\d+X\d+(?:[.,]\d+)?W\b'
      - '(?i)(?<![\d.,])\d+(?:[.,]\d+)?(?:-\d+(?:[.,]\d+)?)?\s?W(?:/M)?(?![A-Z])'
      - '(?<![A-Z])-?(WW|NW|CW|EW|WN)(?![A-Z])'
      - '-[89](27|30|40|65)\b'
      # "BRAVO S/P GRIP 12030" - IP tylko jako osobne slowo, nie koncowka "GRIP" (2026-11-04)
      - '(?i)(?<![A-Z])IP\s?\d{2}(?:/\d{2})?(?!\d)'
      # "CTRL 12/24V", "DRV40W1-10V" - zakres napiec zostaje w calosci (zostawal "CTRL 12/", "DRV 1", 2026-11-04)
      - '(?i)(?<![-/])\b\d{1,2}\s?V(DC)?\b(?![-/])'
      - '(?i)(?<![A-Z])(ST64|G125|G95|G45|C35|C37|A60|A65|A67|PAR16|R39|R50|R63|R80)(?![A-Z0-9])'
      - '-(W|B|S|GR|SR|GM|BR)(?=(-[A-Z]{1,3}\d?)*$|/)'
      - '-(BL|RE|GR|YE|PK|MC)\b'
      - '\b\d{2}-\d{4}-\d{3}\b'
      - '(?<![\w-])LED(?!\w)'
      - '(?<![\w.,/-])\d{1,5}(?![\w.,/-])'
      - '(?i)\b\d+(?:[.,]\d+)?M\b'
      # "EVALO FL 3xGU10 W-SR": po wycieciu gwintu zostaje krotnosc (W/B bez myslnika - np. "XLED W",
      # "FELINE B/W" - to czesc modelu i zostaje)
      - '(?i)(?<![\w.])\d+x(?!\w)'
    types:
      # --- zrodla swiatla ---
      - key: tuba
        noun: Tuba LED
        # nowe kartoteki 2026-11-04: "T8 LED GLASSv3 18W-NW Tuba LED 4000K 2700lm"
        match: ['ZRODLO SWIATLA LED$', '^T8 LED \S+ .*\bTUBA LED\b']
        require_pattern: '\bT8'
        version_suffix: true
        fluorescent_lengths:
          T8: {9: 60, 10: 60, 18: 120, 22: 150, 24: 150}
        # linia tuby za marka (przeglad nazw wlasnych 2026-11-16: GLASSv2-v5 i IQ-LED EX ginely)
        features_line_raw:
          - {match: '\bGLASS ?V(\d)(T?)\b', label: 'GLASSv{0}{1}', group: line}
          - {match: '\bIQ-LED EX\b', label: IQ-LED EX, group: line}
        attrs: [tube_type, tube_length, power, lumen, cct, brand, features_line_raw]
        required: [power, lumen, cct]
      - key: tasma_zrodlo
        noun: Taśma LED
        match: ['^LCOB.*ZRODLO SWIATLA LED$']
        version_suffix: true
        attrs: [series, strip_length, power, lumen, cct, voltage, ip]
        required: [power]
      # MOD / MODv2 - modul LED na wolnych koncach przewodow (do opraw), nie zarowka z trzonkiem
      - key: modul_led
        noun: Moduł LED
        gender: m
        match: ['^MOD(V2)?\b.*ZRODLO SWIATLA LED$']
        version_suffix: true
        attrs: [series, power, lumen, cct]
        required: [power]
      - key: zarowka_led
        noun: Żarówka LED
        gender: f
        match: ['ZRODLO SWIATLA LED$']
        version_suffix: true
        # kolejnosc jak w zarowkach Ledvance (2026-10-19): gwint, W, lm, K, ksztalt i cechy, marka na koncu
        attrs: [gwint, power, lumen, cct, shape, beam, dim, brand, series]
        required: [gwint, power, lumen, cct]
      - key: halogen
        noun: Żarówka halogenowa
        match: ['HALOGENOWE ZRODLO SWIATLA$']
        version_suffix: true
        attrs: [series, gwint, power, voltage]
        required: [gwint, power]
      - key: swietlowka_liniowa
        noun: Tuba fluorescencyjna
        match: ['SWIETLOWKA LINIOWA$']
        fluorescent_lengths:
          T8: {15: 45, 18: 60, 30: 90, 36: 120, 58: 150}
          T5: {6: 21, 8: 29, 13: 52, 14: 55, 21: 85, 24: 55, 28: 115, 35: 145, 39: 85, 49: 145, 54: 115, 80: 145}
        attrs: [tube_type, tube_length, power, cct]
        required: [power, cct]
      - key: tasma
        noun: Taśma LED
        match: ['TASMA LED$']
        version_suffix: true
        attrs: [series, strip_length, power, lumen, cct, voltage, ip]
        required: [power, cct]
      - key: waz_neon
        noun_from: tail
        match: ['WAZ SWIETLNY$', 'NEON LED$', 'GIRLANDA']
        version_suffix: true
        attrs: [series, strip_length, power, cct, light_color, ip]
      # --- akcesoria (przed oprawami - "Akcesorium oprawy typu downlight") ---
      - key: akcesorium_oswietlenia
        noun_from: tail
        match: ['AKCESORI', 'PIERSCIEN OPRAWY', 'ZASLEPKA DO', 'UCHWYT', 'KLOSZ DO', 'LACZNIK DO (TASM|WEZY|PROFILI)',
                'LACZNIK (TYPU|ELASTYCZNY)', 'ZAWIESIE', 'PRZYLACZE PRADOWE', 'PROFIL ALUMINIOWY', 'USZCZELKI',
                'KONTROLER DO TASM', 'PILOT DO TASM', 'OSPRZET DO OPRAW', 'RAMKA NATYNKOWA', 'RAMKA PODTYNKOWA',
                'ZESTAW STARTOWY', 'ZESTAWY 1', 'OPRAWKA DO ZRODEL', 'ZAPLONNIK', 'STATECZNIK', 'TRANSFORMATOR',
                'KONEKTOR']
        exclude: ['ROZDZIELNIC', '^KMCCB', '^KMP', 'SZYNY KBB']
        version_suffix: true
        # rozmiar ramki (3060/6060), dlugosc profilu (2m) i moc oprawy, do ktorej pasuje (HBPH GRID 100W)
        attrs: [series, panel_size, strip_length, power, color]
      - key: zasilacz
        noun_from: tail
        match: ['ZASILACZ (CV|CC|LED)$']
        version_suffix: true
        attrs: [series, power, voltage, ip]
        required: [power]
      - key: czujnik
        noun_from: tail
        match: ['CZUJNIK (RUCHU|ZMIERZCH|ZALANIA|OTWARCIA)', 'PRZEKAZNIK ZMIERZCHOWY']
        version_suffix: true
        attrs: [series, ip, color]
      # --- oprawy ze zintegrowanym LED (moc z nazwy albo parametrow) ---
      - key: naswietlacz
        noun: Naświetlacz LED
        gender: m
        match: ['NASWIETLACZ']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, sensor, color]
        required: [power, lumen, cct]
      - key: high_bay
        noun_from: tail
        match: ['HIGH BAY']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, control, color]
        required: [power, lumen, cct]
      - key: uliczna
        noun_from: tail
        match: ['OPRAWA (ULICZNA|PARKINGOWA|PARKOWA) LED']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, control, color]
        required: [power, lumen, cct]
      - key: panel
        noun: Panel LED
        gender: m
        match: ['PANEL LED']
        version_suffix: true
        attrs: [series, panel_size, power, lumen, cct, ugr, control, color]
        required: [power, lumen, cct]
      - key: biurowa
        noun_from: tail
        match: ['OPRAWA BIUROWA LED', 'OPRAWA RASTROWA']
        version_suffix: true
        attrs: [series, panel_size, power, lumen, cct, ugr, control, color]
        required: [power, lumen, cct]
      - key: liniowa_tuby
        noun_from: tail
        match: ['POD TUBY LED']
        version_suffix: true
        attrs: [series, length, ip, color]
      - key: liniowa
        noun_from: tail
        match: ['OPRAWA LINIOWA LED', 'OPRAWA MEBLOWA LINIOWA', 'OPRAWA PODSZAFKOWA LED', 'PYLOSZCZELNA']
        version_suffix: true
        attrs: [series, length, power, lumen, cct, ugr, ip, sensor, control, color]
        required: [power, lumen, cct]
      - key: awaryjna
        noun_from: tail
        match: ['OPRAWA AWARYJNA', 'OPRAWA EWAKUACYJNA', 'ZNAK EWAKUACYJNY', 'MODUL OSWIETLENIA Z PODTRZYMANIEM']
        version_suffix: true
        attrs: [series, power, lumen, cct, em_time, ip, color]
      - key: downlight
        noun_from: tail
        match: ['DOWNLIGHT', 'OPRAWA DO WBUDOWANIA', 'ZESTAW OPRAW DO WBUDOWANIA']
        requires_power: true
        version_suffix: true
        attrs: [series, diameter, power, lumen, cct, ip, sensor, control, color]
        required: [power, lumen, cct]
      - key: oprawa_led
        noun_from: tail
        match: ['(OPRAWA|PLAFONIERA|LAMPA|LAMPKA|PROJEKTOR|AKCENT|SLUPEK)']
        requires_power: true
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, sensor, control, color]
        required: [power, lumen, cct]
      # typ mowi "LED", a mocy nie ma ani w nazwie, ani w parametrach - to dalej oprawa LED (do sprawdzenia)
      - key: oprawa_led_bez_mocy
        noun_from: tail
        match: ['(OPRAWA|PLAFONIERA|LAMPA|LAMPKA|PROJEKTOR|AKCENT|SLUPEK)\b.*\bLED\b']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, sensor, control, color]
        required: [power, lumen, cct]
      # --- oprawy na wymienne zrodlo swiatla (bez mocy) ---
      - key: oprawa_wymienna
        noun_from: tail
        match: ['(OPRAWA|PLAFONIERA|LAMPA|LAMPKA|PROJEKTOR|AKCENT|SLUPEK)']
        exclude: ['^K(MB|RD|CP|FL|MP|MCCB|DB|TB|BB)']
        version_suffix: true
        attrs: [series, gwint, ip, color]
      # --- osprzet instalacyjny (DOMO, LOGI, TEKNO, BIURO): typ + seria + kolor + indeks ---
      - key: osprzet
        noun_from: tail
        match: ['^\S+?[ -]\d{2}-\d{4}-\d{3}\b']
        version_suffix: true
        attrs: [series, color, osp_code]
      # --- aparatura modulowa ---
      - key: aparatura
        noun_from: tail
        # KMI / KCS / KMC / KSD / KSPD - nowe kartoteki 2026-11-04 (rozlaczniki, przelaczniki, styczniki, ograniczniki)
        match: ['^K(MB|RD|CP|FL|MP|MCCB|DB|TB|BB|SGP|DEM)', '^K(MI|CS|MC|SP?D)-', '^KRO\d']
        no_schema: true
        # linia aparatury z nazwy w Ekonomie ("Wyłącznik różnicowoprądowy IDEAL TS 4P KRD10-...") - za marka (2026-11-16)
        features_line_raw:
          - {match: '\bIDEAL TS\b', label: IDEAL TS}
        attrs: [breaker, head, brand, features_line_raw]
      # --- rozgalezniki, wtyczki, gniazda przenosne (2026-11-05) ---
      # W Ekonomie tylko nazwa grupy "Rozgałęźniki, gniazda, wtyczki"; cechy z karty kanlux.com (`param`), uklad jak
      # rozgalezniki Kobi / Bemko (schemat przedluzaczy V3): gniazda, uziemienie (typ E = z uziemieniem,
      # typ F = Schuko), IP, kolor, model, marka.
      - key: rozgaleznik
        noun: Rozgałęźnik
        gender: m
        match: ['^ZARK\b']
        trusted: true
        features:
          - {param: 'Liczba gniazd', match: '^(\d+)$', label: '{0} gn.'}
          - {param: 'Rodzaj uziemienia', match: 'typu F', label: Schuko, group: earth}
          - {param: 'Rodzaj uziemienia', match: 'typu E', label: z uziemieniem, group: earth}
        attrs: [features, ip, color, head]
      - key: wtyczka
        noun: Wtyczka
        gender: f
        match: ['^(PIN|GRIP) W/']
        trusted: true
        features:
          - {param: 'Rodzaj uziemienia', match: 'typu F', label: Schuko, group: earth}
          - {param: 'Rodzaj uziemienia', match: 'typu E', label: z uziemieniem, group: earth}
          - {param: 'Prąd znamionowy [A]', match: '^(\d+)$', label: '{0}A'}
        attrs: [features, ip, color, head]
      - key: gniazdo_przenosne
        noun: Gniazdo przenośne
        gender: n
        match: ['^(GRIP|STAN) GP\b']
        trusted: true
        features:
          - {param: 'Liczba gniazd', match: '^(\d+)$', label: '{0} gn.'}
          - {param: 'Rodzaj uziemienia', match: 'typu F', label: Schuko, group: earth}
          - {param: 'Rodzaj uziemienia', match: 'typu E', label: z uziemieniem, group: earth}
        attrs: [features, ip, color, head]
      # --- reszta: typ + kod modelu ---
      - key: inne
        noun_from: tail
        match: ['.']
        no_schema: true
        attrs: [head]

  # ===================================================================== GTV
  # Wejscie: CSV z Ekonoma + katalog PDF (--pdf-dir). `Kod producenta` to kod GTV (LD-SMBD45-10),
  # nie EAN - katalog jest czytany po kodzie (`pdf_match: code`), tylko komorki z jednostka (lm, K).
  # Nazwy GTV: "TYP [MODEL], parametr, parametr, ..., KOLOR" WIELKIMI LITERAMI. Rzeczownik = slowa
  # typu z poczatku (`type_words`), model = reszta pierwszego czlonu, parametry z calej nazwy.
  # Kody HT... to narzedzia i odziez Högert (nazwy juz czytelne - tylko marka po rzeczowniku),
  # GT-... to linia G-TECH.
  gtv:
    brand: GTV
    # zasady z Ledvance (2026-10-19): marka na koncu (seria opraw z parametrami za nia, jak linia),
    # srednica w mm, bez powtorzonych slow obok siebie, "tubę/tuby" zamiast "świetlówkę/świetlówki"
    brand_last: true
    series_after_brand: true
    diameter_mm: true
    dedupe_adjacent: true
    tube_words: [tubę, tuby]
    # rodzaj oprawy z kategorii gtv.com.pl (sprawdzone 2026-10-19) zamiast ogolnego "Oprawa LED";
    # tylko typy ogolne, bo te same nazwy rodzin maja tez reflektory szynowe (Sierra)
    noun_overrides:
      - {match: '^OPRAWA LED (AREZZO|MOZA|SAMBA|BOLERO)\b', noun: Downlight LED, gender: m, typ: downlight, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA (LED )?(ARCCO|ARTEMIDA|BIANCO|KARIS|PRIME|SIERRA|TULON)\b|^OPRAWA TULON\b', noun: Plafon LED, gender: m, typ: plafon, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^(G-TECH )?OPRAWA (LED )?(ARGO|MODULAR|BIZAR|BROS)\b', noun: Panel LED, gender: m, typ: panel, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA LED (JASMIN|KATANI|ZITA)\b', noun: Kinkiet LED, gender: m, typ: kinkiet, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA LED LEON\b', noun: Lampa wisząca LED, gender: f, typ: lampa_wiszaca, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA LED (FORTA|LONGI)\b', noun: Oprawa liniowa LED, gender: f, typ: liniowa, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA ?LED (ZEFIR|LUNAR)\b', noun: Oprawa hermetyczna LED, gender: f, typ: hermetyczna, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA LED (KODO|TWIST)\b', noun: Oprawa kanałowa LED, gender: f, typ: kanalowa, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA (LED )?(MISSOURI|NARIN|NICEA|PARIS|SARO|SIROLO|TERRO|TROPEA)\b|^OPRAWA SOLARNA ELEWACYJNA', noun: Oprawa elewacyjna LED, gender: f, typ: elewacyjna, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA SOLARNA Z CZUJNIKIEM', noun: Naświetlacz LED, gender: m, typ: naswietlacz, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA SCHODOWA', noun: Oprawa schodowa LED, gender: f, typ: schodowa, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA OSWIETLENIA AWARYJNEGO', noun: Oprawa awaryjna LED, gender: f, typ: awaryjna, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^OPRAWA PRZYPODLOGOWA', noun: Oprawa przypodłogowa LED, gender: f, typ: meblowa, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
      - {match: '^(OPRAWA|PORAWA) (LED )?(ELIPSO|BEZPRZEWODOWA|COB|MACARIO|MERLIN|PALERMO|PANEL VEGAS|POINT|FIDELIA|FOCUS|MAXIMUS|MIRROR|RADIUS)\b|^OPRAWA (TROJKATNA|KWADRATOWA LED NOELIA|NA WYSIEGNIKU)', noun: Oprawa meblowa LED, gender: f, typ: meblowa, types: [oprawa_led, oprawa_led_lm, oprawa_dekor]}
    # swietlowki to tuby takze w nazwie oprawy (2026-10-19)
    name_replace:
      - {match: '^Oprawa świetlówkowa\b', repl: 'Oprawa pod tuby'}
      - {match: '^Oprawa awaryjna LED oświetlenia awaryjnego\b', repl: 'Oprawa awaryjna LED'}
    brand_code_rules:
      - {match: '^HT', brand: Högert}
      - {match: '^GT-', brand: GTV G-TECH}
    # Karty gtv.com.pl (scripts/fetch_gtv_web.py) uzupelniaja braki lm/K/IP; kod spoza strony = wycofany.
    # Slowa pisane na stronie malymi literami poprawiaja wielkosc liter w starych nazwach WIELKIMI.
    web_params_cache: cache/gtv_web
    web_params_keys: {lumen: 'Strumień świetlny [lm]', cct: 'Temperatura barwowa światła [K]', ip: 'Stopień ochrony IP'}
    web_params_label: gtv.com.pl
    web_withdrawn_note: brak na gtv.com.pl (wycofany) - dane tylko z nazwy
    dedupe_words: true
    # Opis akcesoriow / typow bez schematu (2026-11-05): jednostka za liczba zostaje ("GLAX 12 m"), "+" w skladzie
    # zestawu tez, a limit slow nie tnie w nawiasie ("(profil 2mb osłonka mleczna 2").
    series_keep_units: true
    series_keep_plus: true
    series_balance_parens: true
    polish_lower_re: 'UCHWYTY?'
    # Marka za fraza rzeczownika, przed przyimkiem i parametrem: "Palnik gazowy Högert", "Cyfrowy miernik
    # uniwersalny Högert", "Brzeszczot Högert do wyrzynarki ...", "Uchwyt Högert typu "T"".
    noun_stop_words: [do, z, ze, na, pod, dla, typu, w, i, o, bez, oraz, fi]
    pdf_match: code
    name_lumen_first: true
    lumen_from_efficacy: true
    socket_rules:
      - {match: '\bMR16\b(?!.*\bGU10\b)', socket: GU5.3}
    version_from_clean: true
    per_meter_power: true
    series_first_segment: true
    # przeglad nazw wlasnych 2026-11-16: 1. czlon bez modelu ("OPRAWA ŚCIENNA JEDNOKIERUNKOWA, TIAGO") - model z 2. czlonu
    series_next_segment: true
    polish_lower: true
    noun_no_digits: true
    # Tokeny nazwy, ktore nie sa wyroznikiem wersji.
    version_skip: ['\d*MA', '\d*SZT\.?', 'KARTON', 'PODANA', 'CENA', 'ZA', 'SZTUKE!*', '(AC|DC)?\d+[.-]*\d*V\w*',
                   '\d+°', '\d+ST', 'A-G', 'PF>.*', 'RA[>?].*', '\d+Y', 'MINI', 'AMP', 'PRZEWOD', 'IK\d+']
    name_cleanup:
      - '^G-TECH\s+'
      - '\bGTV\b'
      - '(?i)\(power adj[^)]*\)'
      # znaki, ktorych cp1250 Ekonoma nie ma (2026-11-05): "??" = smieci, "?150 mm" = srednica, "mm?" przekroj,
      # "PF?0,95" = PF>=0,95 (jak UGR<), "400 cm?" = pojemnosc
      - {match: '\?\?', repl: ''}
      - {match: '(?<!\S)\?(?=\d)', repl: 'fi'}
      - {match: '(?<=\d) ?mm\?(?!\S)', repl: ' mm2'}
      - {match: '(?<=\d) ?cm\?(?!\S)', repl: ' cm3'}
      - {match: '\bPF\?', repl: 'PF>'}
      - '(?i)PODANA CENA.*$'
      # tasma: "max. 42W" to moc tasmy (a nie limit zarowki jak ponizej)
      - {match: '(?i)^(TA[SŚ]MA\b.*?)\bmax\.?\s?(\d+(?:[.,]\d+)?\s?W\b)', repl: '\1\2'}
      # "max. 20W" przy oprawach na zarowke to limit zrodla, nie moc oprawy
      - '(?i)\bmax\.?\s?(\d\s?x\s?)?\d+(?:[.,]\d+)?\s?W\b(\s?\*\s?\d)?'
      # "2W1 CIEPŁO-ZIMNY" (VEGAS) to "2 w 1", a nie moc 2W
      - '(?i)\b2W1\b'
      - {match: '(?<=[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]),(?=\S)', repl: ', '}
      - {match: '(?<=\S),(?=[A-Za-zĄĆĘŁŃÓŚŹŻ])', repl: ', '}
      - {match: ',(?=\d{4}\s?K\b)', repl: ', '}
      - {match: '(?<=IP\d\d),', repl: ', '}
      - ',\s*\d{1,4}\s?mA\b(?=\s*(,|$))'
      - {match: 'DC\s?/\s?(\d+)\s?W', repl: 'DC \1W'}
      - {match: '^PORAWA', repl: 'OPRAWA'}
      - {match: 'ELEWACYJNALED', repl: 'ELEWACYJNA LED'}
      - {match: 'OPRAWALED', repl: 'OPRAWA LED'}
      - {match: 'ŃAŚ', repl: 'NAŚ'}
      - {match: 'ZIMNYY', repl: 'ZIMNY'}
      # literowki Ekonoma (2026-11-05)
      - {match: 'UZIEMIENIEMIENIEM|UZIEMNIENIEM', repl: 'UZIEMIENIEM'}
      - {match: '\bGNIA?Z[KD]O\b|\bGNIZDO\b', repl: 'GNIAZDO'}
      - {match: 'WŁACZNIK', repl: 'WŁĄCZNIK'}
      - {match: '\bI(?=GNIAZD|\d\s?GNIAZD)', repl: 'I '}
      - {match: '\s+W BLISTRZE\b', repl: ''}   # tylko WIELKIMI - nazwy Högert zostaja doslowne
      - {match: '(?<=\w)-\s+\(', repl: ' ('}
      - {match: '(?<=\d),00(?=\s?mm)', repl: ',0'}
      - {match: '(\d)\s?\*\s?(?=[EG][U\d])', repl: '\1x'}
      - {match: '(?i)(\d{2,3})\s?(?:ST\b|\*)', repl: '\1°'}
    lumen_patterns:
      # "A60 820lm" to nie 60820lm - liczba sklejona z litera nie zaczyna lumenow (2026-11-05)
      - '(?<![\dA-Z])(\d{1,2}[ .]\d{3}|\d{2,6})\s?LM\b(?!/W)'
    noise_patterns: []
    # Skroty i nazwy systemow, ktore zostaja WIELKIMI literami po zamianie wielkosci liter.
    keep_upper: [LED, COB, SMD, USB, HDMI, RJ45, CCT, RGB, RGBW, PIR, DC, AC, UV, UVC, IP, GLAX, X-RAIL, DALI, SELV,
                 TRACKO, SCHUKO, FRENCH, T8, PC, ABS, AL, MINI, AMP, CR, CM, CO, IR, RF, WIFI, XC11, II, III]
    # Barwa swiatla w slowach nie jest kolorem obudowy.
    color_ignore: ['(CIEPL\w*|NEUTRALN\w*|ZIMN\w*)\s+BIAL\w*', 'BIALE PCB', 'BIALY\s*/\s*CIEPLY']
    # Gdy brak K w nazwie i w katalogu.
    cct_words:
      - {match: 'CIEPLO-ZIMN', label: ciepła/zimna biała}
      - {match: 'CIEPL\w*\s+BIAL', label: ciepła biała}
      - {match: 'NEUTRALN\w*\s+BIAL|BIAL\w*\s+NEUTRAL', label: neutralna biała}
      - {match: 'ZIMN\w*\s+BIAL', label: zimna biała}
      - {match: '\bZIMNA\b', label: zimna biała}
      - {match: '\b3-?CCT\b|\bCCT\b', label: CCT}
      - {match: '\bRED\b', label: czerwona}
      - {match: '\bGREEN\b', label: zielona}
      - {match: '\bBLUE\b', label: niebieska}
      - {match: '\bYELLOW\b', label: żółta}
      - {match: '\bRGBW\b', label: RGBW}
      - {match: '\bRGB\b', label: RGB}
    shape_codes:
      - {match: '\bST ?64\b', label: Edison ST64}
      - {match: '\bG ?125\b', label: globe G125}
      - {match: '\bG ?95\b', label: globe G95}
      - {match: '\b[GP] ?45\b', label: kulka}
      - {match: '\b[CB] ?3[57]\b', label: świeczka}
      - {match: '\bB45[BC]?\b', label: B45}
      - {match: '\bES ?111\b', label: ES111}
      - {match: '\bAR ?111\b', label: AR111}
      - {match: '\bPLOMYK\b', label: płomyk}
      - {match: '^SWIECZKA', label: świeczka}
      - {match: '\bMR ?16\b', label: MR16}
      - {match: '\bF ?\d{3}\b', label: kukurydza}
    housing_colors:
      czarno_zloty: {m: czarno-złoty, f: czarno-złota, n: czarno-złote, match: ['CZARNO\s*[/-]\s*ZLOT']}
      bialo_zloty: {m: biało-złoty, f: biało-złota, n: biało-złote, match: ['BIA\w*\s*/\s*ZLOT']}
      czarno_czerwony: {m: czarno-czerwony, f: czarno-czerwona, n: czarno-czerwone, match: ['CZARNO\s*/\s*CZERWON']}
      czarno_miedziany: {m: czarno-miedziany, f: czarno-miedziana, n: czarno-miedziane, match: ['CZARN\w*\s*/\s*MIEDZ']}
      antracyt: {m: antracyt, f: antracyt, n: antracyt, match: ['ANTRACYT']}
      grafit: {m: grafitowy, f: grafitowa, n: grafitowe, match: ['GRAFIT']}
      czarny_mat: {m: czarny mat, f: czarna mat, n: czarne mat, match: ['CZARN\w* MAT']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN']}
      bialy: {m: biały, f: biała, n: białe, match: ['BIAL']}
      szary: {m: szary, f: szara, n: szare, match: ['SZAR']}
      chrom: {m: chrom, f: chrom, n: chrom, match: ['CHROM']}
      szampan: {m: szampan, f: szampan, n: szampan, match: ['SZAMPAN']}
      zloty: {m: złoty, f: złota, n: złote, match: ['ZLOT']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['SREBRN', '\bSILVER\b']}
      inox: {m: inox, f: inox, n: inox, match: ['\bINOX\b']}
      satyna: {m: satyna, f: satyna, n: satyna, match: ['SATYN']}
      brazowy: {m: brązowy, f: brązowa, n: brązowe, match: ['BRAZOW']}
      miedziany: {m: miedziany, f: miedziana, n: miedziane, match: ['MIEDZ']}
      kremowy: {m: kremowy, f: kremowa, n: kremowe, match: ['KREMOW']}
      rozowy: {m: różowy, f: różowa, n: różowe, match: ['ROZOW']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['CZERWON']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['ZIELON']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['NIEBIESK']}
      zolty: {m: żółty, f: żółta, n: żółte, match: ['ZOLT']}
      bezowy: {m: beżowy, f: beżowa, n: beżowe, match: ['BEZOW']}
      bursztynowy: {m: bursztynowy, f: bursztynowa, n: bursztynowe, match: ['BURSZTYN']}
      drewno: {m: drewno, f: drewno, n: drewno, match: ['DREWN']}
      patyna: {m: patyna, f: patyna, n: patyna, match: ['PATYN']}
      przezroczysty: {m: przezroczysty, f: przezroczysta, n: przezroczyste, match: ['PRZE[ZŹ]ROCZYST']}
    features:
      - {match: 'FILAMENT', label: filament}
      - {match: '\b(\d)\s?PCS', label: '{0}-pak'}
      - {match: '\b(\d)\s?X\s?T8\b', label: '{0}xT8'}
      - {match: 'ROLKA (\d+(?:[.,]\d+)?)\s?M\b', label: '{0}m'}
      - {match: '(?<![\d/])(\d{2,4})\s?LED/M\b', label: '{0}LED/m'}
      - {match: '(?<![\d/x])(\d{2,4})\s?LED\b(?!/)', label: '{0}LED'}
      - {match: 'SZAFK[AI] (\d{2,3})\s?CM', label: 'do szafki {0}cm'}
      - {match: 'WODOODPORN|WOODODPORN|WODOODPRON|WODOSZCZELN', label: {m: wodoodporny, f: wodoodporna, n: wodoodporne}}
      - {match: 'WPUSZCZAN', label: {m: wpuszczany, f: wpuszczana, n: wpuszczane}}
      - {match: 'NATYNKOW', label: {m: natynkowy, f: natynkowa, n: natynkowe}}
      - {match: 'KWADRAT', label: {m: kwadratowy, f: kwadratowa, n: kwadratowe}}
      - {match: 'OKRAGL', label: {m: okrągły, f: okrągła, n: okrągłe}}
      - {match: 'SCIEMNIALN|STOPNI\w* SCIEMNIANIA|ZE SCIEMNIACZEM', label: {m: ściemnialny, f: ściemnialna, n: ściemnialne}}
      - {match: 'CZUJNIK\w* ZB?LIZENIOW', label: z czujnikiem zbliżeniowym}
      - {match: 'Z CZUJ\w*\.? RUCHU(/| I )ZMIERZCH', label: z czujnikiem ruchu i zmierzchu}
      - {match: 'CZUJ\w*\.? ZMIERZCHOW', label: z czujnikiem zmierzchu}
      - {match: 'Z CZUJ\w*+\.?(?! RUCHU/| RUCHU I | ZB?LIZ| ZMIERZCH| MIKRO)( RUCHU)?(?!/)', label: z czujnikiem ruchu}
      - {match: '\b(\d)X(60|120|150)\b', label: '{0}x{1}cm'}
      - {match: 'MIKROFALOW|MICROWAVE', label: mikrofalowy}
      - {match: 'KARTON\s?(\d+)\s?SZT', label: 'karton {0}szt'}
      - {match: '(?<!\d),\s*(\d{1,3})\s?M\s*$', label: '{0}m'}   # (?<!\d): "PRZEWÓD 1,5m" to nie "5m"
      - {match: '\bPIR\b', label: PIR}
      - {match: 'SOLARN', label: {m: solarny, f: solarna, n: solarne}}
      - {match: 'AW2C|MODUL AWARYJN', label: z modułem awaryjnym}
      - {match: '(?<![\d.,])([123])\s?H\b', label: '{0}h'}
      - {match: 'JEDNOZADANIOW', label: jednozadaniowa}
      - {match: 'DWUZADANIOW', label: dwuzadaniowa}
      - {match: 'Z WLACZNIKIEM', label: z włącznikiem}
      - {match: 'ZASILANIE JEDNOSTRONNE', label: zasilanie jednostronne}
      - {match: '\bUGR\s?<\s?(\d{2})', label: 'UGR<{0}'}
    # Czlony nazwy pomijane w typach bez schematu (`segments`).
    segment_drop:
      - '^\d{4}$'
      - '^(AC|DC)?\s?\d{2,3}[.]?-\d{3}\s?V'
      - '^MAX\.?\s?250\s?V'
      - '^\d{2}(/|-)\d{2}\s?HZ'
      - '^PF\s?>'
      - '^RA\s?[>?]'
      - '^\d+Y$'
      - '^BEZ CNBOP'
      - '^A-G$'
      - '^INPUT'
    # Z modelu (1. czlonu po slowach typu) usuwane sa parametry pokazywane osobno.
    series_drop:
      - '(?i)-?\bLED\b(-J)?'
      - '(?i)\bT8(-J)?\b|\b\d,?\d?x\d{2,3}\b'
      - '(?i)\bsolarn\w*\b'
      - '(?i)\btyp[uy]\b'
      - '(?i)\bdownlight\b'
      - '(?i)\bdo szyno\w*\b|\bna szyno\w*\b'
      - '(?i)\bz\s+(mikrofalowym\s+)?czuj\w*\.?(\s+(ruchu|zmierzch\w*|mikrofal\w*|zbliż\w*|zbli\w*))*((\s+i|/)\s*(zmierzch\w*|obecn\w*))?'
      - '(?i)\bczuj\.?\s+(zmierzchowy|mikrofalowy)\b'
      - '(?i)\bz włącznikiem\b'
      # zakres napiecia zasilacza "3-54V" (zostawalo "3-"); "1-10V" w "DALI-PUSH-1-10V" to sterowanie, nie napiecie (2026-11-16)
      - '(?i)(?<![-\w])\d+(?:[.,]\d+)?-\d+(?:[.,]\d+)?\s?V\b'
      - '(?i)(?<!\d-)\b\d+(?:[.,]\d+)?\s?(W|V|mm|cm|m)\b'
      - '(?i)\b(E27|E14|GU10|G9|G4|G13|MR16)\b'
      - '(?i)\bIP\d{2}\b'
      - '(?i)\b(czarn|biał|szar|złot|srebrn|grafit)\w*\b'
      # wiszacy myslnik po wycieciu wymiaru / mocy: "OSL SLIM-1X120" -> "Osl SLIM-", "TE-150W" -> "TE-" (2026-11-16)
      - '(?<=\w)-(?=\s|$)'
    # Slowa typu z poczatku nazwy (bez polskich znakow, wielkie litery) - rzeczownik nazwy.
    type_words: [ZAPINKA, ZAWIESZKA, OPRAWA, OPRAWKA, SUFITOWA, SCIENNA, SCIENNO-SUFITOWA, OGRODOWA, WISZACA, ELEWACYJNA, KANALOWA,
                 STOLOWA, LAMPA, LAMPKA, BIURKOWA, PODLOGOWA, NOCNA, PUNKTOWA, WPUSZCZANA, ZWIESZANA, PLAFONIERA,
                 DWUKIERUNKOWA, LED, LEDOWA, NA, DO, SZYNOPRZEWOD, SZYNOPRZEWODU, 1-FAZOWY, 3-FAZOWY, 1-FAZOWEJ,
                 3-FAZOWEGO, SZYNY, KINKIET, REFLEKTOR, CZUJNIK, RUCHU, I, OBECNOSCI, MIKROFALOWY, ZMIERZCHU,
                 ZMIERZCHOWY, PROFIL, ALUMINIOWY, PROFILU, ZASLEPKA, Z, OTWOREM, OSLONKA, MLECZNA, CZARNA,
                 TRANSPARENTNA, PLASKA, ZLACZKA, ZLACZKI, ZACISKOWA, PRZEZROCZYSTA, TASM, TASMY, LACZNIK, LACZNIKI,
                 PROSTY, KATOWY, KONCOWKA, KONCOWA, ZASILAJACA, RAMKA, RAMA, MONTAZU, NATYNKOWEGO, WPUSZCZANEGO,
                 OPRAW, OPRAWY, ZESTAW, ZWIESZENIA, PODWIESZANIA, PODWIESZANEGO, UCHWYT, UCHWYTY, KLIP, MOCOWANIE,
                 WLACZNIK, DOTYKOWY, BEZDOTYKOWY, BEZPRZEWODOWY, SCIEMNIACZ, PRZEDLUZACZ, BIURKOWY, BEBNOWY,
                 GNIAZDO, MEBLOWE, WPUSZCZANE, LADOWARKA, PROGRAMATOR, KONTROLER, PILOT, TRANSFORMATOR, ZASILACZ,
                 KABEL, PRZEWOD, ADAPTER, PRZEJSCIOWKA, ROZGALEZIACZ, MODUL, STATECZNIK, ZAPLONNIK, SOCZEWKA,
                 MASKOWNICA, POKRYWA, POKRYWKA, HAK, WTYCZKA, BATERIA, LATARKA, PIKTOGRAM, SLUPEK, GIRLANDA,
                 TROJZYLOWY, PRZYLACZE, NYPEL, TULEJA, NAKRETKA, BAZA, KORPUS, LINKA, WYSIEGNIK, STATYW, KOSTKA,
                 PRZELACZNIK, NEON, FLEX, HERMETYCZNA, RASTROWA, LINIOWA, ULICZNO-PARKOWA, ULICZNO, PARKOWA,
                 ULICZNA, PRZEMYSLOWA, AWARYJNA, NASWIETLACZ, PRZENOSNY, PANEL, SWIETLOWKA, ZRODLO, SWIATLA, TASMA,
                 PODSZAFKOWA, HIGHBAY, SWIECZKA, ZAROWKA, OGRODOWY]
    types:
      # Schemat nazwy przedluzaczy V3 (archived_input_files/input_2026-11-10/schemat nazwy przedłużaczy V3.xlsx, 2026-11-05, wszyscy dostawcy) -
      # jak Kobi i Bemko. Przed Högertem, bo kody HT lapie typ `narzedzia`. Biurkowe / wpuszczane /
      # katowe MINI to inny rodzaj (bez schematu) i zostaja w `inne`. Uziemienia nie zgadujemy z liczby zyl.
      - key: przedluzacz_bebnowy
        noun_from: type_words
        match: ['^PRZEDLUZACZ BEBNOWY']
        trusted: true
        features:
          - {match: '\b(\d)\s?X\s?(?:GN\w*\s)?SCHUKO\b', label: '{0} gn.', group: gn}
          - {match: '\b(\d)\s?GN(?:IAZD\w*)?\b', label: '{0} gn.', group: gn}
          - {match: '(?<![\d,.])(\d+(?:[.,]\d+)?)\s?M\b', label: '{0}m', group: len}
          - {match: '\b([23])\s?X\s?(\d(?:[.,]\d+)?)\s?MM2?\b', label: '{0}x{1}mm2', group: cross}
          - {match: 'GUMOW', label: guma, group: cable}
          - {match: '\b(IP[2-6]\d)\b', label: '{0}', group: ip}
          - {match: '\bSCHUKO\b', label: Schuko, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
        attrs: [features]
      - key: przedluzacz
        noun_from: type_words
        match: ['^PRZEDLUZACZ (DOMOWY|SCHUKO|OGRODOWY|W IZOLACJI)']
        trusted: true
        features:
          - {match: '\b(\d)\s?GN(?:IAZD\w*)?\b', label: '{0} gn.', group: gn}
          - {match: '(?<![\d,.])(\d+(?:[.,]\d+)?)\s?M\b', label: '{0}m', group: len}
          - {match: '\b([23])\s?X\s?(\d(?:[.,]\d+)?)\s?MM2?\b', label: '{0}x{1}mm2', group: cross}
          - {match: 'GUMOW', label: guma, group: cable}
          - {match: '\bSCHUKO\b', label: Schuko, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
          - {match: 'WYLACZNIK|WLACZNIK', label: z wyłącznikiem}
          # nazwa wlasna na koncu, przed marka
          - {match: '\bUNI\b', label: Uni, group: name}
        attrs: [features]
      # --- narzedzia i odziez Högert: nazwa dostawcy + marka po rzeczowniku ---
      - key: odziez
        code_match: '^HT5K'
        noun_from: model_first
        trusted: true
        attrs: [model]
      - key: narzedzia
        code_match: '^HT'
        noun_from: first_word
        # marka za fraza rzeczownika (`noun_stop_words` w sekcji gtv): "Cyfrowy miernik uniwersalny Högert"
        trusted: true
        attrs: [model]
      # --- akcesoria (przed oprawami: "RAMKA DO ... OPRAW DOWNLIGHT MAXIS, 9W", "SOCZEWKA DO LAMPY TEKSAS") ---
      - key: akcesorium
        noun_from: type_words
        match: ['^(ZAPINKA|RAMKA|RAMA|ZESTAW DO|SOCZEWKA|REFLEKTOR DO|PILOT|KORPUS|ZASLEPKA|LACZNIK|KONCOWKA|UCHWYT|OSLONKA|PROFIL|ZLACZK|KLIP|HAK|MASKOWNICA|POKRYW|PRZEJSCIOWKA|ADAPTER|MOCOWANIE|LINKA|WYSIEGNIK|BAZA|TULEJA|NYPEL|NAKRETKA|PANEL DOTYKOWY|ZESTAW GLAX|OSPRZET)']
        series_raw: true
        series_limit: 12
        version_suffix: true
        attrs: [series, segments]
      - key: czujnik
        noun_from: type_words
        match: ['^CZUJNIK']
        version_suffix: true
        attrs: [series, features, ip, color]
      # --- zrodla swiatla ---
      - key: zarowka_specjalna
        noun_from: type_words
        match: ['^ZAROWKA SPECJALNA']
        version_suffix: true
        attrs: [series, gwint, power]
      - key: zarowka_led
        noun: Żarówka LED
        gender: f
        match: ['^ZRODLO SWIATLA', '^ZAROWKA', '^SWIECZKA']
        version_suffix: true
        # kolejnosc jak w zarowkach Ledvance (2026-10-19): gwint, W, lm, K, ksztalt i cechy, marka na koncu
        # linia GTV za marka (przeglad nazw wlasnych 2026-11-16: "ŹRÓDŁO ŚWIATŁA LED, FILAMENT, SPIN, C35" gubilo SPIN)
        features_line:
          - {match: '\bCERAMIC\b', label: Ceramic, group: line}
          - {match: '\bSPIN\b', label: Spin, group: line}
          - {match: '\bGLOW\b', label: Glow, group: line}
          - {match: '\bGRID\b', label: Grid, group: line}
          - {match: '\bWAVE\b', label: Wave, group: line}
          - {match: '\bFILAMENT,? SLIM\b', label: Slim, group: line}
          - {match: '\bVINTAGE\b', label: Vintage, group: line}
          - {match: '\bINNOVO\b', label: Innovo, group: line}
        attrs: [gwint, power, lumen, cct, shape, beam, voltage, features, color, brand, features_line]
        required: [gwint, power, lumen, cct]
      - key: tuba
        noun: Tuba LED
        gender: f
        match: ['^SWIETLOWKA']
        version_suffix: true
        features_line:
          - {match: '^SWIETLOWKA SHL\b', label: SHL}
        attrs: [tube_type, length, power, lumen, cct, features, brand, features_line]
        required: [power, lumen, cct]
      - key: tasma
        noun: Taśma LED
        gender: f
        match: ['^TASMA', '^ZESTAW LED']
        version_suffix: true
        attrs: [series, features, power, lumen, cct, voltage]
        required: [power, cct]
      - key: neon
        noun: Neon LED
        gender: m
        match: ['^LED NEON']
        version_suffix: true
        attrs: [series, features, power, cct, voltage]
      # --- oprawy LED ---
      - key: naswietlacz
        noun: Naświetlacz LED
        gender: m
        match: ['^NASWIETLACZ']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
        # solarne podaja tylko lm (moc "200W" to marketing) - moc nie jest wymagana
        required: [lumen, cct]
      - key: high_bay
        noun: Oprawa High Bay LED
        gender: f
        match: ['HIGHBAY|HIGH BAY']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: uliczna
        noun: Oprawa uliczna LED
        gender: f
        match: ['ULICZN']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: awaryjna
        noun: Oprawa awaryjna LED
        gender: f
        match: ['^OPRAWA AWARYJN']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
      - key: panel
        noun: Panel LED
        gender: m
        match: ['^PANEL']
        version_suffix: true
        attrs: [series, panel_size, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: hermetyczna_t8
        noun: Oprawa hermetyczna
        gender: f
        match: ['HERMETYCZN']
        require_pattern: '\bT8\b'
        version_suffix: true
        attrs: [series, features, length, ip, color]
      - key: hermetyczna
        noun: Oprawa hermetyczna LED
        gender: f
        match: ['HERMETYCZN']
        version_suffix: true
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: rastrowa
        noun: Oprawa rastrowa
        gender: f
        match: ['RASTR']
        version_suffix: true
        attrs: [series, features, ip, color]
      - key: downlight
        noun: Downlight LED
        gender: m
        match: ['DOWNLIGHT']
        requires_power: true
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: szynowa
        noun: Reflektor szynowy LED
        gender: m
        match: ['SZYNOPRZEWOD|TRACKO|\bSZYN']
        requires_power: true
        exclude: ['^(ZASLEPKA|LACZNIK|KONCOWKA|ZESTAW|SZYNOPRZEWOD)']
        version_suffix: true
        attrs: [series, power, lumen, cct, optics, features, color]
        required: [power, lumen, cct]
      - key: liniowa
        noun: Oprawa liniowa LED
        gender: f
        match: ['LINIOWA', '^OPRAWA ZWIESZANA']
        requires_power: true
        version_suffix: true
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: meblowa
        noun: Oprawa meblowa LED
        gender: f
        match: ['^OPRAWA (CLARI|BRILLO|LUMINIS)', 'SZAFK', 'MEBLOW', '^OPRAWA LEDOWA', 'PODSZAFKOW']
        exclude: ['^GNIAZDO', '^PRZEDLUZACZ']
        version_suffix: true
        attrs: [series, features, power, lumen, cct, voltage, color]
      - key: plafon
        noun: Plafon LED
        gender: m
        match: ['^PLAFONIERA']
        requires_power: true
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: oprawa_led
        noun_from: type_words
        noun_add_led: true
        match: ['^(OPRAWA|LAMPA|LAMPKA|SUFITOWA|PLAFONIERA|REFLEKTOR|KINKIET|SLUPEK)']
        requires_power: true
        version_suffix: true
        attrs: [series, size, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      # LED z lm, ale bez mocy w nazwie (solarne: "VULOS, LED, 36lm, 3000K")
      - key: oprawa_led_lm
        noun_from: type_words
        noun_add_led: true
        match: ['^(OPRAWA|LAMPA|LAMPKA|SUFITOWA|PLAFONIERA|REFLEKTOR|KINKIET|SLUPEK)']
        require_pattern: '\d\s?LM\b'
        version_suffix: true
        attrs: [series, size, power, lumen, cct, ip, features, color]
        required: [lumen, cct]
      # --- oprawy na wymienne zrodlo swiatla ---
      - key: oprawa_dekor
        noun_from: type_words
        match: ['^(OPRAWA|LAMPA|LAMPKA|SUFITOWA|PLAFONIERA|REFLEKTOR|KINKIET|SLUPEK)']
        version_suffix: true
        attrs: [series, size, sockets, ip, features, color]
      # --- elektryka ---
      - key: zasilacz
        noun: Zasilacz LED
        gender: m
        match: ['^ZASILACZ', '^TRANSFORMATOR']
        version_suffix: true
        # producent zasilaczy BOKE (koncowka nazwy w Ekonomie) - za marka GTV (przeglad nazw wlasnych 2026-11-16)
        features_maker:
          - {match: '\bBOKE\b', label: Boke}
        tail_attrs: [features_maker]
        attrs: [series, voltage, power, ip, features_maker]
      # --- reszta: rzeczownik + model + istotne czlony nazwy ---
      - key: inne
        noun_from: type_words
        match: ['.']
        series_raw: true
        series_limit: 9
        version_suffix: true
        attrs: [series, segments]
  # Bemko (2026-10-14): nazwy w Ekonomie to juz parametry WIELKIMI LITERAMI ("NAŚWIETLACZ LED SMD KASTEL2 30W
  # 4000K 2520LM IP65 CZARNY CZ. PIR Bemko"). Marki: Bemko, Luxmena, Kafler, Schelinger - z konca nazwy;
  # gdy nazwa jej nie podaje, a rodzina kodu (C66-LFC) ma jedna marke, dziedziczy ja (`brand_family`).
  # Oprocz oswietlenia: aparatura Schelinger, przedluzacze, zlaczki, opaski - cechy per typ (`features`).
  bemko:
    brand: Bemko
    # zasady z Ledvance (2026-10-19): marka na koncu (seria opraw z parametrami za nia, jak linia),
    # srednica w mm, bez powtorzonych slow obok siebie, "tubę/tuby" zamiast "świetlówkę/świetlówki"
    brand_last: true
    series_after_brand: true
    diameter_mm: true
    dedupe_adjacent: true
    capitalize_first: true
    tube_words: [tubę, tuby]
    # swietlowki to tuby takze w nazwie oprawy (2026-10-19)
    name_replace:
      - {match: '^Oprawa świetlówkowa\b', repl: 'Oprawa pod tuby'}
    # rodzaj z katalogu Bemko 2026 (2026-10-19): OXAN = "oprawa kloszowa LED" 120 cm (jak liniowe), KANLO =
    # "plafoniera LED"; ALICE (C39-ALC) nie ma w katalogu ani na stronie - kody C39 to plafony (Talar SLR/SLS)
    noun_overrides:
      - {match: '\bOXAN\b', noun: Oprawa liniowa LED, gender: f, typ: liniowa, types: [oprawa_led]}
      - {match: '\bKANLO\b|\bKAN2\b', noun: Plafon LED, gender: m, typ: plafon_led, types: [oprawa_led]}
      - {match: '\bALICE\b|\bALC\b', noun: Plafon LED, gender: m, typ: plafon_led, types: [oprawa_led]}
    brand_from_raw: true
    brand_rules:
      - {match: '\bLUXMENA\b', brand: Luxmena}
      - {match: '\bSCHELINGER\b', brand: Schelinger}
      - {match: '\bKAFLER\b', brand: Kafler}
    brand_explicit: '\b(BEMKO|LUXMENA|KAFLER|SCHELINGER)\b'
    brand_family: '^(?:S-)?([A-Z]\d{2,3}-[A-Z]*\d?[A-Z]*\d?)(?:-|$)'
    # Karty bemko.pl po kodzie (scripts/fetch_bemko_web.py): marka z pola "Marka" (zamiast rodzenstwa), lm/K/IP
    # tylko w brakach, a gdy nazwa w Ekonomie przeczy karcie (moc, barwa, prad, kod) - nazwa z karty, WARNING.
    web_params_cache: cache/bemko_web
    web_params_label: bemko.pl
    web_params_keys: {lumen: 'Strumień świetlny', cct: 'Barwa światła', ip: 'Stopień szczelności'}
    web_withdrawn_note: brak na bemko.pl - dane tylko z nazwy
    web_brand_key: Marka
    fix_from_web_name: true
    pdf_match: code_table
    name_lumen_first: true
    per_meter_power: true
    version_from_clean: true
    series_first_segment: true
    series_drop_polish: true
    polish_lower: true
    noun_no_digits: true
    proper_words: [DIANA]
    # Akcesoria (`inne`): polskie slowa WIELKIMI z koncowka fleksyjna -> male ("WYSOKA", "Z UCHWYTEM").
    polish_lower_re: '[A-Z]{2,}(A|Y|U|I|E|EM|YM|OM|ACH|AMI)|PO|LEWO|PRAWO|PODTYNK|KOMPLET|SZT|STANDARD|SUFIT|KARTON|MOD|MAX|LUX|INNER|OUTER|MONO|KPL|OPRAW|SZYN|GRAFIT|ANTRACYT|TYP'
    # Akcesoria (`inne`): jednostki malymi ("290MM" -> "290mm", "1,5M" -> "1,5m", "10SZT" -> "10 szt."), wymiar "2x15"
    # zostaje w opisie (przeglad 2026-11-04)
    series_unit_lower: true
    # Kod producenta przeczy nazwie: nazwy nie zmieniamy, wiersz idzie do sprawdzenia.
    code_checks:
      # barwa tez kodem 830 / 840 ("Żarówka LED DIM A60 E27 12W 830")
      - {code: '-([23])K(?:-|$)', name: '\b{0}\d00K\b|\b8{0}\d\b', label: 'barwe {0}x00K'}
      - {code: '-([46])K(?:-|$)', name: '\b{0}\d00K\b|\b8{0}\d\b', label: 'barwe {0}x00K'}
      - {code: '-AWW\b', name: 'CIEPLA', label: 'barwe ciepla (AWW)'}
      - {code: '-ANW\b', name: 'NEUTRALNA', label: 'barwe neutralna (ANW)'}
      - {code: '-ACW\b', name: 'ZIMNA', label: 'barwe zimna (ACW)'}
      - {code: '^A0[35]-[A-Z]\d-(\d)-(\d+)-0*(\d+)$', name: '\b{0}P {1}A {2}MA\b', label: '{0}P {1}A {2}mA'}
      - {code: '^A0[02]-[A-Z]\d-(\d)P-([BCD])0*(\d+)$', name: '\b{0}P {1} 0?{2}A\b', label: '{0}P {1}{2}'}
      - {code: '^A08-[A-Z]{3}-AC?-([BCD])0*(\d+)$', name: '\b{0} 0?{1}A\b', label: '{0}{1}'}
    name_cleanup:
      - '(?i)\b(Bemko|Luxmena|Kafler|Schelinger)\b'
      # literowki i sklejenia z zestawienia Ekonoma (2026-11-03): "600 0LM", "4400L M", "CZ. M IKR.", "4000K120cm",
      # "14000LMCRI80", "z CZUP44" (kod C37-PLA-...-MS = czujnik mikrofalowy)
      - {match: '\b(\d{3}) (0LM)\b', repl: '\1\2'}
      - {match: '(?<=\d)L M\b', repl: 'LM'}
      - {match: '(?i)\bI P(\d\d)\b', repl: 'IP\1'}
      # "(4NO + 0NC)", "(11x5,3mm + 2x7,5mm)" - samotny "+" ginal w opisie akcesorium (2026-11-04)
      - {match: '(?<=[\w)]) \+ (?=[\w(])', repl: '+'}
      # "SZYBKOZŁĄCZKA INSTALACYJNA 5x2 MM2 (25sz)" (E00-PM25-25, brak na bemko.pl) - 5 torow, 25 szt.; przekroju
      # nie zgadujemy (rodzenstwo E00-PM25-100 to Kompakt 0,5-2,5mm2)
      - {match: '(?i)\b(\d)x\d(?:,\d)? MM2\b', repl: '\1-TOROWA'}
      - {match: '(?i)\((\d+)\s?sz\)', repl: '\1 SZT'}
      - {match: '(?i)\bCZ\. M IKR\b', repl: 'CZ. MIKR'}
      - {match: '(?i)\bZ CZUP(\d\d)\b', repl: 'Z CZ. MIKR. IP\1'}
      - {match: '(?i)(\d{4}K)(?=\d)', repl: '\1 '}
      - {match: '(?i)(\d)LM(?=CRI)', repl: '\1LM '}
      - {match: '\bmini\b', repl: 'MINI'}
      - {match: '(?i)\bWIFI\b', repl: 'WiFi'}
      # "324 X 158 MM" (piktogram) - ale nie "2,5mm2 x 2" (szybkozlaczki: liczba torow)
      - {match: '(?i)\b(\d+)\s+X\s+(\d+)\s?MM\b', repl: '\1X\2MM'}
      # "AT1H" = autotest 1h (Ontec), "30ST.0316" = kat + numer katalogowy halogenu
      - {match: '(?i)\bAT ?(\d)H\b', repl: 'AUTOTEST \1H'}
      - {match: '(?i)\b(\d{2})ST\.\d{4}\b', repl: '\1° '}
      - {match: '(?i)\b(\d+)W-(\d+)W\b', repl: '\1-\2W'}
      - {match: '(?i)\b(\d+)LM-(\d+)LM\b', repl: '\1-\2LM'}
      - {match: '(?i)^ASTRONOMICZNY PROGRAMATOR CZASOWY\b', repl: 'PROGRAMATOR CZASOWY ASTRONOMICZNY'}
      # "OPRAWA RAMA LED ... 60x60 PLAZA" = panel 591x591x11 mm (karta bemko.pl), ogolnej "Oprawa LED" ma nie byc
      - {match: '(?i)^OPRAWA RAMA LED\b', repl: 'PANEL LED'}
      # "Żarówka LED DIM A60 E27 12W 830 1055lm" - kod barwy 830 = 3000K (kod D84-...-3K-D)
      - {match: '(?i)^(ŻARÓWKA LED\b.*?)\b8(27|30|40|65)\b', repl: '\1\g<2>00K'}
      - {match: '(?i)(\d)\s?VAC/DC\b', repl: '\1V AC/DC'}
      # kilka barw do wyboru ("3000/4000/6500K") = CCT
      - {match: '\b[23]\d{3}(?:/\d{4}){1,4}K\b', repl: 'CCT'}
      # Kafler "2X36W PAR OPRAWA NASTROPOWA EVG" = oprawa rastrowa (paraboliczna) natynkowa na tuby T8
      - {match: '(?i)^\s*(\d)X(\d+)W PAR OPRAWA NASTROPOWA EVG\b', repl: 'OPRAWA RASTROWA \1X\2W N/T EMPTY'}
      - '(?i)-?\s*\(?\bkarton\s?\d+\s?szt\.?\)?'
      - '(?i)\b\d\s?LATA GW\.?|\bgw\.\s?\d+y\.?'
      - '(?i)\bPZH\b'
      # "GU10 MAX. 2x50W" - limit zarowki, nie moc oprawy
      - '(?i)(?<=GU10 )max\.?\s?-?(\d\s?x\s?)?\d+\s?W\b'
      - {match: '(?i)(\d)\s?x\s?\d+W\s+(E27|E14|GU10)\b', repl: '\1x\2'}
      - {match: '(?i)\b(\d{2,3})\s?(?:ST|\*)(?=\s|$)', repl: '\1°'}
      - {match: '(?i)\bKASTEL2\b', repl: 'KASTEL 2'}
      - {match: '(?i)\bIP-(\d\d)', repl: 'IP\1'}
      # QUALIS/OXAN: "4K" = 4000K
      - {match: '(?<![\d.,])([2-6])K\b', repl: '\g<1>000K'}
      - {match: '(?i)\b123x30\b', repl: '120x30'}
      - {match: '(?i)(\d)W/1M\b', repl: '\1W/M'}
      - {match: '(?i)\((\d{3,5})-(\d{3,5})\s?lm\)', repl: '\2LM'}
      - '(?i)\(\d+W-\d+lm[^)]*\)'
      - {match: '(?i)(\d+)\s?VDC\b', repl: '\1V DC'}
      - {match: '(?i)\b12CDC\b', repl: '12V DC'}
      - {match: '(?i)"?\bEMPTY\b"?', repl: ' EMPTY '}
      - {match: '(?i)T8\s?LED\b', repl: 'T8'}
      - {match: '(?i)PUSZKI P/T\b', repl: 'PUSZKI PODTYNKOWEJ'}
      - {match: '(?i)\bP/T\b', repl: 'PODTYNKOWY'}
      - {match: '(?i)\bN/T\b', repl: 'NATYNKOWY'}
      # oprawy "EMPTY" na swietlowki T8: 18W = 60 cm, 36W = 120 cm, 58W = 150 cm
      - {match: '(?i)^(?=.*EMPTY)(.*?)\b(\d)\s?x\s?18W\b', repl: '\1\2xT8 60CM'}
      - {match: '(?i)^(?=.*EMPTY)(.*?)\b(\d)\s?x\s?36W\b', repl: '\1\2xT8 120CM'}
      - {match: '(?i)^(?=.*EMPTY)(.*?)\b(\d)\s?x\s?58W\b', repl: '\1\2xT8 150CM'}
      - {match: '(?<=\d)\.(?=\d)', repl: ','}
      - {match: '(?<=\d),0(?=\s?M\b)', repl: ''}
      - {match: '(?<=[A-Za-z])\.(?=\d)', repl: '. '}
      - {match: '(?<=\d) (mm|cm|MM|CM)\b', repl: '\1'}
      - {match: '\b(\d+)/(\d+)W\b', repl: '\1-\2W'}
    lumen_patterns:
      - '(?<![\d.,])(\d{2,6})\s?LM\b(?!/)'
    noise_patterns: []
    keep_upper: [LED, COB, SMD, USB, RF, IR, DC, AC, DIN, MID, MBUS, PV, RGB, RGBW, CCT, PIR, CNBOP, PC, PMMA, IP,
                 ALC, BLF, BLK, BLD, BLG, BLM, BLS, SLR, SLS, PHR, PHS, PLD, PLC, RES, NT, GLR, MC4, T8, XP7, VDE,
                 HLA3, HBP3, HBU3, HBV2, GN, MV, OHL, OHB, OHT, LOP1, JAS1, STD2, PLZ, PLM, PLY, PLK, ZK, IN, OUT,
                 SL7, SL8, L7, L9, MB213, FS16, GS16, MONO, II, III, SSO, LFX]
    color_ignore: ['BIALA (CIEPLA|NEUTRALNA|ZIMNA)', 'SZKLO MLECZN\w*', 'KLOSZ \w+ MLECZN\w*', 'MULTIKOLOR',
                   'RAMKA (WYSOKA|NISKA) ']
    # Barwa bez K w nazwie (tasmy): "BIAŁA CIEPŁA".
    cct_words:
      - {match: 'BIALA CIEPLA|CIEPLA BIALA', label: ciepła biała}
      - {match: 'BIALA NEUTRALNA|NEUTRALNA BIALA', label: neutralna biała}
      - {match: 'BIALA ZIMNA|ZIMNA BIALA', label: zimna biała}
      - {match: 'MULTIKOLOR', label: RGB}
      - {match: '\bZIELONA\b', label: zielona}
      - {match: '\bZOLTA\b', label: żółta}
    shape_codes:
      - {match: '\bST ?64\b', label: Edison ST64}
      - {match: '\bG ?125\b', label: globe G125}
      - {match: '\bG ?95\b', label: globe G95}
      - {match: '\bG ?45\b', label: kulka}
      - {match: '\bC ?3[57]\b', label: świeczka}
      - {match: '\bA ?70\b', label: A70}
    housing_colors:
      zolto_zielony: {m: żółto-zielony, f: żółto-zielona, n: żółto-zielone, match: ['ZOLTO-ZIELON']}
      jasnoszary: {m: jasnoszary, f: jasnoszara, n: jasnoszare, match: ['JASNOSZAR']}
      ciemnoszary: {m: ciemnoszary, f: ciemnoszara, n: ciemnoszare, match: ['DARK ?GREY', 'CIEMNOSZAR']}
      antracyt: {m: antracyt, f: antracyt, n: antracyt, match: ['RAL ?7016', 'ANTRACYT']}
      grafit: {m: grafitowy, f: grafitowa, n: grafitowe, match: ['GRAFIT']}
      szampan: {m: szampan, f: szampan, n: szampan, match: ['CHAMPA[GN]', 'SZAMPAN']}
      stalowy: {m: stalowy, f: stalowa, n: stalowe, match: ['STALOW']}
      chrom: {m: chrom, f: chrom, n: chrom, match: ['CHROM']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN']}
      bialy: {m: biały, f: biała, n: białe, match: ['BIAL']}
      szary: {m: szary, f: szara, n: szare, match: ['SZAR']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['SREBRN']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['ZIELON']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['NIEBIESK']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['CZERWON']}
      zolty: {m: żółty, f: żółta, n: żółte, match: ['ZOLT']}
      pomaranczowy: {m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['POMARANCZ']}
      kolorowy: {m: kolorowy, f: kolorowa, n: kolorowe, match: ['KOLOROW']}
    # Wspolne listy cech - w `features` typu wpisuje sie nazwe listy.
    feature_sets:
      sensor:
        - {match: 'MIKR.*POLCIENIA', label: z czujnikiem mikrofalowym i półcieniem, group: sensor}
        - {match: 'MIKR.*PODTRZYMANIA', label: z czujnikiem mikrofalowym i podtrzymaniem napięcia, group: sensor}
        - {match: 'CZUJNIKIEM MV I ZMIERZCHU', label: z czujnikiem mikrofalowym i zmierzchu, group: sensor}
        - {match: '\bCZ\w*\.? ?MIKR|\bCZUJ\w*\.? MIKRO|\+ ?SES\b', label: z czujnikiem mikrofalowym, group: sensor}
        - {match: '\bCZ\w*\.? ?(PIR|PODCZER)|\bPIR\b', label: z czujnikiem PIR, group: sensor}
        - {match: '\bCZ\w*\.? ?ZMIERZCH', label: z czujnikiem zmierzchu, group: sensor}
        # nazwa w Ekonomie bez czujnika, a kod ma wariant z czujnikiem (C30-PHR220-MS)
        - {code_match: '-MD$', label: z czujnikiem mikrofalowym i półcieniem, group: sensor}
        - {code_match: '-MS$', label: z czujnikiem mikrofalowym, group: sensor}
        - {code_match: '-PIR$', label: z czujnikiem PIR, group: sensor}
      shape:
        - {match: '\bKWADRAT', label: {m: kwadratowy, f: kwadratowa, n: kwadratowe}, group: shape}
        - {match: '\bOKRA?GL', label: {m: okrągły, f: okrągła, n: okrągłe}, group: shape}
        - {match: '\bOWALN', label: {m: owalny, f: owalna, n: owalne}, group: shape}
        - {match: '\bPROSTOKATN', label: {m: prostokątny, f: prostokątna, n: prostokątne}, group: shape}
      klosz:
        - {match: 'KLOSZ PMMA', label: klosz PMMA, group: klosz}
        - {match: 'KLOSZ PC OPAL|PC-OPAL', label: klosz opal, group: klosz}
        - {match: 'KLOSZ PC MIKRO', label: klosz mikropryzmatyczny, group: klosz}
        - {match: 'PRYZMATYCZN', label: klosz pryzmatyczny, group: klosz}
        - {match: 'PC-CLEAR', label: klosz przezroczysty, group: klosz}
        - {match: 'KLOSZ PC\b|\bPC\b', label: klosz PC, group: klosz}
      control:
        - {match: '\b1-10V\b', label: 1-10V}
        - {match: '\bZHAGA\b', label: Zhaga}
    # Z modelu (slowa po slowach typu) usuwane sa parametry pokazywane osobno.
    series_drop:
      - '(?i)\(.*?\)'
      - '(?i)\b\d+(?:[.,]\d+)?\s?[x*]\s?\d+(?:[.,]\d+)?(?:\s?[x*]\s?\d+)?\s?(?:MM|CM)?(?=\s|$)'
      - '(?i)\b\d+(?:[.,]\d+)?(?:[-/]\d+(?:[.,]\d+)?)*\s?(?:W|K|LM|V|MM2?|CM|M|MA|MAH|H|A|KA|KV|HZ)(?:/\d?M)?(?=[\s,/]|$)'
      - '(?i)\b\d+\s?x\s?\d+(?:[.,]\d+)?\s?W\b'
      - '(?i)\b(SZAR\w*|JASNOSZAR\w*|GRAFIT\w*|CHROM|KWADRAT\w*|OTWART\w*|WYSOK\w*|NISK\w*|PIR|PODCZER\w*|ZMIERZCH\w*|MIKR\w*)\b'
      - '(?i)\bIP\s?\d{2}(?:/IP\d{2})?\b'
      - '(?i)\b\d?x?(E27|E14|GU10|G9|T8)\b'
      - '(?i)\bCRI\s?>?\s?\d{2}\b'
      - '(?i)\b\d+°(?:÷\d+°)?'
      - '(?i)\bI{1,2}\s?KL\.?(\s?OCHR\.?)?'
      - '(?i)\bFI-?\d+\b'
      - '(?i)\b\d-FAZOW\w*'
      - '(?i)PF>[\d.,]+'
      - '(?i)\bPC-(CLEAR|OPAL)\b'
      - '(?i)\bZ ZESTAWEM PIKTOGRAM\w*'
      - '(?i)\bPODTRZYMANIA\b|\bCZUJ\b\.?'
      - '(?i)\+'
      - '(?i)\b(LED|SMD|COB|DALI|ZHAGA|CCT|UGR\s?<?\s?19|PC|PMMA|OPAL|KLOSZ|EMPTY|CNBOP|AUTOTEST|TEST|SES|WW|NW|CW|AC|DC|AL|STAL|PLASTIK|RAL\s?\d+|DARK|GREY|DARKGREY|CHAMPAGNE|CHAMPANGE|MIKRO|RAMKA|PLAFON|KINKIET|OPTYKA|SOCZ|SOCZEWKI)\b'
    # Slowa typu z poczatku nazwy (bez polskich znakow, wielkie litery) - rzeczownik nazwy i poczatek modelu.
    type_words: [OPRAWA, OPRAWKA, OPRAWY, OPRAW, PLAFONIERA, LED, SMD, COB, NASWIETLACZ, NASWIETLACZY, SOLARNY, SOLARNA,
                 ULICZNA, HYBRYDOWA, PARKOWA, PARKINGOWA, PRZEMYSLOWA, HIGHBAY, HERMETYK, HERMETYCZNA, HERMETYCZNE, HERMETYCZNYCH,
                 ELEWACYJNA, LINIOWA, SCHODOWA, AWARYJNA, AWARYJNYCH, NATYNKOWA, NATYNKOWY, NAJAZDOWA, RASTROWA,
                 SPOT, KINKIET, DOWNLIGHT, PANEL, BACKLIGHT, PANELI, TUBA, ZRODLO, TASMA, IZOLACYJNA,
                 SAMOWULKANIZUJACA, ZESTAW, MONTAZOWY, MONTAZU, MONTAZOWE, DO, NA, Z, I, DLA, TYPU, ZWIESZANEGO,
                 ZWIESZANIA, MAGNETYCZNEGO, ADAPTER, AKCESORIUM, SLUPIE, SLUPACH, BAZA, SUFITOWA, BLOK, ROZDZIELCZY,
                 CZUJNIK, MIKROFALOWY, RUCHU, ZMIERZCHU, ZBLIZENIOWY, DEKIEL, SZYNY, DLAWNICA, KABLOWA, DZWONEK,
                 SZYNE, GNIAZDA, PRZYLACZENIOWE, GNIAZDO, WTYKOWE, GLOWKA, BEZPIECZNIKOWA, PUSZKA, LACZENIOWA,
                 ZLACZE, KABLOWE, LISTWA, ZACISKOWA, IZOLATORACH, PLASKICH, KONTROLKA, LAMPKA, LAMKA,
                 SYGNALIZACYJNA, LATARKA, WIELOFUNKCYJNA, LICZNIK, ENERGII, OPASKA, CERAMICZNA, PIKTOGRAM,
                 PIKTOGRAMU, PILOT, PODSTAWA, PROGRAMATOR, MECHANICZNY, ELEKTRONICZNY, PRZEDLUZACZ, BEBNOWY,
                 PRZEJSCIOWKA, PRZELOTOWA, ZLACZKA, INSTALACYJNA, RAMKA, REGULOWANY, DASZEK, ROZDZIELACZ, ZASILANIA,
                 ROZETA, ROZGALEZNIK, ROZLACZNIK, IZOLACYJNY, SIATKA, OCHRONNA, STATYW, POJEDYNCZY, PODWOJNY,
                 STEROWNIK, SZYBKOZLACZKA, SZYNA, SZYNOPRZEWOD, SZYNOPRZEWODU, UCHWYT, METALOWY, UNIWERSALNY,
                 UNIWERSALNE, ZAWIESIE, WKLADKA, TOPIKOWA, CYLINDRYCZNA, OGRANICZNIKA, OGRANICZNIK, PRZEPIEC,
                 WSKAZNIK, NAPIECIA, NATEZENIA, CZESTOTLIWOSCI, WTYCZKA, SIECIOWA, WYLACZNIK, ZMIERZCHOWY,
                 ZASILANIE, ZASLEPKA, SZYN, LACZENIOWYCH, ZASILACZ, LACZNIK, KATOWY, WEWNETRZNY, ZEWNETRZNY,
                 SOLARNE, STADIONOWYCH, HERMETYCZNEJ, OPRAWY,
                 # zestawienie 2026-11-03 (akcesoria i osprzet spoza katalogu)
                 KOLCE, PRZECIW, PTAKOM, PRZEDLUZKA, SLUP, OSWIETLENIOWY, SKLADANY, KOTWA, FUNDAMENTOWA, MODUL,
                 AWARYJNY, MODULOWY, PRZELACZNIK, STYCZNIK, OBECNOSCI, NAKLEJEK, PLAFONIERY, CZASOWY]
    types:
      # --- zrodla swiatla ---
      - key: zarowka_led
        noun: Żarówka LED
        gender: f
        match: ['^ZRODLO LED', '^ZAROWKA LED']
        version_suffix: true
        features_pre:
          - {match: '\bFILAMENT\b', label: filament}
          - {match: '\bDIM\b', label: ściemnialna}
        features: [sensor]
        # kolejnosc jak w zarowkach Ledvance (2026-10-19): gwint, W, lm, K, ksztalt i cechy, marka na koncu
        attrs: [gwint, power, lumen, cct, shape, features_pre, features, brand]
        required: [gwint, power, lumen, cct]
      - key: tuba
        noun: Tuba LED
        gender: f
        match: ['^TUBA LED']
        version_suffix: true
        features:
          - {match: 'SZKLO MLECZN', label: szklana mleczna}
        attrs: [tube_type, tube_length, power, lumen, cct, features]
        required: [power, lumen, cct]
      - key: zestaw_tasma
        noun: Zestaw taśma LED
        gender: m
        match: ['^ZESTAW TASMA']
        version_suffix: true
        trusted: true
        features_pre:
          - {match: 'STEROWNIK', label: z zasilaczem i sterownikiem, group: set}
          - {match: 'ZASILACZ', label: z zasilaczem, group: set}
          - {match: '\b(2835|3528|5050|COB)\b', label: '{0}'}
          - {match: '\b(\d+)\s?LED/(\d+)\s?M\b', label: '{0}LED/{1}m'}
        attrs: [features_pre, voltage, power, ip, cct]
        required: [power, cct]
      - key: tasma_led
        noun: Taśma LED
        gender: f
        match: ['^TASMA LED']
        version_suffix: true
        trusted: true
        features_pre:
          - {match: '\b(2835|3528|5050|COB)\b', label: '{0}'}
          - {match: '\b(\d+)\s?LED/(\d+)\s?M\b', label: '{0}LED/{1}m'}
        attrs: [features_pre, voltage, power, ip, cct]
        required: [power, cct]
      # zrodla tradycyjne z zestawienia 2026-11-03: zarnik 78 / 118 mm to zawsze trzonek R7s
      - key: zarnik_halogenowy
        noun: Żarnik halogenowy R7s
        gender: m
        match: ['^ZARNIK HALOGENOWY']
        trusted: true
        features:
          - {match: '\b(\d{2,3})\s?MM\b', label: '{0}mm'}
        attrs: [power, features]
        required: [power]
      - key: zarowka_halogenowa
        noun: Żarówka halogenowa
        gender: f
        match: ['^(MR\d+ )?ZAROWKA HALOG']
        trusted: true
        features_pre:
          - {match: '\b(MR1[16])\b', label: '{0}'}
          - {match: '\b(G4|G9|G6,35|GY6,35|GU5,3|GU10|E14|E27)\b', label: '{0}'}
        features:
          - {match: '(\d{2,3})°', label: '{0}°'}
        attrs: [features_pre, power, voltage, features]
        required: [power]
      - key: swietlowka
        noun: Świetlówka
        gender: f
        match: ['^SWIETLOWKA']
        trusted: true
        features_pre:
          - {match: '\b(T[458])\b', label: '{0}'}
        features:
          - {match: '\b(\d{3,4})\s?MM\b', label: '{0}mm'}
        attrs: [features_pre, power, cct, features]
        required: [power]
      # --- oprawy LED ---
      - key: naswietlacz
        noun: Naświetlacz LED
        gender: m
        match: ['^NASWIETLACZ']
        version_suffix: true
        features:
          - {match: 'SOLARN', label: solarny}
          - {match: 'PRZENOSN', label: przenośny}
          - sensor
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: high_bay
        noun: Oprawa High Bay LED
        gender: f
        match: ['^HIGHBAY', '^OPRAWA PRZEMYSLOWA']
        version_suffix: true
        features:
          - {match: '\b(30|60|90)X(30|70|90)\b', label: '{0}x{1}°'}
          - control
        attrs: [series, power, lumen, cct, ip, optics, features, control, color]
        required: [power, lumen, cct]
      - key: uliczna
        noun: Oprawa uliczna LED
        gender: f
        match: ['^(SOLARNA |HYBRYDOWA )?OPRAWA ULICZNA']
        version_suffix: true
        features:
          - {match: 'SOLARN', label: solarna}
          - {match: 'HYBRYDOW', label: hybrydowa}
          - control
          - {match: '\bII\s?KL', label: II klasa, group: klasa}
          - {match: '\bI\s?KL', label: I klasa, group: klasa}
          - sensor
        attrs: [series, power, lumen, cct, ip, control, features, color]
        required: [power, lumen, cct]
      - key: parkowa
        noun: Oprawa parkowa LED
        gender: f
        match: ['^(SOLARNA )?OPRAWA PARKOWA']
        version_suffix: true
        features:
          - {match: 'SOLARN', label: solarna}
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: stadionowa
        noun: Oprawa stadionowa LED
        gender: f
        match: ['^OPRAWA STADIONOWA']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, optics, color]
        required: [power, lumen, cct]
      - key: parkingowa
        noun: Oprawa parkingowa LED
        gender: f
        match: ['^OPRAWA PARKINGOWA']
        version_suffix: true
        attrs: [series, power, lumen, cct, ip, color]
        required: [power, lumen, cct]
      # oprawy bez zrodla ("EMPTY") na swietlowki T8
      - key: hermetyczna_t8
        noun: Oprawa hermetyczna
        gender: f
        match: ['^OPRAWA HERMETYCZNA']
        require_pattern: '\bEMPTY\b'
        version_suffix: true
        trusted: true
        features:
          - {match: '\b(\d)XT8\b', label: '{0}xT8'}
          - klosz
        attrs: [length, features, ip]
      - key: rastrowa_t8
        noun: Oprawa rastrowa
        gender: f
        match: ['^OPRAWA RASTROWA']
        version_suffix: true
        trusted: true
        features:
          - {match: '\b(\d)XT8\b', label: '{0}xT8'}
          - {match: '\bNATYNKOW', label: natynkowa}
        attrs: [series, features, length]
      - key: swietlowkowa_t8
        noun: Oprawa świetlówkowa
        gender: f
        match: ['^OPRAWA']
        require_pattern: '\bEMPTY\b'
        version_suffix: true
        trusted: true
        features:
          - {match: '\b(\d)XT8\b', label: '{0}xT8'}
          - klosz
          # "OPRAWA AWARYJNA 03 EMPTY 150cm 2X58W IP65 2H CNBOP" (2026-11-03)
          - {match: '\bAWARYJN', label: awaryjna}
          - {match: '(?<![\d.,])(\d)H\b', label: '{0}h'}
          - {match: '\bCNBOP\b', label: CNBOP}
        attrs: [series, length, features, ip]
      - key: hermetyczna
        noun: Oprawa hermetyczna LED
        gender: f
        match: ['^(OPRAWA )?HERMETY']
        exclude: ['PUSZKA|ZLACZE']
        version_suffix: true
        features: [klosz]
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: panel_backlight
        noun: Panel LED backlight
        gender: m
        match: ['^PANEL BACKLIGHT']
        version_suffix: true
        features:
          - {match: '\b40X40\b', label: 40x40}
          # "BLO NT OKRĄGŁY ... FI60" (2026-11-03)
          - {match: '\bOKRA?GL', label: okrągły}
          - {match: '\bFI ?(\d{2})\b', label: 'fi{0}cm'}
          - {match: '\b24H\b', label: 24h}
          - sensor
        attrs: [series, panel_size, power, lumen, cct, ip, ugr, features, color]
        required: [power, lumen, cct]
      - key: panel
        noun: Panel LED
        gender: m
        match: ['^PANEL']
        version_suffix: true
        features:
          - {match: '\b40X40\b', label: 40x40}
          - {match: '\b24H\b', label: 24h}
          - sensor
        attrs: [series, panel_size, power, lumen, cct, ip, ugr, features, color]
        required: [power, lumen, cct]
      - key: downlight
        noun: Downlight LED
        gender: m
        match: ['^DOWNLIGHT LED']
        version_suffix: true
        features: [shape]
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: downlight_gu10
        noun: Downlight
        gender: m
        match: ['^DOWNLIGHT']
        version_suffix: true
        trusted: true
        features:
          - {match: '\bNIEREGULOWAN', label: nieregulowany, group: reg}
          - {match: '\bREGULOWAN', label: regulowany, group: reg}
          - {match: '\bFI\s?(\d{2,3})\b', label: 'fi{0}', group: size}
          - {match: '\b(\d{2,3})X(\d{2,3})\b', label: '{0}x{1}mm', group: size}
        attrs: [series, features, sockets, color]
      - key: kinkiet
        noun: Kinkiet LED
        gender: m
        match: ['^KINKIET']
        version_suffix: true
        features: [klosz]
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: liniowa
        noun: Oprawa liniowa LED
        gender: f
        match: ['^OPRAWA LINIOWA']
        version_suffix: true
        features: [klosz]
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: schodowa
        noun: Oprawa schodowa LED
        gender: f
        match: ['^OPRAWA SCHODOWA']
        version_suffix: true
        attrs: [series, power, lumen, cct, voltage, color]
        required: [power, lumen, cct]
      - key: elewacyjna_gu10
        noun: Oprawa elewacyjna
        gender: f
        match: ['^OPRAWA ELEWACYJNA']
        require_pattern: 'GU10\b'
        version_suffix: true
        trusted: true
        features:
          - {match: '\bKINKIET\b', label: kinkiet}
        attrs: [series, sockets, ip, features, color]
      - key: elewacyjna
        noun: Oprawa elewacyjna LED
        gender: f
        match: ['^OPRAWA ELEWACYJNA']
        version_suffix: true
        features:
          - shape
          - {match: '\bPLAFON\b', label: plafon, group: shape}
          - {match: '\bKINKIET\b', label: kinkiet, group: shape}
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      # panele / hermetyczne z modulem awaryjnym ("OPRAWA AWARYJNA 08 MINTAL 40W 4000K 4000LM 60x60") niosa
      # parametry jak zwykla oprawa (2026-11-03); male oprawy awaryjne (Skaler, Galer) - bez lm i barwy
      - key: awaryjna_lm
        noun: Oprawa awaryjna LED
        gender: f
        match: ['^OPRAWA (LED )?AWARYJNA']
        # lm albo barwa w nazwie ("OPRAWA AWARYJNA 06 PLATO 24W 4000K" - lm z karty, bez karty DO_SPRAWDZENIA)
        require_pattern: '\d\s?LM\b|\b\d{4}K\b'
        version_suffix: true
        features:
          - sensor
          - {match: '(?<![\d.,])(\d)H\b', label: '{0}h'}
          - {match: '\bCNBOP\b', label: CNBOP}
        attrs: [series, panel_size, power, lumen, cct, ip, ugr, features, color]
        required: [power, lumen, cct]
      - key: awaryjna
        noun: Oprawa awaryjna LED
        gender: f
        match: ['^OPRAWA (LED )?AWARYJNA']
        version_suffix: true
        trusted: true
        features:
          - sensor
          - {match: '\bNATYNKOW', label: natynkowa}
          - shape
          - {match: 'KORYTARZOW', label: optyka korytarzowa, group: opt}
          - {match: 'SKUPIAJAC', label: optyka skupiająca, group: opt}
          - {match: '(OPTYKA|SOCZ\.) OTWART', label: optyka otwarta, group: opt}
          - {match: 'BEZ SOCZEWKI', label: bez soczewki, group: opt}
          - {match: '\bAUTOTEST\b', label: autotest, group: test}
          - {match: 'TEST RECZNY', label: test ręczny, group: test}
          - {match: '(?<![\d.,])(\d)H\b', label: '{0}h'}
          - {match: '\bCNBOP\b', label: CNBOP}
          - {match: 'PIKTOGRAM', label: z piktogramami}
        attrs: [series, power, features, ip]
      - key: reflektor_led
        noun: Reflektor LED
        gender: m
        match: ['^SPOT COB']
        version_suffix: true
        features:
          - {match: '\b([13])-FAZOWY', label: '{0}-fazowy'}
        attrs: [series, features, power, lumen, cct, optics, color]
        required: [power, lumen, cct]
      - key: reflektor_gu10
        noun: Reflektor
        gender: m
        match: ['^OPRAWA SPOT']
        version_suffix: true
        trusted: true
        features:
          - {match: '\b([13])-FAZOWY', label: '{0}-fazowy szynowy'}
          - {match: '\bNATYNKOWY\b', label: natynkowy}
          - {match: '\bREGULOWANY\b', label: regulowany}
        attrs: [series, sockets, features, color]
      - key: najazdowa
        noun: Oprawa najazdowa
        gender: f
        match: ['^OPRAWA NAJAZDOWA']
        trusted: true
        features:
          - shape
          - {match: 'Z OSLONA', label: z osłoną}
        attrs: [series, sockets, features]
      - key: plafon_led
        noun: Plafon LED
        gender: m
        match: ['^PLAFONIERA']
        # bez lm w nazwie tez LED, gdy jest moc i nie ma trzonka ("PLAFONIERA LED PLATO 12W 4000K IP44") - lm z karty
        require_pattern: '\d\s?LM\b|^(?!.*\b(?:\d?X?E27|E14|GU10|G9|GX53)\b).*\bLED\b.*\d\s?W\b'
        version_suffix: true
        features:
          - shape
          - {match: 'RAMKA WYSOKA', label: z wysoką ramką}
          - {match: 'ZASILANIE 24V AC', label: 24V AC, group: zas}
          # Plato na 24V DC (2026-11-03) - bez tego blizniaki 230V / 24V dostawaly smieciowy wyroznik
          - {match: '\b24V(?: DC)?\b', label: 24V DC, group: zas}
          - sensor
        attrs: [series, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      - key: plafon
        noun: Plafon
        gender: m
        match: ['^PLAFONIERA']
        version_suffix: true
        trusted: true
        features:
          - {match: '\bFI-?(\d{2})\b', label: 'fi{0}cm', group: size}
          - {match: '\b(\d{2})X(\d{2})\b', label: '{0}x{1}cm', group: size}
          - {match: '\b24V(?: DC)?\b', label: 24V DC}
          - sensor
        attrs: [series, sockets, features, ip]
      - key: oprawa_led
        noun: Oprawa LED
        gender: f
        match: ['^OPRAWA']
        require_pattern: '\d\s?LM\b'
        version_suffix: true
        features: [shape, klosz, sensor]
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      # --- aparatura ---
      - key: nadpradowy
        noun: Wyłącznik nadprądowy
        gender: m
        match: ['^WYLACZNIK NADPRADOWY']
        trusted: true
        features:
          - {match: '\b(\d)P ([BCD]) 0?(\d+)A\b', label: '{1}{2} {0}P'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
        attrs: [features]
      - key: rcbo
        noun: Wyłącznik RCBO
        gender: m
        match: ['^WYLACZNIK (RCBO|ROZNICOWOPRADOWY Z NADPRADOWYM)']
        trusted: true
        features:
          - {match: '\b(\d)P ([BCD]) 0?(\d+)A\b', label: '{1}{2} {0}P'}
          - {match: '\b(\d+)MA\b', label: '{0}mA'}
          - {match: '\bTYP (AC|A)\b', label: 'typ {0}'}
        attrs: [features]
      - key: roznicowopradowy
        noun: Wyłącznik różnicowoprądowy
        gender: m
        match: ['^WYLACZNIK ROZNICOWOPRADOWY']
        trusted: true
        features:
          - {match: '\b(\d)P\b', label: '{0}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)MA\b', label: '{0}mA'}
          - {match: 'ROZNICOWOPRADOWY (AC|A)\b', label: 'typ {0}'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
        attrs: [features]
      - key: rozlacznik
        noun: Rozłącznik izolacyjny
        gender: m
        match: ['^ROZLACZNIK']
        trusted: true
        features:
          - {match: '\bPV\b', label: PV}
          - {match: '\b(\d)P\b|\b(\d)-POLOWY', label: '{0}{1}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
        attrs: [features, ip]
      - key: ogranicznik
        noun: Ogranicznik przepięć
        gender: m
        match: ['^OGRANICZNIK']
        trusted: true
        features:
          # "KLASY T1T2" (A53-SPD-MOV-DC-3P-T1T2) tez bez plusa - klasa ginela z nazwy (2026-11-04)
          - {match: '\bT1\+?T2\b', label: T1+T2, group: klasa}
          - {match: '\bT2\b', label: T2, group: klasa}
          - {match: '\b(\d)P\b', label: '{0}P'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
          - {match: '\bDC (\d+)V\b', label: '{0}V DC'}
          - {match: 'ISKIERNIK', label: z iskiernikiem}
        attrs: [features]
      - key: wkladka_ogranicznika
        noun: Wkładka do ogranicznika przepięć
        gender: f
        match: ['^WKLADKA DLA OGRANICZNIKA']
        trusted: true
        features:
          - {match: '\bT1\+?T2\b', label: T1+T2, group: klasa}
          - {match: '\bT2\b', label: T2, group: klasa}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
          - {match: 'BEZ TRZPIENIA', label: bez trzpienia}
        attrs: [features]
      - key: wkladka_topikowa
        noun: Wkładka topikowa
        gender: f
        match: ['^WKLADKA TOPIKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\s?MM\b', label: '{0}'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
        attrs: [features]
      - key: podstawa_bezpiecznikowa
        noun: Podstawa bezpiecznikowa
        gender: f
        match: ['^PODSTAWA BEZPIECZNIKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\b', label: '{0}'}
          - {match: '\b(\d)-POLOWA', label: '{0}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
          - {match: 'KONTROLK', label: z kontrolką}
        attrs: [features]
      - key: licznik_energii
        noun: Licznik energii
        gender: m
        match: ['^LICZNIK ENERGII']
        trusted: true
        features:
          - {match: '\b(\d) FAZOWY', label: '{0}-fazowy'}
          - {match: '\bMID\b', label: MID}
          - {match: '\bMODBUS\b', label: Modbus, group: bus}
          - {match: '\bMBUS\b', label: M-Bus, group: bus}
          - {match: '\b(\d+)A\b', label: '{0}A'}
        attrs: [features]
      - key: wskaznik_energii
        noun: Wskaźnik energii
        gender: m
        match: ['^WSKAZNIK ENERGII']
        trusted: true
        features:
          - {match: '\b(\d) FAZOWY', label: '{0}-fazowy'}
          - {match: '\b(\d+) ?\((\d+)\) ?A\b', label: '{0}({1})A'}
          - {match: 'MECHANICZN', label: mechaniczny}
        attrs: [features]
      - key: lampka_sygnalizacyjna
        noun: Lampka sygnalizacyjna
        gender: f
        match: ['^(LAMPKA|LAMKA) SYGNALIZACYJNA', '^KONTROLKA']
        trusted: true
        features:
          - {match: '\b(S?L\d)\b', label: '{0}'}
          - {match: '\b3-FAZOWA\b', label: 3-fazowa}
        attrs: [features, color]
      # zasilacz pradowy do paneli: "ZASILACZ DO PANELI LEDOWYCH PLM 40W WH (950 mA)" - bez napiecia, z pradem
      - key: zasilacz_panel
        noun: Zasilacz do paneli LED
        gender: m
        match: ['^ZASILACZ DO PANELI']
        trusted: true
        features:
          - {match: '\b(PL[A-Z])\b', label: '{0}'}
          - {match: '\b(\d{3,4})\s?MA\b', label: '{0}mA'}
        attrs: [power, features]
        required: [power]
      - key: zasilacz
        noun: Zasilacz LED
        gender: m
        match: ['^ZASILACZ']
        trusted: true
        features_pre:
          - {match: 'SZYNE DIN', label: na szynę DIN}
          - {match: 'OPRAW SCHODOWYCH STEPPER', label: do opraw Stepper}
          - {match: 'HERMETYCZN', label: hermetyczny}
        attrs: [features_pre, voltage, power, ip]
        required: [voltage, power]
      # --- osprzet instalacyjny ---
      # Schemat nazwy przedluzaczy V3 (archived_input_files/input_2026-11-10/schemat nazwy przedłużaczy V3.xlsx, 2026-11-05), wspolny z Kobi.
      # Bebnowe: gniazda, dlugosc, przekroj, rodzaj przewodu (material), hermetycznosc, uziemienie / Schuko,
      # nazwa wlasna, marka.
      - key: przedluzacz_bebnowy
        noun_from: type_words
        match: ['^PRZEDLUZACZ BEBNOWY', '^PRZEDLUZACZ NA BEBNIE']
        trusted: true
        features:
          - {match: '\b(\d)\s?GN\b', label: '{0} gn.', group: gn}
          - {match: '\b(\d)X\s?2P', label: '{0} gn.', group: gn}
          - {match: '\b(\d)XGN\b', label: '{0} gn.', group: gn}
          - {match: '(?:\bX|PRZEWOD)\s?(\d+(?:,\d)?)\s?M\b', label: '{0}m', group: len}
          - {match: '\b(\d{2})M\b', label: '{0}m', group: len}
          - {match: '\b3X(\d(?:,\d)?)\s?MM2\b', label: '3x{0}mm2', group: cross}
          - {match: '\b(\d,\d)\s?MM\b', label: '{0}mm2', group: cross}
          # material przewodu: OW / H05RR-F / H07RN-F = guma, OMY / H05VV-F = PVC
          - {match: 'GUMOW|\bOW\b|\bOWY\b|\bH0[57]R[RN]-F\b', label: guma, group: cable}
          - {match: '\bPVC\b|\bOMY\b|\bH05VV-F\b', label: PVC, group: cable}
          - {match: '\b(IP[2-6]\d)\b', label: '{0}', group: ip}
          # uziemienie / Schuko przy koncu, przed marka (decyzja uzytkownika 2026-11-04, potwierdzona dla V3 2026-11-05 - bez nich B15 i B16 mialy
          # te same nazwy)
          - {match: '\bSCHUKO\b', label: Schuko, group: earth}
          - {match: 'BEZ "0"', label: bez uziemienia, group: earth}
          - {match: '"0"|2P\+Z', label: z uziemieniem, group: earth}
        attrs: [features]
      # Domowe (V3): gniazda (+ USB), dlugosc, przekroj, uziemienie / Schuko / bez uziemienia (jedno), wylacznik,
      # nazwa wlasna, marka. Schuko zastepuje "z uziemieniem" (ma uziemienie).
      - key: przedluzacz
        noun_from: type_words
        match: ['^PRZEDLUZACZ', '^ROZGALEZNIK']
        trusted: true
        features:
          - {match: '\b(\d)\s?GN\b', label: '{0} gn.', group: gn}
          - {match: '\b(\d)X\s?2P', label: '{0} gn.', group: gn}
          - {match: '\b(\d)XGN\b', label: '{0} gn.', group: gn}
          - {match: '(\d)X ?USB ?\(C\+A\)', label: '+ {0}xUSB A+C', group: usb}
          - {match: '(\d)X ?USB', label: '+ {0}xUSB', group: usb}
          - {match: '(?:\bX|PRZEWOD)\s?(\d+(?:,\d)?)\s?M\b', label: '{0}m', group: len}
          - {match: '\b(\d{2})M\b', label: '{0}m', group: len}
          - {match: '\b3X(\d(?:,\d)?)\s?MM2\b', label: '3x{0}mm2', group: cross}
          - {match: '\b(\d,\d)\s?MM\b', label: '{0}mm2', group: cross}
          - {match: '\bSCHUKO\b', label: Schuko, group: earth}
          - {match: 'BEZ "0"|\b\dX\s?2P(?!\+Z)', label: bez uziemienia, group: earth}
          - {match: '"0"|2P\+Z', label: z uziemieniem, group: earth}
          - {match: 'WYL\.|WYLACZNIK', label: z wyłącznikiem}
          - {match: '\bTROJKATNY\b', label: trójkątny}
        attrs: [features]
      - key: szybkozlaczka
        noun_from: type_words
        match: ['^(SZYBKOZLACZKA|PRZELOTOWA ZLACZKA|ZLACZKA ZACISKOWA)']
        trusted: true
        features:
          - {match: '\bKOMPAKT\b', label: Kompakt}
          - {match: '\b(\d+(?:,\d+)?(?:-\d+,\d+)?)\s?MM2?\b', label: '{0}mm2'}
          - {match: '\bX\s?(\d)\b', label: '{0}-torowa', group: tory}
          - {match: '\b(\d)-TOROWA\b', label: '{0}-torowa', group: tory}
          - {match: '\bTWARDA\b', label: twarda}
        features_post:
          - {match: '\b(\d+)\s?SZT', label: '{0} szt.'}
        attrs: [features, ip, color, features_post]
      - key: opaska
        noun: Opaska zaciskowa
        gender: f
        match: ['^OPASKA']
        trusted: true
        features:
          - {match: '\b(\d,\d)\*(\d+)\b', label: '{0}x{1}mm'}
          - {match: '\bMIX\b', label: mix}
        features_post:
          - {match: '\b(\d+) SZT', label: '{0} szt.'}
        attrs: [features, color, features_post]
      - key: dlawnica
        noun: Dławnica kablowa
        gender: f
        match: ['^DLAWNICA']
        trusted: true
        features:
          - {match: '\b(M|PG)-(\d+(?:,\d)?)\b', label: '{0}{1}'}
        features_post:
          - {match: '\b(\d+)\s?SZT', label: '{0} szt.'}
        attrs: [features, color, features_post]
      - key: tasma_izolacyjna
        noun_from: type_words
        match: ['^TASMA (IZOLACYJNA|SAMOWULKANIZUJACA)']
        trusted: true
        features:
          - {match: '\b(\d+)X(\d+)M\b', label: '{0}mm x {1}m'}
          - {match: '\b(\d+)X(\d+)MX', label: '{0}mm x {1}m'}
        attrs: [features, color]
      - key: zlaczka_led
        noun: Złączka do taśm LED
        gender: f
        match: ['^ZLACZKA LED']
        trusted: true
        features:
          - {match: '\b(\d+)MM\b', label: '{0}mm'}
          - {match: '\b(COB|5050|3528|2835/3528|2535/3528|550)\b', label: '{0}'}
          - {match: '\bRGB\b', label: RGB}
          - {match: 'SAMOZACISKOW', label: samozaciskowa}
          - {match: '\b(\d)-STRONNA', label: '{0}-stronna'}
          - {match: 'Z PRZEWODEM', label: z przewodem}
        attrs: [features]
      - key: szynoprzewod
        noun: Szynoprzewód
        gender: m
        match: ['^SZYNOPRZEWOD']
        trusted: true
        features:
          - {match: '\b([13])-FAZOWY', label: '{0}-fazowy'}
          - {match: '\b(\d+(?:,\d)?)M\b', label: '{0}m'}
        attrs: [features, color]
      - key: listwa_zaciskowa
        noun_from: type_words
        match: ['^LISTWA ZACISKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\b', label: '{0}'}
          - {match: '\b(\d+)-TOROWA\b', label: '{0}-torowa'}
        attrs: [features, color]
      # ramki do paneli roznia sie wymiarem (60x60 / 30x120), ktory `inne` wycina (2026-11-03)
      - key: ramka_montazowa
        noun: Ramka montażowa do panelu LED
        gender: f
        match: ['^RAMKA MONTAZOWA DO PANEL']
        trusted: true
        features:
          - {match: '\b(\d{2,3})X(\d{2,3})\b', label: '{0}x{1}'}
          - {match: '\bECO\b', label: Eco}
          - {match: '\bWYS\.? ?(\d+)\s?MM\b', label: 'wys. {0}mm'}
        attrs: [features, color]
      # --- reszta (akcesoria, sterowanie, osprzet): rzeczownik ze slow typu + reszta nazwy ---
      - key: inne
        noun_from: type_words
        match: ['.']
        series_raw: true
        # marka za rzeczownikiem, przed "do/z/na ..." (jak Kobi); caly opis bez zjadania powtorzen
        brand_before_prep: true
        series_all_segments: true
        series_limit: 12
        no_schema: true
        version_suffix: true
        attrs: [series]

  # ===================================================================== Signify (Philips / PILA)
  # Wejscie: katalog z zestawieniami Ekonoma (archived_input_files/input_2026-11-10/EkonomNazwy/Signify): FAR = oprawy, PHP = zrodla swiatla,
  # "kat" w ukladzie Ekonoma, "kart" jako zestawienie "<40> | <reszta>". `Kod producenta` to 12NC Philipsa.
  # Zrodlo prawdy: karta lighting.philips.pl po 12NC (scripts/fetch_signify_web.py -> cache/signify_web) - moc,
  # lm, K, IP, trzonek, kolor, wymiary nadpisuja nazwe z Ekonoma (jak pliki Parametry Kanlux). Bez karty (404 =
  # wycofany) zostaja dane z nazwy. Zasady jak u innych dostawcow (2026-10-19): parametry, potem marka, kod rodziny
  # oprawy (BY120P, RC132V) i linia (MASTER / CorePro / CoreLine / Ledinaire) na koncu - jak "... 36° Philips CorePro".
  signify:
    brand: Philips
    brand_rules:
      - {match: '\bPILA\b', brand: PILA}
    brand_words: [Philips, PILA]
    brand_from_raw: true  # "PILA LEDCLA 100W" - `name_cleanup` zjada slowo PILA razem z zamiennikiem mocy
    brand_last: true
    line_all_types: true
    dedupe_adjacent: true
    diameter_mm: true
    params_web_loader: signify
    params_web_cache: cache/signify_web
    params_withdrawn_note: brak karty na lighting.philips.pl (wycofany)
    params_change_note: true
    params_lumen_keys: ['Całkowity znamionowy strumień świetlny [lm]']
    lumen_patterns: ['(?<![\d.,])(\d{2,6})\s?LM\b']
    per_meter_power: true
    # UGR z karty ("<19") zapisujemy jak w innych nazwach: UGR19
    name_replace:
      - {match: 'UGR<(\d\d)', repl: 'UGR\1'}
      # wymiar panelu dluzszy bok pierwszy, jak z karty ("200x1200 mm" w Ekonomie = 120x20)
      - {match: '\b([1-6]\d)x(1[0-9]\d)\b', repl: '\2x\1'}
      # opakowanie zbiorcze zawsze na koncu nazwy (jak "op. N szt." u Ledvance)
      - {match: '\bOPAK(\d+)\b', repl: 'op. \1 szt.'}
      - {match: '^(.*?) (op\. \d+ szt\.) (.+)$', repl: '\1 \3 \2'}
    # linia produktu: z nazwy w Ekonomie albo z kategorii karty (`line_from_category`)
    lines:
      - {match: '\bMASTER ?COLOU?R\b|\bMASTERC\b|\bMC CDM', label: MASTERColour}
      - {match: '\bMASTER\b|\bMAS\b|\bMST\b', label: MASTER}
      - {match: '\bCORE ?PRO\b', label: CorePro}
      - {match: '\bCORE ?LINE\b', label: CoreLine}
      - {match: '\bLEDINAIRE\b', label: Ledinaire}
      - {match: '\bGREEN ?PERFORM\b', label: GreenPerform}
      - {match: '\bMAXOS\b', label: Maxos}
      - {match: '\bTRUE ?LINE\b', label: TrueLine}
      - {match: '\bECOFIT\b', label: Ecofit}
      - {match: '\bCERTADRIVE\b', label: CertaDrive}
      - {match: '\bXI\b', label: Xi}
      - {match: '\bTFORCE\b', label: TForce}
    line_from_category: true
    features_card_name: true
    # nazwy, ktore nadal sie powtarzaja, dostaja kod wersji z nazwy katalogowej karty (PSR / PSD, ELB3...) - tylko blizniaki
    version_suffix_all: true
    version_from_card: true
    version_skip: ['\d*(?:CT|SL|PF|BC)(?:/\d+)?', 'SLV', 'UNP', 'EU', 'UE', 'CE', 'G', 'GUE', 'EELA', 'PHILIPS', 'PILA', 'MAS',
                   'MASTER', 'COREPRO', 'CORELINE', 'LEDINAIRE', 'LED\d*\S*', '\d+S\S*', 'PSU', 'ND', 'D', 'CL', 'FR', 'CLG', 'FRG',
                   'LEDBULB\S*', 'LEDCANDLE\S*', 'LEDLUSTER\S*', 'LEDTUBE', 'WWCLND', 'WWFR', 'W\d+L\d+', 'L\d{3,4}', 'II?',
                   '\d+X\d+F?', 'HALO', 'CAPS', 'CLEAR', 'E27\S*', 'E14\S*', 'A60\S*', 'RF\S*', '\d*SRT\d*',
                   '\d{1,3}', '\d+VDC', 'RED', 'COOL', 'NON-DIMMABLE', 'DAYLIGHT', 'ENERGY', 'SAVING', 'BULB', 'CAP', '\d+D',
                   '\d{3}[A-Z]\d{2}\S*', '\d{3}CLG?', '\d{3}FRG?', 'N?OCW\d', 'N?OCELB\S*', 'ELB\dW\d']
    # Nazwa wlasna rodziny z kategorii karty, przed kodem rodziny (decyzja 2026-11-03): "Philips Malaga BRP102 CoreLine".
    # Tylko prawdziwe nazwy - slowa kategorii (Downlight, Highbay, Waterproof, Batten, Panel) powtarzalyby rzeczownik.
    # Produkty bez karty dostaja nazwe po kodzie rodziny z innych kart (BRP102 = Malaga).
    proper_names:
      - {category: 'CLEARWAY', name: ClearWay}
      - {category: 'MALAGA', name: Malaga}
      - {category: 'LUMISTREET', name: LumiStreet}
      - {category: 'TOWNGUIDE PERFORMER', name: TownGuide Performer}
      - {category: 'TOWNTUNE', name: TownTune}
      - {category: 'UNIFLOOD M\b', name: UniFlood M}
      - {category: 'UNIFLOOD', name: UniFlood}
      - {category: 'UNIEDGE', name: UniEdge}
      - {category: 'RECESSED SPOT', name: Recessed Spot}
      - {category: 'SLIMDOWNLIGHT', name: SlimDownlight}
      - {category: 'FASTSET', name: FastSet}
      - {category: 'CLEAR ACCENT', name: Clear Accent}
      - {category: 'ECOSET', name: EcoSet}
      - {category: 'NASWIETLACZE LEDINAIRE SOLAR', name: Solar}
    # kod rodziny oprawy Philips w pisowni producenta: BY120P, RC132V, WT120C, DN142B, BRP102, BVP167, EXT2010
    families:
      - {match: '(?<![A-Z0-9-])(?:B[A-Z]P\d{3}|Z[A-Z]P\d{3}|ZRS\d{3}|RCS\d{3}|EXT\d{4}|(?:BY|RC|WT|DN|SM|BN|RS|ST|WL|LL)\d{3}[A-Z]?)(?![A-Z0-9])', raw: true}
    # Naprawy zapisu w Ekonomie: angielskie opisy z kartotek ("Halogen metal halide lamp ... Zuzycie energii 227.0 W"),
    # dopiski gwarancji, opakowania (1CT/10, 1SL/25, 5X10BOX), sklejki ("PSUW20L120NOCELB3")
    name_cleanup:
      # sklejki przed angielskim opisem: "CDM-TMASTERColour", "230-240VBallast", "1CTMASTERColour", "25DMASTERColour"
      - {match: '\bCDM\.-', repl: 'CDM-'}
      - {match: '(?<=\S)(?=MASTERColour)', repl: ' '}  # "10DMASTERColour" - przed odczytem kata
      - {match: '\b(\d{2})VDC\b', repl: '\1V'}  # zasilacz "120W 24VDC"
      # kontrola 2026-11-03:
      # - TForce "60-35W" = zamiennik 60 W, moc rzeczywista 35 W (karta: "TForce LED Road 120-68W" = 68 W) - odwrotnie
      #   niz zarowki "LEDBulb 8-60W"
      - {match: '(?i)(\bTFORCE\b.*?)\b\d{2,3}-(\d{2,3})W\b', repl: '\1\2W'}
      # - sklejki: "7.3-100WE27830", "CoreProLEDspot", "78mm840", "LEDCandleDT3.4-40W", "LEDBulbND2.3-40W",
      #   "840PSUW20L120OCELB3W3" (inaczej "B3W3" czytane jako moc 3W)
      - {match: '(?i)\b(LED[A-Z]+?)(ND|DT|D)?(\d)', repl: '\1 \2 \3'}
      - {match: '(?<=/\d\d\d)(?=PS[UDR])', repl: ' '}
      - {match: '(?<=PS[UDR])(?=W\d)', repl: ' '}
      - {match: '\b(ELB\d)(W\d)\b', repl: '\1 \2'}
      - {match: '\b(N?OC)(W\d)\b', repl: '\1 \2'}
      - {match: '(?<=\dW)(?=E\d\d)', repl: ' '}
      - {match: '(?i)\bCorePro(?=LED)', repl: 'CorePro '}
      - {match: '(?i)(?<=\dmm)(?=[89]\d\d\b)', repl: ' '}
      # - "D" na koncu nazwy lampy = sciemnialna ("LEDcapsuleMV 2.6-25W G9 827 D")
      - {match: '^(.*\bLED\w*.*\b[89]\d\d) D$', repl: '\1 DIM'}
      # - kat "24D" / "36ST" -> "36°" (parser kata zarowek zna tylko stopnie)
      - {match: '\b(1[05]|2[0-9]|3[0-9]|4[05]|60|90|100|110|120)(?:ST|D)\b', repl: '\1°'}
      # - akcesoria Color Kinetics ZXP399 po angielsku
      - {match: '^ZXP399 Lead\b', repl: 'Kabel zasilający ZXP399 Lead'}
      - {match: '^ZXP399 Jump\b', repl: 'Kabel połączeniowy ZXP399 Jump'}
      - {match: '\b(?:Lead|Jump) (\d)P (\S+) cable\b', repl: '\1P \2'}
      - {match: '^ZXP399 endcap female connector\b', repl: 'Zaślepka końcowa żeńska ZXP399'}
      - {match: '^ZXP399 endcap male connector\b', repl: 'Zaślepka końcowa męska ZXP399'}
      - {match: '\((\d+) pcs\)', repl: 'OPAK\1'}  # "op. N szt." dopiero w `name_replace` - "szt." wycina czyszczenie opakowan
      - {match: '^MASTER LEDtube Starter\b', repl: 'Starter do tub LED MASTER'}
      - {match: '\bMODULE\b', repl: 'moduł LED'}  # "RS150Z MODULE LED6-WB-/830" - wymienny modul spotu
      - {match: '\s+zestaw montażowy/ramka SME\b', repl: ''}
      # - akcesoria szyny 3-fazowej po angielsku ("Szyna 3C ZRS750 ICP BK"); kolory kodem WH / BK / ALU
      - {match: '^Szyna 3C (ZRS7\d0)\b', repl: 'Akcesorium do szyny 3-fazowej \1'}
      - {match: '\bWH\b', repl: 'biały'}
      - {match: '\bBK\b', repl: 'czarny'}
      - {match: '\bALU\b', repl: 'aluminiowy'}
      # - MDU = czujnik ruchu (CoreLine WL140V, BVP164 "... MDU")
      - {match: '\bMDU\b', repl: 'z czujnikiem ruchu'}
      # - naswietlacz iluminacyjny "BCP435 3000 220.-240 20 CE CQC" = 3000K, kat 20°
      - {match: '\bBCP435 (\d{4}) 220\.-240 (\d{2})\b', repl: 'BCP435 \1K \2°'}
      # "BVP110 LED42/NW" = 4200 lm; trzy-cztery cyfry ("BCP312 LED760/WW", "BBP343 LED1800/NW") to juz lumeny
      - {match: '\bLED(\d{2})/(NW|WW)\b', repl: '\g<1>00LM \2'}
      - {match: '\bLED([3-9]\d\d|\d{4})/(NW|WW)\b', repl: '\1LM \2'}  # LED100 / LED150 (BCP15x) - niejasne, bez lm
      - {match: '\bCDM Elite TMW (\d+)/', repl: 'CDM-TMW Elite \1W/'}
      - {match: '\b\d{13}\b|\b\d{8}\b', repl: ''}  # EAN / numer w nazwie statecznika
      - {match: '(?<=taśma)\?(?=przewód|taśma)', repl: '-'}  # "złączka taśma?przewód" - strzalka zgubiona w Ekonomie
      - {match: '(?<=\S)(?=MASTERColour|Ballast electrical|Starter for lighting|Kapsuły halogenowe|InfraRed)', repl: ' '}
      - {match: '(?i)\s(?:\d+\s?szt\.?\s?/\s?)?(?:Halogen metal halide|High pressure sodium|Ballast electrical|Starter for lighting|InfraRed|Kapsuły halogenowe|High voltage halogen|Zużycie energii|Skorelowana temperatura).*$', repl: ''}
      - {match: '(?i)\b\d\s?lat(?:a)?\s?gwar\w*|\s/\s?gwar\b|\bgwar\s?\d{4,5}\b', repl: ''}
      # zamiennik mocy zarowki konsumenckiej: "LED classic 40W", "PILA LED 60W", "LEDClassic 50W GU10" (moc rzeczywista z karty)
      # bez karty zostaje jako "zamiennik 60W" (`drop_with_power`), bo moc rzeczywista nieznana
      - {match: '(?i)\b(?:(?:PILA|LED) LED(?: ?CLASSIC| ?CLA| SENSOR)?|LED ?CLASSIC|LEDCLA|LED CLA) (\d{2,3})W\b', repl: 'LED EQ\1'}
      # sterownik DALI w kodzie Philips: PSD / PSD-E / PSR (PSU = bez sciemniania); PSR zostaje tez jako kod, bo
      # odroznia blizniaki PSD / PSR (decyzja 2026-11-03: wyrozniki z powtorzen)
      - {match: '\bPSD(?:-E)?\b', repl: 'DALI'}
      - {match: '\bPSR\b', repl: 'DALI PSR'}
      # Philips "LEDBulb D 4-60W", "LEDCandleD3.4-40W" - D = sciemnialna (ND = nie, DT = WarmGlow)
      - {match: '(?i)\b(LED(?:BULB|CANDLE|LUSTER|SPOT|CAPSULE)(?:LV|MV)?)\s?D(?=\s|\d)', repl: '\1 DIM '}
      # spot RS140B "LED12-36-/830" = 1200 lm, kat 36°
      - {match: '\bLED(\d{1,2})-(\d{2})-/([789]\d\d)\b', repl: '\g<1>00LM \2° \3'}
      # barwa skrotem "27K" / "40K" (PILA SL252, Color Kinetics BCP384)
      - {match: '\b(2[257]|3[05]|4[05]|5[07]|6[05])K\b', repl: '\g<1>00K'}
      - {match: '\b(N?OC)(ELB\d)\b', repl: '\1 \2'}
      # IP od strony pomieszczenia: "IP20/44" -> IP44 (karta tez podaje wyzszy)
      - {match: '\bIP20/(\d\d)\b', repl: 'IP\1'}
      # tasma "8.3/1m(37)W" = 8,3 W/m (37 W cala rolka)
      - {match: '\b(\d+(?:[.,]\d)?)/1m\(\d+(?:[.,]\d)?\)W', repl: '\1W/M'}
      # SON-T LED "3.6Klm"
      - {match: '(?i)\b(\d)[.,](\d)KLM\b', repl: '\1\g<2>00LM'}
      # swietlowki: TL-D = T8, TL5 = T5, LF (ekonomiczna liniowa) = T8
      - {match: '^((?:Świetlówka|Źródło światła).*?)\bTL-?D\b', repl: '\1T8 TL-D'}
      - {match: '^(Świetlówka.*?)\bTL5\b', repl: '\1T5 TL5'}
      - {match: '^(Świetlówka.*?)\bTL Mini\b', repl: '\1T5 TL Mini'}
      - {match: '^(Świetlówka liniowe) LF\b', repl: '\1 T8'}
      # ksztalt i klosz sklejone: "A60CL", "B35CLG", "P45FR"; CL / FR to klosz u Philipsa (u Ledvance CL = CLASSIC)
      - {match: '\b(A60|A67|B35|B38|P45|P48|G93|G120)(CLG?|FRG?)\b', repl: '\1 \2'}
      - {match: '(?<=\s)CLG?(?=\s|$)', repl: 'CLEAR'}
      - {match: '(?<=\s)FRG?(?=\s|$)', repl: 'FROSTED'}
      - {match: '(?i)\b\d+\s?szt\.?/?', repl: ''}
      - {match: '\b\d?(?:CT|SL|PF|BC|SRT)\d*/\d+(?:X\d+)?(?:BOX|F)?\b|\bUNP/\d+(?:X\d+CT)?\b|\bFAM/\d+X\d+BOX\b|\bSLV/\d+\b|\bRFSRT4\b|\bN?DSRT4\b|\b1?SRT4\b|\b1CT\b|\b1SL\b|\b1PF\b', repl: ''}
      - {match: '(?i)\bwycofany zamiennik \d{12}\b', repl: ''}
      - {match: '(?<=PSU)(?=W\d)', repl: ' '}
      - {match: '(?<=\d)(?=N?OC)', repl: ' '}
      # "LED55/740", "LED39-4S/830", "LED100S/865", "36S/840" -> lm (kod Philips = strumien / 100) i kod barwy
      - {match: '\bLED(\d{1,3})(?:-\d+)?S?-?/([789]\d\d)\b', repl: '\g<1>00LM \2'}
      - {match: '(?<![\w/])(\d{2,3})S/([789]\d\d)\b', repl: '\g<1>00LM \2'}
      # wymiary panelu "W60L60" / "W30L120" (cm)
      - {match: '\bW(\d{2,3})L(\d{2,3})\b', repl: '\g<2>0X\g<1>0 MM'}
      # panele SM136V / RC136B: "OCELB3W3" -> "OC W3 ELB3" - kod W3 / W5 przed ELB, bo "ELB3 W3" czytalo sie jako moc 3W
      - {match: '\b(N?OC)(ELB\d)', repl: '\1 \2'}
      - {match: '\b(N?OC)(W[35])\b', repl: '\1 \2'}
      - {match: '\b(ELB\d)\s?(W[35])\b', repl: '\2 \1'}
      # zamiennik mocy w nazwie katalogowej: "LEDBulb D 4-60W", "LEDcapsuleLV 1.8-20W", "ND13-100W" -> moc rzeczywista;
      # tylko w nazwach LED - "Zaplonnik 4-65W" to zakres mocy swietlowek
      - {match: '(?i)^(.*\bLED\w*\b.*?)(?<![\d.,/-])(\d{1,2}(?:[.,]\d)?)\.?-(?:15|20|25|28|30|35|40|50|60|65|75|100|120|150|200)W\b', repl: '\1\2W'}
      - {match: '\bND(?=\d)', repl: 'ND '}
      - {match: '(?<=\d)W(?=[89]\d\d\b)', repl: 'W '}
      - {match: '\bE27(?=[89]\d\d\b)', repl: 'E27 '}
      - {match: '(?<=\d)(?=[89]\d\d(?:B35|P45|A60)?CLG?\b)', repl: ' '}
    socket_rules:
      - {match: '^(?!.*\bG53\b).*\bAR111\b', socket: G53}
      # zarowki reflektorowe bez trzonka w nazwie: MR16 = GU5.3, PAR20/30/38 i R63/R80 = E27 (kontrola 2026-11-03)
      - {match: '^(?!.*\b(?:GU5[.,]3|GX5[.,]3|GU10|GU4)\b)(?:ZAROWKA|ZRODLO|SPOT|KAPSUL|REFLEKTOR).*\bMR16\b', socket: GU5.3}
      - {match: '^(?!.*\b(?:E27|E14|E40)\b)(?:ZAROWKA|ZRODLO|SPOT|REFLEKTOR).*\b(?:PAR(?:20|30S?|38)|R63|R80)\b', socket: E27}
    # Zly rodzaj w Ekonomie (stare narzedzie nazwalo swietlowki TL-D Colored / TL-E / TL Mini "Tuba LED", zarowki do
    # piekarnika "Tuba LED 26W E14") - kategoria karty rozstrzyga, nazwa = rodzaj + nazwa katalogowa z karty
    card_rename:
      - {category: 'SWIETLOWKI I ZAPLONNIKI|LAMPY SPECJALNE', name: '^TUBA LED', prefix: 'Świetlówka liniowe'}
      - {category: 'WYSOKOPREZNE', name: '^TUBA LED', prefix: 'Źródło światła'}
      - {category: 'ZAROWKI TRADYCYJNE', name: '^(?:TUBA LED|ZAROWKA SPECJALNE)', prefix: 'Żarówka tradycyjna'}
      - {category: 'OPRAWY LED PL', name: '^TUBA LED', prefix: 'Świetlówka LED'}
    # Rodzaj produktu dla surowych nazw katalogowych (bez polskiego rzeczownika na poczatku): z nazwy albo z kategorii karty
    noun_prefix:
      - {match: '^(?:MAS|MASTER|CORE ?PRO|2X COREPRO|TROJPAK)\b.*\b(?:LEDBULB|LEDLUSTER|LEDCANDLE|CANDLE|LUSTRE|LED GU10|LEDSPOT)', prefix: 'Żarówka LED'}
      - {match: '^(?:MAS|MASTER|CORE ?PRO|LEDTUBE)\b.*\bLEDTUBE\b(?! STARTER)|^LEDTUBE\b', prefix: 'Tuba LED'}
      - {match: '^MAS LED SON', prefix: 'Żarówka LED'}
      - {match: '^MASTERC?\b.*\bCDM', prefix: 'Lampa metalohalogenkowa'}
      - {match: '^(?:XI |CERTADRIVE )?LED TRANSFORMER', prefix: 'Zasilacz LED'}
      - {match: '^BSN\b', prefix: 'Statecznik'}
      - {match: '^HAL-DICH', prefix: 'Żarówka halogenowa'}
      - {match: '^LED EQ\d', prefix: 'Żarówka LED'}  # "PILA LED 50W GU5.3 WW 12V 36D" (zamiennik bez rzeczownika)
      - {match: '^UVCA', prefix: 'Oczyszczacz powietrza UVC'}
      - {match: '^LL2\d{2}[XZ]\b|^(?:RC|SM|ZCS|RS)\d{3}Z\b|^ZCS\d{3}\b|^ZXP399\b', prefix: 'Akcesorium'}
      - {match: '^HIGHBAY BY\d{3}Z', prefix: 'Akcesorium'}
      - {match: '^(?:BCP3\d{2}|BVP353)\b', prefix: 'Oprawa iluminacyjna'}
      - {match: '^PILA CEILING\b', prefix: 'Plafon'}
      - {match: '^PILA DN\d', prefix: 'Downlight'}
      - {match: '^(?:BGP|BRP)\d', prefix: 'Oprawa drogowa'}
      - {match: '^SM\d{3}[CV]\b', prefix: 'Panel nasufitowy'}
      - {match: '^RC\d{3}[BV]\b', prefix: 'Panel LED'}
      - {match: '^(?:RS\d{3}B|DN\d{3}[BC])\b', prefix: 'Downlight'}
      - {category: 'HIGH-BAY|HIGHBAY', prefix: 'Highbay'}
      - {category: 'NASWIETLACZ|PROJEKTOROWE', prefix: 'Naświetlacz LED'}
      - {category: 'DROGOWE|ULICZNE', prefix: 'Oprawa drogowa'}
      - {category: 'MIEJSKICH', prefix: 'Oprawa parkowa'}
      - {category: 'DOWNLIGHT', prefix: 'Downlight'}
      - {category: 'DO WBUDOWANIA', prefix: 'Panel LED'}
      - {category: 'NATYNKOWE', prefix: 'Panel nasufitowy'}
      - {category: 'PLAFONIER', prefix: 'Plafon'}
      - {category: 'ARCHITEKTONICZNE|ELEWAC', prefix: 'Oprawa iluminacyjna'}
    # z modelu (akcesoria, statecznik, tasmy) - marka, linia i kod rodziny ida na koniec nazwy; napiecie zasilania nic nie mowi
    noise_patterns: ['(?i)\bPhilips\b', '\bPILA\b', '(?i)\b(?:Core ?line|Ledinaire|CorePro|MASTER)\b', '\b\d{3}[.-]{1,2}\d{3}V\b',
                     '\b50(?:/60)?\s?Hz\b', '(?i)\bEcoSet LED\b',
                     '(?<![A-Z0-9-])(?:B[A-Z]P\d{3}|Z[A-Z]P\d{3}|(?:BY|RC|WT|DN|SM|BN|RS|ST|WL|LL)\d{3}[A-Z]?)(?![A-Z0-9])']
    # Kolor obudowy z karty ("Kolor Korpusu": Biel / Szary / Czarny / Aluminium) albo z nazwy (WH / BK / ALU / GR)
    housing_colors:
      bialy: {m: biały, f: biała, n: białe, match: ['BIAL', '\bBIEL\b', '\bWH\b', '\bWHITE\b']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN', '\bBK\b', '\bBLACK\b']}
      ciemnoszary: {m: ciemnoszary, f: ciemnoszara, n: ciemnoszare, match: ['CIEMNOSZAR']}
      szary: {m: szary, f: szara, n: szare, match: ['SZAR', '\bGREY\b']}
      aluminium: {m: aluminiowy, f: aluminiowa, n: aluminiowe, match: ['ALUMINI', '\bALU\b']}
    fluorescent_lengths:
      T8: {10: 45, 14: 60, 15: 45, 16: 72, 18: 60, 23: 97, 30: 90, 36: 120, 38: 105, 51: 150, 58: 150, 70: 180}
      T5: {14: 55, 21: 85, 24: 55, 28: 115, 35: 145, 39: 85, 49: 145, 54: 115, 80: 145, 73: 145, 50: 115, 25: 145, 32: 115, 45: 145}
    shape_codes:
      # kod banki przed rzeczownikiem z Ekonoma ("Kulka LED ... B35" to swieczka); BA35 = plomyk, A67 to wieksza banka
      - {match: '\bBA35\b', label: płomyk}
      - {match: '\bST35\b', label: świeczka ST35}
      - {match: '\bB3[58]\b|\bB40\b|\bCANDLE\b', label: świeczka}
      - {match: '\bP4[58]\b|\bLUSTER\b|\bLUSTRE\b', label: kulka}
      - {match: '^KULKA', label: kulka}
      - {match: '^SWIECZK', label: świeczka}
      - {match: '\bA67\b', label: A67}
      - {match: '\bA70\b', label: A70}
      - {match: '\bA60\b', label: A60}
      - {match: '\bR80\b', label: R80}
      - {match: '\bA95\b', label: A95}
      - {match: '\bT25L?\b', label: T25}
      - {match: '\bG93\b', label: globe G93}
      - {match: '\bG120\b', label: globe G120}
      - {match: '\bPAR\s?16\b|\bGU10\b', label: PAR16}
      - {match: '\bPAR\s?20\b', label: PAR20}
      - {match: '\bPAR\s?30S?\b', label: PAR30}
      - {match: '\bPAR\s?38\b', label: PAR38}
      - {match: '\bAR111\b', label: AR111}
      - {match: '\bMR\s?16\b|\bGU5[.,]3\b', label: MR16}
      - {match: '\bMR\s?11\b', label: MR11}
      - {match: '\bR39\b', label: R39}
      - {match: '\bR50\b', label: R50}
      - {match: '\bR63\b|^REFLEKTOR LED E27', label: R63}
      - {match: '\bR7S\b.*\b118\s?MM\b|\b118\s?MM\b.*\bR7S\b', label: R7s 118mm}
      - {match: '\bR7S\b.*\b78\s?MM\b|\b78\s?MM\b.*\bR7S\b', label: R7s 78mm}
      - {match: '\bG200\b', label: globe G200}
      - {match: '\bG125\b', label: globe G125}
      - {match: '\bA160\b', label: A160}
      - {match: '\bT65\b', label: T65}
      # kapsulka tylko bez gwintu E27 / E14 ("Zarowka LED G9 E27 ... 93ST" to blad Ekonoma, nie kapsulka)
      - {match: '^(?!.*\bE(?:27|14)\b).*(?:\bG4\b|\bG9\b|\bGY6[.,]35\b|^KAPSU)', label: kapsułka}
    types:
      # --- akcesoria i osprzet (przed oprawami - "Akcesorium ... Highbay", "Szyna 3C ...") ---
      # akcesorium z polskim rzeczownikiem w Ekonomie ("Ramka natynkowa do Paneli", "Kabel zasilajacy ZXP399") - bez "Akcesorium"
      - key: akcesorium_nazwane
        noun: ''
        match: ['^RAMKA', '^KABEL', '^ZASLEPKA', '^PRZYCISK', '^PILOT', '^STARTER DO TUB']
        strip_prefix: '^$'
        line_with_model: true
        attrs: [model]
      - key: akcesorium
        noun: Akcesorium
        match: ['^AKCESORIUM', '^SZYNA 3C ZRS', '^PANEL (PCV|SUSPENSION)', '^HIGHBAY BY\d{3}Z', '^SPOT LED RS\d{3}Z']
        strip_prefix: '^(?:Akcesorium|Spot LED|Highbay)\s+'
        line_with_model: true
        attrs: [model]
      - key: szyna
        noun: Szyna 3-fazowa
        gender: f
        match: ['^SZYNA 3C RCS']
        attrs: [length, color]
      - key: czujnik
        noun: Czujnik ruchu i światła
        gender: m
        match: ['^CZUJNIK']
        attrs: [ip, color]
      - key: zasilacz
        noun: Zasilacz LED
        gender: m
        match: ['^ZASILACZ', 'LED TRANSFORMER']
        attrs: [driver, voltage]
        required: [driver]
      - key: statecznik_hid
        noun: Statecznik magnetyczny
        gender: m
        match: ['^(?:OSPRZET |STATECZNIK (?:SODOWY |DO LAMP SODOWYCH )?)?(?:BSN|BHL|BHD|BMH)\b', '^STATECZNIK.*\bBSN\b']
        strip_prefix: '^(?:Osprzęt|Statecznik(?: sodowy| do lamp sodowych)?)\s+'
        attrs: [model]
      - key: statecznik
        noun: Statecznik elektroniczny
        gender: m
        match: ['^(?:OSPRZET|STATECZNIK)\b.*\b(?:HF-|HID-PV|HID-DV)', '^STATECZNIK']
        strip_prefix: '^(?:Osprzęt|Statecznik(?: elektroniczny)?)\s+'
        attrs: [model]
      - key: zaplonnik
        noun: Zapłonnik
        gender: m
        match: ['^ZAPLONNIK', '^UKLAD ZAPLONOWY', '^STARTER S', '^OSPRZET (?:SI|SN|SND|SKD|CSLS)\b']
        strip_prefix: '^(?:Zapłonnik|Układ zapłonowy|Starter|Osprzęt)\s+'
        attrs: [model]
      # --- zrodla swiatla ---
      - key: kompakt_led
        noun: Świetlówka kompaktowa LED
        gender: f
        match: ['^(?:TUBA|SWIETLOWKA) LED\b.*\b(?:PL-?[CLST]|PLC|PLL|G24|2G11|2G7|G23)\b', '^TUBA LED \d{2}[.,]\dCM\b', '^TUBA LED 1\d[.,]\dCM']
        features: &pl_types
          - {match: '\bPL-?([CLSTQR])\b|\bPL([CLS])\b', label: 'PL-{0}{1}', group: pl}
          - {match: '\b([24])P\b', label: '{0}-pin', group: pin}
        attrs: [features, gwint, power, lumen, cct, tube_supply]
        required: [power, cct]
      - key: tuba
        noun: Tuba LED
        gender: f
        match: ['^TUBA LED', '^LEDTUBE']
        attrs: [tube_type, tube_length, power, lumen, cct, tube_supply, dim]
        required: [power, lumen, cct]
      - key: swietlowka_uv
        noun: Świetlówka
        gender: f
        params_skip: [power]
        match: ['\bTUV\b', '\bACTINIC\b', '\bBLB\b']
        features:
          - {match: '\bPL-?S\b', label: PL-S, group: pl}
          - {match: '\bTUV\b|BAKTERIOB', label: bakteriobójcza UV-C, group: uv}
          - {match: '\bACTINIC\b|OWADOB', label: UV-A owadobójcza, group: uv}
          - {match: '\bBLB\b', label: UV-A czarne światło, group: uv}
        attrs: [features, tube_type, gwint, power]
      - key: swietlowka_liniowa
        noun: Świetlówka
        gender: f
        params_skip: [power]
        match: ['^SWIETLOWKA LINIOWE', '^SWIETLOWKA T\d', '^ZRODLO SWIATLA T8 TL-D']
        features:
          - {match: '\bCOLOU?RED\b.*\bGREEN\b', label: zielona, group: c}
          - {match: '\bCOLOU?RED\b.*\bRED\b', label: czerwona, group: c}
          - {match: '\bCOLOU?RED\b.*\bBLUE\b', label: niebieska, group: c}
          - {match: '\bCOLOU?RED\b.*\bYELLOW\b', label: żółta, group: c}
          - {match: '\bTL5 CIRCULAR\b|\bTL5C\b', label: kołowa, group: k}
          - {match: '\bTL-?E\b', label: kołowa T9, group: k}
          - {match: '\bFOOD\b', label: do żywności}
          - {match: '\bTL-X XL\b', label: TL-X XL}
          - {match: '\bTL MINI\b', label: Mini, group: k}
          - {match: '\bHE\b', label: HE, group: k}
          - {match: '\bHO\b', label: HO, group: k}
          - {match: '\bSUPER 80\b', label: Super 80}
          - {match: '\b90 DE LUXE\b', label: De Luxe}
          - {match: '\bGRAPHICA\b', label: Graphica}
          - {match: '\bSECURA\b', label: Secura}
          - {match: '\bECO\b', label: Eco}
          - {match: '\bXTRA\b', label: Xtra}
          - {match: '\bXTREME\b', label: Xtreme}  # TL-D Xtreme (dluga zywotnosc) - kontrola 2026-11-03
        attrs: [tube_type, tube_length, power, cct, features]
        required: [power, cct]
        required_unless: {cct: '\bCOLOU?RED\b'}  # TL-D Colored - kolor swiatla zamiast barwy
      - key: kompakt
        noun: Świetlówka kompaktowa
        gender: f
        params_skip: [power]
        match: ['^SWIETLOWKA KOMPAKTOWE NIEZINTEGROWANE', '\bPL-?[CLSTQR]\b']
        features: *pl_types
        attrs: [features, gwint, power, cct]
        required: [power, cct]
      - key: kompakt_zintegrowana
        noun: Świetlówka kompaktowa
        gender: f
        params_skip: [power]
        match: ['^SWIETLOWKA KOMPAKTOWE ZINTEGROWANE']
        features:
          - {match: '\bTORNADO\b', label: Tornado}
          - {match: '\bHIGH LUMEN\b', label: High Lumen}
        attrs: [gwint, power, cct, features]
        required: [gwint, power]
      - key: sodowa
        noun: Lampa sodowa
        gender: f
        match: ['SODOWA', '\bSON\b', '\bSDW\b']
        exclude: ['^ZAROWKA LED']
        features: &hid_models
          - {match: '\b(CDM-(?:TMW|TC|TD|TP|TM|T|R111|RM|R|E|SA/T)|CDO-(?:TT|ET)|CPO-TW|MHN-(?:TD|FC|SE|LA|SA|SB)|HPI-T|HPI|SON-T|SON|SDW-TG|SDW-T)\b', label: '{0}', group: model}
          - {match: '\bPIA\b', label: PIA}
          - {match: '\bELITE\b', label: Elite}
          - {match: '\bMINI\b', label: Mini}
          - {match: '\bPLUS\b', label: Plus}
          - {match: '\bXTRA\b', label: Xtra}
          - {match: '\bMW ?ECO\b', label: MW Eco}
        attrs: [features, hid_power, gwint, cct]
        required: [hid_power]
      - key: metalohalogenkowa
        noun: Lampa metalohalogenkowa
        gender: f
        match: ['METALOHALOGEN', 'METAHALOGEN', '^LAMPA MET\b', '\bCDM', '\bCDO', '\bCPO', '\bMHN', '\bHPI', '^ZRODLO SWIATLA', '^LAMPY WYLADOWCZE']
        exclude: ['^ZAROWKA LED', '\bIR\b', '\bTL-?D\b']
        features: *hid_models
        # kat lamp reflektorowych CDM-R / CDM-R111 / CDM-Rm ("10D" / "40D") za barwa
        features_post:
          - {match: '(?<![\d.,])(\d{2})°', label: '{0}°'}
        attrs: [features, hid_power, gwint, cct, features_post]
        required: [hid_power]
      - key: promiennik
        noun: Promiennik podczerwieni
        gender: m
        match: ['^PROMIENNIK', '^ZRODLO SWIATLA .*\bIR\b']
        features:
          - {match: '\bRED\b|CZERWO', label: czerwony}
        attrs: [gwint, power, shape, features]
        required: [power]
      - key: zarowka_tradycyjna
        noun: Żarówka tradycyjna
        gender: f
        params_skip: [power]
        match: ['^ZAROWKA TRADYCYJNA']
        features:
          - {match: '\bOV\b', label: do piekarnika}
          - {match: '\bT(17|22|25)\b', label: 'T{0}'}
        attrs: [gwint, power, voltage, features]
        required: [power]
      - key: halogen
        noun: Żarówka halogenowa
        gender: f
        params_skip: [power]
        match: ['HALOGEN(?!.*\bLED\b)', 'HAL-DICH', '^ZAROWKA SPECJALNE']
        features:
          - {match: '\bOV\b|PIEKARN', label: do piekarnika}
          - {match: '\b(78|118)\s?MM\b', label: '{0}mm'}
        attrs: [gwint, power, voltage, features]
        required: [power]
      - key: tasma
        noun: Taśma LED
        gender: f
        match: ['^TASMA LED']
        params_skip: [power]
        attrs: [strip_length, power, lumen, cct, voltage]
        required: [power]
      - key: oczyszczacz
        noun: Oczyszczacz powietrza UVC
        gender: m
        match: ['UVCA']
        attrs: [model]
      - key: zarowka_led
        noun: Żarówka LED
        gender: f
        match: ['^ZAROWKA LED', '^KULKA LED', '^SWIECZK', '^KAPSUL', '^ZRODLO REFLEKTOROWE', '^REFLEKTOR LED', '^HALOGEN LED',
                'LEDSPOT\b', '\bAR111\b',
                '^LINIOWE LED', '^LEDOWE ZAMIENNIKI', '^ZAROWKA METAHALOGEN']
        cct_words:
          - {match: '\bWW\b', label: 2700K}
          - {match: '\bCW\b', label: 4000K}
        drop_with_power: 'zamiennik \d+W'
        features:
          - {match: '\bEQ(\d+)\b', label: 'zamiennik {0}W'}
          - {match: '\bDT\b|DIMTONE|WARM ?GLOW', label: WarmGlow}
          - {match: '\bTFORCE\b|SON-T|ZAMIENNIKI LAMP WYLADOWCZYCH', label: zamiennik HID}
          # kod barwy 9xx / "CRI95" - wysoki wspolczynnik oddawania barw (decyzja 2026-11-03: wyrozniki z powtorzen)
          - {match: '\bCRI ?(9\d)\b', label: 'CRI {0}', group: cri}
          - {match: '(?<![\d/.,])9(?:22|25|27|30|40)(?![\d.,])', label: CRI 90, group: cri}
        attrs: [gwint, power, lumen, cct, shape, beam, glass, dim, features]
        required: [gwint, power, lumen, cct]
      # --- oprawy ---
      - key: naswietlacz
        noun: Naświetlacz LED
        gender: m
        match: ['^NASWIETLACZ']
        features:
          - {match: '(?<![\d.,])(\d{2})°', label: '{0}°', group: beam}  # BCP435 "20" / "40"
        # optyka z nazwy albo z nazwy katalogowej karty (`features_card_name`): SWB / AWB / NB / WB, kod projektora OFA52;
        # skrot "opt. sym." / "opt. asym." blizej konca nazwy - za kolorem, przed marka (wytyczne 2026-11-04)
        features_post:
          - {match: '\bSWB\b', label: opt. sym., group: opt}
          - {match: '\bAWB\b', label: opt. asym., group: opt}
          - {match: '\bNB\b', label: opt. wąska, group: opt}
          - {match: '\bWB\b', label: opt. szer., group: opt}
          - {match: '\b(OFA\d{2})\b', label: 'opt. {0}', group: opt}
          - {match: '\sA(?:\s|$)', label: opt. asym., group: opt}  # BVP110 "... NW A"
          - {match: '\sS(?:\s|$)', label: opt. sym., group: opt}
        attrs: [power, lumen, cct, ip, features, sensor, control, color, features_post]
        required: [power, lumen, cct]
      - key: high_bay
        noun: Oprawa High Bay LED
        gender: f
        match: ['^HIGHBAY', '^HIGH BAY']
        # optyka skrotem na koncu, przed marka - jak w naswietlaczach (wytyczne 2026-11-04)
        features:
          - {match: '\bNB\b', label: opt. wąska, group: opt}
          - {match: '\bWB\b', label: opt. szer., group: opt}
        attrs: [power, lumen, cct, ip, control, sensor, features]
        required: [power, lumen, cct]
      # optyka drogowa kodem producenta (jak Ledvance "opt. RV20ST") i klasa ochronnosci I / II - blizniaki tej samej mocy
      - key: uliczna
        noun: Oprawa uliczna LED
        gender: f
        match: ['^OPRAWA DROGOWA']
        features: &street_features
          - {match: '\b(D[MSWXNA]\d{0,2})\b', label: 'opt. {0}', group: opt}
          - {match: '\bII\b', label: klasa II, group: cls}
          - {match: '\bI\b', label: klasa I, group: cls}
        attrs: [power, lumen, cct, ip, features, control]
        required: [power, lumen, cct]
      - key: parkowa
        noun: Oprawa parkowa LED
        gender: f
        match: ['^OPRAWA PARKOWA']
        features: *street_features
        attrs: [power, lumen, cct, ip, features, control]
        required: [power, lumen, cct]
      - key: slupek
        noun: Słupek oświetleniowy LED
        gender: m
        match: ['^SLUPEK']
        # kod barwy WW / NW w nazwie ("LED760/WW") - karty PDF tych opraw: WW = 3000 K, NW = 4000 K (2026-11-03)
        cct_words: &ww_nw
          - {match: '\bWW\b', label: 3000K}
          - {match: '\bNW\b', label: 4000K}
        attrs: [power, lumen, cct, ip, color]
        required: [power, cct]
      - key: najazdowa
        noun: Oprawa najazdowa LED
        gender: f
        match: ['^OPRAWA WBUDOWANA W ZIEMIE']
        cct_words: *ww_nw
        features:
          - {match: '(?<![\d.,])(\d{2})°', label: '{0}°', group: beam}
        attrs: [power, lumen, cct, ip, features, color]
        required: [power, cct]
      - key: iluminacyjna
        noun: Oprawa iluminacyjna LED
        gender: f
        match: ['ILUMINAC', '^OPRAWA DO ILUMINACJI']
        attrs: [length, power, lumen, cct, ip, control, color]
        required: [power, cct]
      - key: linia_swietlna
        noun: Linia świetlna LED
        gender: f
        match: ['^LINIA SWIETLNA']
        # okablowanie szyny nosnej (5x1,5 / 7x2,5), optyka (WB / NB / O / BV) i wersja HE
        features:
          - {match: '\b(WB|NB|BV|O)\b', label: 'opt. {0}', group: opt}
          - {match: '\b([579])X(1[.,]5|2[.,]5)\b', label: 'przewody {0}x{1}', group: cab}
          - {match: '\bHE\b', label: HE}
        params_keep_name: [length]
        attrs: [length, power, lumen, cct, control, features]
        required: [power, lumen, cct]
      - key: hermetyczna_tuby
        noun: Oprawa hermetyczna pod tubę LED
        gender: f
        match: ['^OPRAWA HERMETYCZNA\b.*TLED\b']
        params_keep_name: [length]
        attrs: [length, ip]
      - key: hermetyczna
        noun: Oprawa hermetyczna LED
        gender: f
        match: ['^OPRAWA HERMETYCZNA', '^PROMOWAGO WT']
        params_keep_name: [length]
        attrs: [length, power, lumen, cct, ip, control, sensor]
        required: [power, lumen, cct]
      - key: belka
        noun: Belka LED
        gender: f
        match: ['^BELKA']
        params_keep_name: [length]
        attrs: [length, power, lumen, cct, ip, control]
        required: [power, lumen, cct]
      - key: panel_nasufitowy
        noun: Panel LED nasufitowy
        gender: m
        match: ['^PANEL NASUFITOWY', '^OPRAWA BIUROWA (?:NABUDOWANA|ZWIESZANA)']
        # oslona OC / NOC (kod Philips), generacja G4 / G5, modul awaryjny ELB3 = 3 h
        features: &panel_features
          - {match: '\b(N?OC)\b', label: '{0}', group: oc}
          - {match: '\bG([3-6])\b', label: 'G{0}', group: gen}
          - {match: '\bELB(\d)\b', label: 'awaryjna {0}h', group: em}
        params_keep_name: [panel_size]
        attrs: [panel_size, power, lumen, cct, ugr, control, features]
        required: [power, lumen, cct]
      - key: panel
        noun: Panel LED
        gender: m
        match: ['^PANEL', '^OPRAWA BIUROWA', '^PROMOWAGO RC']
        features: *panel_features
        attrs: [panel_size, power, lumen, cct, ugr, control, features]
        required: [power, lumen, cct]
      - key: szynowa
        noun: Reflektor szynowy LED
        gender: m
        match: ['^PROJEKTOR DO SZYNY']
        attrs: [power, lumen, cct, ugr, color]
        required: [power, lumen, cct]
      - key: downlight
        noun: Downlight LED
        gender: m
        match: ['^DOWNLIGHT', '^OPRAWA DOWNLIGHT', '^SPOT LED']
        # kat (36ST / "LED12-36-"), oslona C / WR (DN140B), wersja HALOX, sterownik PSR obok PSD
        features:
          - {match: '(?<![\d.,])(\d{2})°', label: '{0}°', group: beam}
          - {match: '\b(C|WR)\b', label: 'opt. {0}', group: opt}
          - {match: '\bHALOX\b', label: HALOX}
        attrs: [round, diameter, power, lumen, cct, ip, ugr, features, control, color]
        required: [power, lumen, cct]
      - key: plafon
        noun: Plafon LED
        gender: m
        match: ['^PLAFON']
        attrs: [power, lumen, cct, ip, sensor, color]
        required: [power, lumen, cct]
      # --- reszta: nazwa z Ekonoma bez zmian rzeczownika ---
      - key: inne
        noun: ''
        match: ['.']
        strip_prefix: '^$'
        attrs: [model]

  # ===================================================================== Elgotech
  # Wejscie: katalog z zestawieniami Ekonoma (input/Nazwy Ekonom/Elgotech): "katalog" w ukladzie Ekonoma, "karto" =
  # nowe kartoteki jako "<40> | <reszta>". Prawie same przedluzacze - schemat V3
  # (archived_input_files/input_2026-11-10/schemat nazwy przedłużaczy V3.xlsx), jak Kobi / Bemko / GTV:
  # domowe: gniazda (+ USB), dlugosc, przekroj, [guma], uziemienie / Schuko / bez uziemienia, wylacznik, [kolor],
  # nazwa wlasna (Classic / Economic), marka; bebnowe: gniazda, dlugosc, przekroj, material, IP, uziemienie,
  # nazwa wlasna (Mini / Maxi), marka. Kod producenta z nazwy jest wycinany (`strip_code`).
  # Zapis Elgotech: z/u = z uziemieniem, b/u = bez uziemienia, 2P+Z = gniazdo z bolcem (z uziemieniem), "unischuko"
  # = wtyczka pasujaca do obu gniazd (to nie gniazdo Schuko); koncowka kodu -2 czarny, -3 brazowy, -7 zielony,
  # -9 szary; bebnowe Y = przewod PVC, G = guma (H05RR / H07RN), BQ = H07BQ-F (PUR, olejo- i mrozoodporny).
  elgotech:
    brand: Elgotech
    brand_last: true
    strip_code: true
    capitalize_first: true
    # Katalog PDF Elgotech (scripts/extract_elgotech_catalog.py, 609 z 1254 kodow): przekroj i kolor, ktorych krotka
    # nazwa w Ekonomie nie podaje ("Przedłużacz 3xz/u 3m" = "3x1 mm2 biały"); kolor sprzeczny z nazwa = DO_SPRAWDZENIA
    catalog_rows: cache/elgotech/katalog_wiersze.json
    catalog_label: Elgotech
    catalog_cross_types: [przedluzacz, przedluzacz_przeciwprzepieciowy, przedluzacz_bebnowy, przewod]
    # tabela katalogu podaje "biały", a zdjecie i probka koloru (s. 127) - czarno-czerwony, jak nazwa w Ekonomie
    catalog_color_skip: [R-20BS-24]
    name_cleanup:
      - '(?i)\bELGOTECH\b'
      # "4xIP-44" (bez granicy slowa przed IP); przed wycinaniem kodu z konca, ktore zjadaloby "IP-44"
      - {match: '(?i)IP-(\d\d)\b', repl: 'IP\1'}
      # "... Classic PSN-403-1,5-2" / "... biały R-10F" - kod (czasem inny niz w Ekonomie) na koncu dlugiej nazwy
      - {match: '\s+[A-Z][A-Z0-9]{0,5}-[\w,/-]*\d[\w,/-]*$', repl: ''}
      - {match: '(?i)mm\?', repl: 'mm2'}
      - {match: '(?i)(\d),(\d)0\s?mb\b', repl: '\1,\2m'}
      - {match: '(?i)(\d)\s?mb\b', repl: '\1m'}
      - {match: '(?i)\b(H0[57][A-Z]{2})(?=\d)', repl: '\1 '}
      - {match: '(?i)(\d)(GUMA)\b', repl: '\1 \2'}
      - {match: '(?i)\bH05RR\.-F\b', repl: 'H05RR-F'}
      - {match: '(?i)\b(\d)\.-krotn', repl: '\1-krotn'}
      # "1x2P.+Z", "2x2P+Zczarny250V~"
      - {match: '(?i)(?<=\d)P\.\+Z', repl: 'P+Z'}
      - {match: '(?i)(?<=\d)P\+Z(?=[a-z])', repl: 'P+Z '}
      - {match: '(?i)\bczar(?:my|nt|nyy|n)\b', repl: 'czarny'}
      - {match: '(?i)\b(czarny)(?=\d)', repl: '\1 '}
      - {match: '(?i)\bcztekrotne\b', repl: 'czterokrotne'}
      - {match: '(?i)\bPzewód\b', repl: 'Przewód'}
      - {match: '(?<=\dx)(\d),0(?=mm)', repl: '\1'}
    noun_overrides:
      # dzial katalogu "Przedłużacze ogrodowe": PK-10 / PK-10-1,5 / PS-10-5 / PS-10-5-1,5 (pomaranczowy przewod)
      - {code_match: '^(?:PK-10\d\d|PS-10\d\d-5)\b', noun: Przedłużacz ogrodowy, gender: m, types: [przedluzacz]}
      - {match: 'SPIRALN', noun: Przedłużacz spiralny, gender: m, types: [przedluzacz]}
      - {match: 'ZWIJANY', noun: Przedłużacz zwijany, gender: m, types: [przedluzacz]}
      - {match: 'SZPIC|OGRODOW', noun: Przedłużacz ogrodowy, gender: m, types: [przedluzacz]}
      - {match: 'PRZEMYSLOW', noun: Przedłużacz przemysłowy, gender: m, types: [przedluzacz]}
      - {match: 'PRZECIWPRZEP', noun: Rozgałęźnik przeciwprzepięciowy, gender: m, types: [rozgaleznik]}
      - {match: 'ZWIJAKA', noun: Gniazdo do zwijaka bębnowego, gender: n, types: [gniazdo]}
      - {match: 'KOMPUTER', noun: Przewód komputerowy, gender: m, types: [przewod]}
      - {match: 'BAWELN.*NASADK', noun: Przewód w oplocie bawełnianym z nasadką grzejną, gender: m, types: [przewod]}
      - {match: 'BAWELN', noun: Przewód w oplocie bawełnianym z wtyczką, gender: m, types: [przewod]}
    housing_colors:
      czarno_czerwony: {m: czarno-czerwony, f: czarno-czerwona, n: czarno-czerwone, match: ['CZARNO-CZERWON']}
      transparentny: {m: transparentny, f: transparentna, n: transparentne, match: ['TRANSPARENT']}
      zloty: {m: złoty, f: złota, n: złote, match: ['\bZLOT[YAE]\b']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['SREBRN']}
      brazowy: {m: brązowy, f: brązowa, n: brązowe, match: ['\bBRAZ']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN']}
      bialy: {m: biały, f: biała, n: białe, match: ['\bBIAL[YAE]\b']}
      szary: {m: szary, f: szara, n: szare, match: ['\bSZAR[YAE]\b']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['ZIELON']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['NIEBIESK']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['CZERWON']}
      pomaranczowy: {m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['POMARANCZ']}
    # kolor przewodu bebna to nie kolor produktu
    color_ignore: ['PRZEWOD (?:GUMOWY )?(?:CZARNY|NIEBIESKI|CZERWONY)']
    # wersja kolorystyczna tylko w kodzie: "WT-20S-2" (nazwa jak "WT-20S"), "R-12-2", "GP2C-2"
    # Kolor jest koncowka po co najmniej jednym czlonie modelu ("GN-30-2", "R-12-2"); "GN-2" / "GO-3" to liczba gniazd.
    code_colors:
      - {code: '^(?:GP2C|WTP2C)-2$', color: czarny}
      # przedluzacze ogrodowe PK-10 i PS-10-5 maja w katalogu pomaranczowy przewod (zdjecia, s. 47); "PK-1020-7" -
      # zielony (koncowka -7 jak "PS-13-7 ZIELONY", "OSŁONA-7 zielona"), w katalogu go nie ma
      - {code: '^(?:PK|PS)-\d{4}-7(?:-|$)', color: zielony}
      - {code: '^(?:PK-10\d\d(?:-1,5)?|PS-10\d\d-5(?:-1,5)?)$', color: pomaranczowy}
      - {code: '^(?:WT|GN|GO|GS|G|RO|RC|RT|R|EPS|PSN|PSF\w*|MPS\w*|PSU)(?:-[\w,]+)+-2$', color: czarny}
      - {code: '^(?:WT|GN|GO|GS|G|RO|RC|RT|R|EPS|PSN|PSF\w*|MPS\w*|PSU)(?:-[\w,]+)+-3$', color: brazowy}
      - {code: '^(?:WT|GN|GO|GS|G|RO|RC|RT|R|EPS|PSN|PSF\w*|MPS\w*|PSU)(?:-[\w,]+)+-7$', color: zielony}
      - {code: '^(?:WT|GN|GO|GS|G|RO|RC|RT|R|EPS|PSN|PSF\w*|MPS\w*|PSU)(?:-[\w,]+)+-9$', color: szary}
    # Kod przeczy nazwie - nazwy nie poprawiamy, wiersz do sprawdzenia:
    # bebny "PZBX2S-1111-60BQ" (60m) z nazwa "45m"; domowe <gniazda>[0 = z uziemieniem]<dlugosc>: "PSN-407-1,5" = 7m,
    # a nazwa mowi 6m
    code_checks:
      - {code: '^[PS]\w*-.*-(\d{2})(?:Y|G|BQ|GH07|H05)\b', name: '\b{0}M\b', label: 'dlugosc {0}m'}
      # przeciwprzepieciowe: koncowka 1 = 1,5m ("PSF4-401 1,5m"), 3 / 5 / 10 = metry
      - {code: '^M?PSF\w*-\d01(?:-|$)', name: '(?<![\d,])1,50?\s?MB?\b', label: 'dlugosc 1,5m'}
      - {code: '^M?PSF\w*-\d0(3|5|10)(?:-|$)', name: '(?<![\d,X]){0}\s?MB?\b', label: 'dlugosc {0}m'}
      - {code: '^(?:EPS|PSN|PSU|PSK|MPS|PSCH|PSS|EPU|PS)-\d0?(\d{1,2}(?:,5)?)(?=[WG]|-|$)',
         name: '(?<![\d,X]){0}\s?M(?!M)|(?<![\d,X]){0}0\s?MB|(?<![\d,X]){0}$', label: 'dlugosc {0}m'}
    feature_sets:
      gn:
        # "2xgn.jednofaz.,1xgn.siłowe", "2xIP-44,1xsił." - gniazda 230V i siłowe
        - {match: '\b(\d)\s?X\s?(?:GN\.?\s?)?(?:JEDNOFAZ\w*\.?|IP\d\d)[\s,.]*(?:Z/U\s?)?,?\s?(\d)\s?X\s?(?:GN\.?\s?)?SIL', label: '{0} gn. + {1} gn. siłowe', group: gn}
        - {match: '\b(\d)\s?X\s?GN\.?\s?TROJFAZ', label: '{0} gn. siłowe', group: gn}
        - {match: '\b(\d)\s?X\s?SILOWE', label: '{0} gn. siłowe', group: gn}
        - {match: '\b(\d)\s?X\s?(?:Z/U|B/U|B/Z|Z/Z|2P|GN|IP\d\d|\bZ UZIEM)', label: '{0} gn.', group: gn}
        - {match: '\b(\d)-KROTN', label: '{0} gn.', group: gn}
        - {match: '\b(\d)\s?GN\b', label: '{0} gn.', group: gn}
        - {match: '\b(\d)\s?GNIAZD', label: '{0} gn.', group: gn}
        - {match: '\bJEDNOKROTN', label: '1 gn.', group: gn}
        - {match: '\bDWUKROTN', label: '2 gn.', group: gn}
        - {match: '\bTRZYKROTN', label: '3 gn.', group: gn}
        - {match: '\bCZTEROKROTN', label: '4 gn.', group: gn}
        - {match: '\bPIECIOKROTN', label: '5 gn.', group: gn}
        - {match: '\bSZESCIOKROTN', label: '6 gn.', group: gn}
        - {match: '\b(\d)\s?X\b', label: '{0} gn.', group: gn}
        # "Przedłużacz PK-1010 bez uziemienia, przew. 2x1mm? 10m" - 1 gniazdo (kartoteka "PS-1010 Przedłużacz 1xz/u 10m")
        - {code_match: '^(?:PK|PS)-10(?:10|15|20|25|30)(?:-|$)', label: '1 gn.', group: gn}
      usb:
        - {match: 'USB A\s?\+\s?C', label: '+ USB A+C', group: usb}
        - {match: '\b(\d)\s?X\s?LADOWARK\w* USB', label: '+ {0}xUSB', group: usb}
        - {match: '\bUSB\b', label: '+ USB', group: usb}
      len:
        - {match: '(?<![\d,X/])(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
      # "Przedłużacz 1xb/u, CZARNY 1,5" - dlugosc bez jednostki na koncu
      len_bare:
        - {match: '(?<![\d,X/])(\d(?:,\d)?)$', label: '{0}m', group: len}
      cross:
        - {match: '\b([235])\s?[XG]\s?(\d(?:,\d+)?)(?!\d|,\d|\s?P|\s?X)', label: '{0}x{1}mm2', group: cross}
      # H07RN-F (ciezka guma, olejo- i mrozoodporna) obok H05RR-F tego samego bebna ("PSPZ1-12-20" / "SPZ1-12-2,5-20G",
      # "PZBX-1111-40GH07" / "PZBX-1111-40G") - jedyna roznica w nazwie z Ekonoma, wiec typ przewodu za "guma"
      cable:
        - {match: '\bH07BQ', label: PUR, group: cable}
        - {match: '\bH07RN', label: guma H07RN-F, group: cable}
        - {match: 'GUM|\bH05RR', label: guma, group: cable}
        - {match: '\bPVC\b|\bOMY\b|\bH05VV', label: PVC, group: cable}
        - {code_match: '\d{2}Y(?:/[\d,]+)?$', label: PVC, group: cable}
      # domowe: PVC jest domyslny - w nazwie tylko guma / PUR
      cable_extra:
        - {match: '\bH07BQ', label: PUR, group: cable}
        - {match: '\bH07RN', label: guma H07RN-F, group: cable}
        - {match: 'GUM|\bH05RR', label: guma, group: cable}
      # gniazdo silowe 16A / 32A tylko w kodzie ("SP5-16-2,5-10" / "SP5-32-2,5-10")
      amp_code:
        - {code_match: '^SP5-(\d{2})-', label: '{0}A'}
      ip:
        - {match: '(IP[2-6]\d)\b', label: '{0}', group: ip}
      # "BEZ UZIEMIENIA" zawiera "Z UZIEM" - stad \b
      earth:
        - {match: '(?<!UNI)SCHUKO', label: Schuko, group: earth}
        - {match: 'B/U|B/Z|BEZ UZIEM|\b\dX2P\b(?!\+)', label: bez uziemienia, group: earth}
        - {match: 'Z/U|Z/Z|\bZ UZIEM|2P\+Z', label: z uziemieniem, group: earth}
      switch:
        - {match: '\b(\d) WYLACZ', label: 'z {0} wyłącznikami', group: sw}
        - {match: 'WYL\.?\s?NADP', label: z wyłącznikiem nadprądowym, group: sw}
        - {match: 'PRZELACZNIK', label: z przełącznikiem, group: sw}
        - {match: '\bWYL|\bWLACZ', label: z wyłącznikiem, group: sw}
      # nazwa wlasna (linia Elgotech): EPS = Economic, PSN = Classic (tak podaja dlugie nazwy w Ekonomie)
      line:
        - {match: '\bCLASSIC\b', label: Classic, group: line}
        - {match: '\bECONOMIC\b', label: Economic, group: line}
        - {code_match: '^EPS', label: Economic, group: line}
        - {code_match: '^PSN', label: Classic, group: line}
      drum_size:
        - {match: 'PRZEMYSLOW', label: przemysłowy}
        - {match: '\bMALY\b', label: mały, group: size}
        - {match: '\bDUZY\b', label: duży, group: size}
        - {code_match: '^P?SPZD', label: duży, group: size}
        # PZB1 = maly beben (nazwy wersji "Y" mowia MAŁY, wersje gumowe "G" juz nie)
        - {code_match: '^PZB1-', label: mały, group: size}
        - {match: 'METALOW', label: metalowy, group: metal}
        # katalog s. 14: PZB-1111-xxG to "Przedłużacze bębnowe metalowe IP44" (bęben 328 mm), PZB-1111C1 - z tworzywa
        - {code_match: '^PZB-1111-\d', label: metalowy, group: metal}
    types:
      - key: przedluzacz_bebnowy
        noun: Przedłużacz bębnowy
        gender: m
        match: ['^PRZED\w*\.?\s?(?:PRZEMYSLOWY\s|ZWIJANY\s)?BEB']
        trusted: true
        features_pre: [drum_size]
        features: [gn, len, cross, cable, ip, earth]
        features_name:
          - {match: '\bMINI\b', label: Mini}
          - {match: '\bMAXI\b', label: Maxi}
        attrs: [features_pre, features, features_name]
      - key: zwijak
        noun: Zwijak bębnowy
        gender: m
        match: ['^ZWIJAK']
        trusted: true
        features_pre: [drum_size]
        features: [gn, ip, earth]
        features_post:
          - {match: 'ADAPTOR,\s?NAWIJAK', label: z adapterem i nawijakiem, group: acc}
          - {match: 'ADAPTOR', label: z adapterem do nawijania, group: acc}
        attrs: [features_pre, features, features_post]
      - key: przedluzacz_przeciwprzepieciowy
        noun: Przedłużacz przeciwprzepięciowy
        gender: m
        match: ['^PRZED.*PRZECIW(?:PRZEP|ZAKL)', '^LISTWA DO KOMP']
        trusted: true
        features: [gn, usb, len, cross, earth, switch]
        features_post:
          - {match: 'PRZECIWZAKL', label: z filtrem}
          - {match: 'Z RESETEM', label: z resetem}
        # nazwa wlasna = model z katalogu ("PSF 3", "PSF 4", "MPSFU"): ta sama nazwa w Ekonomie, inna ochrona -
        # PSF3 tylko przeciwprzepieciowa, PSF4 / PSF2 tez przeciazeniowo-zwarciowa, PSF tez filtr, MPSFU warystor,
        # MPSF2U uklad hybrydowy
        features_name:
          - {code_match: '^(M?PSF\w*?)-', label: '{0}'}
        attrs: [features, features_post, color, features_name]
      - key: przedluzacz
        noun: Przedłużacz
        gender: m
        match: ['^PRZED']
        trusted: true
        # "PSZ-306 Przedłużacz zwijany 3xz/u, MAŁY 6m"
        features_pre:
          - {match: '\bMALY\b', label: mały}
        features: [gn, amp_code, usb, len, len_bare, cross, cable_extra, ip, earth, switch]
        features_post:
          - {match: 'SZPIC\w* I NAWIJAK', label: ze szpicem i nawijakiem, group: acc}
          - {match: 'SZPIC', label: ze szpicem, group: acc}
        features_name: [line]
        attrs: [features_pre, features, features_post, color, features_name]
      - key: rozgaleznik
        noun: Rozgałęźnik
        gender: m
        match: ['^ROZGAL']
        trusted: true
        features_pre:
          # bez "2xgn płaskie, 1xgn okrągłe" / "2xz/u okrągłe, 1xgn płaskie" - tam rodzaj gniazd jest przy liczbie
          # "gniazda okrągłe" (R-30-2, R-20CU) to rodzaj gniazd, nie okragla obudowa jak RO-30
          - {match: '(?<!GN )(?<!GNIAZDA )OKRAGL(?![EY]?,? \d\s?X)', label: okrągły}
          # ksztalt ze zdjec katalogu (s. 124-125): RT-30CA gniazda w trojkacie, R-20CA / R-30CA / R-40CA w jednym
          # rzedzie; R-30 to klasyczna kostka (bez dopisku)
          - {code_match: '^RT-', label: trójkątny}
          - {code_match: '^R-\d0CA$', label: płaski}
        features:
          - {match: '\b(\d)\s?X\s?GN\.? PLASKIE,? (\d)\s?X\s?GN\.? OKRAGLE', label: '{0} gn. płaskie + {1} gn. okrągłe', group: gn}
          # "2xz/u okrągłe, 1xgn płaskie b/u" - uziemienie maja tylko gniazda okragle
          - {match: '\b(\d)\s?X\s?Z/U OKRAGLE,? (\d)\s?X\s?GN\.? PLASKIE', label: '{0} gn. okrągłe z uziemieniem + {1} gn. płaskie', group: gn}
          - {match: '\b\d\s?X\s?Z/U OKRAGLE,? \d\s?X\s?GN\.? PLASKIE', label: '', group: earth}
          - gn
          - usb
          - earth
          - ip
          - switch
          - {match: 'PLASKA WTYCZK', label: z wtyczką płaską}
        attrs: [features_pre, features, color]
      - key: gniazdo
        noun: Gniazdo przenośne
        gender: n
        match: ['^GNIAZDO']
        trusted: true
        features_pre:
          - {match: '(?<!GNIAZDO )OKRAGLE|^GNIAZDO OKRAGLE ZWIJAKA', label: okrągłe}
          - {match: 'GUMOW', label: gumowe}
        # "G-10G Gniazdo z uziemieniem IP-44" - liczba gniazd tylko w kodzie (G-10 = 1 gn., GN-30 = 3 gn.)
        features:
          - gn
          - {code_match: '^G[NOSD]?-(\d)', label: '{0} gn.', group: gn}
          - earth
          - ip
        features_post:
          - {match: 'Z UCHWYTEM', label: z uchwytem}
          - {match: '\b(\d+(?:,\d)?)A/', label: '{0}A'}
          - switch
        attrs: [features_pre, features, features_post, color]
      - key: wtyczka
        noun: Wtyczka
        gender: f
        match: ['^WTYCZKA']
        trusted: true
        features_pre:
          - {match: 'KATOWA', label: kątowa, group: shape}
          - {match: 'PROSTA', label: prosta, group: shape}
          - {match: 'OBROTOWA', label: obrotowa, group: shape}
          - {match: 'GUMOWA', label: gumowa}
          - {match: 'STANDARD', label: standardowa}
        features:
          - {match: 'UNISCH', label: Unischuko}
          - earth
          - ip
          - {match: 'Z UCHEM', label: z uchem}
          - {match: 'Z UCHWYTEM', label: z uchwytem}
          - {match: 'Z GNIAZDKIEM', label: z gniazdkiem}
          - {match: '\b(\d+(?:,\d)?)\s?A\b', label: '{0}A', group: amp}
        attrs: [features_pre, features, color]
      - key: przewod
        noun: Przewód z wtyczką
        gender: m
        match: ['^PRZEWOD']
        trusted: true
        features_pre:
          - {match: 'ZALEWAN', label: zalewaną}
          - {match: 'KATOW', label: kątową, group: shape}
          - {match: 'PROST', label: prostą, group: shape}
          - {match: 'PLASK', label: płaską, group: shape}
          - {match: 'UNISCH', label: Unischuko}
          - {match: 'KOLNIERZ', label: z kołnierzem}
        features: [len, cross, cable, ip]
        features_post: [switch]
        attrs: [features_pre, features, features_post, color]
      - key: lacznik
        noun: Łącznik kołyskowy
        gender: m
        match: ['^LACZNIK KOLYSK']
        trusted: true
        features:
          - {match: 'PODSWIET', label: z podświetleniem}
          - {match: 'SRUBK', label: ze śrubkami}
        attrs: [features, color]
      - key: nasadka
        noun: Nasadka grzejna
        gender: f
        match: ['^NASADKA']
        trusted: true
        attrs: []
      - key: bezpiecznik
        noun: Bezpiecznik
        gender: m
        match: ['^BEZPIECZNIK']
        trusted: true
        features:
          - {match: '\b(\d+)\s?A\b', label: '{0}A'}
          - {match: '\b(2[35]0)\s?V\b', label: '{0}V'}
        attrs: [features]
      - key: oprawka
        noun: Oprawka E27 termoplastyczna z przewodem
        gender: f
        match: ['^OPRAWKA']
        trusted: true
        features:
          - {match: 'MAX\.?\s?(\d+)\s?W\b', label: 'max {0}W'}
        attrs: [features]
      - key: adapter
        noun: Adapter podróżny uniwersalny
        gender: m
        match: ['^ADAPT']
        trusted: true
        features: [earth]
        attrs: [features]
      - key: oslona
        noun: Osłona złącza kablowego
        gender: f
        match: ['^OSLONA']
        trusted: true
        attrs: [color]
      - key: lampka
        noun: Lampka wtyczkowa
        gender: f
        match: ['^LAMPKA']
        trusted: true
        features:
          - {match: 'ZMIERZCH', label: z czujnikiem zmierzchu}
        attrs: [features]
      - key: nawijak
        noun: Nawijak do przewodu
        gender: m
        match: ['^NAWIJAK']
        trusted: true
        attrs: []
      - key: wylacznik
        noun: Wyłącznik do wbudowania
        gender: m
        match: ['^WYLACZNIK']
        trusted: true
        features:
          - {match: '\b(\d+)\s?A\b', label: '{0}A'}
          - {match: '\b(2[23]0)\s?V\b', label: '{0}V'}
        attrs: [features]
  # Plastrol (od 2026-11-10, runda 1): `input/Nazwy Ekonom/Plastrol` - "karto" i "katalog" sa identyczne (78 kartotek),
  # przebieg na jednym pliku. Przedluzacze wg schematu V3 jak Elgotech / Kobi / Bemko / GTV. KEL to marka Plastrolu
  # (Castorama / Morele: "KEL, producent Plastrol") - produkty z "KEL" w nazwie dostaja marke KEL zamiast Plastrol.
  # X1 / X3 to przedluzacze budowlane 1- i 3-gniazdowe (karty TME W-99192 "X1 ... one socket", W-01189 / W-98982 "X3
  # construction extension cord ... three sockets"); "X1" / "X3" zostaje jako nazwa wlasna.
  plastrol:
    brand: Plastrol
    brand_last: true
    brand_from_raw: true
    brand_rules:
      - {match: '\bKEL\b', brand: KEL}
    strip_code: true
    capitalize_first: true
    name_cleanup:
      - '(?i)\bPLASTROL\b'
      - '\bKEL\b'
      - {match: '×', repl: 'x'}
      - {match: '(?i)\bwarszatatow', repl: 'warsztatow'}
      - {match: '(?i)\bPrzedłuzacz', repl: 'Przedłużacz'}
      - {match: '(?i)\brozberialn', repl: 'rozbieraln'}
      - {match: '(?i)\bczrwon', repl: 'czerwon'}
      - {match: '(?i)\bCZARNO-CZARN(\w+)', repl: 'CZARN\1'}
      - {match: '(?i)\bczarno-\s+czerwon', repl: 'czarno-czerwon'}
      - {match: '(?i)\bIP[\s-](\d\d)\b', repl: 'IP\1'}
      - {match: '(?i)\bE-27\b', repl: 'E27'}
      - {match: '(?i)\bH07-BQF\b', repl: 'H07BQ-F'}
      - {match: '(?i)\bUni\s?SCHUKO\b', repl: 'Unischuko'}
      - {match: '(?i)\b2X075\s?mm2', repl: '2x0,75mm2'}
      # "3,m" = 3m (T-02224, rodzenstwo T-110230 ma "1,5m")
      - {match: '(?<=\d),m\b', repl: 'm'}
      - {match: '(?i)(\d)\s?mb\b', repl: '\1m'}
      # "WT-11P" + "BIAŁA" - ciecie zestawienia na 40. znaku zgubilo spacje
      - {match: '\b(WT-\d+[A-Z]*?)(BIAŁ|CZARN)', repl: '\1 \2'}
    noun_overrides:
      - {match: 'BUDOWLAN|\bX[13]\b', noun: Przedłużacz budowlany, gender: m, types: [przedluzacz]}
      - {match: 'WARSZTATOW', noun: Przedłużacz warsztatowy, gender: m, types: [przedluzacz]}
    housing_colors:
      czarno_czerwony: {m: czarno-czerwony, f: czarno-czerwona, n: czarno-czerwone, match: ['CZARNO-CZERWON']}
      szaro_niebieski: {m: szaro-niebieski, f: szaro-niebieska, n: szaro-niebieskie, match: ['SZARO-NIEBIESK']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN']}
      bialy: {m: biały, f: biała, n: białe, match: ['\bBIAL[YAE]\b']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['NIEBIESK']}
      pomaranczowy: {m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['POMARANCZ']}
    # X1 / X3: kolor przewodu ("przewód kolor czarny", "H05RR-F czarna") to nie kolor wtyczki i gniazda
    color_ignore: ['PRZEWOD KOLOR \w+', 'H05RR-F CZARNA']
    feature_sets:
      gn:
        - {match: '\b(\d)\s?X\s?(?:2P|GN)', label: '{0} gn.', group: gn}
        - {match: '\b(\d)\s?GNIAZD', label: '{0} gn.', group: gn}
        - {match: '\bX([13])\b', label: '{0} gn.', group: gn}
        - {match: 'JEDNOGNIAZD|\bPOJEDYNCZ', label: '1 gn.', group: gn}
        - {match: '\bPODWOJN', label: '2 gn.', group: gn}
        - {match: '\bTRZYKROTN', label: '3 gn.', group: gn}
        - {match: '\bCZTEROKROTN', label: '4 gn.', group: gn}
        - {match: '\bSZESCIOKROTN', label: '6 gn.', group: gn}
      usb:
        - {match: 'USB A,?\s?(?:USB )?C\b', label: '+ USB A+C', group: usb}
      len:
        # beben z automatycznym zwijaczem "14+2m" (14 m na bebnie + 2 m przewodu zasilajacego)
        - {match: '\b(\d+)\+(\d+)\s?M\b', label: '{0}+{1}m', group: len}
        - {match: '(?<![\d,X/+])(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
      cross:
        - {match: '\b([235])\s?X\s?(\d(?:,\d+)?)(?!\d|,\d|\s?P|\s?X)', label: '{0}x{1}mm2', group: cross}
      cable:
        - {match: '\bH07BQ', label: PUR, group: cable}
        - {match: 'GUM|\bH05R[RN]', label: guma, group: cable}
        - {match: '\bOMY\b|\bH05VV', label: PVC, group: cable}
      # domowe: PVC domyslny - w nazwie tylko guma / PUR
      cable_extra:
        - {match: '\bH07BQ', label: PUR, group: cable}
        - {match: 'GUM|\bH05RR', label: guma, group: cable}
      ip:
        - {match: '\b(IP[2-6]\d)\b', label: '{0}', group: ip}
      earth:
        - {match: 'UNISCHUKO', label: '', group: earth}
        - {match: 'SCHUKO', label: Schuko, group: earth}
        - {match: '\b2P\b(?!\+)', label: bez uziemienia, group: earth}
        - {match: '2P\+Z', label: z uziemieniem, group: earth}
      switch:
        - {match: '\bWYLACZ|\bWLACZ', label: z wyłącznikiem, group: sw}
      flap:
        - {match: 'KLAPK', label: z klapką, group: flap}
        - {match: 'POKRYWK', label: z pokrywką, group: flap}
    types:
