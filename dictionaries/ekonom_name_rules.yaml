      - key: rozgaleznik_bebnowy
        noun: Rozgałęźnik na bębnie
        gender: m
        match: ['^ROZGALEZNIK NA BEBNIE']
        trusted: true
        features_pre:
          - {match: 'BEBNIE METALOW', label: metalowym}
          - {match: '\bFI\s?(\d{3})\b', label: 'fi{0}'}
        features:
          - drum_outs
          - ip
          - {match: '\dX2[35]0V', label: z uziemieniem, group: earth}
          - termik
        features_name:
