          - {match: '\b(\d+)W\b', label: '{0}W'}
          - {match: '\b(\d+)M\b', label: '{0}m'}
          - {match: '\b(\d{3})°', label: '{0}°'}
        attrs: [features_pre, features, color]
      # ---------------------------------------------------------------- oprawki
      - key: oprawka_redukcyjna
        noun: Oprawka redukcyjna
        gender: f
        match: ['^OPRAWKA REDUKCYJNA']
        trusted: true
        features:
          - {match: '\b(E27|E14)\s?(?:/|NA)\s?(E14|GU10)', label: 'z {0} na {1}'}
        attrs: [features, color]
      - key: oprawka
        noun: Oprawka
        gender: f
        match: ['^OPRAWKA']
        trusted: true
        features:
          - {match: '\b(E40|E27|E14|GU10)\b', label: '{0}'}
          - {match: 'TERMOPLAST', label: termoplastyczna, group: mat}
          - {match: 'PORCELAN', label: porcelanowa, group: mat}
          - {match: 'BAKELIT', label: bakielitowa, group: mat}
          - {match: 'METALOW', label: metalowa, group: mat}
          - {match: 'TYP 426', label: typ 426}
          - {match: 'BLASZKA ODWROC', label: z blaszką odwróconą, group: bl}
          - {match: 'Z GRUBSZA BLASZKA', label: z blaszką, group: bl}
          - {match: 'BEZ BLASZKI', label: bez blaszki, group: bl}
          - {match: 'KOLNIERZ', label: z kołnierzem}
          - {match: 'ODCHUDZON', label: odchudzona}
          - {match: 'Z PRZEWODEM', label: z przewodem}
        attrs: [features, color]
      # ---------------------------------------------------------------- puszki
      - key: puszka_sbox
        noun: Puszka hermetyczna
        gender: f
        match: ['^PUSZKA HERMETYCZNA']
        trusted: true
        features_pre:
          - {match: 'OKRAGLA', label: okrągła}
          - {match: 'WYSOKA', label: wysoka}
        features:
          - {match: '\b(\d{2,3})\s?X\s?(\d{2,3})\s?X\s?(\d{2,3})\b', label: '{0}x{1}x{2}mm', group: dim}
          - {match: '\b(\d{2,3})\s?X\s?(\d{2,3})\b', label: '{0}x{1}mm', group: dim}
          - {match: 'BEZ DLAWIKOW', label: bez dławików, group: dl}
          - {match: '\b([234]) DLAWIK', label: '{0} dławiki', group: dl}
          - {match: '\b(\d{1,2}) DLAWIK', label: '{0} dławików', group: dl}
          - {match: 'ODPORNA NA UV', label: odporna na UV}
          - {match: 'BEZHALOGEN', label: bezhalogenowa}
          - {match: 'POKRYW\w* PRZEZROCZ|\b[DP]\.\s?PRZEZ', label: z pokrywą przezroczystą}
        features_post: [ip]
        features_name:
          - {match: 'S-BOX', label: S-BOX}
        attrs: [features_pre, features, color, features_post, features_name]
      - key: puszka_odgromowa
        noun: Puszka do złącza odgromowego
        gender: f
        match: ['^PUSZKA DO ZLACZA ODGROM']
        trusted: true
        features:
          - {match: 'REGULOWAN', label: regulowana}
          - {match: 'DRZWICZK', label: z drzwiczkami}
          - {match: '\b(\d{3}X\d{3}X\d{3})MM', label: '{0}mm'}
          - {match: 'BIALA POKRYWA', label: pokrywa biała, group: cov}
          - {match: 'SZARA POKRYWA', label: pokrywa szara, group: cov}
        features_post: [ip]
        attrs: [features, color, features_post]
      - key: puszka_natynkowa
        noun: Puszka natynkowa hermetyczna
        gender: f
        match: ['^PUSZKA NATYNKOWA']
        trusted: true
        features:
          - {match: '\b(\d{2,3}X\d{2,3})\b', label: '{0}mm', group: dim}
          - {match: '\b(\d) ZACISK\w* (\d+(?:,\d+)?)MM2', label: '{0}x{1}mm2', group: z}
          - {match: 'ZLACZK\w* (\d)X(\d+(?:,\d+)?)MM2', label: 'ze złączką {0}x{1}mm2', group: z}
          - {match: '\b(\d)X(\d+(?:,\d+)?)MM2', label: '{0}x{1}mm2', group: z}
          - {match: 'BEZ ZACISK', label: bez zacisków, group: z}
          - {match: 'Z WKRETEM', label: z wkrętem}
        features_post: [ip]
        features_name:
          - {match: '\bKLIK\b', label: KLIK}
          - {match: '\b(PG\d{2}|P-2)\b', label: '{0}'}
        attrs: [features, color, features_post, features_name]
      - key: puszka_agd
        noun: Puszka podtynkowa i natynkowa do AGD
        gender: f
        match: ['^PUSZKA PODTYNKOWA I NATYNKOWA']
        trusted: true
        features:
          - {match: '\b(\d{2,3}X\d{2,3})\b', label: '{0}mm'}
          - {match: '\b(5X\d(?:,\d)?)MM2', label: '{0}mm2'}
          - amp
        features_post: [ip]
        attrs: [features, color, features_post]
      - key: puszka_p_t
        noun: Puszka podtynkowa
        gender: f
        match: ['^PUSZKA\b']
        trusted: true
        features:
          - {match: '\b(\d{2,3}X\d{2,3}X\d{2,3})\b', label: '{0}mm', group: dim}
          - {match: 'PLYTKA (\d{2})MM', label: 'płytka {0}mm', group: depth}
          - {match: 'GLEBOKA (\d{2})MM', label: 'głęboka {0}mm', group: depth}
          - {match: 'PLYTKA', label: płytka, group: depth}
          - {match: 'GLEBOKA|\bGL\.', label: głęboka, group: depth}
          - {match: '\bFI\s?(\d{2,3})\b', label: 'fi{0}'}
          - {match: 'LACZENIOWA', label: łączeniowa, group: fn}
          - {match: 'ODGALEZNA', label: odgałęźna, group: fn}
          - {match: 'KONCOWA', label: końcowa, group: fn}
          - {match: 'PODWOJNA', label: podwójna, group: mult}
          - {match: 'POTROJNA', label: potrójna, group: mult}
          - {match: 'POCZWORNA', label: poczwórna, group: mult}
          - {match: 'PIECIOKROTNA', label: pięciokrotna, group: mult}
          - {match: 'Z WKRETAMI', label: z wkrętami, group: scr}
          - {match: 'BEZ WKRETOW', label: bez wkrętów, group: scr}
          - {match: 'WIATROSZCZELN|GUMOWYMI PRZEPUSTAMI', label: wiatroszczelna}
          - {match: 'DO ELEKTRONIKI', label: do elektroniki}
          - {match: 'DWUCZESCIOWA DO DREWNA', label: dwuczęściowa do drewna}
          - {match: 'Z POKRYWA BIALA', label: z pokrywą białą, group: cov}
          - {match: 'Z POKRYWA', label: z pokrywą, group: cov}
          - {match: 'UNIWERSALNA', label: uniwersalna}
          - {match: 'BEZ GWINTU', label: bez gwintu}
          - {match: 'SAMOGASN', label: samogasnąca}
          - {match: '\bWPC\b', label: WPC}
        features_post: [ip_tight]
        features_name:
          - {match: '\bPK\s?60\s?LUX\b', label: PK60 Lux, group: s}
          - {match: '\bPRODUO ECO\b', label: ProDuo Eco, group: s}
          - {match: '\bPRODUO\b', label: ProDuo, group: s}
          - {match: '\b(PK\s?60|PO\s?70|PO\s?80|UK1|KUP68)\b', label: '{0}', group: s}
        attrs: [features, color, features_post, features_name]
      # ---------------------------------------------------------------- rury, kanaly
      - key: rura
        noun: Rura karbowana
        gender: f
        match: ['^RURA']
        trusted: true
        features_pre:
          - {match: 'SAMOCHOD', label: samochodowa, group: kind}
          - {match: 'SPIRALN', label: spiralna, group: kind}
        features:
          - {match: '\b(320|750)N\b', label: '{0}N'}
          - {match: '\b(\d+(?:,\d+)?/\d+(?:,\d+)?)\s?MM', label: '{0}mm', group: dim}
          - {match: 'Z PILOTEM', label: z pilotem, group: pil}
          - {match: 'BEZ PILOTA', label: bez pilota, group: pil}
          # stare kartoteki "-25UV" bez opisu pilota: rodzina z cennika (6100A / 6102A / 6109 / 6110 = bez pilota,
          # 6160 / 6161A / 6163A / 6166 = z pilotem)
          - {code_match: '^61(?:00A|02A|09|10)-', label: bez pilota, group: pil}
          - {code_match: '^616[0-6]A?-', label: z pilotem, group: pil}
          - {match: 'ROZCIET', label: rozcięta}
          - {match: 'ODPORNA NA UV|\bUV\b', label: UV}
          - {match: 'BEZHALOGEN|/BH\b', label: bezhalogenowa}
        features_post:
          - {match: '\b(\d+)\s?M\b', label: '{0}m', group: len}
          - {code_match: '-(\d{2,3})(?=[A-Z/]|$)', label: '{0}m', group: len}
        attrs: [features_pre, features, color, features_post]
      - key: kanal
        noun: Kanał kablowy
        gender: m
        match: ['^KANAL']
        trusted: true
        features:
          - {match: '\b(\d{2,3}X\d{2,3})', label: '{0}mm'}
          - {match: 'ODPORNY NA UV', label: UV}
        features_post:
          - {match: '\b(\d+)\s?M\b', label: '{0}m', group: len}
        attrs: [features, color, features_post]
      - key: przegroda
        noun: Przegroda kanału kablowego
        gender: f
        match: ['^PRZEGRODA']
        trusted: true
        features:
          - {match: '\b(\d{2})MM', label: '{0}mm'}
        attrs: [features, color]
      # ---------------------------------------------------------------- uchwyty instalacyjne, opaski
      - key: uchwyt_kablowy
        noun: Uchwyt kablowy z gwoździem
        gender: m
        match: ['^UCHWYT KABLOWY']
        trusted: true
        features:
          - {match: '\bFI\s?(\d+)\s?MM', label: 'fi{0}mm', group: size}
          - {match: '\b(\d+) MM\b', label: 'fi{0}mm', group: size}
          - {match: '\b(YDY|OMY|SMY)P\s?(\dX\d(?:,\d+)?)\s?(\d+/\d+)?', label: '{0}p {1} {2}', group: size}
          - {match: 'PLASKI', label: płaski, group: shape}
          - {match: 'OKRAGLY', label: okrągły, group: shape}
        features_post:
          - pack
          - {code_match: '-(\d+)$', label: 'op. {0} szt.', group: pack}
        attrs: [features, color, brand, features_post]
      - key: uchwyt_montazowy
        noun: Uchwyt montażowy
        gender: m
        match: ['^UCHWYT (?:MONTAZOWY|PASKOWY|DWUDZIELNY|USM|UM|UWR|RING)', '^USMP']
        trusted: true
        features:
          - {match: 'WCISKANY', label: wciskany}
          - {match: 'ODSTEPOWY', label: odstępowy}
          - {match: '\bFI\s?(\d+)\s?MM', label: 'fi{0}mm'}
          - {match: 'ODPORNY NA UV', label: UV}
        features_name:
          - {match: '\b(USMP|USMO|UWR|UM|UP)\s?-?\s?(\d+)(?:\s?-?\s?(BIS|H)\b)?', label: '{0} {1} {2}', group: m}
          - {match: '\bRING BIS (\d+/\d)', label: 'Ring Bis {0}', group: m}
          - {match: '\bRING (\d+)', label: 'Ring {0}', group: m}
          - {match: '\b(USMP|USMO|UWR|UM)\b', label: '{0}', group: m}
        features_post:
          - pack
          - {match: '\b(\d+)SZT', label: 'op. {0} szt.', group: pack}
          - {code_match: '-(\d+)$', label: 'op. {0} szt.', group: pack}
        attrs: [features, color, features_name, brand, features_post]
      - key: obejma
        noun: Obejma
        gender: f
        match: ['^OBEJMA']
        trusted: true
        features:
          - {match: 'POJEDYNCZA', label: pojedyncza, group: m}
          - {match: 'PODWOJNA', label: podwójna, group: m}
          - {match: 'KOLKIEM ROZPOROW', label: z kołkiem rozporowym}
          - {match: '\b(\d+-\d+)MM', label: '{0}mm'}
        features_post: [pack]
        attrs: [features, color, brand, features_post]
      - key: opaska
        noun: Opaska kablowa
        gender: f
        match: ['^OPASKA KABLOWA']
        trusted: true
        features:
          - {match: '\b(\d{2,4})\s?/\s?(\d(?:,\d)?)', label: '{0}x{1}mm'}
        features_post:
          - pack
        attrs: [features, color, brand, features_post]
      # ---------------------------------------------------------------- listwy zaciskowe, bloki, szyny
      - key: listwa_zaciskowa
        noun: Listwa zaciskowa
        gender: f
        match: ['^LISTW[AY] ZACISKOW']
        trusted: true
        features_pre:
          - {match: 'BEZGWINTOWA', label: bezgwintowa, group: kind}
          - {match: 'GWINTOWA', label: gwintowa, group: kind}
          - {match: 'OCHRONNA DZIELONA', label: ochronna dzielona, group: kind}
          - {match: 'OCHRONNA', label: ochronna, group: kind}
          - {match: 'W KORPUSIE', label: w korpusie, group: kind}
          - {match: 'POCZWORNA', label: poczwórna, group: kind}
          - {match: 'POJEDYNCZE', label: pojedyncza, group: kind}
          - {match: '\bROMB\b', label: romb, group: kind}
          - {match: '(\d{1,2})-TOROWA', label: '{0}-torowa'}
        features:
          - {match: 'AL/CU', label: Al/Cu}
          - {match: '(?:CU:)?(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)MM2\s?/\s?(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)MM2', label: '{0}/{1}mm2', group: cross}
          - {match: '(?:CU:)?(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)\s?MM2', label: '{0}mm2', group: cross}
          - {match: '\b(\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)\s?MM2', label: '{0}mm2', group: cross}
          - amp
          - {match: 'NISKA PODSTAWA', label: niska podstawa, group: base}
          - {match: 'WYSOKA PODSTAWA', label: wysoka podstawa, group: base}
          - {match: 'Z OSLONA', label: z osłoną}
          - {match: 'NA SZYNE TH35', label: na szynę TH35}
        features_name:
          - {match: '\b(LZ[SDTB]?)\s?(\d{1,2}/[A-Z](?:-[A-Z])?)\b', label: '{0} {1}', group: s}
          - {match: '\b(LZ[SDTB]|LG)\b', label: '{0}', group: s}
        attrs: [features_pre, features, color, features_name]
      - key: blok
        noun: Blok rozdzielczy
        gender: m
        match: ['^BLOK ROZDZIELCZY']
        trusted: true
        features_pre:
          - {match: 'DWUBIEGUNOWY', label: dwubiegunowy}
          - {match: 'MODULOWY', label: modułowy}
          - {match: '1-TOROWY', label: 1-torowy}
        features:
          - {match: 'AL/CU', label: Al/Cu}
          - {match: '\b(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)(?:MM2)?\s?/\s?(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)(?:MM2)?', label: '{0}/{1}mm2', group: cross}
          - {match: '\b(\d+X\d+)\s?ZACISK', label: '{0} zacisków', group: cross}
          - {match: '\b(\d+X\d+(?:,\d+)?-\d+(?:,\d+)?)MM2', label: '{0}mm2', group: cross}
          - amp
          - {match: 'NIEBIESKA KLAPK', label: z klapką niebieską}
        features_name:
          - {match: '\bSPLIT\b', label: SPLIT}
        attrs: [features_pre, features, color, features_name]
      - key: zacisk
        noun: Zacisk ochronno-prądowy
        gender: m
        match: ['^ZACISK']
        trusted: true
        features:
          - {match: 'OCZKOWY 2XM8', label: oczkowy 2xM8}
          - {match: '\b(\dX\d{2})(?:MM2)?,\s?(\dX\d{2})(?:MM2)?', label: '{0}/{1}mm2', group: cross}
          - {match: '\b(\dX\d{2})(?:MM2)?\b', label: '{0}mm2', group: cross}
          - amp
          - {match: 'BEZ POKRYWY', label: bez pokrywy, group: cov}
          - {match: 'Z POKRYWA', label: z pokrywą, group: cov}
        attrs: [features, color]
      - key: szyna_pradowa
        noun: Szyna łączeniowa
        gender: f
        match: ['^SZYNA PRADOWA']
        trusted: true
        features:
          - {match: '\b(\d)-FAZOWA', label: '{0}-fazowa', group: ph}
          - {match: '\b(\d)F\b', label: '{0}-fazowa', group: ph}
          # koncowka kodu SZ = sztyftowa (cennik E.4316/54SZ: "widełkowa" - blad, `code_notes`)
          - {code_match: '/\d*\w*SZ$', label: sztyftowa, group: kind}
          - {match: 'WIDELKOW|W\.WID', label: widełkowa, group: kind}
          - {match: 'SZTYFTOW', label: sztyftowa, group: kind}
          - {match: 'DZIELONA', label: dzielona}
          - {match: '\b(\d+)\s?MM2?\b', label: '{0}mm2'}
          - amp
        features_name:
          - {match: '\bS-?(\d{1,2})\b', label: 'S-{0}', group: s}
          - {match: ',\s(\d{1,2}(?:L|STV|V|ST))\b', label: '{0}', group: s}
          - {match: '\b(\d{1,2}L)\b', label: '{0}', group: s}
        attrs: [features, features_name]
      - key: szyna_wyrownawcza
        noun: Szyna wyrównawcza potencjałów
        gender: f
        match: ['^SZYNA WYROWNUJ']
        trusted: true
        features:
          - {match: '\bMALA\b', label: mała}
          - {match: '\b(\d+X\d+)MM2,\s?(\d+X\d+)MM2,\s?(\d+X\d+)MM2', label: '{0}/{1}/{2}mm2', group: cross}
          - {match: '\b(\d+X\d+)MM2,\s?(\d+X\d+)MM2', label: '{0}/{1}mm2', group: cross}
          - {match: 'BEDNARKI', label: do bednarki}
          - {match: 'POKRYW', label: z pokrywą}
        attrs: [features, color]
      - key: szyna_th35
        noun: Szyna montażowa TH35
        gender: f
        match: ['^SZYNA MONTAZOWA']
        trusted: true
        features:
          - {match: 'PERFOROWAN', label: perforowana, group: k}
          - {match: 'PELNA', label: pełna, group: k}
          - {match: '\b(\d)M\b', label: '{0}m'}
        attrs: [features]
      - key: szybkozlaczka
        noun: Szybkozłączka
        gender: f
        match: ['^SZYBKOZLACZK', '^ZESTAW SZYBKOZLACZEK']
        trusted: true
        features_pre:
          - {match: 'OSWIETLENIOW', label: oświetleniowa}
          - {match: 'DWUSTRONN', label: dwustronna}
        features:
          - {match: 'Z DZWIGNIA', label: z dźwignią}
          - {match: '\b(\d+X\d+(?:,\d+)?(?:-\d+(?:,\d+)?)?)\s?MM2', label: '{0}mm2', group: cross}
          - {match: '\b(\d+(?:,\d+)?-\d+(?:,\d+)?)\s?MM2', label: '{0}mm2', group: cross}
          - {match: '\b(\d+(?:,\d+)?)\s?MM2', label: '{0}mm2', group: cross}
          - {match: '\b(\d)\s?(?:STYK|ST\b)', label: '{0}-przewodowa', group: st}
          - {match: 'POJEDYNCZA', label: pojedyncza, group: st}
          - {match: 'PODWOJNA', label: podwójna, group: st}
          - {match: 'POTROJNA', label: potrójna, group: st}
          - amp
        features_post: [pack]
        attrs: [features_pre, features, color, brand, features_post]
      # ---------------------------------------------------------------- dlawice, lacznik, akcesoria
      - key: dlawica
        noun: Dławica kablowa
        gender: f
        match: ['^DLAWICA']
        trusted: true
        features_pre:
          - {match: 'METRYCZN', label: metryczna, group: k}
          - {match: 'GUMOW', label: gumowa, group: k}
        features:
          - {match: '\b(PG|M)-?(\d+(?:,\d)?)\b', label: '{0}{1}'}
        features_post: [ip]
        attrs: [features_pre, features, color, features_post]
      - key: lacznik_krzywkowy
        noun: Łącznik krzywkowy tablicowy
        gender: m
        match: ['^LACZNIK KRZYWKOWY']
        trusted: true
        features:
          - {match: '\bL/P\b', label: L-0-P, group: fn}
          - {match: '\b0/1\b', label: 0-1, group: fn}
          - amp
          - {match: '(\d)-FAZOWY', label: '{0}-fazowy'}
          - {match: 'KLODK', label: z blokadą na kłódkę}
        features_post: [ip]
        attrs: [features, color, features_post]
      - key: wylacznik_termiczny
        noun: Wyłącznik termiczny
        gender: m
        match: ['^WYLACZNIK TERMICZNY']
        trusted: true
        features:
          - {match: '(\d)-FAZOWY', label: '{0}-fazowy'}
          - amp
        features_post: [ip]
        attrs: [features, color, features_post]
      # ---------------------------------------------------------------- instalacja odgromowa i reszta: opis producenta
      - key: odgromowe
        match: ['^(?:UCHWYT|ZLACZE|UZIOM|MASZT|IGLICA|OPASKA UZIEMIAJ|STUDZIENKA)']
        trusted: true
        noun_from: rest_head
        rest_strip: '^\S+(?:\s+[a-ząćęłńóśźż-]+(?=[\s,]|$))*'
        # maszty R.8312 / R.8313: w cenniku oba "2m", roznia sie podstawa (Ekonom: "podst. 15kg" / "40kg")
        features_raw:
          - {match: 'PODST\.?\s?(\d+)\s?KG', label: 'podstawa {0}kg'}
        attrs: [rest, features_raw]
      - key: inne
        match: ['.']
        noun_from: rest_head
        rest_strip: '^\S+(?:\s+[a-ząćęłńóśźż-]+(?=[\s,]|$))*'
        attrs: [rest]
  # ===================================================================== F-Elektro
  # F-Elektro (od 2026-11-10, runda 1): `input/Nazwy Ekonom/F Electro` - "katalog" (2925 kartotek w ukladzie Ekonoma) i
  # "karto" (21 nowych, zestawienie "<40> | <reszta>"), `--input <katalog>`. Polski producent rozdzielnic budowlanych
  # (LAGO, CAJA, ULISSE, FEMO, LEGATO, R-240...), przedluzaczy bebnowych (FILO, NERO, BORDO, MAKARA, GOLIA...), zlaczy
  # CEE i osprzetu (puszki, LZ, bloki rozdzielcze, szafy). Wlasnej strony nie ma (f-elektro.pl nie istnieje); karty z
  # parametrami sa w Onninen (onninen.pl, marka F-ELEKTRO). Nazwy w Ekonomie sa juz opisowe i po polsku - zrodlo danych
  # to sama nazwa. "/FE/" i "/VC/" w nazwie to znacznik marki, nie cecha.
  # Wzor jak PCE / Pawbol: rzeczownik + wyjscia (16/5, 2x32/5, 2x230V) + zabezpieczenia + przelacznik + zasilanie + IP,
  # nazwa wlasna serii z liczba modulow (LAGO 11M) i marka F-Elektro na koncu. Przedluzacze bebnowe wg schematu V3
  # (gniazda, dlugosc, przekroj, przewod: OW = guma, OPD = guma H07RN-F, OWY = PVC); uziemienia nie zgadujemy.
  felektro:
    brand: F-Elektro
    label: F-Elektro
    brand_last: true
    capitalize_first: true
    squash_spaces: true
    # tytul karty onninen.pl (adres z mapy strony) i karty kodow z powtorzen - scripts/fetch_felektro_onninen.py
    params_web_loader: onninen
    params_web_cache: cache/onninen_felektro
    name_cleanup:
      - '\s*/(?:FE|VC)/\s*'
      - {match: '(?i)\bżółto\s?-\s?szar', repl: 'żółto-szar'}
      - {match: '(?i)\bbiało\s?-\s?czerwon', repl: 'biało-czerwon'}
      - {match: '/(szara|szary)/', repl: '\1'}
      - {match: '/(\d+x\d+(?:,\d+)?m)/', repl: '\1'}
      - {match: '\s~\s?', repl: ' '}
      - {match: '(\d)-(styki|styków)\b', repl: '\1 \2'}
      # " - " przed liczba z jednostka / wymiarem ("TH 35 - 0,25m", "- 2 styki", "drzwi - 600x600x200 mm")
      - {match: '\s-\s(?=\d+(?:,\d+)?\s?(?:m|cm|mm)\b|\d+ styk|\d+ otw|\d+x\d+x|\d+/\d+mm|PEN\b)', repl: ' '}
      - {match: '(?<=\d)\s-(?=[a-ząćęłńóśźż])', repl: ' '}
      # reduktory: "wt.16A 5p + OW ... + 2x gn gumowe"
      - {match: '\bwt\.\s?(?=\d)', repl: 'wtyczka '}
      - {match: '\bwt\.\s(?=230V)', repl: 'wtyczka '}
      - {match: '\b(\d)x gn\b', repl: '\1x gniazdo'}
      - {match: '\+ gn\b', repl: '+ gniazdo'}
      # literowki Ekonoma
      - {match: '\bczane\b', repl: 'czarne'}
      - {match: '\bodbornikowy\b', repl: 'odbiornikowy'}
      - {match: '\bogrzewana\b', repl: 'ogrzewania'}
      - {match: '\bPlytka\b', repl: 'Płytka'}
      - {match: '(?<=\d)\s?-\s?gniazda\s?mm\b', repl: 'mm'}
      - {match: '(?i)\bhermet\.\s?', repl: 'hermetyczna '}
      - {match: '(?i)\.?-\s?klik\b', repl: ' klik'}
      - {match: '\s\.-\s', repl: ' - '}
      - {match: '(?<=\d)\s?\.\+', repl: ' +'}
      - {match: '\bP\.\+Z\b', repl: 'P+Z'}
      - {match: '(?i)\b05VVH8\.?-F\b', repl: 'H05VVH8-F'}
      - {match: '(?i)\bSCHUKO\b', repl: 'Schuko'}
      - {match: '(?i)\buni-schuko\b', repl: 'Unischuko'}
      - {match: '(?i)\bNAKRĘTKA\b', repl: 'z nakrętką'}
      - {match: '(?i)\(wymiar wewn\.? w mm\)', repl: ' '}
      - {match: '\s*/szer\. x wys\./', repl: ' '}
      # wymiary "295mm x 225mm x 120mm", "200mm x 200mm x 200mm" -> "295x225x120mm"
      - {match: '(\d+)\s?mm\s?x\s?(\d+)\s?mm\s?x\s?(\d+)\s?mm', repl: '\1x\2x\3mm'}
      - {match: '(\d+)\s?x\s?(\d+)\s?x\s?(\d+)\s+mm\b', repl: '\1x\2x\3mm'}
      - {match: '(\d+)mm x (\d+)mm x (\d+)mm', repl: '\1x\2x\3mm'}
      # zakresy przekrojow "1,5mm2 - 16mm2" -> "1,5-16mm2", "25 - 120SW" -> "25-120SW"
      - {match: '(\d(?:,\d)?)\s?mm2\s?-\s?(\d+)\s?mm2', repl: '\1-\2mm2'}
      - {match: '(?<=\d)\s-\s(?=\d+SW\b)', repl: '-'}
      # zasilanie rozdzielnic / bebnow (wtyczka na przewodzie, wtyk odbiornikowy w obudowie) - nie jest wyjsciem
      - {match: '(?<=, )(?:wtyczka|wt\.)\s?(\d+)A\s?([2-5])p\b', repl: 'wtp \1-\2'}
      - {match: '(?<=[,-] )wtyk(?: odbiornikowy)?\s?(\d+)A\s?([2-5])p\b', repl: 'wtk \1-\2'}
      - {match: ',?\s*wtyczka 230V', repl: ' '}
      # zapis wyjsc: "16A 5p", "16A5p", "2x16/5" -> "16A/5P" (jak Pawbol); "0/1", "1/4" zostaja
      - {match: '(?i)(?<![\d.])(16|32|63|125)A\s?([2-5])p\b', repl: '\1A/\2P'}
      - {match: '(?<![\d/.,])(16|32|63|125)/([345])(?![\d/])', repl: '\1A/\2P'}
      # opakowanie na koniec nazwy - za marka (`move_brand_tail`)
      - {match: '(?i)\s*-?\s*(?:opakowanie|komplet) (\d+) szt\b\.?', repl: ', opak \1 szt'}
      - {match: '\s+-\s+(?=[a-ząćęłńóśźż])', repl: ' '}
    code_notes:
      - {code: '^F7\.0(?:19[78]|20[01])$', note: 'znacznik /VC/ w nazwie Ekonoma - marka do potwierdzenia (przyjęto F-Elektro)'}
    # zapis "16A/5P" sluzy tylko parsowaniu wyjsc; w nazwach z opisu (reduktory, adaptery, wylaczniki WK) "16A 5P"
    name_replace:
      - {match: '\b(\d+A)/([2-5]P)\b', repl: '\1 \2'}
    housing_colors:
      zolto_czerwony: {m: żółto-czerwony, f: żółto-czerwona, n: żółto-czerwone, match: ['ZOLTO\s?-\s?CZERWON']}
      zolto_szary: {m: żółto-szary, f: żółto-szara, n: żółto-szare, match: ['ZOLTO\s?-\s?SZAR']}
      zolto_zielony: {m: żółto-zielony, f: żółto-zielona, n: żółto-zielone, match: ['ZOLTO\s?[-/]\s?ZIEL']}
      bialo_czerwony: {m: biało-czerwony, f: biało-czerwona, n: biało-czerwone, match: ['BIALO\s?-\s?CZERWON']}
      bialy: {m: biały, f: biała, n: białe, match: ['\bBIAL[YAE]\b']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['\bCZARN[YAE]\b']}
      szary: {m: szary, f: szara, n: szare, match: ['\bSZAR[YAE]\b']}
      brazowy: {m: brązowy, f: brązowa, n: brązowe, match: ['\bBRAZOW[YAE]\b']}
      pomaranczowy: {m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['POMARANCZOW']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['\bCZERWON[YAE]\b']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['\bNIEBIESK(?:I|A|IE)\b', '\bNIEB\.']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['\bZIELON[YAE]\b']}
      zolty: {m: żółty, f: żółta, n: żółte, match: ['\bZOLT[YAE]\b']}
    feature_sets:
      ip:
        - {match: '\b(IP\d\d)\b', label: '{0}', group: ip}
      # wyjscia rozdzielnic i bebnow trojfazowych: "2x16A/5P" -> "2x16/5", "16A/5P" -> "16/5", "2x230V"; kolejnosc jak
      # u producenta (od 16A)
      outs:
        - {match: '(?<![\dA-Z])([2-9]|1\d)X16A/(\d)P', label: '{0}x16/{1}', group: o16}
        - {match: '(?<![\dA-Z])(?:1X)?16A/(\d)P', label: '16/{0}', group: o16}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X32A/(\d)P', label: '{0}x32/{1}', group: o32}
        - {match: '(?<![\dA-Z])(?:1X)?32A/(\d)P', label: '32/{0}', group: o32}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X63A/(\d)P', label: '{0}x63/{1}', group: o63}
        - {match: '(?<![\dA-Z])(?:1X)?63A/(\d)P', label: '63/{0}', group: o63}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X125A/(\d)P', label: '{0}x125/{1}', group: o125}
        - {match: '(?<![\dA-Z])(?:1X)?125A/(\d)P', label: '125/{0}', group: o125}
        # "2x250V" (ULISSE 74180.8) to te same gniazda 230V
        - {match: '(?<![\d/])\b(\d{1,2})X2[35]0\s?V', label: '{0}x230V', group: ogs}
        - {match: '(?:^|[ ,])2[35]0V\b', label: '1x230V', group: ogs}
      # IP z tytulu / opisu karty Onninen (`params_web_loader: onninen`), przed IP z nazwy
      ip_card:
        - {param: IP, match: '(IP\d\d)', label: '{0}', group: ip}
        - {match: '\b(IP\d\d)\b', label: '{0}', group: ip}
      # zlacza CEE: pary kartotek o tej samej nazwie to IP44 / IP67 - IP tez z (generowanego) opisu karty, WARNING;
      # w rozdzielnicach opis podaje IP obudowy takze przy gniazdach IP44, wiec tam tylko tytul
      ip_card_desc:
        - {param: IP, match: '(IP\d\d)', label: '{0}', group: ip}
        - {match: '\b(IP\d\d)\b', label: '{0}', group: ip}
        - {param: IP_opis, match: '(IP\d\d)', label: '{0}', group: ip}
      # przelacznik z tytulu karty: Ekonom zgubil go w RB-300 ("RB-300 12M 2x16A5p, 2x230V" x3)
      switch_card:
        - {param: _slug, match: '-0-1-(\d+)A-Z(?:-|$)', label: 'z rozłącznikiem zamykanym 0-1 {0}A', group: sw}
        - {param: _slug, match: '-0-1-(\d+)A(?:-|$)', label: 'z rozłącznikiem 0-1 {0}A', group: sw}
        - {param: _slug, match: '-L-P-(\d+)A-Z(?:-|$)', label: 'z przełącznikiem zamykanym L-0-P {0}A', group: sw}
        - {param: _slug, match: '-L-P-(\d+)A(?:-|$)', label: 'z przełącznikiem L-0-P {0}A', group: sw}
      # bebny: jednofazowe "4 gn." (V3), trojfazowe - wyjscia jak w rozdzielnicy ("2x32/5 1x230V")
      drum_outs:
        - {match: '^(?!.*A/\dP).*?(?<![\dA-Z])(\d)X230V', label: '{0} gn.', group: gn}
        - {match: '(?<![\dA-Z])([2-9])X16A/(\d)P', label: '{0}x16/{1}', group: o16}
        - {match: '(?<![\dA-Z])(?:1X)?16A/(\d)P', label: '16/{0}', group: o16}
        - {match: '(?<![\dA-Z])([2-9])X32A/(\d)P', label: '{0}x32/{1}', group: o32}
        - {match: '(?<![\dA-Z])(?:1X)?32A/(\d)P', label: '32/{0}', group: o32}
        - {match: '^(?=.*A/\dP).*?(?<![\d/A-Z])(\d{1,2})X230\s?V', label: '{0}x230V', group: ogs}
        - {match: '^(?=.*A/\dP).*?(?:^|[ ,])230V\b', label: '1x230V', group: ogs}
      inlet:
        - {match: '\bWTP (\d+)-(\d)\b', label: 'z wtyczką {0}/{1}', group: inlet}
        - {match: '\bWTK (\d+)-(\d)\b', label: 'z wtykiem {0}/{1}', group: inlet}
      lead:
        - {match: '\b(?:OPD|OWY?)\s?(\d)X(\d+(?:,\d+)?)\s?MM2\s?[-/]?\s?(\d+(?:,\d+)?)\s?M\b', label: 'na przewodzie {0}x{1}mm2 {2}m', group: lead}
      switch:
        - {match: '(?<!\d)0/1\s?\((\d+)A-Z\)', label: 'z rozłącznikiem zamykanym 0-1 {0}A', group: sw}
        - {match: '(?<!\d)0/1\s?\((\d+)A\)', label: 'z rozłącznikiem 0-1 {0}A', group: sw}
        - {match: '\bL/P\s?\((\d+)A-Z\)', label: 'z przełącznikiem zamykanym L-0-P {0}A', group: sw}
        - {match: '\bL/P\s?\((\d+)A\)', label: 'z przełącznikiem L-0-P {0}A', group: sw}
        - {match: '(?<!\d)0/1\b', label: z rozłącznikiem 0-1, group: sw}
        - {match: '\bL/P\b', label: z przełącznikiem L-0-P, group: sw}
      # "z zabezpieczeniami R4P40A typ AC, 3FC16A, 1FB16A" = RCD 4P 40A typ AC + wylaczniki nadpradowe
      prot:
        - {match: '\b\dF[BC]\d+A', label: z wył. nadprądowymi, group: mcb}
        - {match: '\bR\dP(\d+)A\b', label: 'i RCD {0}A', group: rcd}
      len:
        - {match: '/(\d+(?:,\d+)?)\s?M/', label: '{0}m', group: len}
        - {match: '-\s?(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
        - {match: '(?<![\dX,/])(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
      cable_set:
        - {match: '\b([2-5])X(\d+(?:,\d+)?)\s?(?:MM2?)?\b(?![/V])', label: '{0}x{1}mm2', group: cross}
        - {match: '\bOPD\b|H07RN', label: guma H07RN-F, group: cable}
        - {match: '\bOWY\b|H05VV', label: PVC, group: cable}
        - {match: '\bOW\b|H05RR', label: guma, group: cable}
      earth:
        - {match: '\bSCHUKO\b', label: Schuko, group: earth}
        - {match: 'UNISCHUKO', label: Unischuko, group: earth}
        - {match: '2P\+Z|Z UZIEMIENIEM', label: z uziemieniem, group: earth}
      amp:
        - {match: '\b(\d{1,3})A\b', label: '{0}A', group: amp}
      cee:
        - {match: '(?<!\d)(\d{2,3})A/(\d)P\b', label: '{0}A {1}P', group: cee}
      volt:
        - {match: '\b(24|42|110|230|250|400)V\b', label: '{0}V', group: volt}
      drum_series:
        - {match: '\b(FILO|NERO|MIDI|MINI|BORDO|GRANDE|MAKARA|GOLIA|ALBERO)-(\d{3})(?: (NK))?\b', label: '{0}-{1} {2}', group: s}
    types:
      # ---------------------------------------------------------------- rozdzielnice budowlane
      - key: rozdzielnica
        noun: Rozdzielnica
        gender: f
        match: ['^ROZDZIELNICA']
        trusted: true
        features:
          - outs
          - {match: 'GNIAZDA PROSTE', label: gniazda proste}
          - {match: '\+\s?(\d)X AIR', label: '+ {0}x AIR'}
          - prot
          - switch
          - switch_card
          - {match: 'Z BEZPIECZNIKIEM', label: z bezpiecznikiem}
          - inlet
          - lead
          - {match: 'STELAZ PLASTIK', label: na stelażu plastikowym, group: stand}
          - {match: 'STELAZ METAL', label: na stelażu metalowym, group: stand}
        features_post: [ip_card]
        features_name:
          - {match: '\bHORIZONTAL( [BS])?\b', label: 'Horizontal{0}', group: s}
          - {match: '\bVERTICAL( [BS])?\b', label: 'Vertical{0}', group: s}
          - {match: '^ROZDZIELNICA (?:BUDOWLANA )?([A-Z][A-Z0-9-]*(?: (?:\d+M|MINI|MIDI|MAXI|NK|BICOLOR|SCENIC))*)', label: '{0}', group: s}
        attrs: [features, features_post, features_name]
      - key: obudowa_rozdzielnicy
        noun: Obudowa rozdzielnicy
        gender: f
        match: ['^OBUDOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+X\d+)\s?(?:MM)?\b', label: '{0}mm'}
        features_post: [ip_card]
        features_name:
          - {match: '^OBUDOWA ([A-Z][A-Z0-9-]*(?: (?:\d+M|MINI|MIDI|MAXI|BICOLOR|SCENIC))*)', label: '{0}'}
        attrs: [features, features_post, features_name]
      - key: rozdzielnica_hermetyczna
        noun: Rozdzielnica modułowa hermetyczna
        gender: f
        match: ['^ACQUA']
        trusted: true
        features:
          - {match: '\b(\d)/(\d+) MODUL', label: '{1} mod. ({0} rz.)'}
          - {match: 'DYMN', label: drzwi dymne}
        features_name:
          - {match: '^(ACQUA(?: EKO)?)', label: '{0}'}
        attrs: [features, features_name]
      # ---------------------------------------------------------------- przedluzacze
      - key: przedluzacz_bebnowy
        noun: Przedłużacz bębnowy
        gender: m
        match: ['^PRZEDLUZACZ (?:FILO|NERO|MIDI|MINI|BORDO|GRANDE|MAKARA|GOLIA|ALBERO)-']
        trusted: true
        features: [drum_outs, len, cable_set]
        features_post: [ip_card, earth]
        features_name: [drum_series]
        attrs: [features, features_post, features_name]
      - key: rozgaleznik_bebnowy
        noun: Rozgałęźnik na bębnie
        gender: m
        match: ['^ROZGALEZNIK (?:FILO|NERO|MIDI|MINI|BORDO|GRANDE|MAKARA|GOLIA|ALBERO)-']
        trusted: true
        features:
          - drum_outs
          - {match: 'TERMIK', label: z termikiem}
          - {match: 'KONTROLK', label: z kontrolką}
        features_post: [ip_card, earth]
        features_name: [drum_series]
        attrs: [features, features_post, features_name]
      - key: zwijak
        noun: Zwijak
        gender: m
        match: ['^ZWIJAK']
        trusted: true
        features_pre:
          - {match: 'METALOW', label: metalowy}
        features_name: [drum_series]
        attrs: [features_pre, features_name]
      - key: przedluzacz_silowy
        noun: Przedłużacz siłowy
        gender: m
        match: ['^PRZEDLUZACZ SILOWY']
        trusted: true
        features: [cee, len, cable_set]
        features_post: [ip_card]
        attrs: [features, features_post]
      - key: przedluzacz_kempingowy
        noun: Przedłużacz kempingowy
        gender: m
        match: ['^PRZEDLUZACZ KEMPING']
        trusted: true
        features: [cee, len, cable_set]
        features_name:
          - {match: 'OPAL KAMPER', label: Opal Kamper}
        attrs: [features, features_name]
      # schemat V3 domowych: gniazda | dlugosc | przekroj | (przewod) | uziemienie | nazwa wlasna | marka
      - key: przedluzacz
        noun: Przedłużacz
        gender: m
        match: ['^PRZEDLUZACZ']
        trusted: true
        features:
          - {match: '\b(\d)X230V', label: '{0} gn.', group: gn}
          - {match: '\b(\d)-GNIAZDOW', label: '{0} gn.', group: gn}
          - len
          - cable_set
          - earth
        features_post: [ip_card]
        attrs: [features, features_post]
      - key: przewod_spiralny
        noun: Przewód spiralny
        gender: m
        match: ['^PRZEWOD SPIRALNY']
        trusted: true
        features_pre:
          - {match: 'WTYCZKA KATOWA', label: z wtyczką kątową}
        features: [len, cable_set]
        attrs: [features_pre, features, color]
      - key: przewod_przylaczeniowy
        noun: Przewód przyłączeniowy
        gender: m
        match: ['^PRZEWOD PRZYLACZ']
        trusted: true
        features_pre:
          - {match: 'WTYCZKA PROSTA', label: z wtyczką prostą, group: plug}
          - {match: 'WTYCZKA KATOWA', label: z wtyczką kątową, group: plug}
          - {match: 'WTYCZKA PLASKA', label: z wtyczką płaską, group: plug}
        features: [len, cable_set]
        features_post:
          - {match: '\bOMYP\b', label: OMYp}
          - {match: 'WYLACZNIK', label: z wyłącznikiem}
        attrs: [features_pre, features, features_post, color]
      # ---------------------------------------------------------------- zlacza CEE (siłowe 4p / 5p, przemysłowe 3p, 24V 2p)
      - key: cee
        match: ['^(?:GNIAZDO|WTYCZKA|WTYK)\b.*\b\d{2,3}A/[2-5]P\b']
        trusted: true
        noun_from: rest_head
        rest_strip: '^\S+(?:\s+[a-ząćęłńóśźż-]+(?=[\s,]|$))*'
        features:
          - cee
          - {match: '\+ 230V', label: + 1x230V}
          - {match: '\b(24|42)V\b', label: '{0}V', group: volt}
          - {match: 'ZWROTNICA FAZ', label: ze zwrotnicą faz}
          - {match: 'Z PUSZKA', label: z puszką}
          - {match: 'Z NAKRETKA', label: z nakrętką}
          - {match: 'KOLNIERZ (\d+X\d+)', label: 'kołnierz {0}mm'}
        features_post: [ip_card_desc]
        attrs: [features, color, features_post]
      # ---------------------------------------------------------------- reszta: opis z Ekonoma (rzeczownik + reszta nazwy)
      - key: inne
        match: ['.']
        trusted: true
        noun_from: rest_head
        rest_strip: '^\S+(?:\s+[a-ząćęłńóśźż-]+(?=[\s,]|$))*'
        # opakowanie za marka: "Szybkozłączka ... 3 styki F-Elektro op. 10 szt." (jak Pawbol)
        rest_drop: ['^OPAK \d+ SZT$']
        features_post:
          - {match: '\bOPAK (\d+) SZT\b', label: 'op. {0} szt.'}
        attrs: [rest, brand, features_post]
    noun_overrides:
      - {match: 'ROZDZIELNICA BUDOWLANA', noun: Rozdzielnica budowlana, gender: f, types: [rozdzielnica]}
      - {match: 'A/\dP', noun: Przedłużacz bębnowy trójfazowy, gender: m, types: [przedluzacz_bebnowy]}
      - {match: 'A/\dP', noun: Rozgałęźnik trójfazowy na bębnie, gender: m, types: [rozgaleznik_bebnowy]}
      - {match: 'LISTWOWY', noun: Przedłużacz listwowy, gender: m, types: [przedluzacz]}
      - {match: 'ROZGALEZNIKIEM', noun: Przedłużacz z rozgałęźnikiem, gender: m, types: [przedluzacz]}
