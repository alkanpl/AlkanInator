      - key: plafon
        noun: Plafon
        gender: m
        match: ['^PLAFONIERA']
        version_suffix: true
        trusted: true
        features:
          - {match: '\bFI-?(\d{2})\b', label: 'fi{0}cm', group: size}
          - {match: '\b(\d{2})X(\d{2})\b', label: '{0}x{1}cm', group: size}
          - sensor
        attrs: [series, sockets, features, ip]
      - key: oprawa_led
        noun: Oprawa LED
        gender: f
        match: ['^OPRAWA']
        require_pattern: '\d\s?LM\b'
        version_suffix: true
        features: [shape, klosz, sensor]
        attrs: [series, length, power, lumen, cct, ip, features, color]
        required: [power, lumen, cct]
      # --- aparatura ---
      - key: nadpradowy
        noun: Wyłącznik nadprądowy
        gender: m
        match: ['^WYLACZNIK NADPRADOWY']
        trusted: true
        features:
          - {match: '\b(\d)P ([BCD]) 0?(\d+)A\b', label: '{1}{2} {0}P'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
        attrs: [features]
      - key: rcbo
        noun: Wyłącznik RCBO
        gender: m
        match: ['^WYLACZNIK (RCBO|ROZNICOWOPRADOWY Z NADPRADOWYM)']
        trusted: true
        features:
          - {match: '\b(\d)P ([BCD]) 0?(\d+)A\b', label: '{1}{2} {0}P'}
          - {match: '\b(\d+)MA\b', label: '{0}mA'}
          - {match: '\bTYP (AC|A)\b', label: 'typ {0}'}
        attrs: [features]
      - key: roznicowopradowy
        noun: Wyłącznik różnicowoprądowy
        gender: m
        match: ['^WYLACZNIK ROZNICOWOPRADOWY']
        trusted: true
        features:
          - {match: '\b(\d)P\b', label: '{0}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)MA\b', label: '{0}mA'}
          - {match: 'ROZNICOWOPRADOWY (AC|A)\b', label: 'typ {0}'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
        attrs: [features]
      - key: rozlacznik
        noun: Rozłącznik izolacyjny
        gender: m
        match: ['^ROZLACZNIK']
        trusted: true
        features:
          - {match: '\bPV\b', label: PV}
          - {match: '\b(\d)P\b|\b(\d)-POLOWY', label: '{0}{1}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
        attrs: [features, ip]
      - key: ogranicznik
        noun: Ogranicznik przepięć
        gender: m
        match: ['^OGRANICZNIK']
        trusted: true
        features:
          - {match: '\b(T1\+T2|T2)\b', label: '{0}'}
          - {match: '\b(\d)P\b', label: '{0}P'}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
          - {match: '\bDC (\d+)V\b', label: '{0}V DC'}
          - {match: 'ISKIERNIK', label: z iskiernikiem}
        attrs: [features]
      - key: wkladka_ogranicznika
        noun: Wkładka do ogranicznika przepięć
        gender: f
        match: ['^WKLADKA DLA OGRANICZNIKA']
        trusted: true
        features:
          - {match: '\bT1\+?T2\b', label: T1+T2, group: klasa}
          - {match: '\bT2\b', label: T2, group: klasa}
          - {match: '\b(\d+(?:,\d+)?)KA\b', label: '{0}kA'}
          - {match: 'BEZ TRZPIENIA', label: bez trzpienia}
        attrs: [features]
      - key: wkladka_topikowa
        noun: Wkładka topikowa
        gender: f
        match: ['^WKLADKA TOPIKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\s?MM\b', label: '{0}'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
        attrs: [features]
      - key: podstawa_bezpiecznikowa
        noun: Podstawa bezpiecznikowa
        gender: f
        match: ['^PODSTAWA BEZPIECZNIKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\b', label: '{0}'}
          - {match: '\b(\d)-POLOWA', label: '{0}P'}
          - {match: '\b(\d+)A\b', label: '{0}A'}
          - {match: '\b(\d+)V DC\b', label: '{0}V DC'}
          - {match: 'KONTROLK', label: z kontrolką}
        attrs: [features]
      - key: licznik_energii
        noun: Licznik energii
        gender: m
        match: ['^LICZNIK ENERGII']
        trusted: true
        features:
          - {match: '\b(\d) FAZOWY', label: '{0}-fazowy'}
          - {match: '\bMID\b', label: MID}
          - {match: '\bMODBUS\b', label: Modbus, group: bus}
          - {match: '\bMBUS\b', label: M-Bus, group: bus}
          - {match: '\b(\d+)A\b', label: '{0}A'}
        attrs: [features]
      - key: wskaznik_energii
        noun: Wskaźnik energii
        gender: m
        match: ['^WSKAZNIK ENERGII']
        trusted: true
        features:
          - {match: '\b(\d) FAZOWY', label: '{0}-fazowy'}
          - {match: '\b(\d+) ?\((\d+)\) ?A\b', label: '{0}({1})A'}
          - {match: 'MECHANICZN', label: mechaniczny}
        attrs: [features]
      - key: lampka_sygnalizacyjna
        noun: Lampka sygnalizacyjna
        gender: f
        match: ['^(LAMPKA|LAMKA) SYGNALIZACYJNA', '^KONTROLKA']
        trusted: true
        features:
          - {match: '\b(S?L\d)\b', label: '{0}'}
          - {match: '\b3-FAZOWA\b', label: 3-fazowa}
        attrs: [features, color]
      - key: zasilacz
        noun: Zasilacz LED
        gender: m
        match: ['^ZASILACZ']
        trusted: true
        features_pre:
          - {match: 'SZYNE DIN', label: na szynę DIN}
          - {match: 'OPRAW SCHODOWYCH STEPPER', label: do opraw Stepper}
          - {match: 'HERMETYCZN', label: hermetyczny}
        attrs: [features_pre, voltage, power, ip]
        required: [voltage, power]
      # --- osprzet instalacyjny ---
      - key: przedluzacz
        noun_from: type_words
        match: ['^PRZEDLUZACZ', '^ROZGALEZNIK']
        trusted: true
        features:
          - {match: '\b(\d)\s?GN\b', label: '{0} gn.', group: gn}
          - {match: '\b(\d)X\s?2P', label: '{0} gn.', group: gn}
          - {match: '\b(\d)XGN\b', label: '{0} gn.', group: gn}
          - {match: '\bSCHUKO\b', label: Schuko}
          - {match: 'BEZ "0"|\b\dX\s?2P(?!\+Z)', label: bez uziemienia, group: earth}
          - {match: '"0"|2P\+Z', label: z uziemieniem, group: earth}
          - {match: 'WYL\.|WYLACZNIK', label: z wyłącznikiem}
          - {match: '(\d)X ?USB ?\(C\+A\)', label: '{0}xUSB A+C', group: usb}
          - {match: '(\d)X ?USB', label: '{0}xUSB', group: usb}
          - {match: '\bTROJKATNY\b', label: trójkątny}
          - {match: '\b3X(\d(?:,\d)?)\s?MM2\b', label: '3x{0}mm2', group: cross}
          - {match: '\b(\d,\d)\s?MM\b', label: '{0}mm2', group: cross}
          - {match: '(?:\bX|PRZEWOD)\s?(\d+(?:,\d)?)\s?M\b', label: '{0}m', group: len}
          - {match: '\b(\d{2})M\b', label: '{0}m', group: len}
        attrs: [features]
      - key: szybkozlaczka
        noun_from: type_words
        match: ['^(SZYBKOZLACZKA|PRZELOTOWA ZLACZKA|ZLACZKA ZACISKOWA)']
        trusted: true
        features:
          - {match: '\bKOMPAKT\b', label: Kompakt}
          - {match: '\b(\d+(?:,\d+)?(?:-\d+,\d+)?)\s?MM2?\b', label: '{0}mm2'}
          - {match: '\bX\s?(\d)\b', label: '{0}-torowa', group: tory}
          - {match: '\b(\d)-TOROWA\b', label: '{0}-torowa', group: tory}
          - {match: '\bTWARDA\b', label: twarda}
        features_post:
          - {match: '\b(\d+)\s?SZT', label: '{0} szt.'}
        attrs: [features, ip, color, features_post]
      - key: opaska
        noun: Opaska zaciskowa
        gender: f
        match: ['^OPASKA']
        trusted: true
        features:
          - {match: '\b(\d,\d)\*(\d+)\b', label: '{0}x{1}mm'}
          - {match: '\bMIX\b', label: mix}
        features_post:
          - {match: '\b(\d+) SZT', label: '{0} szt.'}
        attrs: [features, color, features_post]
      - key: dlawnica
        noun: Dławnica kablowa
        gender: f
        match: ['^DLAWNICA']
        trusted: true
        features:
          - {match: '\b(M|PG)-(\d+(?:,\d)?)\b', label: '{0}{1}'}
        features_post:
          - {match: '\b(\d+)\s?SZT', label: '{0} szt.'}
        attrs: [features, color, features_post]
      - key: tasma_izolacyjna
        noun_from: type_words
        match: ['^TASMA (IZOLACYJNA|SAMOWULKANIZUJACA)']
        trusted: true
        features:
          - {match: '\b(\d+)X(\d+)M\b', label: '{0}mm x {1}m'}
          - {match: '\b(\d+)X(\d+)MX', label: '{0}mm x {1}m'}
        attrs: [features, color]
      - key: zlaczka_led
        noun: Złączka do taśm LED
        gender: f
        match: ['^ZLACZKA LED']
        trusted: true
        features:
          - {match: '\b(\d+)MM\b', label: '{0}mm'}
          - {match: '\b(COB|5050|3528|2835/3528|2535/3528|550)\b', label: '{0}'}
          - {match: '\bRGB\b', label: RGB}
          - {match: 'SAMOZACISKOW', label: samozaciskowa}
          - {match: '\b(\d)-STRONNA', label: '{0}-stronna'}
          - {match: 'Z PRZEWODEM', label: z przewodem}
        attrs: [features]
      - key: szynoprzewod
        noun: Szynoprzewód
        gender: m
        match: ['^SZYNOPRZEWOD']
        trusted: true
        features:
          - {match: '\b([13])-FAZOWY', label: '{0}-fazowy'}
          - {match: '\b(\d+(?:,\d)?)M\b', label: '{0}m'}
        attrs: [features, color]
      - key: listwa_zaciskowa
        noun_from: type_words
        match: ['^LISTWA ZACISKOWA']
        trusted: true
        features:
          - {match: '\b(\d+X\d+)\b', label: '{0}'}
          - {match: '\b(\d+)-TOROWA\b', label: '{0}-torowa'}
        attrs: [features, color]
      # --- reszta (akcesoria, sterowanie, osprzet): rzeczownik ze slow typu + reszta nazwy ---
      - key: inne
        noun_from: type_words
        match: ['.']
        series_raw: true
        # marka za rzeczownikiem, przed "do/z/na ..." (jak Kobi); caly opis bez zjadania powtorzen
        brand_before_prep: true
        series_all_segments: true
        series_limit: 12
        no_schema: true
        version_suffix: true
        attrs: [series]
