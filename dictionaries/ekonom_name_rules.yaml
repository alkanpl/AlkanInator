          - {code_match: '-BZ-', label: barwa zimna, group: cct}
          - {code_match: '-BC-', label: barwa ciepła, group: cct}
          - {match: 'B\.?\s?NEUTR|BIALY\s+NEUTRALNY', label: 4000K, group: cct}
          - {match: 'B\.?\s?ZIMN|BIALY\s+ZIMNY', label: barwa zimna, group: cct}
          - {match: 'KLOSZ MLECZN|\bMLECZN', label: klosz mleczny, group: klosz}
          - {match: 'KLOSZ PRZEZROCZYST|KLOSZ PRZEZROCZ', label: klosz przezroczysty, group: klosz}
