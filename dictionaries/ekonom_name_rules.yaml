      - {match: 'BIOLUX HCL LS\b', noun: Zestaw taśmy LED TW Zigbee, gender: m}  # LS = taśma (Light Strip)
      - {match: 'CHAIN KIT', noun: Zestaw łańcuchów, gender: m}
