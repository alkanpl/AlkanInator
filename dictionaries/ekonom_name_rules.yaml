          - {match: 'TROJGNIAZD|\b3 GNIAZD', label: 3 gn., group: gn}
          - {match: 'CZTEROGNIAZD|\b4 GNIAZD', label: 4 gn., group: gn}
          - {match: 'BEZ PRZEWODU', label: bez przewodu, group: len}
          - len
          - cable_set
          - {match: 'SCHUKO', label: Schuko, group: earth}
          - {match: '.', label: z uziemieniem, group: earth}
          - ip
        attrs: [features, color]
      - key: trojnik
        noun: Trójnik z wtyczką
        gender: m
        match: ['^TROJNIK']
        trusted: true
        features: [len, cable_set]
        attrs: [features, color]
      - key: rozgaleznik
        noun: Rozgałęźnik
        gender: m
        match: ['^ROZGALEZNIK']
        trusted: true
        features:
          - {match: '\b(\d)X2P', label: '{0} gn.', group: gn}
          - {match: 'TROJGNIAZD', label: 3 gn., group: gn}
          - {match: 'BEZ UZIEMIENIA', label: bez uziemienia, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
          - ip
        features_name:
          - {match: '\b(R-\d{2,3})\b', label: '{0}'}
        attrs: [features, color, features_name]
      - key: przewod
        noun: Przewód z wtyczką
        gender: m
        match: ['^PRZEWOD PRZYLACZ']
        trusted: true
        features_pre:
          - {match: 'PROSTA', label: prostą}
          - {match: 'UNI-?\s?SCHUKO', label: Unischuko}
        features: [len, cable_set]
        attrs: [features_pre, features, color]
      # ---------------------------------------------------------------- zlacza CEE i 230V
      - key: cee
        noun: Gniazdo
        gender: n
        match: ['^(?:GNIAZDO|WTYCZKA) (?:PRZENOSNA|PRZENOSNE|STALE|TABLICOWE SKOSNE|TABLICOWA|ODBIORNIKOWA|SILOWE?A?)', '^WTYK TABLICOWY', '^GNIAZDO TABLICOWE \d']
        trusted: true
        features:
          - cee
          - {match: 'KOMBI', label: + 1x230V}
          - cee_volt
          - {match: 'SZYBKOZLACZ', label: na szybkozłącze}
          - ip
        features_name:
          - {match: 'KOMBI', label: Kombi}
        attrs: [features, features_name]
      - key: gniazdo_vz
        noun: Gniazdo tablicowe 230V
        gender: n
        match: ['^GNIAZDO (?:TABLICOWE )?VZ', '^GNIAZDO WTYCZKOWE']
        trusted: true
        features:
          - {match: 'NA SZYNE TH35', label: na szynę TH35}
          - {match: 'SCHUKO', label: Schuko, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
          - ip
        features_name:
          - {match: '\bVZ\b', label: VZ}
        attrs: [features, color, features_name]
      - key: gniazdo_230
        noun: Gniazdo przenośne
        gender: n
        match: ['^GNIAZDO (?:GUMOWE|PLASKIE)']
        trusted: true
        features_pre:
          - {match: 'GUMOWE', label: gumowe}
          - {match: 'PLASKIE', label: płaskie}
        features:
          - {match: 'BEZ UZIEMIENIA', label: bez uziemienia, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
          - amp
          - ip
        features_name:
          - {match: '\bLUX\b', label: Lux}
        attrs: [features_pre, features, color, features_name]
      - key: wtyczka_230
        noun: Wtyczka
        gender: f
        match: ['^WTYCZKA (?:GUMOWA|PLASKA|WT-)']
        trusted: true
        features_pre:
          - {match: 'GUMOWA', label: gumowa}
          - {match: 'PLASKA', label: płaska}
        features:
          - {match: 'UNI-?\s?SCHUKO', label: Unischuko, group: earth}
          - {match: 'BEZ UZIEMIENIA', label: bez uziemienia, group: earth}
          - {match: 'Z UZIEMIENIEM', label: z uziemieniem, group: earth}
          - amp
          - ip
        features_name:
          - {match: '\bLUX\b', label: Lux}
          - {match: '\b(WT-\d+)', label: '{0}'}
        attrs: [features_pre, features, color, features_name]
      # ---------------------------------------------------------------- osprzet natynkowy BETA
      - key: beta
        noun: Wyłącznik
        gender: m
        match: ['^(?:WYLACZNIK|GNIAZDO) BETA']
        trusted: true
        # uklad z kodu (cennik 2026 ma bledy w zestawach: D.3114BGGW/1, D.3214GW2W2/1 opisane jak pojedyncze):
        # D.3<kolor>1<ramka><klapka>G..W.. - G = gniazdo (GG podwojne, GGG potrojne), W = jednobiegunowy,
        # W2 = swiecznikowy, WS / WK / WD = schodowy / krzyzowy / dzwonkowy; klapka BR / B / S / C, bez = dymna
        features_pre:
          - {code_match: '(?<!W)W2W2W2(?=C?(?:/1)?$)', label: potrójny świecznikowy, group: fn}
          - {code_match: '(?<!W)WW2W2(?=C?(?:/1)?$)', label: potrójny jednobiegunowy + 2x świecznikowy, group: fn}
          - {code_match: '(?<!W)WWW2(?=C?(?:/1)?$)', label: potrójny 2x jednobiegunowy + świecznikowy, group: fn}
          - {code_match: '(?<!W)WWW(?=C?(?:/1)?$)', label: potrójny jednobiegunowy, group: fn}
          - {code_match: '(?<!W)W2W2(?=C?(?:/1)?$)', label: podwójny świecznikowy, group: fn}
          - {code_match: '(?<!W)WW2(?=C?(?:/1)?$)', label: podwójny jednobiegunowy + świecznikowy, group: fn}
          - {code_match: '(?<!W)WW(?=C?(?:/1)?$)', label: podwójny jednobiegunowy, group: fn}
          - {code_match: '(?<!W)WS(?=C?(?:/1)?$)', label: schodowy, group: fn}
          - {code_match: '(?<!W)WK(?=C?(?:/1)?$)', label: krzyżowy, group: fn}
          - {code_match: '(?<!W)WD(?=C?(?:/1)?$)', label: dzwonkowy, group: fn}
          - {code_match: '(?<!W)W2(?=C?(?:/1)?$)', label: świecznikowy, group: fn}
          - {code_match: '(?<!W)W(?=C?(?:/1)?$)', label: jednobiegunowy, group: fn}
          # gniazdo bez lacznika: krotnosc przy rzeczowniku
          - {code_match: '^D\.3\d1\d[BRSC]*GGG(?:/1)?$', label: potrójne, group: gmult}
          - {code_match: '^D\.3\d1\d[BRSC]*GG(?:/1)?$', label: podwójne, group: gmult}
          - {match: 'SCHUKO', label: Schuko, group: earth}
        features:
          - {code_match: '^D\.3\d1\d[BRSC]*GGG\w*W', label: z gniazdem potrójnym, group: socket}
          - {code_match: '^D\.3\d1\d[BRSC]*GG\w*W', label: z gniazdem podwójnym, group: socket}
          - {code_match: '^D\.3\d1\d[BRSC]*G\w*W', label: z gniazdem, group: socket}
        features_post:
          - {match: 'DYMN\w* KLAPK|KLAPK\w* DYMN|\bDYMNYM\b', label: klapka dymna, group: flap}
          - {match: 'BIALA KLAPK', label: klapka biała, group: flap}
          - {match: 'BRAZOWA KLAPK|\bBRAZOWYM\b', label: klapka brązowa, group: flap}
          - {match: 'CZARNA KLAPK', label: klapka czarna, group: flap}
          - {match: 'SZARA KLAPK', label: klapka szara, group: flap}
          - ip
        # BETA1 w starych nazwach Ekonoma = ta sama seria (cennik 2026 pisze BETA dla tych kodow)
        features_name:
          - {match: '\bBETA1?\b', label: Beta, group: s}
        attrs: [features_pre, features, color, features_post, features_name]
      # ---------------------------------------------------------------- oprawy oswietleniowe
      - key: lampa_reczna
        noun: Lampa ręczna
        gender: f
        match: ['^OPRAWA RECZNA', '^LAMPA PL']
        trusted: true
