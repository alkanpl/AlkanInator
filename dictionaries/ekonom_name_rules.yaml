      # ---------------------------------------------------------------- przedluzacze i rozgalezniki
      # schemat V3 bebnowych: gniazda | dlugosc | przekroj | przewod | IP | uziemienie | nazwa wlasna | marka;
      # trojfazowe: wyjscia jak w rozdzielnicach (PCE)
      - key: przedluzacz_bebnowy
        noun: Przedłużacz bębnowy
        gender: m
        match: ['^PRZEDLUZACZ (?:NA BEBNIE|PBS?\b)']
