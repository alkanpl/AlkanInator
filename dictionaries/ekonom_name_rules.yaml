      - {match: 'WTYCZKA DO PRZEWODU', noun: Wtyczka do przewodu płaskiego łańcucha świetlnego, gender: f, types: [czesc_lancucha]}
      - {match: 'KONCOWKA', noun: Końcówka z haczykiem do łańcucha świetlnego, gender: f, types: [czesc_lancucha]}
      - {match: 'GNIAZDO PRZENOSNE', noun: Gniazdo przenośne do łańcucha świetlnego, gender: n, types: [czesc_lancucha]}
      - {match: 'PRZEWOD PLASKI', noun: Przewód płaski do łańcucha świetlnego, gender: m, types: [czesc_lancucha]}
      - {match: 'OKIENKO', noun: Okienko inspekcyjne, gender: n, types: [wyposazenie_rozdzielnic]}
      - {match: 'UCHWYT', noun: Uchwyt szyny TH35 do rozdzielnicy z okienkiem, gender: m, types: [wyposazenie_rozdzielnic]}
      - {match: 'BLOKADA', noun: Blokada otwierania okienka inspekcyjnego, gender: f, types: [wyposazenie_rozdzielnic]}
      - {match: 'SZYNA DIN', noun: Szyna DIN TH35 perforowana 2m, gender: f, types: [wyposazenie_rozdzielnic]}
      - {match: 'TABLICOWY', noun: Rozłącznik 0-1 tablicowy, gender: m, types: [rozlacznik]}
      - {match: 'KLICK-FIX', noun: Uchwyt Klick-Fix do lamp Mini / Standard / Maxi, gender: m, types: [oswietlenie_akcesoria]}
      - {match: '2 MAGNESY', noun: Uchwyt magnetyczny 2 magnesy do lampy Standard, gender: m, types: [oswietlenie_akcesoria]}
      - {match: '3 MAGNESY', noun: Uchwyt magnetyczny uchylny 3 magnesy do lampy Maxi, gender: m, types: [oswietlenie_akcesoria]}
      - {match: 'STATYW', noun: Statyw trójnożny do lamp przemysłowych, gender: m, types: [oswietlenie_akcesoria]}
      - {match: 'LAMPA RECZNA LED ZE', noun: Lampa ręczna LED, gender: f, types: [oswietlenie]}
      - {match: 'LAMPA CZOLOWA', noun: Lampa czołowa LED, gender: f, types: [oswietlenie]}
      - {match: 'RECZNA LEDOWA', noun: Lampa ręczna LED, gender: f, types: [oswietlenie]}
      - {match: 'PENLIGHT', noun: Lampa przemysłowa LED mini, gender: f, types: [oswietlenie]}
      - {match: 'LAMPA LED AKUMULATOR', noun: Lampa LED, gender: f, types: [oswietlenie]}
  # ===================================================================== Pawbol
  # Pawbol (od 2026-11-10, runda 1): `input/Nazwy Ekonom/Pawbol` - "katalog" (2120 kartotek w ukladzie Ekonoma) i "karto"
  # (288 nowych, zestawienie "<40> | <reszta>"), `--input <katalog>`. Zrodlo nazwy: cennik Pawbol 2026 (PDF z
  # pawbol.pl/strefa-klienta/cennik, 2003 kody), potem karta pawbol.pl (REST API WordPressa, typ `produkt`, kod w
  # komentarzu tresci) - scripts/fetch_pawbol_web.py -> cache/pawbol_web. Opis producenta jest jednolity ("Puszka
  # podtynkowa PK60, płytka 40mm, fi63, bez wkrętów, czarna, IP30") i zastepuje nazwe z Ekonoma; "Produkt wycofany"
  # w cenniku = dane tylko z nazwy w Ekonomie (jak produkty spoza feedu u innych dostawcow).
  # Wzor: rzeczownik + parametry + kolor + IP, nazwa wlasna serii (R-BOX 240 4S, S-BOX, PK60 Lux, Beta, Pantera) i
  # marka Pawbol na koncu, za nia tylko "op. N szt." (uchwyty, opaski). Rozdzielnice jak PCE: wyjscia (32/5, 2x16/5,
  # 2x230V), zabezpieczenia, przelacznik. Przedluzacze bebnowe wg schematu V3. Oprawy LED: BN = 4000K (karty EPREL
  # pawbol.pl), BZ / BC = "barwa zimna" / "barwa ciepła" (K nieznane); moc przy E27 to limit zarowki - pomijana.
  pawbol:
    brand: Pawbol
    brand_last: true
    capitalize_first: true
    squash_spaces: true
    params_web_loader: pawbol
    params_web_cache: cache/pawbol_web
    prefer_feed_name: always
    feed_name_cleanup: true
    # bledy cennika 2026 poprawione z kodu (Ekonom ma tu dobre dane)
    code_color_fix:
      - {code: '^E\.4132$', color: zolty, note: 'kolor żółta z kodu (LZ 10/Ż, w Ekonomie żółta); cennik Pawbol 2026: zielona'}
    code_notes:
      - {code: '^E\.4096/125$', note: 'przekrój 1x10-35mm2 jak w Ekonomie; cennik Pawbol 2026: "1x10-3mm2" (literówka)'}
      - {code: '^B\.1923$', note: 'wtyczka przenośna wg pawbol.pl i Ekonomu; cennik Pawbol 2026: wtyczka tablicowa (jak B.1919)'}
      - {code: '^E\.4316/54SZ$', note: 'szyna sztyftowa z kodu (SZ, w Ekonomie "sztyf."); cennik Pawbol 2026: widełkowa'}
      - {code: '^D\.3(?:114B?GGW2?|214(?:BR)?GGW|214BRGGW2|214GW2W2)/1$', note: 'układ z kodu (GG = gniazdo podwójne, W2W2 = podwójny świecznikowy, jak w Ekonomie); cennik Pawbol 2026 opisuje zestaw jak pojedynczy'}
    name_cleanup:
      - '(?i)\bPAWBOL\b'
      - '(?i)\s*-?\s*zamiana kodu na \S+'
      # skroty starych nazw odgromowych w Ekonomie
      - {match: '(?i)\boc\.\s?og\w*\.?(?:\s?\d+\b)?', repl: 'ocynk ogniowy'}
      - {match: '(?i)\boc\.\s?galw\w*\.?', repl: 'ocynk galwaniczny'}
      - {match: '(?i)\bocynkowana\s?ogniowo\b', repl: 'ocynk ogniowy'}
      - {match: '(?i)\bz/śr\b', repl: 'zacisk śrubowy'}
      - {match: '(?i)\bz/zg\b', repl: 'zacisk przez dogięcie'}
      - {match: '(?i)^Uziom\s?-\s?(?=\w)', repl: 'Uziom '}
      # cennik 2026 E.4096/125: "1x10-3mm2" (Ekonom i karta: 1x10-35)
      - {match: '\b1x10-3mm2', repl: '1x10-35mm2'}
      - {match: '(?i)\bH0([57])(RR|VV|RN)\s?-?\s?F(?=\s|\d|$)', repl: 'H0\1\2-F '}
      - {match: '×', repl: 'x'}
      - {match: '[–—]', repl: '-'}
      - {match: '[”“]', repl: '"'}
      - {match: '(?i)\bIP\s(\d\d)\b', repl: 'IP\1'}
      - {match: '(?i)\bKOMAPKT\b', repl: 'KOMPAKT'}
      - {match: '(?i)\bheremetyczna\b', repl: 'hermetyczna'}
      - {match: '(?i)\bgwitnu\b', repl: 'gwintu'}
      - {match: '(?i)\bgalwniczny\b', repl: 'galwaniczny'}
      - {match: '(?i)\bocynko\b', repl: 'ocynk'}
      - {match: '(?i)\btrójniazdowy\b', repl: 'trójgniazdowy'}
      - {match: '(?i)\bZłacze\b', repl: 'Złącze'}
      - {match: '(?i)\bOpawa\b', repl: 'Oprawa'}
      - {match: '(?i)\bszfki\b', repl: 'szafki'}
      - {match: '(?i)^oprawa\s?PANDA\s?Karo\s?LED', repl: 'Oprawa PANDA Karo LED '}
      # sklejenia w Ekonomie: "11S1x16/5", "5x230VzIP65", "2x230Vpuste okno"
      - {match: '(?i)\b(\d{1,2}S)(?=\d)', repl: '\1 '}
      # MAX BOX w Ekonomie: ",6Vz" / ",2Vz" = 6x230V / 2x230V, "63IP65" = 63A IP65, "4/40/0,04" = 30 mA
      - {match: '(?<=,)(\d{1,2})Vz\b', repl: '\1x230V'}
      - {match: '(?<=\dV)z(?=\s?IP|\s|$|,)', repl: ' '}
      - {match: '(?<=\d)IP(\d\d)\b', repl: ' IP\1'}
      - {match: '(?<=/)0,04\b', repl: '0,03'}
      # zapis wyjsc rozdzielnic: "1x32/5", "32A/5p", "16A5p" -> "1x32A/5P" (nie zabezpieczenie "B32/3")
      - {match: '(?i)(?<![\dBC.\-])(16|32|63|125)A?/([345])p?(?!\d)', repl: '\1A/\2P'}
      - {match: '(?i)(?<![\dBC.\-])(16|32|63|125)A([345])p\b', repl: '\1A/\2P'}
      - {match: '(?i)\b(\d+)\s?x\s?GZ\s?16A\s?\(2[35]0V\)', repl: '\1x250V'}
      - {match: '(?i)\b(\d+)\s?x\s?GZ\s?2[35]0V', repl: '\1x250V'}
      - {match: '(?i)(?<=\d)V(?=puste)', repl: 'V '}
      - {match: '(?i)(?<=\d)\s?mb\b', repl: 'm'}
      - {match: '(?i)\bb/dł\b', repl: 'bez dławików'}
      # Ekonom: rura "wymiar zewnętrzny = 25/ wymiar wewnętrzny = 19"
      - {match: '(?i)wymiar zewnętrzny\s?=\s?(\d+(?:,\d+)?)\s?/\s?wymiar wewnętrzny\s?=\s?(\d+(?:,\d+)?)', repl: '\1/\2mm'}
    noun_overrides:
      - {match: 'TELEINFORMATYCZNA', noun: Rozdzielnica teleinformatyczna, gender: f, types: [rozdzielnica_modulowa]}
      # puszki do plyt g-k (kod ...K, ...PG, -/68 "do płyt gipsowych") - inny produkt niz podtynkowa o tych samych wymiarach
      - {match: 'DO PUSTYCH SCIAN|\bG/?K\b|PLYT GIPSOW', noun: Puszka do pustych ścian, gender: f, types: [puszka_p_t]}
      # oprawy: OWAL z siatka = oprawa kanalowa; LED na plytce = "Plafon LED", na zarowke E27 = "Plafon"
      - {match: '\bOWAL\b.*\bLED\b|\bOWAL SLIM', noun: Oprawa kanałowa LED, gender: f, types: [oprawa]}
      - {match: '\bOWAL\b|KANALOWA', noun: Oprawa kanałowa, gender: f, types: [oprawa]}
      - {match: '\bLED\b', noun: Plafon LED, gender: m, types: [oprawa]}
      - {match: '^UCHWYT PASKOWY', noun: Uchwyt paskowy, gender: m, types: [uchwyt_montazowy]}
      - {match: '^UCHWYT DWUDZIELNY', noun: Uchwyt dwudzielny, gender: m, types: [uchwyt_montazowy]}
      # beben z gniazdami CEE (jak PCE)
      - {match: '\d{2,3}A/\dP', noun: Przedłużacz bębnowy trójfazowy, gender: m, types: [przedluzacz_bebnowy]}
      - {match: '\d{2,3}A/\dP', noun: Rozgałęźnik trójfazowy na bębnie, gender: m, types: [rozgaleznik_bebnowy]}
      # BETA: kod bez W = samo gniazdo
      - {code_match: '^D\.3\d1\d[BRSC]*G+(?:/1)?$', noun: Gniazdo, gender: n, types: [beta]}
      # B.1923: pawbol.pl i Ekonom = wtyczka przenosna 32A/3P (jak B.1922 16A), cennik 2026 kopiuje B.1919 tablicowa
      - {code_match: '^B\.1923$', noun: Wtyczka przenośna, gender: f, types: [cee]}
      # zlacza CEE: rodzaj z nazwy producenta (Ekonom: "Wtyczka siłowa", "Wtyk tablicowy", "Gniazdo siłowe")
      - {match: '^GNIAZDO PRZENOSNE', noun: Gniazdo przenośne, gender: n, types: [cee]}
      - {match: '^GNIAZDO (?:STALE|SILOWE)', noun: Gniazdo stałe, gender: n, types: [cee]}
      - {match: '^GNIAZDO TABLICOWE', noun: Gniazdo tablicowe skośne, gender: n, types: [cee]}
      - {match: '^WTYCZKA (?:PRZENOSNA|SILOWA)', noun: Wtyczka przenośna, gender: f, types: [cee]}
      - {match: '^(?:WTYCZKA TABLICOWA|WTYK TABLICOWY)', noun: Wtyczka tablicowa, gender: f, types: [cee]}
      - {match: '^WTYCZKA ODBIORNIKOWA', noun: Wtyczka odbiornikowa, gender: f, types: [cee]}
    name_replace:
      - {match: 'nadprądowymi z RCD', repl: 'nadprądowymi i RCD'}
    # czlony nazwy producenta bez wartosci dla sprzedawcy (`rest`)
    rest_drop:
      - '^\d{2,3}\s?V(?: AC| DC)?$'
      - '^IK\d\d$'
      - '^SAMOGASNAC'
      - '^\d{2}HZ$'
    housing_colors:
      zolto_zielony: {m: żółto-zielony, f: żółto-zielona, n: żółto-zielone, match: ['ZOLTO-\s?ZIEL', 'ZOLTOZIEL', 'Z/Z\b']}
      zolto_czerwony: {m: żółto-czerwony, f: żółto-czerwona, n: żółto-czerwone, match: ['ZOLTO-\s?CZERWON']}
      niebiesko_zolty: {m: niebiesko-żółty, f: niebiesko-żółta, n: niebiesko-żółte, match: ['NIEBIESKO\s?-\s?ZOLT']}
      niebiesko_zielony: {m: niebiesko-zielony, f: niebiesko-zielona, n: niebiesko-zielone, match: ['NIEBIESKO\s?-\s?ZIEL']}
      roznokolorowy: {m: różnokolorowy, f: różnokolorowa, n: różnokolorowe, match: ['ROZNOKOLOR']}
      przezroczysty: {m: przezroczysty, f: przezroczysta, n: przezroczyste, match: ['PRZEZROCZYST']}
      ciemnobrazowy: {m: ciemnobrązowy, f: ciemnobrązowa, n: ciemnobrązowe, match: ['CIEMNOBRAZ']}
      jasnobrazowy: {m: jasnobrązowy, f: jasnobrązowa, n: jasnobrązowe, match: ['JASNOBRAZ']}
      ciemnoszary: {m: ciemnoszary, f: ciemnoszara, n: ciemnoszare, match: ['CIEMNOSZAR']}
      bialy: {m: biały, f: biała, n: białe, match: ['\bBIAL[YAE]\b', '\bBIALYM\b']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['\bCZARN[YAE]\b', '\bCZARNYM\b']}
      szary: {m: szary, f: szara, n: szare, match: ['\bSZAR[YAE]\b', '\bSZARYM\b']}
      brazowy: {m: brązowy, f: brązowa, n: brązowe, match: ['\bBRAZOW[YAE]\b', '\bBRAZOWYM\b']}
      pomaranczowy: {m: pomarańczowy, f: pomarańczowa, n: pomarańczowe, match: ['POMARANCZ']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['\bCZERWON[YAE]\b']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['\bNIEBIESK(?:I|A|IE)\b']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['\bZIELON[YAE]\b']}
      zolty: {m: żółty, f: żółta, n: żółte, match: ['\bZOLT[YAE]\b']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['\bSREBRN[YAE]\b']}
      zloty: {m: złoty, f: złota, n: złote, match: ['\bZLOT[YAE]\b']}
    # BETA: kolor klapki to nie kolor obudowy; "biały ciepły / zimny" to barwa swiatla
    color_ignore: ['\b\w+ KLAPKA\b', '\bKLAPKA \w+\b', '\bDRZWI \w+\b', '\bPOKRYW\w* \w+\b', '\b\w+ POKRYW\w*\b', '\b\w+ DEKL\w*\b', '\bOB\.\.? ?BRAZ\w*\b', '\bOB\. ?SZAR\w*\b', '\bBIALY ?(?:CIEPLY|ZIMNY|NEUTRALNY)\b']
    # BETA bez koloru w nazwie (stare kartoteki "..., dymnym, ob. brąz"): kolor obudowy z kodu D.3<kolor>1..
    code_colors:
      - {code: '^D\.31[01][0-5][A-Z]', color: bialy}
      - {code: '^D\.32[01][0-5][A-Z]', color: brazowy}
      - {code: '^D\.36[01][0-5][A-Z]', color: szary}
      - {code: '^D\.37[01][0-5][A-Z]', color: czarny}
    feature_sets:
      ip:
        - {match: '\b(IP\d\d)\b', label: '{0}', group: ip}
      # puszki podtynkowe: IP20 / IP30 to norma - w nazwie tylko szczelne
      ip_tight:
        - {match: '\bIP([4-6]\d)\b', label: 'IP{0}', group: ip}
      # wyjscia rozdzielnic / bebnow: "2x32A/5P" -> "2x32/5", "1x32A/5P" -> "32/5" (jak PCE); wtyczka zasilajaca
      # "1xWTP16A/5P" nie jest wyjsciem
      outs:
        - {match: '(?<![\dA-Z])([2-9]|1\d)X125A/(\d)P', label: '{0}x125/{1}', group: o125}
        - {match: '(?<![\dA-Z])(?:1X)?125A/(\d)P', label: '125/{0}', group: o125}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X63A/(\d)P', label: '{0}x63/{1}', group: o63}
        - {match: '(?<![\dA-Z])(?:1X)?63A/(\d)P', label: '63/{0}', group: o63}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X32A/(\d)P', label: '{0}x32/{1}', group: o32}
        - {match: '(?<![\dA-Z])(?:1X)?32A/(\d)P', label: '32/{0}', group: o32}
        - {match: '(?<![\dA-Z])([2-9]|1\d)X16A/(\d)P', label: '{0}x16/{1}', group: o16}
        - {match: '(?<![\dA-Z])(?:1X)?16A/(\d)P', label: '16/{0}', group: o16}
        - {match: '(?<![\d/])\b(\d{1,2})X2[35]0\s?V', label: '{0}x230V', group: ogs}
      # bebny / rozgalezniki: jednofazowe "4 gn." (V3), trojfazowe - wyjscia jak w rozdzielnicy ("2x16/5 1x230V")
      drum_outs:
        - {match: '^(?!.*A/\dP).*?(?<![\dA-Z])(\d)X2[35]0V', label: '{0} gn.', group: gn}
        - {match: '(?<![\dA-Z])([2-9])X32A/(\d)P', label: '{0}x32/{1}', group: o32}
        - {match: '(?<![\dA-Z])(?:1X)?32A/(\d)P', label: '32/{0}', group: o32}
        - {match: '(?<![\dA-Z])([2-9])X16A/(\d)P', label: '{0}x16/{1}', group: o16}
        - {match: '(?<![\dA-Z])(?:1X)?16A/(\d)P', label: '16/{0}', group: o16}
        - {match: '^(?=.*A/\dP).*?(?<![\d/A-Z])(\d{1,2})X2[35]0\s?V', label: '{0}x230V', group: ogs}
      inlet:
        - {match: 'WTP\s?(\d+)A/(\d)P', label: 'z wtyczką {0}/{1}', group: inlet}
      switch:
        - {match: '(?:\b|\dX)L/P\b|\bL-0-P\b', label: z przełącznikiem L-0-P, group: sw}
        - {match: '(?<!\d)0/1\b', label: z rozłącznikiem 0-1, group: sw}
      # "zabezp. 1xM.01-B32/3, 1xM.02-4/40/0,03" = wylaczniki nadpradowe i RCD 4P 40A 30mA ("z RCD" po
      # nadpradowych zamienia `name_replace` na "i RCD")
      prot:
        - {match: 'M\.01-|ZAB\w*\.?\s?ROZN|ZABEZP\w*\.?\s+\d?X?\s?B\s?\d|\bB\d{2}/[13]\b', label: z wył. nadprądowymi, group: mcb}
        - {match: '\+\s?ZAB(?:EZPIECZENIA)?\b|ZABEZP(?![\w.]*\s*\d?X?M\.02)', label: z zabezpieczeniami, group: mcb}
        - {match: '(?:M\.02-)?(?<!\d)[24]/(\d{2})/0,03', label: 'z RCD {0}A', group: rcd}
      termik:
        - {match: 'BEZ TERMIKA', label: bez termika, group: termik}
        - {match: 'TERMIK|WYL\.?\s?TERM', label: z termikiem, group: termik}
      cable_set:
        - {match: '\b([235])X(\d+(?:,\d+)?)\s?(?:MM2?)?\b(?!/)', label: '{0}x{1}mm2', group: cross}
        - {match: '\bH07RN', label: guma H07RN-F, group: cable}
        - {match: '\bH05R[RN]', label: guma, group: cable}
        - {match: '\bH05VV', label: PVC, group: cable}
      len:
        - {match: '-\s?(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
        - {match: '(?<![\dX,/])(\d+(?:,\d+)?)\s?M\b', label: '{0}m', group: len}
      pack:
        - {match: '\b(\d+)\s?SZT\b', label: 'op. {0} szt.', group: pack}
      amp:
        - {match: '\b(\d{2,3})A\b', label: '{0}A', group: amp}
      cee:
        - {match: '(?<!\d)(\d{2,3})A/(\d)P\b', label: '{0}A {1}P', group: cee}
      cee_volt:
        - {match: '\b400V\b', label: 400V, group: volt}
        - {match: '\b2[35]0V\b', label: 230V, group: volt}
    types:
      # ---------------------------------------------------------------- rozdzielnice budowlane
      - key: slupek
        noun: Słupek ogrodowy
        gender: m
        match: ['^(?:ROZDZIELNICA )?SLUPEK OGRODOWY']
        trusted: true
        features_pre:
          - {match: '\bDUZY\b', label: duży, group: size}
          - {match: '\bMALY\b', label: mały, group: size}
        features: [outs, switch, prot]
        features_post: [ip]
        attrs: [features_pre, features, color, features_post]
      - key: rozdzielnica
        noun: Rozdzielnica
        gender: f
        match: ['R-BOX', 'MAX[ -]?BOX', 'MULTI-BOX']
        exclude: ['^(?:STOJAK|PODSTAWA|OKIENKO)']
        trusted: true
        features: [outs, inlet, switch, prot, termik]
        features_post:
          - {match: 'PRZEWOD', label: z przewodem}
          # R w modelu = z raczka (cennik B.18.190-1R "+ rączka", Ekonom B.1703 "b/R" przy B.1703R)
          - {match: 'RACZK', label: z rączką, group: handle}
          - {match: '\bB/R\b', label: bez rączki, group: handle}
          - {code_match: '^B\.17\d\dR', label: z rączką, group: handle}
          # "+ 2x podstawka" / "podstawa stalowa (komplet 2 szt.)" (-PS) i "+ 1x podstawka" / "-1szt" (-PS_1)
          - {match: '2X PODSTAWK|KOMPLET 2 SZT', label: z 2 podstawami, group: base}
          - {match: 'PODSTAW', label: z podstawą, group: base}
          - ip
        features_name:
          - {match: 'R-BOX (SLIM(?:BR)?|MINI|KOMPAKT)\b(?:\s?/?\s?(\d{1,2}S)\b)?', label: 'R-BOX {0} {1}', group: s}
          - {match: 'R-BOX LUX[- ]?(\d{3})R?\b.*?\b(\d{1,2}S)\b', label: 'R-BOX LUX {0} {1}', group: s}
          - {match: 'R-BOX (\d{3})(BR)?R?\b.*?\b(\d{1,2}S)\b', label: 'R-BOX {0}{1} {2}', group: s}
          - {match: 'R-BOX (\d{3})(BR)?', label: 'R-BOX {0}{1}', group: s}
          - {match: 'MAX[- ]?BOX[- ](\d{1,2}S)', label: 'MAX-BOX {0}', group: s}
          - {match: 'MULTI-BOX[- ](\d{1,2}S)', label: 'MULTI-BOX {0}', group: s}
        attrs: [features, features_post, features_name]
      - key: szafka_rozdzielcza
        noun: Szafka rozdzielcza hermetyczna
