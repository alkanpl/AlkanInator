        attrs: [features]
  # PCE (od 2026-11-10, runda 1): `input/Nazwy Ekonom/PCE` - "karto" to same pozycje uslugowe (KGO, marketing, samochody),
  # produkty sa tylko w "katalog" (577 kartotek w ukladzie Ekonoma) - przebieg na tym pliku. Bez zrodla danych poza nazwa.
  # Zlacza CEE: bieguny skrotem branzowym (2P+Z = 3P, 3P+Z = 4P, 3P+Z+N = 5P, 5P+Z+N = 7P), nazwa wlasna serii
  # (Shark / Shark TT / Grip / Power Twist / Twist / Nautilus / Taurus2 / S-Nova / P-Nova+ / Design / Combo-Pol / Kombi).
  # Rozdzielnice budowlane: wyjscia (32/5, 16/5, Nx230V = gniazda GS), zabezpieczenia (RCD / RCBO / wyl. nadpradowe /
  # bez zabezpieczen), nazwa wlasna typu (Adamow, Szubin...). Przedluzacze bebnowe wg schematu V3 (jak Elgotech).
  pce:
    brand: PCE
    brand_last: true
    capitalize_first: true
    name_cleanup:
      - {match: '(?i)\bIP\s(\d\d)\b', repl: 'IP\1'}
      - {match: '(?i)(?<=\d)P\.\+', repl: 'P+'}
      - {match: '(?i)\b(\d) P\+Z', repl: '\1P+Z'}
      - {match: '(?i)\b(\d+) A\b', repl: '\1A'}
      - {match: '(?i)(\d)\.(\d{3})\s?mAh', repl: '\1\2mAh'}
      - {match: '\*', repl: 'x'}
      - {match: '(?<=\d)\.(?=\d)', repl: ','}
      - {match: '(?i)(\d)\s?mb\b', repl: '\1m'}
      - {match: '(?i)podtynkoweprzelotowe', repl: 'podtynkowe przelotowe'}
      # sklejenia na 40. znaku: "gniazdo tablicowe16A", "125A 400V" + "3P+Z", "3P+Z" + ".+N"
      - {match: '(?i)(tablicowe)(?=\d)', repl: '\1 '}
      - {match: '(?<=\dV)(?=\d)', repl: ' '}
      - {match: '(?i)\+Z\.\+N', repl: '+Z+N'}
      # Opole / Koszalin: "32/5*B 2*16*B 5GS*4B" = 32/5xB32, 2x16/5xB16, 5 gniazd 230V
      - {match: '(?i)(?<=\s)(\d)x16xB\b', repl: '\1x16/5xB'}
      - {match: '(?i)(?<=\s)16xB\b', repl: '16/5xB'}
      # zasilanie wtyczka CEE ("Wejście 16/5+1,5M", "wtyczka 32/5 – wyjście") nie jest wyjsciem rozdzielnicy / bebna
      - {match: '(?i)Wej(?:ście|scie)?:?\s*(\d+)/5', repl: 'wtyk \1-5'}
      - {match: '(?i)wtyczka (\d+)/5', repl: 'wtyk \1-5'}
      # wtyczka przewodu zasilajacego bebna ("wtyczka gumowa 16A IP54") - jej IP to nie IP bebna
      - {match: '(?i)\s*wtyczka (?:gumowa|zalewana) 16A(?: IP\d\d)?', repl: ' '}
    # Bledy opisow w Ekonomie poprawione wg zrodel (przeglad 2026-11-10) - wartosc daje cecha z `code_match` w typie,
    # `code_notes` dopisuje uwage ze zrodlem i WARNING:
    # - wtyczki tablicowe 613 / 623 / 6132 / 6232: 3P (2P+PE) 6h = 230V (pcelectric.at 6232-6v, Farnell / karta 613-6),
    #   Ekonom pisze 400V
    # - 75132-6: IP66/IP67 (pcelectric.at), Ekonom IP44 jak 7513-6
    # - 8615: wtyczka ze zwrotnica faz jak 7715, z dwoma wprowadzeniami przewodu (certyfikat OVE 43-223)
    # - puszki Light -171: Ekonom skopiowal opis -161 (162x116x76); Onninen / TME: 155x179x100. EX-088 opisana jak
    #   EX-111 (108x108x64), a to rozmiar EP-088 (TME: EX-088 i EP-088 88x88x52; w Ekonomie EP-088 84x84x50)
    # 90EKO006 i 90EKO010 maja na pce.pl identyczne parametry (2x16/5, 4 gn. typ F, 204x255x114) - zostaja jedna nazwa.
    code_notes:
      - {code: '^6[12]32?-6$', note: 'napiecie 230V z karty producenta (3P 2P+PE 6h); w Ekonomie 400V'}
      - {code: '^75132-6$', note: 'IP67 z karty pcelectric.at (IP66/IP67); w Ekonomie IP44'}
      - {code: '^8615-6$', note: '2 wprowadzenia przewodu wg certyfikatu OVE (8615 = 7715 z dwoma wprowadzeniami)'}
      - {code: '^E[VXL]T?-171$', note: 'wymiary 155x179x100 z Onninen / TME (baza PCE: korpus GS*-171 155x179); w Ekonomie 162x116x76 jak -161'}
      - {code: '^EX-088$', note: 'wymiary jak EP-088; w Ekonomie 108x108x64 jak EX-111'}
      # Kontrola wszystkich nazw z baza produktow PCE (pce.pl > Pliki BMEcat > baza XLS, etim-mapper, 2026-11-10):
      # poprawiane tylko to, co stoi w nazwie / opisie producenta; IP54 z samego ETIM (rozdzielnice budowlane, gumowe
      # 0511 / 0522 / 2511) zostaje jak w Ekonomie i jest w raporcie kontroli
      - {code: '^90PV\d+$', note: 'IP65 z nazwy producenta (obudowa CDP..PT/RR IP65); w Ekonomie IP54 z naglowka grupy'}
      - {code: '^(?:7202800|720800|430180620|450020)$', note: 'IP z bazy PCE; w Ekonomie IP54 z naglowka grupy "OSWIETLENIE PRZEMYSLOWE"'}
      - {code: '^2571[12]-sr$', note: 'klapka / zatyczka wg nazwy producenta (25711 = z klapka, 25712 = z zatyczka); w Ekonomie odwrotnie'}
      - {code: '^(?:0512-sr|05721-sr|24711-sr)$', note: 'IP54 z nazwy producenta; w Ekonomie IP44'}
      - {code: '^9769215W$', note: 'IP54 z nazwy producenta; w Ekonomie IP44'}
      - {code: '^92503H48153$', note: 'IP54 z nazwy producenta (XREEL250 50M OWY3*1.5 4GS IP54); w Ekonomie IP44'}
    housing_colors:
      zolto_czerwony: {m: żółto-czerwony, f: żółto-czerwona, n: żółto-czerwone, match: ['ZOLT[OE]-\s?CZERWON']}
      srebrno_czarny: {m: srebrno-czarny, f: srebrno-czarna, n: srebrno-czarne, match: ['SREB?R?NO-\s?CZARN']}
      szaro_czarny: {m: szaro-czarny, f: szaro-czarna, n: szaro-czarne, match: ['SZARO-\s?CZARN']}
      czerwony: {m: czerwony, f: czerwona, n: czerwone, match: ['CZERWON']}
      czarny: {m: czarny, f: czarna, n: czarne, match: ['CZARN']}
      bialy: {m: biały, f: biała, n: białe, match: ['\bBIAL[YAE]\b']}
      niebieski: {m: niebieski, f: niebieska, n: niebieskie, match: ['NIEBIESK']}
      szary: {m: szary, f: szara, n: szare, match: ['\bSZAR[YAE]\b']}
      srebrny: {m: srebrny, f: srebrna, n: srebrne, match: ['SREBRN']}
      zielony: {m: zielony, f: zielona, n: zielone, match: ['ZIELON']}
    feature_sets:
      amp:
        - {match: '\b(\d{2,3})A\b', label: '{0}A', group: amp}
      poles:
        - {match: '5P\+Z\+N', label: 7P, group: poles}
        - {match: '3P\+Z\+N', label: 5P, group: poles}
        - {match: '3P\+Z', label: 4P, group: poles}
        - {match: '2P\+Z', label: 3P, group: poles}
        - {match: '\b([2-7])P\b(?!\+)', label: '{0}P', group: poles}
      volt:
        - {match: '24V/=', label: 24V DC, group: volt}
        - {match: '24V/~', label: 24V AC, group: volt}
        - {match: '(?<!\+ )\b(230|400)\s?V\b', label: '{0}V', group: volt}
      # pierwsze IP w nazwie (seria rozdzielnicy / bebna), "IP44/54", "IP66/67"
      ip:
        - {match: '\b(IP(?:\d\d|X\d)(?:/\d\d)?)\b', label: '{0}', group: ip}
      # ostatnie IP: "WTYCZKI ... IP44 16A 24V 2P IP67", "GNIAZDO Z WYLACZNIKIEM ... IP44 16A 400V 3P+Z IP67"
      ip_last:
        - {match: '.*\b(IP(?:\d\d|X\d)(?:/\d\d)?)\b', label: '{0}', group: ip}
      cee_series:
        - {match: 'POWER TWIST', label: Power Twist, group: series}
        - {match: '\bSHARK TT\b', label: Shark TT, group: series}
        - {match: '\bSHARK\b', label: Shark, group: series}
        - {match: '\bGRIP TT\b', label: Grip TT, group: series}
        - {match: '\bGRIP\b', label: Grip, group: series}
        - {match: '\bTWIST TT\b', label: Twist TT, group: series}
        - {match: '\bTWIST\b', label: Twist, group: series}
      # wyjscia rozdzielnic i bebnow trojfazowych: "2x16/5x2xB16", "32/5xB32", "2xGSx2xB16", "4GS", "GSxTOPIK"
      outs:
        - {match: '\b(\d)X63/5', label: '{0}x63/5', group: o63}
        - {match: '(?<![\dX-])63/5', label: '63/5', group: o63}
        - {match: '\b(\d)X32/5', label: '{0}x32/5', group: o32}
        - {match: '(?<![\dX-])32/5', label: '32/5', group: o32}
        - {match: '\b(\d)X16/5', label: '{0}x16/5', group: o16}
        - {match: '(?<![\dX-])16/5', label: '16/5', group: o16}
        # "16/5 GS" = 16/5 i jedno gniazdo 230V, a nie 5 gniazd
        - {match: '(?<![/\d])\b(\d)\s?X?\s?GS(?![A-WYZ])', label: '{0}x230V', group: ogs}
        - {match: '(?<![\dX])GS(?![A-WYZ])', label: '1x230V', group: ogs}
      prot:
        - {match: 'CKN6-C(\d+)/0,03', label: 'z RCBO C{0} 30mA', group: prot}
        - {match: '\bFI\s?(\d{2,3})', label: 'z RCD {0}A', group: prot}
        - {match: '(?:/5|GS)X(?:\d?X?)[BC]', label: z wył. nadprądowymi, group: prot}
        - {match: 'BEZ ZABEZP', label: bez zabezpieczeń, group: prot}
      switch:
        - {match: 'R\.\s?L-[0O]-P', label: z przełącznikiem L-0-P, group: sw}
        - {match: 'R\.\s?0-1', label: z rozłącznikiem 0-1, group: sw}
      fuse:
        - {match: 'TOPIK (\d+)A', label: 'z bezpiecznikiem {0}A', group: fuse}
      termik:
        - {match: '\bTER\.|TERMIK', label: z termikiem, group: termik}
      drum_len:
        - {match: '\b(\d+)\s?M\b', label: '{0}m', group: len}
      drum_cable:
        - {match: '\b([35])X(\d+(?:,\d+)?)(?![\d/,])', label: '{0}x{1}mm2', group: cross}
        - {match: '\bH07RN', label: guma H07RN-F, group: cable}
        - {match: '\bH05RR', label: guma, group: cable}
        - {match: '\bH05VV', label: PVC, group: cable}
      board_names:
        - {match: '\bADAMOW\b', label: Adamów, group: name}
        - {match: '\bPIESZYCE\b', label: Pieszyce, group: name}
        - {match: '\bSWINOUJSCIE\b', label: Świnoujście, group: name}
        - {match: '\bNYSA\b', label: Nysa, group: name}
        - {match: '\bDZIERZONIOW\b', label: Dzierżoniów, group: name}
        - {match: '\bHEL\b', label: Hel, group: name}
        - {match: '\bKOLO\b', label: Koło, group: name}
        - {match: '\bPLOCK\b', label: Płock, group: name}
        - {match: '\bMLAWA\b', label: Mława, group: name}
        - {match: '\bMIKOLAJKI\b', label: Mikołajki, group: name}
        - {match: '\bLESZNO\b', label: Leszno, group: name}
        - {match: '\bLUBLIN\b', label: Lublin, group: name}
        - {match: '\bSZUBIN\b', label: Szubin, group: name}
        - {match: '\bSTAR\b', label: Star, group: name}
        - {match: '\bKOS(?:ZALIN)?\b', label: Koszalin, group: name}
        - {match: '\bSUWALKI\b', label: Suwałki, group: name}
        - {match: '\bSLUPSK\b', label: Słupsk, group: name}
        - {match: '\bPEGASUS\b', label: Pegasus, group: name}
        - {match: '\bECOLINE\b', label: Ecoline, group: name}
        - {match: '\bOPOLE\b', label: Opole, group: name}
        - {match: '\bXREEL\b', label: XREEL, group: name}
        - {match: '\bJAWOR\b', label: Jawor, group: name}
        - {match: '\bKLODZKO\b', label: Kłodzko, group: name}
        - {match: '\bZABKOWICE\b', label: Ząbkowice, group: name}
        - {match: '\bGLOGOW\b', label: Głogów, group: name}
      flap:
        - {match: 'ZATYCZK', label: z zatyczką, group: flap}
        - {match: 'KLAPK', label: z klapką, group: flap}
        - {match: 'POKRYW', label: z pokrywą, group: flap}
      # jednofazowe 10/16A: "z zab. bocznym VDE" = Schuko, "z bolcem" = uziemienie bolcem (gniazdo francuskie)
      earth1:
        - {match: 'UNI-?\s?SCHUKO', label: Unischuko, group: earth}
        - {match: 'ZAB\.?\s?BOCZN|\bVDE\b|(?<!UNI-)SCHUKO', label: Schuko, group: earth}
        - {match: 'Z\s+BOLCEM|2P\+Z', label: z uziemieniem, group: earth}
      rubber_f:
        - {match: 'PELNA GUMA|W PELNI GUMOW', label: pełnogumowa, group: mat}
        - {match: 'GUMOW', label: gumowa, group: mat}
      rubber_n:
        - {match: 'PELNA GUMA|W PELNI GUMOW', label: pełnogumowe, group: mat}
        - {match: 'GUMOW', label: gumowe, group: mat}
      rubber_m:
        - {match: 'PELNA GUMA|W PELNI GUMOW', label: pełnogumowy, group: mat}
        - {match: 'GUMOW', label: gumowy, group: mat}
      phase_inv:
        - {match: 'ZWROTNICA FAZ', label: ze zwrotnicą faz}
    types:
      - key: zatyczka
        noun: Zatyczka do wtyczki 16/5 i 16/7
        gender: f
        match: ['^ZATYCZKA']
        trusted: true
        features: [ip]
        attrs: [features]
      - key: lancuch_swietlny
        noun: Łańcuch świetlny
        gender: m
        match: ['^LS0\d']
        trusted: true
        features:
          - {match: '\b(\d+)M\b', label: '{0}m'}
          - {match: '\b(\d+) OPRAW E-?27', label: '{0}xE27'}
          - ip
          - {match: 'HACZYK', label: z haczykiem}
          - {match: 'GNIAZDEM PRZENOSN', label: z gniazdem przenośnym}
          - {match: 'BEZ ZAROWEK', label: bez żarówek, group: bulb}
          - {match: 'Z ZAROWKAMI.*?(\d+)W', label: 'z żarówkami {0}W', group: bulb}
        features_name:
          - {match: '\b(LS0\d)\b', label: '{0}'}
        attrs: [features, features_name]
      - key: czesc_lancucha
        noun: Część do łańcucha świetlnego
        gender: f
        match: ['^CZESCI DO LANCUCHA']
        trusted: true
        features:
          - {match: '\b(\d)\s?X\s?(\d(?:,\d)?)\s?MM2', label: '{0}x{1}mm2'}
        attrs: [features, color]
      - key: wtyczka_1f
        noun: Wtyczka
