          - {match: '\bTRIO\b', label: Trio, group: m}
        attrs: [features, features_color, features_post, features_name]
      - key: czujnik
        noun: Czujnik ruchu radarowy
        gender: m
        match: ['^RADAROWY CZUJNIK']
        trusted: true
        features_pre:
          - {match: '\bMINI\b', label: mini}
