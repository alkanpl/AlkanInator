          - {match: 'SIATKA PLASTIK|SIATKA PLASTIKOW|Z SIATKA', label: z siatką plastikową, group: net}
        features_color:
          - {match: 'PIERSCIEN SREBRN|SREBRN\w* PIERSCIEN', label: {m: srebrny, f: srebrna}, group: col}
          - {match: 'PIERSCIEN CZARN|CZARN\w* PIERSCIEN', label: {m: czarny, f: czarna}, group: col}
          - {match: 'PIERSCIEN ZLOT|ZLOT\w* PIERSCIEN', label: {m: złoty, f: złota}, group: col}
          - {match: 'PIERSCIEN BIAL|BIAL\w* PIERSCIEN', label: {m: biały, f: biała}, group: col}
          - {match: 'PODSTAWA SREBRN|SREBRN\w* PODSTAW', label: {m: srebrny, f: srebrna}, group: col}
          - {match: 'PODSTAWA CZARN|CZARN\w* PODSTAW', label: {m: czarny, f: czarna}, group: col}
          - {match: 'PODSTAWA SZAR|SZAR\w* PODSTAW', label: {m: szary, f: szara}, group: col}
          - {match: 'PODSTAWA ZLOT|ZLOT\w* PODSTAW', label: {m: złoty, f: złota}, group: col}
          - {match: 'PODSTAWA BIAL|BIAL\w* PODSTAW', label: {m: biały, f: biała}, group: col}
        features_post:
          - {match: 'CZUJN\w*\.?\s?RUCH|\bRUCH\b|RADAROWY', label: z czujnikiem ruchu, group: sensor}
