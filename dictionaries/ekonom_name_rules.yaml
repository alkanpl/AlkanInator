      - key: beben
        noun: Bęben pusty plastikowy
        gender: m
        match: ['^BEBEN PUSTY']
        trusted: true
        features:
          - {match: '\bFI\s?(\d{3})\b', label: 'fi{0}'}
        attrs: [features, color]
      - key: dysk
        noun: Dysk środkowy do bębna
        gender: m
        match: ['^DYSK SRODKOWY']
        trusted: true
        features:
          - {match: '(\d)X2[35]0V', label: '{0} gn.'}
          - {match: 'SCHUKO', label: Schuko, group: earth}
          - {match: '\dX2[35]0V', label: z uziemieniem, group: earth}
          - termik
          - ip
