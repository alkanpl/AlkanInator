      - {match: 'SENSOR REMOTE CONTROL', noun: Pilot do czujnika, gender: m}
      # 2026-10-21: byly "Oprawa do TruSys" (CHAIN KIT), "Oprawa do EM Exit" (FLAG KIT), "Oprawa COMPACT BATTERY", ramki
      # natynkowe i wpuszczane paneli rozroznione tylko wersja "RECESSED FRAME" / "SURFACE KIT H75"
