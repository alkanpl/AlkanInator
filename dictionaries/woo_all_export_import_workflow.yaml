    ekranowany: "pa_ekranowany"
    uziemienie: "pa_uziemienie"
    typ_zaciskow: "pa_typ-zaciskow"
    napiecie_v: "pa_napiecie-v"
    prad_znamionowy_a: "pa_prad-znamionowy-a"
    liczba_biegunow: "pa_liczba-biegunow"
