version: 1
updated_at: "2026-08-24"
purpose: "Trwala zasada przygotowywania plikow aktualizacyjnych WooCommerce w projekcie AlkanInator."

workflow:
  export_plugin: "WP All Export"
  import_plugin: "WP All Import"
  do_not_use_for_updates: "Wbudowany importer CSV produktow WooCommerce"
  canonical_template: "input/Hager-Berker-Gniazdka.xlsx"
  file_format: "XLSX"

canonical_structure:
  worksheet_name: "Worksheet"
  header_row: 1
  source_rows_in_reference: 1920
  source_columns_in_reference: 153
  identity_columns:
    - "id"
    - "SKU"
  attribute_value_pattern: "Atrybut Produktu: <nazwa atrybutu>"
  attribute_declarations_column: "Product Attributes"
  tags_column: "Product Tags"
  up_sells_column: "Up-Sells"
  cross_sells_column: "Cross-Sells"

rules:
  - "Zawsze zaczynaj od pelnej kopii pliku wyeksportowanego przez WP All Export."
  - "Zachowaj wszystkie produkty, arkusz, naglowki, kolejnosc kolumn i wartosci nieobjete zadaniem."
  - "Modyfikuj tylko jawnie wskazane kolumny; nie tworz minimalnego CSV dla importera WooCommerce."
  - "Wartosci atrybutow zapisuj w kolumnach Atrybut Produktu: <nazwa>."
  - "Jesli atrybut jest nowy dla produktu, dodaj jego globalna deklaracje pa_* do serializowanej tablicy PHP w Product Attributes."
  - "Nowy globalny atrybut ma is_visible=1, is_variation=0 i is_taxonomy=1, o ile zadanie nie stanowi inaczej."
  - "Dopisuj nowe tagi do Product Tags bez usuwania tagow istniejacych, z wyjatkiem tagu 'pusty opis fb', ktory zawsze usuwaj z przyszlych plikow wynikowych."
  - "Nie zmieniaj Up-Sells ani Cross-Sells, jezeli nie sa zakresem zadania."
  - "Produkty przeznaczone tylko do wyprzedazy i oznaczone jako stare duplikaty pozostaw bez tagow wariantowych i nowych atrybutow."
  - "Kolor Producenta jest szczegolowa osia wariantu; Kolor jest ogolnym filtrem klienta (np. antracyt -> czarny)."
  - "Gdy kilka wykonczen ma ten sam ogolny Kolor, rozrozniaj i lacz warianty po Kolorze Producenta, nie po ogolnym Kolorze."
  - "Produkty tej samej rodziny funkcjonalnej moga byc laczone takze po bezpiecznych osiach technicznych, jezeli kazdy wariant ma kompletna i unikalna kombinacje wartosci."
  - "Wtyczka wariantowa zmienia jedna os naraz: wszystkie pozostale osie musza miec identyczne wartosci w produkcie zrodlowym i docelowym."
  - "Nie lacz grupy zlozonej z dwoch produktow, jezeli produkty roznia sie na wiecej niz jednej osi wariantu."
  - "W wiekszej grupie odrzuc produkt bez zadnego sasiada rozniacego sie dokladnie jedna osia; taki produkt bylby nieprzelaczalny."
  - "Walidacja pliku wynikowego musi wykrywac uszkodzone polskie znaki (mojibake) i zachowywac tekst w UTF-8."

