hager_berker_cross_up_sell:
  generator: "src/build_hager_berker_catalog_cross_upsell.py"
  source_example: "output/Hager-Berker-Gniazdka_WOO_ALL_IMPORT_OSIE_POPRAWIONE.xlsx"
  catalog_source: "input/21PL001_Katalog_Osprzet_Hager_2021.pdf"
  output_example: "output/Hager-Berker-Gniazdka_WOO_ALL_IMPORT_CROSS_UP_SELL_KATALOG.xlsx"
  report_example: "reports/hager_berker_cross_up_sell_katalog/cross_up_sell_katalog_report.xlsx"
  separator: "|"
  limits:
    cross_sells_per_product: 4
    up_sells_per_product: 3
  rules:
    - "Przy zadaniu cross-sell/up-sell wyczysc obie dotychczasowe kolumny i wygeneruj relacje od nowa w nowej kopii pelnego eksportu."
    - "Kompatybilnosc Hager/Berker potwierdzaj w katalogu PDF z input; jawne sekcje Wspolpracuje z maja pierwszenstwo przed regulami heurystycznymi."
    - "Przy skroconych kodach katalogowych uwzgledniaj wskazany numer strony docelowej, aby nie laczyc akcesoriow z innej serii o wspolnym prefiksie kodu."
    - "Cross-sell oznacza element uzupelniajacy: zgodna ramka, klawisz, plytka, mechanizm lub potwierdzone akcesorium."
    - "Dla elementow wzorniczych wymagaj zgodnej serii i Koloru Producenta; dla mechanizmu wymagaj jednoznacznej zgodnosci funkcji."
    - "Up-sell musi zachowac funkcje, glowna rodzine wzornicza, kolor i krotnosc oraz poprawiac co najmniej jedna ceche."
    - "Dopuszczalne ulepszenia to m.in. podswietlenie, wyzszy IP, przeslony, wyzsza kategoria sieciowa, ekranowanie lub wieksze mozliwosci."
    - "Dla gniazd zasilajacych rozszerzony up-sell jest dozwolony tylko w tej samej normie gniazda; wersja docelowa moze dodawac IP44, przeslony lub podswietlenie, ale nie moze tracic pokrywy, pola opisowego, samozaciskow ani sygnalizacji kontrolnej."
    - "Dla RJ45 dopuszczaj up-sell do wyzszej kategorii i/lub wersji ekranowanej przy zachowaniu liczby portow i rodzaju zlacza; nie lacz RJ11, VGA, USB ani gniazd zasilajacych jako zamiennikow RJ45."
    - "Nie lacz produktu z samym soba, starym duplikatem, nieistniejacym SKU ani produktem z tej samej grupy wariantowej."
    - "Cross-Sells i Up-Sells jednego produktu musza byc rozlaczne; up-sell jest kierunkowy."
    - "Waliduj zachowanie wszystkich komorek poza zakresem zadania i brak uszkodzonych polskich znakow."
