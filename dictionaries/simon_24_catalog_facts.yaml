# Fakty o zgodnosci i akcesoriach Simon 24 z katalogu producenta
# "Osprzet elektroinstalacyjny Simon 24. Katalog produktow (ver. 26.01)"
# (link w API e-katalogu: documents -> Katalog). Trafiaja do briefow opisow
# jako "Pasuje do" (Compatibility facts) - nie sa cechami samego produktu.
# Wartosci po polsku z diakrytykami, bo agent opisow cytuje je w tekscie.
# Klucz: symbol bazowy bez koloru (NW1.01, NW6.01/X, NR2...).
source: "Kontakt-Simon, katalog Simon 24 ver. 26.01"

# Dla modulow (parametr API "Typ produktu" = "moduł").
module: >-
  Moduł serii Simon 24 montowany w ramkach Simon 24 NR1–NR5 (od 1- do 5-krotnych).

# Dla modulow z mocowaniem Push In (parametr API "montaż" = "mocowanie Push In").
push_in: >-
  Mocowanie Push In: montaż bez użycia wkrętów i stabilne osadzenie w puszce, według producenta
  nawet trzykrotnie szybszy montaż niż przy tradycyjnym mocowaniu; możliwe poziomowanie modułu
  po montażu; w puszkach wielokrotnych zespolonych i w puszkach do ścian g-k montaż przy
  zablokowanej łapce z użyciem wkrętów; do zestawów wielokrotnych poziomica montażowa NRM.

# Dla produktow IP20/IP44 z uwaga "Do uzyskania klasy bryzgoszczelnosci IP44 zastosowac uszczelke ramki".
ip44_seal: >-
  IP44 po zastosowaniu uszczelki ramki: NUU1 (ramka 1-krotna), zestawy NUV2–NUV5 (ramki
  od 2- do 5-krotnych w układzie pionowym) lub NUH2–NUH5 (układ poziomy).

by_symbol:
  NR1: "Ramka 1-krotna 85×85 mm. Uszczelka IP44: NUU1. Puszka natynkowa: NSC (składana, 40 mm) lub NPN1."
  NR2: "Ramka 2-krotna 85×156 mm. Uszczelki IP44: NUV2 (układ pionowy), NUH2 (układ poziomy). Natynkowo: puszka NSC z elementem rozszerzającym NSH lub puszka NPN2."
  NR3: "Ramka 3-krotna 85×227 mm. Uszczelki IP44: NUV3 (układ pionowy), NUH3 (układ poziomy). Natynkowo: puszka NSC z elementami NSH lub puszka NPN3."
  NR4: "Ramka 4-krotna 85×298 mm. Uszczelki IP44: NUV4 (układ pionowy), NUH4 (układ poziomy). Natynkowo: puszka NSC z elementami NSH."
  NR5: "Ramka 5-krotna 85×369 mm. Uszczelki IP44: NUV5 (układ pionowy), NUH5 (układ poziomy). Natynkowo: puszka NSC z elementami NSH."
  NUV2: "Zestaw uszczelek IP44 do ramki 2-krotnej Simon 24 (NR2) w układzie pionowym; do układu poziomego służy zestaw NUH2, do ramki 1-krotnej uszczelka NUU1."
  NSC: "Puszka natynkowa pojedyncza składana do ramek Simon 24, głębokość 40 mm; do ramek wielokrotnych rozbudowuje się ją elementem rozszerzającym NSH."
