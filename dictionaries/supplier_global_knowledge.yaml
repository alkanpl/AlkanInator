version: 1
description: >
  Global reusable supplier knowledge for AlkanInator. This file stores rules and
  decisions that should survive a single supplier batch, review file, or output.

suppliers:
  kanlux:
    canonical_producer: Kanlux
    producer_aliases:
      - Kanlux
      - KANLUX
    sku_suffixes:
      - KAN
      - KANL
    default_input:
      workbook: archived_input_files/Alkan_Kanlux_pelne_rodziny.xlsx
      sheet: 7. Wszystkie SKU (master)
      parameters_workbook: archived_input_files/Parametry.xlsx
      category_config: configs/categories/kanlux-oswietlenie.yaml
      title_anatomy: configs/title_anatomy.yaml
    workflow_principles:
      - Supplier files are source data, not final store data.
      - Prefer enriched parameter files over supplier names when building titles, descriptions, and features.
      - Store categories must be Woo/Alkan categories, not supplier category labels.
      - Product descriptions are semi-automatic review work and should not be mass-generated in the production pipeline.
      - Descriptions must use filtered BaseLinker features, not raw supplier columns.
      - Do not copy producer HTML descriptions into BaseLinker descriptions.
    manufacturer_data_source:
      rule: use_woocommerce_catalog_knowledge
      note: Dane producenta should be read from dictionaries/woocommerce_catalog_knowledge.yaml by producer name.

    category_mapping_rules:
      source_category_hints:
        - source_terms: [Panele LED]
          woo_category: Oswietlenie > Oswietlenie przemyslowe wewnetrzne > Panele LED sufitowe
        - source_terms: [Oprawy pyloszczelne, Oprawy pyłoszczelne, Hermetyczne]
          woo_category: Oswietlenie > Oswietlenie przemyslowe wewnetrzne > Lampy hermetyczne
        - source_terms: [High Bay, Oswietlenie hal, Oświetlenie hal]
          woo_category: Oswietlenie > Oswietlenie przemyslowe wewnetrzne > Oprawy High-bay LED
        - source_terms: [Naswietlacze LED, Naświetlacze LED]
          woo_category: Oswietlenie > Oswietlenie zewnetrzne > Naswietlacze LED
        - source_terms: [Plafoniery, Oprawy sufitowe]
          woo_category: Oswietlenie > Oswietlenie wewnetrzne > Plafony LED
      category_quality_rules:
        - Category should be flagged for review when an accessory is classified as a main lighting fixture.
        - Category should be flagged for review when a main fixture category contains driver, sensor, frame, adapter, holder, lens, clip, or grid terms.

    title_rules:
      preferred_main_title_keywords:
        panel_led: Panel LED
        high_bay: Oprawa High Bay LED
        oprawa_hermetyczna: Oprawa hermetyczna LED
        naswietlacz: Naświetlacz LED
        naswietlacz_solarny: Naświetlacz solarny LED
        plafon_led: Plafon LED
        oprawa_sufitowa: Oprawa sufitowa
        oprawa_sufitowa_punktowa: Oprawa sufitowa punktowa
        oprawa_kanalowa: Oprawa kanałowa
        lampa_wiszaca: Lampa wisząca
      canonical_type_aliases:
        plafoniera: plafon_led
        plafoniera_led: plafon_led
        plafoniera_z_czujnikiem: plafon_led
        oprawa_hermetyczna: oprawa_hermetyczna
        oprawa_hermetyczna_na_t8: oprawa_hermetyczna
        high_bay_led: high_bay
        panel_led_uniwersalny: panel_led
        panel_led_z_zasilaczem_aio: panel_led
        naswietlacz_led_z_czujnikiem: naswietlacz
        naswietlacz_iq_led: naswietlacz
      series_keyword_overrides:
        AVAR: Ramka oswietleniowa LED
        SLR: Naświetlacz solarny LED
      duplicate_disambiguation_order:
        - wariant
        - czujnik
        - dlugosc_przewodu
        - wysokosc
        - material
        - moc
        - srednica
        - wymiary
        - kat_swiecenia
        - model
      title_notes:
        - Keep producer and product code at the end of the final title.
        - Check uniqueness before appending producer code, because code makes almost every title artificially unique.
        - Use "Plafon", not "Plafoniera", for LED ceiling fixtures unless the product is explicitly a different lamp type.
        - Add "punktowa" to ceiling fixture titles when product type or source title carries that information.
        - Do not add random extra attributes to duplicates; only add a real differentiating parameter found in the product data.

    accepted_feature_values:
      product_types:
        - Czujnik ruchu
        - Klips
        - Klosz
        - Konektor
        - Lampa wisząca
        - Linka do podwieszenia
        - Łącznik
        - Naświetlacz LED
        - Oprawa High Bay
        - Oprawa hermetyczna
        - Oprawa kanałowa
        - Oprawa sufitowa
        - Oprawa sufitowa punktowa
        - Panel LED
        - Pilot do oprawy
        - Plafon
        - Ramka
        - Ramka do paneli
        - Siatka ochronna
        - Soczewka
        - Uchwyt
        - Wspornik montażowy
        - Zapinka
        - Zasilacz
        - Ogranicznik przepięć
        - Lampa ogrodowa
        - Oprawa elewacyjna solarna LED
      series:
        - ACETE
        - ADTR
        - AGOR
        - AGZAR
        - ALIN
        - AMAZI
        - ANBAR
        - ANTEM
        - ANTO
        - AQILO
        - ARVOS
        - AVAR
        - AZPO
        - BAREV
        - BENO
        - BLINGO
        - BLURRO
        - BONSA
        - BORD
        - BRAVO
        - CARVO
        - CORSO
        - DABA
        - DABER
        - DICHT
        - DUNO
        - ENELO
        - ERTON
        - EXATE
        - FL
        - FLS
        - FOGLER
        - FT1200
        - FT1500
        - FTD1200
        - FTD1500
        - FTHL1500
        - FTHT1500
        - GALOBA
        - GORD
        - GRUN
        - HBPA
        - HBPHS
        - HERMI
        - INES
        - IPER
        - IQ-LED
        - JASMIN
        - JURBA
        - LUMKO
        - MAH
        - MARC
        - MILO
        - NIFU
        - PHLOX
        - PIRES
        - PLAFMIN
        - PLAVE
        - RIFA
        - RITI
        - S
        - SANGA
        - SANI
        - SANSO
        - SOLN
        - STATO
        - STIVI
        - STOBI
        - TOLEO
        - TOLU
        - TP
        - TUNA
        - TURA
        - TURK
        - TYBIA
        - VAND
        - VARSO
        - KSPD-T2
        - STONO
        - REKA
      producer_colors:
        - Biały mat
        - Czarny mat
        - Dąb sonoma
        - Nikiel satynowy
        - STAL INOX
        - Wenge
        - Złoto-brązowy
        - Złoty dąb
      applications:
        - Do paneli

    feature_export_rules:
      excluded_features:
        - EAN (GTIN)
        - Kod producenta
      drop_unknown_features:
        - Model
        - Sterowanie
      normalize_before_review: true
      unknown_feature_or_value_goes_to_review: true
      review_file_format: xlsx
      color_rules:
        - Matte or wood-like producer colors may stay as "Kolor producenta".
        - If producer color is equivalent to base color, remove redundant "Kolor producenta".
        - STAL INOX should normalize to base color "Srebrny" and producer color "STAL INOX".
      numeric_rules:
        - Dimensions, lengths, widths, heights, diameters, power, flux, voltage, CCT, IP, IK and angle values can be accepted when normalized value matches the catalog format.
        - Remove degree symbol from angle values before review/export.
      manufacturer_data_separator: ", "
      multi_value_features: []
      value_conventions:
        - 'Pojedyncze wymiary uzywaja nazw sklepu bez jednostki w nazwie ("Dlugosc", "Szerokosc", "Wysokosc", "Srednica", "Glebokosc"); jednostka jest w wartosci po spacji, np. "600 mm" (format z Woo catalog knowledge). Nie tworzymy duplikatow typu "Dlugosc [mm]".'
        - 'Dane producenta rozdzielamy przecinkami, np. "KANLUX, Objazdowa 1-3 41-922 Radzionkow, kanlux@kanlux.pl".'
        - 'Zapisy typu "3xGU10" rozbijamy: Trzonek=GU10, Liczba zrodel swiatla=3 (krotnosc takze z tytulu, np. "JASMIN 3xE27"). Krotnosc trzonkow idzie do "Liczba zrodel swiatla", nie do "Liczba gniazd" (ta dotyczy gniazdek elektrycznych).'
        - 'Atrybut "Zrodlo swiatla" ma tylko dwie wartosci: "Zintegrowane" i "Niezintegrowane" (pisane lacznie). Wyprowadzamy go z "Zrodlo swiatla w komplecie" (Tak -> Zintegrowane) albo z obecnosci trzonka / maks. mocy zrodla (-> Niezintegrowane).'
        - 'Przy zintegrowanym zrodle produkt nie ma atrybutow Trzonek, Liczba zrodel swiatla ani Kierunek swiecenia (np. EAN 5905339289971 / REKA 28997).'
        - 'Barwa swiatla wynika z Temperatury barwowej [K]: <3300 Ciepla, 3300-5300 Neutralna, >5300 Zimna, zakres -> Zmienna. Dozwolone wartosci: Neutralna, Ciepla, Zimna, Zmienna.'
        - 'Zasilanie mowi, jak zasilany jest produkt: Solarne / Akumulator / Sieciowe (wyprowadzane z tytulu i napiecia, wazne zwlaszcza dla naswietlaczy).'
        - 'Schematy atrybutow i tytulow dotycza typu produktu, nie kategorii sklepu: akcesoria (ramki, zasilacze, czujniki itd.) nie ida schematem oprawy, a "Oprawa kanalowa"/"Oprawa sufitowa" to nie plafony - ida schematem opraw natynkowych.'
        - 'Ksztalt zgadujemy z wymiarow, gdy go brak: srednica -> Okragly, dlugosc == szerokosc -> Kwadrat, dlugosc != szerokosc -> Prostokatny.'
        - 'Seria TOLEO (DTL) to natynkowa oprawa punktowa "Oprawa sufitowa", nie lampa wiszaca.'
        - 'Wskaznik olsnienia [UGR] jest opcjonalny, nie wymagany - producent podaje go tylko dla czesci rodzin.'
        - 'Reczne uzupelnienia atrybutow mieszkaja w archived_input_files/kanlux_braki_wymaganych_uzupelnione.xlsx (format skoroszytu brakow); wygrywaja z danymi automatycznymi, wartosci "n/d" sa pomijane.'
        - 'Kolumna "Typ" producenta bywa mylna (np. "plafoniera LED" dla opraw sufitowych AQILO/RITI, "Plafoniera" dla kanalowej MILO) - typ produktu kotwiczymy we frazie na poczatku nazwy wygenerowanej przez pipeline nazw.'
        - 'Gdy nazwa referencyjna (stare Woo) klosci sie z typem produktu (np. "Zasilacz BLINGO AIO" dla panelu), do importu idzie nazwa wygenerowana przez pipeline nazw.'
        - 'Nazwa panelu ma zgadzac sie ze sposobem montazu: BLINGO AIO/UAIO w wariancie SRM to panele natynkowe, mimo ze pipeline domyslnie nazywa panele "podtynkowy".'
        - 'Wartosci z wieloma kolorami ida do "Kolor producenta"; w "Kolor" zostaje pierwszy kolor. Nie generujemy juz osobnego atrybutu "Kolory".'
        - 'Dla zakresu mocy (np. 12-18W) w atrybucie "Moc [W]" zapisujemy najwieksza wartosc liczbowa, a w tytule i opisie zostawiamy zakres.'
        - 'Panele LED musza miec w tytule moc i wymiar; ramki do paneli musza miec wymiar, a moc tylko gdy rzeczywiscie dotyczy produktu.'
        - 'Dla Kanlux zachowujemy pelniejszy model producenta w tytule, jesli rozroznia wariant produktu (np. ADTR SKY, ADTR SKY-V, ADTR PT, ADTR-H).'
        - 'Naswietlacze AGOR/A sa asymetryczne, a AGOR bez /A symetryczne; tytul naswietlacza AGOR ma zawierac odpowiednio "asymetryczny" albo "symetryczny".'
        - 'Maksymalna moc wymiennego zrodla idzie do atrybutu "Maksymalna moc zrodla swiatla" (nie "Moc maksymalna zarowki"). Lapiemy zapisy "max 60", "2 x max 40", "2 x 36" i "10 LED".'
        - 'Produkt bez zrodla swiatla w srodku (Zrodlo swiatla w komplecie != Tak) nie ma "Moc [W]" - zostaje tylko "Maksymalna moc zrodla swiatla". Wyjatek: zintegrowany LED bez trzonka, gdzie "max NN" to moc oprawy.'
        - 'Napiecie [V] zostaje w eksporcie zawsze i zawiera rodzaj pradu, np. "220-240 AC"; dla typowych napiec sieciowych bez oznaczenia dopisujemy "AC".'
        - 'Parametr "Zrodlo swiatla zasilane lub niezasilane napieciem sieciowym" (wartosci MLS/NLS) nie jest zrodlem "Napiecie [V]".'
        - 'Klasa energetyczna pochodzi z parametru "Klasa efektywnosci energetycznej" (litery A-G) i ma byc eksportowana zawsze, gdy jest znana.'
        - 'Sposob montazu mapujemy z "Miejsce montazu": "do nadbudowania..." -> Natynkowy, "do wbudowania..." -> Podtynkowy; wartosci mieszane pomijamy.'
        - 'Kilka materialow w jednym polu ("ABS,PE") to osobne wartosci atrybutu Material rozdzielane "|".'
        - 'Brak "Czujnik ruchu" i "Liczba gniazd" nie jest brakiem atrybutu wymaganego - pusty czujnik znaczy "nie ma", a liczba gniazd dotyczy tylko opraw na wymienne zrodla.'
        - 'Przy wymiennym zrodle swiatla takze Moc [W], Barwa swiatla, Strumien swietlny i Temperatura barwowa nie sa atrybutami wymaganymi - zaleza od wkreconej zarowki.'
        - 'Produkty ze zmienna/przelaczalna moca (np. naswietlacz solarny FL 36607 z wyborem 10/15W, panele ze zmiennymi lumenami bez zasilacza) moga miec "Maksymalna moc zrodla swiatla" mimo braku trzonka - to nie blad danych.'
        - 'Produkt EDO111111 (dane producenta ELHURT) to znana anomalia poprawiana recznie przez uzytkownika - nie ruszac automatycznie.'
        - 'Przy rozbieznosci mocy miedzy starym Woo a parametrami producenta wygrywaja parametry producenta - taka roznica nie jest bledem ani nie wymaga flagowania.'
        - 'Oprawy hermetyczne z trzonkiem (swietlowki T8) zachowuja Trzonek i Liczbe gniazd, a tytul dostaje "do swietlowek LED" (np. "Oprawa hermetyczna do swietlowek LED DICHT...").'
        - 'Gdy kilka produktow ma identyczna nazwe (po odcieciu kodu "Kanlux NNN"), do finalnego pliku idzie rozrozniajaca nazwa z pipeline nazw (liczy wymiary/warianty/czujnik). Gdy pipeline tez nie rozroznia (ten sam produkt pod 2 SKU) - zostawiamy duplikat do scalenia w sklepie (raport duplicate_names_remaining.csv).'
        - 'Krotnosc swietlowek w oprawie hermetycznej idzie do tytulu jako "Nx<moc>W" (np. MAH PLUS-258 -> 2x58W, kod "-{liczba}{moc}" w Nazwa Kanlux; -158 -> pojedyncza, 58W).'
        - 'Soczewki HB PRO STRONG (HBPHS LENS) rozrozniamy moca docelowej oprawy z Nazwa Kanlux/atrybutu Moc [W] (200W vs 150W), obok kata swiecenia.'
        - 'Akcesoria do paneli (klipsy/linki) rozrozniamy formatem panela z Nazwa Kanlux ("60-62" -> "do paneli 60x60/62x62 cm"; "120"/"12030" -> "do paneli 120x30 cm") oraz Iloscia sztuk w opakowaniu jednostkowym (mapowana z Parametrow, np. "4 szt.").'
        - 'DICHT 4LED rozrozniamy wersja z odblysnikiem (sufiks PI w Nazwa Kanlux -> "z odblysnikiem") i materialem klosza (/PS -> "klosz PS", /PC -> "klosz PC").'
        - 'Oprawa kanalowa MILO: sufiks "/P" w Nazwa Kanlux = "siatka plastikowa", brak = "siatka metalowa".'
        - 'Plafony drewniane JASMIN z wariantem "C" w Nazwa Kanlux to wersje wiszace (tytul dostaje "wiszacy"); bez "C" to wersje natynkowe.'
        - 'Atrybut "Klosz" pochodzi z parametru "Typ klosza" (opalowy, ryflowany, "pryzmatyczny, waskostrumieniowy", "pryzmatyczny, asymetryczny", mikropryzmatyczny, matowy...) i jest zawsze eksportowany, gdy znany. Kod klosza z Nazwa Kanlux opraw FTD (-OPL/-RYF/-INT/-ASY) idzie do tytulu jako OPL/RYF/INT/ASY na koncu (rozroznia warianty o tej samej mocy).'
        - 'Atrybut "Wspolpraca ze sciemniaczem" ma tylko dwie wartosci: Tak/Nie. Kazdy protokol sciemniania (DALI, 1-10V, 0-10V) liczy sie jako "Tak".'
        - 'Wymiar (Dlugosc/Szerokosc/Wysokosc/Srednica/Glebokosc) o wartosci "1" to zwykle dlugosc kabla blednie wpisana jako wymiar oprawy - jest usuwany z eksportu.'
        - 'Atrybut "Czujnik ruchu" ma w kategoriach, gdzie jest filtrowalny (ordered_attributes), zawsze wartosc: "Tak" gdy czujnik jest, "Nie" gdy go brak lub brak informacji (nie zostawiamy pustego, zeby filtr dzialal). W kategoriach bez tego atrybutu zostaje pusty.'
        - 'Slug taksonomii Woo dla "Maksymalna moc zrodla swiatla" jest skrocony do "pa_max-moc-zrodla" (override w serialize_product_attributes), nie domyslny "pa_maksymalna-moc-zrodla-swiatla".'
        - 'Atrybut odpornosci mechanicznej nazywa sie "Stopien odpornosci [IK]" (slug pa_stopien-odpornosci-ik), nie "Stopien ochrony [IK]".'
        - 'Parametry producenta (Parametry.xlsx) sa zrodlem prawdy i wygrywaja z kolumnami master/ekstrakcja z tytulu dla atrybutow, gdzie kolumny bywaly bledne (np. kolor obudowy mylony z barwa swiatla). Wyjatki (zostaje master): "material" (Parametry podaja material klosza, np. szklo, zamiast obudowy jak drewno) i "moc" (Parametry podaja moc przelaczana/wielowartosciowa "52 / 44", a "Moc [W]" ma byc pojedyncza). Reczne uzupelnienia usera nadal wygrywaja z Parametrami.'
        - 'Konflikt koloru miedzy tytulem a atrybutem porownujemy po RDZENIU koloru (szary/szara/szare -> "szar", utils.color_stem), zeby tytul podazal za poprawionym kolorem obudowy niezaleznie od formy gramatycznej.'
        - 'Produkty istniejace w WooCommerce i w master (enriched), ktorych NIE ma na liscie referencyjnej Baselinkera (Kanlux (4).xlsx), sa wzbogacane gotowymi danymi (Typ produktu + atrybuty + tytul) tylko do pliku Woo - NIE ida do importu Baselinkera, bo nie maja ID Baselinkera (source_match_status=MATCHED_OUTSIDE_REFERENCE; atrybutowy CSV ma kolumne name i wszystkie produkty, plik importu Baselinkera tylko produkty z referencji).'

    accessory_rules:
      product_types_without_own_power:
        - Klips
        - Klosz
        - Linka do podwieszenia
        - Pilot do oprawy
        - Ramka
        - Ramka do paneli
        - Siatka ochronna
        - Soczewka
        - Uchwyt
        - Wspornik montażowy
        - Zapinka
        - Łącznik
      role_detection_terms:
        Siatka ochronna: [siatka ochronna, grid]
        Klosz: [klosz do, pokrywa, szybka, osłona, oslona]
        Ramka: [ramka, adtr]
        Zasilacz: [zasilacz, driver, driv, drv, drvm]
        Linka: [linka, spn]
        Klips: [klips, klipsy, clips panel]
        Zapinka: [zapinka]
        Wspornik montażowy: [wspornik montażowy, bracket]
        Uchwyt: [uchwyt, adapter]
        Pilot: [pilot do, remote]
        Soczewka: [soczewka, lens]
        Czujnik: [mah pro sensor, sensor c]
        Konektor: [qci]
        Kabel: [3x1mm]
        Łącznik: [con ele, łącznik modułów, lacznik modulow]
      description_safety:
        - Accessory power from source title or rejected facts is not a product fact.
        - For grid, lens, holder, clip, bracket, sensor and similar accessories, power may only describe the compatible fixture when this is explicit.
        - 'Example 33482/KAN: "240W" can refer to compatible FL AGOR HI GRID fixture variant, not to the protective grid itself.'

    parameter_priority:
      - Final filtered BaseLinker features
      - Enriched Parametry.xlsx columns
      - Extracted attr_* columns
      - Supplier title only as fallback or compatibility context
    useful_parameter_columns:
      - Typ
      - Rodzina
      - Moc [W]
      - Barwa CCT [K]
      - Strumień [lm]
      - Klasa IP
      - Kąt
      - Kolor obudowy
      - Wymiary
      - Gwint
      - Czujnik ruchu
      - Materiał
      - Pasuje do
      - Zastosowanie
