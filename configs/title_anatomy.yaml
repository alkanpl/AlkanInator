enabled: true
default_primary_keyword_source: primary_keyword
primary_keyword_fallback_fields:
- attr_typ
- Typ produktu
- Typ
- Rodzaj produktu
sku_fields:
- Kod
- Kod Producenta
- SKU
- sku
producer_fields:
- attr_producent
- Producent
- manufacturer_name
- producer
- Marka
accepted_status_values:
- approved
- zaakceptowane
- accepted
# Serie, ktore mimo typu produktu sa czyms innym - nadpisuja slowo kluczowe.
# SLR = marker solarny (serie SOLNAR, SONE); lm wazniejsze niz W, etykieta solarny.
series_title_keyword:
  AVAR: Ramka oświetleniowa LED
  SLR: Naświetlacz solarny LED
# Mapowanie wariantow nazwy typu na typ kanoniczny, ktory ma regule anatomii.
# Wlaczone dla typow semantycznie rownowaznych (LED z moca). Typy o innym
# schemacie (drewniane E27 bez mocy, akcesoria) celowo zostaja przy legacy.
product_type_aliases:
  plafoniera led: plafon led
  plafoniera: plafon led
  plafoniera dekoracyjna: plafon led
  plafoniera led dekoracyjna: plafon led
  plafoniera led z czujnikiem: plafon led
  plafoniera z czujnikiem: plafon led
  plafoniera z czujnikiem ruchu: plafon led
  oprawa hermetyczna: oprawa hermetyczna led
  oprawa hermetyczna na t8: oprawa hermetyczna led
  naswietlacz led z czujnikiem: naswietlacz led
  naswietlacz iq led: naswietlacz led
  high bay led: high bay przemyslowy
  panel led uniwersalny: panel led
  panel led uniwersalny aio: panel led
  panel led z zasilaczem aio: panel led
# `required_title_attributes` = kolejnosc i sklad tytulu (atrybut wchodzi, jesli
# jest obecny). `warn_if_missing` = ktore z nich naprawde musza wystapic.
rules:
- normalized_product_type: panel led
  title_keyword: Panel LED
  status: approved
  required_title_attributes:
  - montaz
  - seria_clean
  - ksztalt_masculine
  - wymiary
  - moc
  - strumien
  - barwa_full
  - ip
  - kolor
  optional_title_attributes:
  - czujnik
  warn_if_missing:
  - moc
  - wymiary
  - barwa_full
  excluded_if_redundant:
    kolor:
    - barwa_swiatla
    - barwa_neuter
- normalized_product_type: high bay przemyslowy
  title_keyword: Oprawa High Bay LED
  status: approved
  required_title_attributes:
