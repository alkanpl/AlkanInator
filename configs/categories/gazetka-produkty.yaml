product_role_classification:
  name_columns:
    - Nazwa produktu
    - Opis
    - Atrybuty
  default_role: main
  accessory_rules: []

product_type_prefix_rules:
  - type: Naświetlacz LED
    terms: [naświetlacz, naswietlacz]
  - type: Oprawa hermetyczna LED
    terms: [oprawa hermetyczna, damp proof]
  - type: Panel LED
    terms: [panel backlight]
  - type: Plafon LED
    terms: [plafoniera]
  - type: Lampa ogrodowa
    terms: [lampa led ogrodowa, stono]
  - type: Gniazdo
    terms: [gniazdo]
  - type: Przedłużacz
    terms: [przedłużacz, przedluzacz]
  - type: Rozdzielnica
    terms: [rozdzielnica]
  - type: Puszka
    terms: [puszka]
  - type: Złączka
    terms: [złączka, zlaczka]
  - type: Ogranicznik przepięć
    terms: [ogranicznik przepięć, ogranicznik przepiec, spd]

product_type_prefix_stop_words:
  - led
  - ip
  - kolor
  - dane
  - informacje

forbidden_title_words:
  - promocja
  - okazja
  - najlepszy
  - super
  - gwarancja
  - lat
