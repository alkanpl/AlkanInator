category: "Gazetka produkty"

title_template: "{typ} {seria_clean} {model} {moc} {prad} {napiecie} {przekroj} {wymiary} {ip} {kolor} {producent}"

max_title_length: 130
min_title_length: 25
append_sku_after_producer: true
prefer_title_producer_over_column: true

sku_columns:
  - Kod Producenta
  - Kod produktu
  - sku

title_fallback_columns:
  - Opis
  - Atrybuty
  - atrybuty nie posegregowane
  - gazetki_Opis
  - gazetki_Atrybuty

input_attribute_text_columns:
  - Nazwa produktu
  - Opis
  - Atrybuty
  - atrybuty nie posegregowane
  - gazetki_Opis
  - gazetki_Atrybuty

default_values: {}

required_fields:
  - producent
required_fields_by_role:
  main:
    - producent
  accessory:
    - producent

title_strategy_rules:
  - name: reka_solar
    title_contains: REKA
    template: "Oprawa elewacyjna solarna LED REKA {moc} {strumien} {barwa} {ip} {czujnik} {kolor_feminine} {producent}"
